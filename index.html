úmero aparece na config, ex.: secret 9)","headers":["Tipo","O que é","Força"],"rows":[["0","texto puro","nenhuma"],["7","ofuscação reversível","só esconde de quem olha por cima do ombro"],["4","SHA-256 mal implementado","descontinuado"],["5","MD5 com salt","fraco pros padrões de hoje"],["8","PBKDF2-SHA-256","bom"],["9","scrypt","bom, o recomendado"]]},{"type":"warn","text":"`service password-encryption` só aplica o tipo 7, que é reversível. Protege de leitura casual, não de quem pegou o arquivo de config."}],"deep":[{"type":"points","title":"enable password vs enable secret","items":["`enable password` guarda a senha do modo privilegiado em texto puro (ou tipo 7, com `service password-encryption`)","`enable secret` guarda um hash","Se as duas existirem, vale a `secret`"]},{"type":"table","title":"Protocolos da casa (Cisco)","headers":["Protocolo","Pra quê","Equivalente aberto"],"rows":[["CDP","anuncia modelo, versão e IP pros vizinhos","LLDP"],["HSRP","redundância de gateway","VRRP"],["VTP","espalha a configuração de VLANs entre switches","-"],["EIGRP","roteamento","o próprio EIGRP foi aberto: nasceu proprietário e depois foi publicado"]]},{"type":"facts","title":"Outros fabricantes, mesma lógica","items":[{"value":"Junos","label":"Juniper"},{"value":"RouterOS","label":"MikroTik"},{"value":"FortiOS","label":"Fortinet"},{"value":"PAN-OS","label":"Palo Alto"}]},{"type":"tip","text":"Quando aparecer um sistema de fabricante que você não conhece, a documentação oficial dele é seu melhor amigo."}],"terms":[{"en":"running-config / startup-config","pt":"config ativa (RAM) / config salva (NVRAM)"},{"en":"privileged EXEC","pt":"o modo administrador do IOS"},{"en":"VTY","pt":"as linhas de acesso remoto ao equipamento"},{"en":"enable secret","pt":"senha do modo privilegiado, guardada em hash"},{"en":"CDP","pt":"protocolo da Cisco que anuncia o equipamento pros vizinhos"}],"practice":"Achar um backup de configuração de roteador (num compartilhamento ou servidor TFTP) é ouro: senhas tipo 0 e 7 são praticamente texto puro, e o `show version` entrega a versão exata pra procurar vulnerabilidades conhecidas.","quiz":[{"q":"Num backup de config você acha uma senha `secret 9` e outra `password 7`. Qual é mais fácil de recuperar?","options":["A `secret 9`, porque scrypt é antigo","A `password 7`, porque o tipo 7 é só ofuscação reversível","As duas são igualmente fortes","Nenhuma: config de roteador nunca guarda senha"],"answer":1,"explain":"O tipo 7 só embaralha o texto e pode ser revertido. O tipo 9 é um hash scrypt, o recomendado hoje."},{"q":"Você mudou a config de um roteador e ele reiniciou antes de você salvar. O que acontece?","options":["Nada se perde, porque a running-config fica na NVRAM","O roteador volta em user EXEC e pede pra confirmar as mudanças","As mudanças vão sozinhas pra startup-config","As mudanças se perdem: a running-config fica na RAM e o boot carrega a startup-config"],"answer":3,"explain":"Só o `copy running-config startup-config` grava as mudanças na NVRAM. Sem isso, o reboot volta pra última config salva."}]},{"n":18,"title":"Key Exchange Mechanisms","titlePt":"Combinando chaves em público","minutes":6,"gist":"Troca de chave é como dois lados combinam uma chave secreta conversando num canal que qualquer um pode estar escutando.","blocks":[{"type":"text","text":"A criptografia simétrica (seção 21) é rápida, mas exige que os dois lados tenham **a mesma chave**. Mandar essa chave em texto puro estragaria tudo."},{"type":"analogy","text":"Pensa num molho base que todo mundo conhece. Cada pessoa mistura um tempero secreto, troca a panela com a outra e mistura o próprio tempero de novo. As duas chegam no mesmo sabor, e quem só viu as panelas passando não consegue desmisturar."},{"type":"exchange","title":"Diffie-Hellman com números de brinquedo","actors":["Ana","Beto"],"messages":[{"from":0,"to":1,"label":"p = 23, g = 5","note":"valores públicos: qualquer um pode ver"},{"from":0,"to":1,"label":"A = 8","note":"Ana calculou g^a mod p com o segredo a = 6, que nunca sai da máquina dela"},{"from":1,"to":0,"label":"B = 19","note":"Beto calculou g^b mod p com o segredo b = 15"}]},{"type":"text","text":"Agora Ana calcula `B^a mod p` e Beto calcula `A^b mod p` (`^` é potência e `mod` é o resto da divisão). Os dois dão **2**: a mesma chave, sem ela nunca ter passado pela rede."},{"type":"table","title":"Os mecanismos que você vai encontrar","headers":["Mecanismo","O que faz","Onde aparece"],"rows":[["DH / DHE","acordo de chave; o E é de ephemeral: chave nova a cada sessão","TLS, SSH, IPsec"],["ECDH / ECDHE","mesma ideia com curvas elípticas; chaves menores, mesma segurança","TLS moderno, SSH"],["RSA (key transport)","o cliente cifra um segredo com a chave pública do servidor","TLS antigo; removido no TLS 1.3"],["ECDSA","**assinatura**, não troca de chave: prova quem é quem","certificados, chaves SSH"],["IKE","negocia chaves e parâmetros do IPsec","VPNs IPsec"]]},{"type":"warn","text":"**DH sozinho não autentica ninguém.** Um man-in-the-middle pode fazer uma troca separada com cada lado, por isso a troca é assinada com certificado (RSA ou ECDSA)."},{"type":"text","text":"**Forward secrecy:** com chaves efêmeras (DHE/ECDHE), se a chave privada do servidor vazar amanhã, o tráfego gravado hoje continua protegido. Com RSA key transport, não."}],"deep":[{"type":"text","text":"Descobrir o segredo `a` a partir de `A` é o **problema do logaritmo discreto**: inviável com números grandes. Na vida real, eles têm 2048 bits ou mais."},{"type":"commands","title":"Brinque com o exemplo","items":[{"cmd":"python3 -c \"p,g,a,b=23,5,6,15; A=pow(g,a,p); B=pow(g,b,p); print(A, B, pow(B,a,p), pow(A,b,p))\"","note":"saída 8 19 2 2: os dois lados chegam na mesma chave (2) sem nunca enviá-la"}]},{"type":"steps","title":"IKE versão 1, em duas fases","items":[{"label":"Fase 1","text":"Cria um canal seguro entre os dois lados, em **main mode** ou **aggressive mode**."},{"label":"Fase 2 (quick mode)","text":"Dentro desse canal, negocia as chaves do túnel IPsec."}]},{"type":"warn","text":"O **aggressive mode** é mais rápido, mas expõe a identidade e dados derivados da PSK, que podem ser atacados offline. O IKEv2 simplificou e melhorou isso."}],"terms":[{"en":"key exchange","pt":"troca (ou acordo) de chave"},{"en":"shared secret","pt":"o segredo que os dois lados calculam"},{"en":"ephemeral","pt":"descartável, uma chave por sessão"},{"en":"forward secrecy","pt":"vazamento futuro não abre o tráfego passado"},{"en":"man-in-the-middle (MitM)","pt":"atacante no meio da conversa"},{"en":"pre-shared key (PSK)","pt":"senha combinada antes"}],"practice":"Ao analisar um serviço TLS, SSH ou VPN, você confere quais algoritmos de troca ele aceita. DH com grupo pequeno (1024 bits ou menos), RSA key exchange e IKE aggressive mode com PSK são achados frequentes em relatório de pentest.","quiz":[{"q":"Se o Diffie-Hellman já resolve a troca de chave, por que ainda precisamos de certificados?","options":["Porque o DH garante o segredo, mas não a identidade de quem está do outro lado","Porque o DH manda a chave final em texto puro","Porque é o certificado que cifra os dados depois","Porque o DH só funciona com números pequenos"],"answer":0,"explain":"Sem autenticação, um man-in-the-middle negocia uma chave diferente com cada lado. A assinatura do certificado prova quem é quem."},{"q":"Qual a vantagem de usar DHE ou ECDHE em vez de RSA key transport?","options":["Dispensa o uso de certificados","Deixa a conexão mais lenta e, por isso, mais segura","Forward secrecy: vazar a chave do servidor amanhã não abre o tráfego gravado hoje","Permite mandar a chave de sessão em texto puro"],"answer":2,"explain":"Com chaves efêmeras, cada sessão tem uma chave descartável. Com RSA key transport, quem obtiver a chave privada do servidor decifra o tráfego antigo gravado."}]},{"n":19,"title":"Authentication Protocols","titlePt":"Como provar quem você é","minutes":7,"gist":"Protocolos de autenticação definem como você prova quem é pra um sistema, de preferência sem mandar a senha em texto puro pela rede.","blocks":[{"type":"compare","title":"Não confunda","columns":[{"label":"Autenticação","items":["Provar **quem você é**","Mostrar o documento na portaria do condomínio"]},{"label":"Autorização","items":["O que você **pode fazer** depois","Quais andares liberam pra você"]}]},{"type":"facts","title":"Os 3 fatores (MFA = dois ou mais tipos diferentes)","items":[{"value":"Sabe","label":"algo que você sabe: senha"},{"value":"Tem","label":"algo que você tem: celular, token"},{"value":"É","label":"algo que você é: biometria"}]},{"type":"exchange","title":"Challenge-response: provar sem mandar a senha","actors":["Cliente","Servidor"],"messages":[{"from":0,"to":1,"label":"Quero entrar como ana","note":"só o nome de usuário"},{"from":1,"to":0,"label":"Challenge","note":"um número aleatório, novo a cada tentativa"},{"from":0,"to":1,"label":"Response","note":"um cálculo feito a partir da senha + o challenge"},{"from":1,"to":0,"label":"OK","note":"o servidor confere o cálculo e libera (ou não)"}]},{"type":"warn","text":"A senha não trafega, mas se ela for fraca, a resposta capturada pode virar alvo de **quebra offline**."},{"type":"table","title":"Os que mais aparecem em rede e Windows","headers":["Protocolo","Onde aparece","Ideia principal"],"rows":[["PAP","acesso remoto (PPP)","manda usuário e senha em texto puro"],["CHAP","acesso remoto (PPP)","challenge-response; a senha não atravessa a rede"],["RADIUS","autenticação central de Wi-Fi e VPN","UDP 1812/1813; protege só o campo da senha"],["TACACS+","login em equipamentos de rede","TCP 49; cifra o pacote todo e separa autenticação, autorização e registro"],["Kerberos","Active Directory","tickets emitidos por um servidor central (KDC); port 88"],["NTLM","Windows legado","challenge-response calculado a partir do hash da senha"],["LDAP","diretórios de usuários","consulta e login (bind) no diretório; 389, ou 636 com TLS"]]},{"type":"analogy","text":"Kerberos é como um show: você mostra o documento uma vez na bilheteria (o KDC) e ganha uma pulseira (o **TGT**). Pra cada área, você volta na bilheteria, mostra a pulseira e recebe um ingresso específico, sem mostrar documento de novo."},{"type":"exchange","title":"Kerberos em três atos","actors":["Você","KDC","Serviço"],"messages":[{"from":0,"to":1,"label":"Prova quem é (uma vez só)","note":"a senha em si não trafega"},{"from":1,"to":0,"label":"TGT","note":"Ticket Granting Ticket: a pulseira"},{"from":0,"to":1,"label":"TGT + quero o serviço X","note":"volta na bilheteria mostrando a pulseira"},{"from":1,"to":0,"label":"Service ticket","note":"o ingresso só daquele serviço"},{"from":0,"to":2,"label":"Service ticket","note":"entra sem mostrar documento de novo"}]},{"type":"tip","text":"No Kerberos os relógios das máquinas precisam estar sincronizados: por padrão, a tolerância é de até 5 minutos de diferença."}],"deep":[{"type":"table","title":"Web, SSO e Wi-Fi","headers":["Protocolo","Onde aparece","Ideia principal"],"rows":[["EAP","Wi-Fi Enterprise, 802.1X","moldura que carrega vários métodos (EAP-TLS, PEAP...)"],["SAML","SSO corporativo na web","asserções em XML entre o provedor de identidade e a aplicação"],["OAuth 2.0","apps e APIs","**delegação de autorização** via tokens, não login por si só"],["OpenID Connect","Entrar com Google","camada de autenticação construída em cima do OAuth 2.0"],["FIDO2 / WebAuthn","passkeys, chaves físicas","chave pública por site; resistente a phishing"]]},{"type":"warn","text":"OAuth 2.0 serve pra **delegar acesso** (um app agir em seu nome com um token), não pra provar identidade. O login em cima dele é o OpenID Connect."},{"type":"text","text":"**SSO** (single sign-on) é um login só pra vários sistemas. Quem confirma sua identidade pros outros sistemas é o **identity provider** (IdP)."},{"type":"commands","items":[{"cmd":"klist","note":"lista os tickets Kerberos que você tem (no Debian/Ubuntu vem no pacote krb5-user)"},{"cmd":"ssh -o PreferredAuthentications=publickey usuario@\u003cip-alvo>","note":"força o login SSH só por chave"}]}],"terms":[{"en":"authentication vs authorization","pt":"quem você é vs o que você pode fazer"},{"en":"challenge-response","pt":"prova de identidade sem enviar a senha"},{"en":"ticket","pt":"credencial temporária do Kerberos"},{"en":"SSO","pt":"single sign-on: um login pra vários sistemas"},{"en":"MFA","pt":"autenticação com múltiplos fatores"},{"en":"identity provider (IdP)","pt":"quem confirma sua identidade pros outros sistemas"}],"practice":"Em redes Windows, Kerberos e NTLM aparecem em praticamente todo pentest de Active Directory, e entender ticket e challenge-response é a base dos ataques que vêm depois. Na web, tratar OAuth como autenticação é fonte de falha real.","quiz":[{"q":"Entre PAP e CHAP, qual é mais seguro e por quê?","options":["PAP, porque é mais simples e tem menos pontos de falha","PAP, porque cifra o pacote inteiro","Tanto faz: os dois mandam a senha cifrada","CHAP, porque usa challenge-response e a senha não atravessa a rede"],"answer":3,"explain":"No PAP a senha vai em texto puro pra quem estiver escutando. No CHAP só trafegam o challenge e a resposta calculada."},{"q":"No Kerberos, o que é o TGT?","options":["O hash da senha guardado no servidor","O ticket que você ganha do KDC e usa pra pedir os tickets de cada serviço","O certificado TLS do controlador de domínio","O número aleatório que o servidor manda no challenge"],"answer":1,"explain":"O TGT é a pulseira do show: você prova quem é uma vez, ganha o TGT e com ele pede os service tickets sem mostrar a senha de novo."}]},{"n":20,"title":"TCP/UDP Connections","titlePt":"TCP, UDP e o handshake","minutes":7,"gist":"TCP conversa com conexão, confirmação e ordem garantida, UDP só despacha, e os dois viajam dentro de um pacote IP que diz origem, destino e saltos restantes.","blocks":[{"type":"analogy","text":"Pensa nos Correios: TCP é carta registrada com AR (aviso de recebimento), você sabe se chegou e reenvia se não chegou. UDP é carta simples: você posta e torce."},{"type":"table","title":"TCP vs UDP","headers":["Característica","TCP","UDP"],"rows":[["Conexão antes de enviar","sim (handshake)","não"],["Entrega garantida e em ordem","sim (ACKs, retransmissão, sequence numbers)","não"],["Tamanho do cabeçalho","20 bytes no mínimo","8 bytes"],["Exemplos","HTTP(S), SSH, SMB","DNS, DHCP, VoIP, jogos online"]]},{"type":"exchange","title":"Three-way handshake: abrindo uma conexão TCP","actors":["Cliente","Servidor"],"messages":[{"from":0,"to":1,"label":"SYN","note":"quero conversar; meu número de sequência inicial é X"},{"from":1,"to":0,"label":"SYN-ACK","note":"recebi o X; o meu é Y"},{"from":0,"to":1,"label":"ACK","note":"recebi o Y. Conexão ESTABLISHED"}]},{"type":"text","text":"Pra encerrar, cada lado manda `FIN` e recebe `ACK`: o jeito educado. Já o `RST` corta na hora, e é a resposta padrão quando alguém manda `SYN` pra uma port fechada."},{"type":"table","title":"SYN scan: o que cada resposta quer dizer","headers":["Resposta ao SYN","O que geralmente significa"],"rows":[["SYN-ACK","port aberta"],["RST","port fechada (mas o host está vivo)"],["silêncio","filtro de firewall no caminho"]]},{"type":"layers","title":"Um pacote, de fora pra dentro","items":[{"label":"Cabeçalho IP","text":"Origem, destino, TTL e o campo Protocol, que diz o que vem dentro."},{"label":"Cabeçalho TCP ou UDP","text":"Aqui ficam as ports (e, no TCP, as flags e o sequence number).","tag":"IP payload"},{"label":"Dados","text":"O conteúdo da aplicação: uma página, uma consulta DNS...","tag":"IP payload"}]},{"type":"table","title":"Campos do cabeçalho IPv4 que mais importam","headers":["Campo","Pra quê"],"rows":[["Version","versão do IP (num cabeçalho IPv4, sempre 4)"],["TTL","contador de saltos (seção 14)"],["Protocol","o que vem dentro: 1 = ICMP, 6 = TCP, 17 = UDP"],["Source / Destination Address","IP de origem e de destino"]]}],"deep":[{"type":"text","text":"Outras flags do TCP que aparecem por aí: `PSH` (entrega já pra aplicação) e `URG` (dado urgente)."},{"type":"table","title":"Os outros campos do cabeçalho IPv4","headers":["Campo","Pra quê"],"rows":[["Identification, Flags, Fragment Offset","remontar pacotes que foram fragmentados"],["Header Checksum","detectar corrupção no cabeçalho"],["Options","extras opcionais, como o Record Route"]]},{"type":"text","text":"**Record Route** é uma opção do IP que pede pra cada roteador anotar o próprio endereço no pacote. Cabe no máximo 9 endereços e muitos roteadores ignoram, mas é outra forma de enxergar o caminho."},{"type":"points","title":"Blind spoofing","items":["Forjar o IP de origem é fácil; o difícil é que a resposta vai pro IP falsificado, e o atacante fica cego.","No TCP, ele precisaria adivinhar o sequence number do servidor pra completar o handshake, e sistemas modernos geram esse número aleatoriamente.","No UDP não existe handshake, então o spoofing é bem mais simples. É a base dos ataques de amplificação (DDoS via DNS ou NTP)."]},{"type":"commands","items":[{"cmd":"ss -tan","note":"conexões TCP e seus estados (LISTEN, ESTAB, TIME-WAIT...)"},{"cmd":"sudo tcpdump -n -i eth0 'tcp[tcpflags] & tcp-syn != 0'","note":"mostra só pacotes com SYN (troque eth0 pela sua interface)"},{"cmd":"ping -c 1 -R \u003cip-alvo>","note":"tenta registrar a rota com a opção Record Route"}]}],"terms":[{"en":"three-way handshake","pt":"a abertura da conexão TCP em 3 mensagens"},{"en":"sequence number","pt":"numeração que garante ordem e confirmação"},{"en":"flags","pt":"bits de controle do TCP (SYN, ACK, FIN, RST...)"},{"en":"header","pt":"cabeçalho"},{"en":"payload","pt":"carga útil, o que vem depois do cabeçalho"},{"en":"spoofing","pt":"falsificar a origem"}],"practice":"Port scanning é todo construído em cima do handshake: o Nmap manda pacotes e interpreta o que volta de cada port. Entender SYN, SYN-ACK e RST é entender a saída do Nmap.","quiz":[{"q":"Você manda um `SYN` pra uma port e volta um `RST`. O que dá pra concluir, em regra?","options":["A port está aberta, esperando o seu ACK","O host está desligado","O host está vivo e a port está fechada","Um firewall descartou o pacote em silêncio"],"answer":2,"explain":"A pilha TCP respondeu, então o host está vivo, mas não tem serviço escutando ali. Alguns firewalls também respondem com RST no lugar do host, mas é exceção."},{"q":"Por que forjar o IP de origem (spoofing) é bem mais fácil com UDP do que com TCP?","options":["Porque o UDP não tem handshake, então não há sequence number pra adivinhar","Porque o cabeçalho UDP esconde o IP de origem","Porque roteadores não conferem pacotes TCP","Porque o UDP cifra o pacote inteiro"],"answer":0,"explain":"No TCP, o atacante cego teria que adivinhar o sequence number do servidor pra completar o handshake. No UDP basta mandar o pacote."}]},{"n":21,"title":"Cryptography","titlePt":"Criptografia sem mistério","minutes":7,"gist":"Criptografia deixa dados ilegíveis pra quem não tem a chave, e quase tudo que é seguro na rede (HTTPS, SSH, VPN) combina dois tipos: simétrica e assimétrica.","blocks":[{"type":"text","text":"Vocabulário rápido: **plaintext** é o texto original, **ciphertext** é o texto cifrado, **key** é a chave e **cipher** é o algoritmo."},{"type":"compare","title":"Os dois tipos","columns":[{"label":"Simétrica","items":["A **mesma chave** cifra e decifra","Rápida, ótima pra grandes volumes","O problema é entregar a chave pro outro lado (seção 18)","Ex.: AES, ChaCha20"]},{"label":"Assimétrica","items":["Um **par de chaves**: a pública você distribui, a privada fica só com você","O que a pública tranca, só a privada abre","Bem mais lenta","Ex.: RSA, ECC"]}]},{"type":"analogy","text":"Pensa em cadeados abertos: você distribui vários (a chave pública) e qualquer pessoa pode trancar uma caixa pra você. Só você tem a chave que abre (a chave privada)."},{"type":"steps","title":"Na vida real é híbrido (é o que o TLS faz)","items":[{"label":"Assimétrica","text":"Autentica quem é quem e combina uma chave de sessão."},{"label":"Simétrica (AES)","text":"Cifra os dados de verdade com essa chave, rápido."}]},{"type":"text","text":"A assimétrica também serve pra **assinatura digital**: você assina com a chave privada e qualquer um confere com a pública."},{"type":"compare","title":"Não confunda","columns":[{"label":"Criptografia","items":["Volta ao original com a chave","Protege o conteúdo"]},{"label":"Hash (SHA-256)","items":["Mão única e tamanho fixo","Serve pra conferir integridade"]},{"label":"Encoding (Base64)","items":["Só muda o formato","Qualquer um reverte: não protege nada"]}]},{"type":"text","text":"Cifras de bloco precisam de um **modo** pra lidar com mensagens maiores que um bloco. O mais ingênuo, o **ECB**, cifra cada bloco sozinho: blocos iguais viram ciphertext igual e os padrões vazam."}],"deep":[{"type":"points","title":"Simétricas que você vai ver","items":["**AES**: o padrão atual; chaves de 128, 192 ou 256 bits e blocos de 128 bits","**DES**: chave de 56 bits, quebrável por força bruta desde o fim dos anos 90","**3DES** (DES aplicado três vezes): legado e já descontinuado","**ChaCha20**: cifra de fluxo moderna, muito usada em celulares"]},{"type":"points","title":"Assimétricas que você vai ver","items":["**RSA**: baseado na dificuldade de fatorar números enormes; hoje, 2048 bits ou mais","**ECC**: curvas elípticas; uma chave de 256 bits dá segurança comparável à de um RSA de 3072","**PGP/GPG**: pra e-mails e arquivos; usa assimétrica pra proteger uma chave simétrica aleatória"]},{"type":"table","title":"Cipher modes","headers":["Modo","Como funciona","Observação"],"rows":[["ECB","cada bloco é cifrado sozinho","blocos iguais viram ciphertext igual; vaza padrões, evite"],["CBC","cada bloco é misturado (XOR) com o anterior, começando por um IV","muito usado; o IV precisa ser imprevisível"],["CFB","transforma a cifra de bloco em fluxo, realimentando com o ciphertext","erro num bloco afeta o seguinte"],["OFB","gera um fluxo de chave independente da mensagem","erro num bit não se espalha"],["CTR","cifra um contador e faz XOR com os dados","rápido e paralelizável"],["GCM","CTR + uma tag de autenticação","cifra e detecta adulteração (AEAD); padrão no TLS moderno"]]},{"type":"warn","text":"Pra guardar senha, o certo é um hash **lento e com salt** (bcrypt, Argon2), não um SHA-256 puro. E MD5 e SHA-1 têm colisões conhecidas."},{"type":"commands","items":[{"cmd":"openssl enc -aes-256-cbc -pbkdf2 -in segredo.txt -out segredo.enc","note":"cifra o arquivo com senha (simétrica)"},{"cmd":"openssl enc -d -aes-256-cbc -pbkdf2 -in segredo.enc -out volta.txt","note":"decifra de volta"},{"cmd":"openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out priv.pem","note":"gera uma chave privada RSA"},{"cmd":"openssl pkey -in priv.pem -pubout -out pub.pem","note":"extrai a chave pública da privada"},{"cmd":"sha256sum arquivo.iso","note":"calcula o hash pra conferir integridade"},{"cmd":"echo -n 'oi' | base64","note":"encoding, **não** é criptografia"}]}],"terms":[{"en":"plaintext / ciphertext","pt":"texto original / texto cifrado"},{"en":"symmetric / asymmetric","pt":"chave única / par de chaves"},{"en":"key pair","pt":"o par chave pública + chave privada"},{"en":"IV (initialization vector)","pt":"valor inicial que evita resultados repetidos"},{"en":"block cipher","pt":"cifra que trabalha em blocos de tamanho fixo"},{"en":"hash","pt":"resumo de mão única e tamanho fixo"}],"practice":"No dia a dia de pentest você mais reconhece do que quebra criptografia. Perceber que algo é só Base64, que um serviço aceita DES/3DES ou modo ECB, ou que um hash é MD5 já vira achado ou o próximo passo do ataque.","quiz":[{"q":"Por que o modo ECB é considerado inseguro mesmo usando AES?","options":["Porque ele usa chave de só 56 bits","Porque blocos iguais de plaintext viram blocos iguais de ciphertext, e os padrões aparecem","Porque ele dispensa a chave","Porque ele transforma o AES em encoding"],"answer":1,"explain":"O ECB cifra cada bloco sozinho, sem misturar com nada. Mesmo com AES, a estrutura dos dados continua visível no resultado."},{"q":"Você encontra uma senha guardada em Base64 num arquivo de configuração. Ela está protegida?","options":["Sim: Base64 é uma cifra simétrica","Sim, desde que ninguém tenha a chave privada","Não, porque Base64 é um hash e hash nunca protege","Não: Base64 é só encoding e qualquer um reverte"],"answer":3,"explain":"Base64 só muda o formato dos dados e não usa chave nenhuma. Um `base64 -d` devolve o texto original."}]}]},{"id":"linux","title":"Linux Fundamentals","titlePt":"Fundamentos de Linux","url":"https://academy.hackthebox.com/course/preview/linux-fundamentals","blurb":"O mais prático dos quatro. Deixa um terminal aberto e roda os comandos enquanto lê.","sections":[{"n":1,"title":"Linux Structure","titlePt":"Como o Linux é organizado","minutes":6,"gist":"Linux é um kernel inspirado no Unix, com uma filosofia simples (tudo é arquivo) e uma árvore de pastas padrão que começa na raiz `/`.","blocks":[{"type":"text","text":"Tecnicamente, **Linux** é só o kernel: o núcleo que conversa com o hardware. Somado às ferramentas do projeto GNU (comandos como `ls` e `cp`), vira um sistema completo e livre."},{"type":"layers","title":"As camadas, de cima pra baixo","items":[{"label":"Utilitários","text":"os programas que fazem o trabalho de fato: `ls`, `cp`, `grep`..."},{"label":"Shell","text":"onde você digita; ele transforma seu comando em programa rodando"},{"label":"Kernel","text":"gerencia CPU, memória, discos e dispositivos. Os programas pedem coisas a ele por **system calls** (chamadas de sistema)"},{"label":"Hardware","text":"a parte física da máquina"}]},{"type":"points","title":"A filosofia que explica muita coisa depois","items":["**Tudo é arquivo:** disco, terminal e até dados de processos aparecem como arquivos (`/dev/sda`, `/proc`).","**Programas pequenos**, cada um fazendo uma coisa bem feita.","**Encadear programas:** a saída de um vira a entrada do outro (o pipe `|`, que aparece mais pra frente).","**Configuração em texto:** quase tudo se ajusta editando arquivos, geralmente em `/etc`.","**Nada de interface que prende:** tudo roda na linha de comando e dá pra automatizar."]},{"type":"analogy","text":"Pensa num condomínio: `/` é o terreno, `/home` são os apartamentos dos moradores, `/root` é o apartamento do síndico (o usuário root), `/etc` é a administração com as regras de tudo e `/tmp` é o salão de festas: qualquer um usa, e em muitas distros ele é limpo a cada reboot."},{"type":"tree","title":"A árvore de diretórios (FHS)","items":[{"label":"/","depth":0,"text":"raiz, o topo de tudo"},{"label":"/bin","depth":1,"text":"comandos essenciais (`ls`, `cp`, `cat`)"},{"label":"/sbin","depth":1,"text":"comandos de administração do sistema"},{"label":"/boot","depth":1,"text":"kernel e arquivos do bootloader"},{"label":"/dev","depth":1,"text":"dispositivos como arquivos (discos, terminais)"},{"label":"/etc","depth":1,"text":"arquivos de configuração"},{"label":"/home","depth":1,"text":"pastas pessoais dos usuários (`/home/joao`)"},{"label":"/root","depth":1,"text":"pasta pessoal do usuário root"},{"label":"/lib","depth":1,"text":"bibliotecas compartilhadas e módulos do kernel"},{"label":"/media","depth":1,"text":"montagem de mídia removível (pendrive, DVD)"},{"label":"/mnt","depth":1,"text":"montagem temporária, feita na mão"},{"label":"/opt","depth":1,"text":"software opcional, geralmente de terceiros"},{"label":"/tmp","depth":1,"text":"arquivos temporários; todo mundo pode escrever"},{"label":"/usr","depth":1,"text":"programas, bibliotecas e documentação de uso geral"},{"label":"/var","depth":1,"text":"dados que mudam: cache, sites (`/var/www`)..."},{"label":"/var/log","depth":2,"text":"logs do sistema e dos serviços"}]},{"type":"tip","text":"Não existe `C:` e `D:` como no Windows. Outro disco ou um pendrive é **montado** (encaixado) numa pasta dentro dessa mesma árvore, tipo `/media/pendrive`."}],"deep":[{"type":"points","title":"História em 3 linhas","items":["O Unix nasceu nos Bell Labs (AT&T) por volta de 1970. Muito do jeito Linux de fazer as coisas vem dele.","Em 1991, Linus Torvalds lançou o **kernel** Linux, que, junto com as ferramentas GNU, formou um sistema completo e livre.","O pacote completo que você instala (kernel + programas) se chama **distribuição**, assunto da próxima seção."]},{"type":"table","title":"Componentes principais","headers":["Componente","O que faz"],"rows":[["Bootloader","Roda logo depois do firmware (BIOS/UEFI) e carrega o kernel na memória. O mais comum é o GRUB"],["Kernel","O núcleo: gerencia CPU, memória, discos e dispositivos"],["Daemons","Serviços rodando em segundo plano (servidor SSH, agendador de tarefas...)"],["Shell","Interface de linha de comando onde você digita comandos"],["Servidor gráfico","Base da parte gráfica (X11 ou Wayland)"],["Gerenciador de janelas / ambiente gráfico","A \"cara\" do desktop: GNOME, KDE, Xfce..."],["Utilitários","Os programas do dia a dia (`ls`, `cp`, `grep`...)"]]},{"type":"text","text":"Em distros modernas, `/bin`, `/sbin` e `/lib` costumam ser só atalhos (**symlinks**) pras pastas equivalentes dentro de `/usr`. Pra você, funciona igual."}],"terms":[{"en":"kernel","pt":"núcleo do sistema, que fala com o hardware"},{"en":"daemon","pt":"serviço rodando em segundo plano"},{"en":"bootloader","pt":"programa que carrega o kernel na inicialização"},{"en":"root directory","pt":"a raiz `/`, topo da árvore"},{"en":"mount point","pt":"pasta onde um disco é \"pendurado\" na árvore"},{"en":"FHS","pt":"Filesystem Hierarchy Standard, o padrão de organização das pastas"}],"practice":"Quando você cai numa máquina, saber o mapa te leva direto ao ponto: configs (às vezes com senha dentro) em `/etc`, logs em `/var/log`, sites em `/var/www` e coisa esquecida em `/tmp`, `/opt` e nas homes.","quiz":[{"q":"Você quer achar o arquivo de configuração de um serviço. Em qual diretório começa a procurar?","options":["`/tmp`","`/etc`","`/boot`","`/dev`"],"answer":1,"explain":"Pelo FHS e pela filosofia \"configuração em arquivo de texto\", as configs do sistema ficam em `/etc`."},{"q":"O `ls` precisa ler o disco. Como ele consegue isso?","options":["Acessa o disco direto, sem intermediário","Pede ao shell, que lê o disco por ele","Pede ao kernel, por uma system call","Pede ao bootloader"],"answer":2,"explain":"Programas comuns não mexem no hardware sozinhos: pedem ao kernel por system calls, e é o kernel que fala com o disco."}]},{"n":2,"title":"Linux Distributions","titlePt":"Distros: um Linux, vários sabores","minutes":4,"gist":"Distro é o kernel Linux empacotado com programas, gerenciador de pacotes e configurações prontas: muda o acabamento, mas a base é a mesma.","blocks":[{"type":"analogy","text":"É tipo prato feito: arroz e feijão (o kernel) estão em todo PF, mas cada restaurante monta o seu com acompanhamento e tempero diferentes."},{"type":"table","title":"As famílias principais","headers":["Família","Exemplos","Pacotes"],"rows":[["Debian","Debian, Ubuntu, Linux Mint, Kali, Parrot","`.deb`, com `apt`"],["Red Hat","RHEL, Fedora, CentOS Stream, Rocky, AlmaLinux","`.rpm`, com `dnf`/`yum`"],["Arch","Arch Linux, BlackArch","`pacman`"]]},{"type":"points","title":"O que muda de uma distro pra outra","items":["o gerenciador de pacotes (o programa que instala e atualiza software)","o foco: desktop, servidor ou segurança","o tempo de suporte","o ciclo de lançamento (logo abaixo)"]},{"type":"compare","title":"Dois jeitos de lançar versões","columns":[{"label":"Versões fixas","items":["sai uma versão grande de tempos em tempos","mais previsível e estável","ex.: Debian, Ubuntu LTS"]},{"label":"Rolling release","items":["atualiza continuamente, sem versões grandes","pacotes sempre recentes","ex.: Arch, Kali"]}]},{"type":"text","text":"Distros de segurança, como **Kali Linux** e **Parrot OS** (as duas baseadas em Debian), já vêm com as ferramentas de pentest instaladas."},{"type":"commands","title":"Que distro é essa?","items":[{"cmd":"cat /etc/os-release","note":"nome e versão da distro"},{"cmd":"uname -r","note":"versão do kernel"},{"cmd":"hostnamectl","note":"resumo do sistema (em distros com systemd, o gerenciador de serviços mais comum)"}]}],"deep":[{"type":"text","text":"Por que o Debian aparece tanto: é estável, muito usado em servidor e é a base de Ubuntu, Kali e Parrot. O preço da estabilidade são pacotes mais antigos."},{"type":"points","title":"Outras distros de segurança","items":["BlackArch (baseada em Arch)","Pentoo (baseada em Gentoo)","BackBox (baseada em Ubuntu)"]}],"terms":[{"en":"distro","pt":"distribuição Linux"},{"en":"package manager","pt":"gerenciador de pacotes, instala e atualiza programas"},{"en":"rolling release","pt":"atualização contínua, sem \"versões grandes\""},{"en":"LTS","pt":"Long Term Support, versão com suporte longo"}],"practice":"Uma das primeiras coisas que você descobre num alvo é a distro e a versão. Isso diz qual gerenciador de pacotes usar, onde ficam certas configs e se existe vulnerabilidade conhecida pra aquela versão.","quiz":[{"q":"Um servidor usa `dnf` pra instalar pacotes. De qual família ele provavelmente é?","options":["Debian","Arch","Red Hat","Gentoo"],"answer":2,"explain":"O `dnf` gerencia pacotes `.rpm`, o padrão da família Red Hat (Fedora, RHEL, Rocky...)."},{"q":"Qual comando mostra o nome e a versão da distro?","options":["`cat /etc/os-release`","`uname -r`","`echo $SHELL`","`cat /etc/shells`"],"answer":0,"explain":"O `/etc/os-release` descreve a distro. O `uname -r` parece, mas mostra a versão do kernel, não da distro."}]},{"n":3,"title":"Introduction to Shell","titlePt":"Terminal e shell: quem é quem","minutes":4,"gist":"O shell é o programa que interpreta o que você digita e manda o sistema executar; o terminal é só a janela onde essa conversa acontece.","blocks":[{"type":"analogy","text":"O terminal é o telefone; o shell é o atendente do outro lado da linha, que entende o pedido e repassa pra cozinha (o kernel)."},{"type":"layers","title":"Da janela até o kernel","items":[{"label":"Emulador de terminal","text":"a janela de texto. Ex.: GNOME Terminal, Konsole, xterm"},{"label":"Multiplexador","text":"`tmux` ou `screen`: divide o terminal em painéis e mantém a sessão viva mesmo se você desconectar","tag":"opcional"},{"label":"Shell","text":"o interpretador: lê o comando, roda o programa e devolve o resultado"},{"label":"Kernel","text":"cria e executa os processos que o shell pede"}]},{"type":"table","title":"Shells que você vai encontrar","headers":["Shell","Onde aparece"],"rows":[["`bash` (Bourne-Again Shell)","Padrão na maioria das distros; o que você mais vai ver"],["`sh`","Shell mínimo, que segue o padrão POSIX (a norma comum dos sistemas tipo Unix); no Debian/Ubuntu, `/bin/sh` aponta pro `dash`"],["`zsh`","Padrão no Kali atual e no macOS"],["`fish`, `ksh`, `tcsh`","Existem, mas são menos comuns"]]},{"type":"commands","title":"Qual shell eu tô usando?","items":[{"cmd":"echo $SHELL","note":"shell padrão do seu usuário"},{"cmd":"echo $0","note":"shell que tá rodando agora"},{"cmd":"cat /etc/shells","note":"shells válidos instalados no sistema"}]}],"deep":[{"type":"text","text":"Se o `echo $0` mostrar `-bash`, com hífen na frente, não é erro: o hífen indica um shell de login, aberto quando você entra no sistema."},{"type":"text","text":"**Reverse shell** é quando a máquina alvo abre a conexão de volta pra você e te entrega um shell nela. Você vai ouvir muito esse termo no HTB."}],"terms":[{"en":"shell","pt":"interpretador de comandos"},{"en":"terminal emulator","pt":"programa da janela de texto"},{"en":"CLI","pt":"command-line interface, interface de linha de comando"},{"en":"multiplexer","pt":"programa que divide o terminal e mantém sessões vivas (tmux)"},{"en":"reverse shell","pt":"shell que a máquina alvo \"manda de volta\" pra você"}],"practice":"Servidor quase nunca tem interface gráfica, e em quase toda máquina do HTB o primeiro objetivo é conseguir um shell no alvo. Daí pra frente é tudo linha de comando: quem trava no terminal trava no resto.","quiz":[{"q":"Qual frase descreve certo a diferença entre terminal e shell?","options":["O shell interpreta os comandos; o terminal é a janela onde você digita","O terminal interpreta os comandos; o shell é só a janela","Terminal e shell são o mesmo programa com nomes diferentes","O shell só funciona em ambiente gráfico"],"answer":0,"explain":"O terminal só mostra texto e recebe o que você digita. Quem entende o comando e manda executar é o shell rodando dentro dele."},{"q":"Fechar a janela do terminal mata o shell que estava rodando nela?","options":["Nunca: o shell é independente da janela","Só se você for root","Só se o shell for o `zsh`","Normalmente sim; dentro do `tmux`, a sessão continua viva"],"answer":3,"explain":"O shell depende daquela janela. O `tmux` mantém a sessão rodando, e você reconecta depois."}]},{"n":4,"title":"Prompt Description","titlePt":"Lendo (e mudando) o prompt","minutes":4,"gist":"O prompt é a linha antes do cursor: mostra quem você é, em qual máquina e em qual pasta está, e dá pra personalizar pela variável `PS1`.","blocks":[{"type":"code","title":"O prompt padrão do bash","lang":"text","code":"joao@notebook:~/htb$"},{"type":"table","title":"Peça por peça","headers":["Parte","Significado"],"rows":[["`joao`","usuário"],["`notebook`","hostname (nome da máquina)"],["`~/htb`","pasta atual (`~` = sua home)"],["`$`","usuário comum; vira `#` quando você é root"]]},{"type":"warn","text":"Viu `#` no fim? Você é **root**, o administrador total da máquina. Pensa duas vezes antes de apertar Enter."},{"type":"text","text":"O formato do prompt fica guardado na variável `PS1` (um nome que guarda um valor no shell), montada com códigos especiais: `\\u` vira o usuário, `\\h` o hostname e `\\w` a pasta atual."},{"type":"commands","title":"Mudando o prompt","items":[{"cmd":"echo $PS1","note":"mostra o formato atual"},{"cmd":"PS1='[\\t] \\u@\\h:\\w\\$ '","note":"muda o prompt só nesta sessão; fica algo como `[14:32:10] joao@notebook:~/htb$`"}]},{"type":"tip","text":"Pra deixar permanente, coloca a linha do `PS1` no fim do `~/.bashrc`, arquivo que o bash lê ao abrir um terminal."}],"deep":[{"type":"table","title":"Códigos do PS1 (bash)","headers":["Código","Mostra"],"rows":[["`\\u`","usuário"],["`\\h`","hostname (até o primeiro ponto)"],["`\\H`","hostname completo"],["`\\w`","caminho completo da pasta atual (sua home aparece como `~`)"],["`\\W`","só o nome da pasta atual"],["`\\d`","data"],["`\\t`","hora (24h, com segundos)"],["`\\@`","hora (12h, com AM/PM)"],["`\\j`","quantos jobs (tarefas em segundo plano ou pausadas) o shell está gerenciando"],["`\\s`","nome do shell"],["`\\n`","quebra de linha"],["`\\$`","`#` se for root, `$` se não"]]},{"type":"text","text":"No Kali atual, o shell padrão é o `zsh`, com prompt de duas linhas e códigos diferentes (`%n` usuário, `%m` máquina, `%~` pasta). A lógica é a mesma; os códigos da tabela são do bash."}],"terms":[{"en":"prompt","pt":"linha que espera seu comando"},{"en":"PS1","pt":"variável que define o prompt principal"},{"en":"hostname","pt":"nome da máquina"},{"en":"home directory","pt":"sua pasta pessoal (`~`)"},{"en":"root","pt":"superusuário, o admin total"}],"practice":"Depois de uma escalada de privilégio, o `$` virando `#` é o primeiro sinal de vitória. Muito pentester também põe data e hora no prompt, pra que prints e logs do teste já saiam com horário, o que ajuda no relatório.","quiz":[{"q":"Seu prompt está `www-data@web01:/var/www$`. O que dá pra saber só olhando?","options":["Você é root na máquina `www-data`, dentro de `/var/www`","Você é o usuário comum `www-data`, na máquina `web01`, dentro de `/var/www`","Você é o usuário `web01`, na máquina `www-data`, na sua home","Você é o usuário `www-data` com poderes de root, na pasta `web01`"],"answer":1,"explain":"Antes do `@` vem o usuário, depois a máquina e, após o `:`, a pasta. O `$` no fim mostra que não é root."},{"q":"Seu `PS1` usa `\\w` e você está em `/home/joao/htb` (sua home é `/home/joao`). O que aparece no lugar do `\\w`?","options":["`htb`","`joao`","`notebook`","`~/htb`"],"answer":3,"explain":"O `\\w` minúsculo mostra o caminho completo da pasta atual, trocando sua home por `~`. Só `htb` seria o `\\W`, com W maiúsculo."}]},{"n":5,"title":"Getting Help","titlePt":"Pedindo ajuda ao próprio Linux","minutes":5,"gist":"Ninguém decora todas as flags: o próprio Linux traz manual (`man`), ajuda rápida (`--help`) e busca por palavra-chave (`apropos`).","blocks":[{"type":"text","text":"Topou com um comando que não conhece? Não precisa sair do terminal: a ajuda já vem instalada e funciona até em máquina sem internet."},{"type":"commands","title":"As ferramentas de ajuda","items":[{"cmd":"ls --help","note":"resumo das opções direto no terminal; quase todo comando aceita"},{"cmd":"man ls","note":"manual completo do comando"},{"cmd":"apropos \"copy files\"","note":"procura comandos pela descrição (o mesmo que `man -k`); salva quando você sabe o que quer fazer, mas não o nome do comando"},{"cmd":"whatis ls","note":"descrição de uma linha"},{"cmd":"help cd","note":"ajuda dos comandos embutidos no bash (**builtins**), como o `cd`, que muitas vezes nem têm página no `man`"},{"cmd":"type cd","note":"diz se é builtin, alias (apelido de comando) ou programa"}]},{"type":"steps","title":"A ordem que resolve quase tudo","items":[{"label":"`--help`","text":"olha o resumo das opções primeiro"},{"label":"`man`","text":"não bastou? abre o manual completo"},{"label":"`/palavra`","text":"dentro do `man`, busca o termo que você precisa"}]},{"type":"table","title":"Andando dentro do man","headers":["Tecla","Ação"],"rows":[["`Espaço` / `b`","desce / sobe uma página"],["`/palavra`","busca no texto"],["`n` / `N`","próxima / anterior ocorrência"],["`q`","sai"]]},{"type":"warn","text":"`-h` nem sempre é ajuda. Em `ls -lh` e `df -h`, ele significa **human-readable**: tamanhos em K, M, G."}],"deep":[{"type":"text","text":"No topo da página do `man`, em **SYNOPSIS**: o que está entre `[ ]` é opcional, e `...` significa que pode repetir."},{"type":"table","title":"Seções do manual que mais importam","headers":["Seção","Tem o quê"],"rows":[["1","comandos"],["5","formatos de arquivo e configuração"],["8","comandos de administração"]]},{"type":"text","text":"Por isso `man passwd` abre o comando `passwd`, enquanto `man 5 passwd` explica o formato do arquivo `/etc/passwd`."},{"type":"tip","text":"Fora do terminal: o site explainshell.com recebe um comando gigante e explica cada pedaço, e o `tldr` (precisa instalar) mostra exemplos práticos curtos."}],"terms":[{"en":"man page","pt":"página de manual"},{"en":"flag / option","pt":"opção que muda o comportamento (`-l`, `--all`)"},{"en":"builtin","pt":"comando embutido no próprio shell"},{"en":"synopsis","pt":"linha de sintaxe no topo do man"},{"en":"usage","pt":"\"como usar\", aparece no `--help`"}],"practice":"Você vai topar toda hora com ferramenta que nunca viu. O caminho `--help`, depois `man`, depois busca dentro do `man` resolve a maioria sem sair do terminal, e funciona até numa máquina sem internet.","quiz":[{"q":"Você rodou `man cd` e veio \"No manual entry for cd\". E agora?","options":["Instalar o pacote do `cd`","Desistir: o `cd` não tem ajuda nenhuma","Rodar `help cd`, porque o `cd` é builtin do bash","Rodar `cd --version`"],"answer":2,"explain":"O `cd` é embutido no bash, então a ajuda dele mora no próprio shell, acessada com `help`."},{"q":"Em `ls -lh`, o que o `-h` faz?","options":["Mostra tamanhos legíveis, em K, M, G","Mostra a ajuda do `ls`","Mostra os arquivos ocultos","Mostra o hostname"],"answer":0,"explain":"Aqui o `-h` é \"human-readable\". Nem todo `-h` é ajuda: na dúvida, use `--help`."}]},{"n":6,"title":"System Information","titlePt":"Reconhecendo a máquina","minutes":6,"gist":"Antes de fazer qualquer coisa numa máquina, você descobre quem você é, que sistema é esse e o que está rodando, com poucos comandos.","blocks":[{"type":"text","text":"Com IP, usuário e senha de uma máquina Linux, o jeito padrão de entrar é por **SSH**. Ele pede a senha e te entrega um shell remoto."},{"type":"commands","items":[{"cmd":"ssh usuario@\u003cip-alvo>","note":"conecta na máquina como `usuario`"}]},{"type":"table","title":"As perguntas e os comandos","headers":["Pergunta","Comando"],"rows":[["Quem sou eu?","`whoami` (só o nome) e `id` (UID, GID e todos os grupos)"],["Que máquina é essa?","`hostname` e `uname -a`"],["Onde estou?","`pwd`"],["Como ela tá na rede?","`ip a` (placas de rede e seus IPs, MAC e MTU)"],["Que portas estão abertas?","`ss -tulpn` (as flags estão explicadas no aprofundamento)"],["O que está rodando?","`ps aux` (todos os processos, de todos os usuários)"],["Quem mais está logado?","`who`"]]},{"type":"warn","text":"Pegadinha do `uname`: o `-r` (**release**) mostra o número de versão do kernel. Já o `-v` (**version**) mostra dados da compilação. O nome engana."},{"type":"tip","text":"Não achou `ifconfig` ou `netstat`? Eles são do pacote antigo net-tools e podem nem estar instalados. Os substitutos modernos são `ip` e `ss`."}],"deep":[{"type":"commands","title":"O uname por partes","items":[{"cmd":"uname -a","note":"tudo de uma vez"},{"cmd":"uname -s","note":"nome do kernel"},{"cmd":"uname -n","note":"hostname"},{"cmd":"uname -r","note":"release: o número de versão do kernel"},{"cmd":"uname -v","note":"version: dados da compilação do kernel (o nome engana!)"},{"cmd":"uname -m","note":"arquitetura do hardware da máquina"}]},{"type":"table","title":"Decifrando o ss -tulpn","headers":["Flag","Significa"],"rows":[["`-t`","TCP"],["`-u`","UDP"],["`-l`","só portas escutando (esperando conexão)"],["`-p`","processo dono da porta (sem root, você só vê os seus)"],["`-n`","números em vez de nomes"]]},{"type":"table","title":"Mais comandos de reconhecimento","headers":["Comando","Mostra"],"rows":[["`env`","variáveis de ambiente (`HOME`, `USER`, `SHELL`, `PATH`...); `echo $HOME` mostra uma só"],["`lsblk`","discos e partições"],["`lsusb` / `lspci`","dispositivos USB / PCI"],["`lsof`","arquivos abertos e quem abriu"],["`ifconfig` / `netstat`","versões antigas de `ip a` / `ss`"]]},{"type":"text","text":"Bônus: no `/etc/passwd`, cada linha descreve um usuário em 7 campos separados por `:`. Dá pra ler ali a home e o shell de qualquer usuário (o `grep`, pra filtrar só a linha que interessa, vem em Filter Contents)."},{"type":"code","title":"Formato de uma linha do /etc/passwd","lang":"text","code":"nome:x:UID:GID:comentário:pasta_home:shell"}],"terms":[{"en":"UID / GID","pt":"número do usuário / do grupo"},{"en":"kernel release","pt":"versão do kernel"},{"en":"environment variable","pt":"variável de ambiente, tipo `HOME` e `PATH`"},{"en":"network interface","pt":"placa de rede, física ou virtual"},{"en":"listening port","pt":"porta esperando conexão"}],"practice":"É o começo de toda enumeração pra escalar privilégio: versão do kernel (tem exploit conhecido?), grupos no `id` (`sudo`, `docker` ou `lxd` costumam ser meio caminho andado), portas abertas só pra localhost e processos rodando como root.","quiz":[{"q":"Você quer ver seu usuário, seu UID, seu GID e todos os seus grupos de uma vez. Qual comando?","options":["`whoami`","`id`","`hostname`","`who`"],"answer":1,"explain":"O `whoami` só dá o nome. O `id` mostra também UID, GID e grupos, que é o que define o que você pode acessar."},{"q":"Qual comando mostra o número de versão do kernel?","options":["`uname -v`","`uname -n`","`uname -r`","`uname -m`"],"answer":2,"explain":"O `-r` (release) é a versão do kernel. O `-v` parece, mas mostra dados da compilação."}]},{"n":7,"title":"Navigation","titlePt":"Andando pelas pastas","minutes":5,"gist":"Navegar é saber onde você está (`pwd`), o que tem em volta (`ls`) e como ir pra outro lugar (`cd`).","blocks":[{"type":"facts","title":"O trio da navegação","items":[{"value":"pwd","label":"onde eu tô?"},{"value":"ls","label":"o que tem aqui?"},{"value":"cd","label":"me leva pra lá"}]},{"type":"table","title":"As variações do ls","headers":["Comando","O que faz"],"rows":[["`ls`","lista o conteúdo da pasta"],["`ls -l`","formato longo: permissões, dono, tamanho, data"],["`ls -a`","inclui arquivos ocultos (os que começam com `.`)"],["`ls -la`","os dois juntos, o combo mais usado"],["`ls -lh`","tamanhos legíveis (K, M, G)"],["`ls -i`","mostra o número de inode (identificador interno) de cada item"],["`ls -l /etc`","lista outra pasta sem precisar entrar nela"]]},{"type":"analogy","text":"Caminho absoluto é o endereço completo com CEP: funciona de qualquer lugar. Caminho relativo é \"segunda rua à direita daqui\": só faz sentido a partir de onde você está."},{"type":"compare","title":"Absoluto x relativo","columns":[{"label":"Absoluto","items":["começa na raiz `/`","funciona de qualquer lugar","ex.: `cd /etc/ssh`"]},{"label":"Relativo","items":["parte da pasta atual","muda de sentido conforme onde você está","ex.: `cd docs`, `cd ..`"]}]},{"type":"commands","title":"Se movendo","items":[{"cmd":"pwd","note":"mostra a pasta atual"},{"cmd":"cd /etc/ssh","note":"absoluto: começa na raiz `/`"},{"cmd":"cd docs","note":"relativo: a partir da pasta atual"},{"cmd":"cd ..","note":"sobe uma pasta (`..` = pasta de cima, `.` = pasta atual)"},{"cmd":"cd ~","note":"vai pra sua home (só `cd` faz o mesmo)"},{"cmd":"cd -","note":"volta pra pasta anterior"}]},{"type":"points","title":"Atalhos que poupam tempo","items":["`Tab` completa nomes de comandos e arquivos; `Tab` duas vezes lista as opções.","`Ctrl+L` (ou `clear`) limpa a tela.","Setas pra cima e pra baixo percorrem comandos anteriores; `history` lista todos; `Ctrl+R` busca no histórico."]}],"deep":[{"type":"code","title":"Uma linha do ls -l","lang":"text","code":"-rw-r--r-- 1 joao joao 3771 Jan 10 09:12 .bashrc"},{"type":"table","title":"Decifrando a linha","headers":["Pedaço","Significado"],"rows":[["`-rw-r--r--`","tipo (`-` arquivo, `d` pasta, `l` link simbólico) + permissões (detalhadas em Permission Management)"],["`1`","número de hard links (nomes apontando pro mesmo inode)"],["`joao joao`","dono e grupo"],["`3771`","tamanho em bytes"],["`Jan 10 09:12`","data da última modificação"],["`.bashrc`","nome; o ponto no começo deixa oculto"]]},{"type":"text","text":"A linha `total` no topo da listagem é o espaço em blocos ocupado pelos arquivos. Pode ignorar por enquanto."},{"type":"text","text":"**Inode** é o número de identificação do arquivo dentro do sistema de arquivos. Ele guarda os metadados (dono, permissões, datas, onde estão os dados); o nome é só um rótulo apontando pra esse número."}],"terms":[{"en":"working directory","pt":"pasta atual"},{"en":"absolute path / relative path","pt":"caminho absoluto / relativo"},{"en":"hidden file","pt":"arquivo oculto (começa com `.`)"},{"en":"inode","pt":"identificador interno do arquivo"},{"en":"tab completion","pt":"autocompletar com Tab"}],"practice":"`ls -la` vira reflexo: arquivos ocultos nas homes (configs, históricos, chaves SSH dentro de `.ssh`) são onde aparecem credenciais esquecidas.","quiz":[{"q":"Você está em `/home/joao/docs` e roda `cd ../../..`. Onde vai parar?","options":["`/home`","`/home/joao`","`/root`","`/`"],"answer":3,"explain":"Cada `..` sobe um nível: o primeiro leva pra `/home/joao`, o segundo pra `/home` e o terceiro pra raiz `/`."},{"q":"Qual comando lista a pasta com detalhes e incluindo os arquivos ocultos?","options":["`ls -la`","`ls -lh`","`ls -i`","`ls -l`"],"answer":0,"explain":"O `-l` dá o formato longo e o `-a` inclui os ocultos (os que começam com `.`)."}]},{"n":8,"title":"Working with Files and Directories","titlePt":"Criar, copiar, mover e apagar","minutes":5,"gist":"Criar, copiar, mover, renomear e apagar arquivos e pastas se faz com meia dúzia de comandos curtos.","blocks":[{"type":"table","title":"Os comandos","headers":["Comando","Faz"],"rows":[["`touch arq.txt`","cria arquivo vazio (ou atualiza a data, se já existir)"],["`mkdir pasta`","cria uma pasta"],["`mkdir -p a/b/c`","cria o caminho inteiro, incluindo as pastas do meio"],["`cp origem destino`","copia arquivo"],["`cp -r pasta1 pasta2`","copia pasta com tudo dentro"],["`mv origem destino`","move **ou** renomeia"],["`rm arq`","apaga arquivo"],["`rm -r pasta`","apaga pasta e tudo dentro"],["`tree`","mostra a estrutura em árvore (às vezes precisa instalar)"]]},{"type":"text","text":"O `mv` faz duas coisas com o mesmo comando: **move** e **renomeia**. Renomear, pro Linux, é só \"mover\" pro mesmo lugar com outro nome."},{"type":"commands","title":"Montando sua pasta de trabalho","items":[{"cmd":"mkdir -p ~/htb/{scans,loot,notas}","note":"cria `htb` e, dentro dela, 3 pastas de uma vez (o `{...}` vira três nomes)"},{"cmd":"touch ~/htb/notas/alvo.txt","note":"cria um arquivo vazio"},{"cmd":"cp ~/htb/notas/alvo.txt ~/htb/notas/alvo.bak","note":"faz uma cópia"},{"cmd":"mv ~/htb/notas/alvo.bak ~/htb/loot/","note":"move pra outra pasta"},{"cmd":"mv ~/htb/loot/alvo.bak ~/htb/loot/antigo.txt","note":"renomeia"},{"cmd":"tree ~/htb","note":"confere como ficou"}]},{"type":"tree","title":"O resultado","items":[{"label":"~/htb","depth":0},{"label":"loot","depth":1},{"label":"antigo.txt","depth":2,"text":"a cópia, movida e renomeada"},{"label":"notas","depth":1},{"label":"alvo.txt","depth":2,"text":"o original"},{"label":"scans","depth":1,"text":"vazia, esperando seus scans"}]},{"type":"warn","text":"Terminal não tem lixeira: `rm` apagou, já era. E `rm -rf` (o `-f` força, sem perguntar) com caminho errado é o desastre clássico. Lê duas vezes antes do Enter."},{"type":"tip","text":"Por padrão, `cp` e `mv` sobrescrevem o destino sem perguntar. Com `-i`, eles (e o `rm`) pedem confirmação antes."}],"deep":[{"type":"commands","title":"Ordenando por data","items":[{"cmd":"ls -lt","note":"lista com o modificado mais recente primeiro"},{"cmd":"ls -ltr","note":"mesma coisa, ao contrário (mais antigo primeiro)"}]},{"type":"text","text":"O `{scans,loot,notas}` é **brace expansion**: o bash expande isso em três nomes antes de rodar o comando, e o `mkdir` recebe três caminhos."},{"type":"text","text":"Algumas distros já criam um alias (apelido de comando) com `-i` pro root. Por isso, às vezes o `cp` ou o `mv` pergunta antes de sobrescrever mesmo sem você pedir."}],"terms":[{"en":"directory","pt":"pasta"},{"en":"recursive (-r)","pt":"aplica em tudo que está dentro"},{"en":"overwrite","pt":"sobrescrever"},{"en":"timestamp","pt":"data/hora registrada no arquivo"},{"en":"brace expansion","pt":"o `{a,b,c}` que o bash expande em vários nomes"}],"practice":"Organizar uma pasta por alvo (scans, loot, notas) desde o começo salva sua vida na hora do relatório. E `ls -lt` em pastas de logs ou uploads mostra rápido o que mudou por último, que costuma ser o mais interessante.","quiz":[{"q":"O que acontece com `mv relatorio.txt final.txt` se `final.txt` já existe?","options":["O `mv` dá erro e não faz nada","O `mv` cria um `final(1).txt`","O `final.txt` antigo é sobrescrito sem aviso","O conteúdo dos dois é juntado"],"answer":2,"explain":"Por padrão, o `mv` sobrescreve o destino sem perguntar. Com `mv -i`, ele pergunta antes."},{"q":"Qual comando cria `a/b/c` de uma vez, incluindo as pastas do meio?","options":["`mkdir a/b/c`","`mkdir -p a/b/c`","`touch a/b/c`","`cp -r a/b/c`"],"answer":1,"explain":"O `-p` cria o caminho inteiro. Sem ele, o `mkdir` reclama se `a` ou `a/b` ainda não existirem."}]},{"n":9,"title":"Editing Files","titlePt":"Editando no terminal: nano e vim","minutes":5,"gist":"No terminal você edita texto com o `nano` (fácil) ou o `vim` (poderoso, mas cheio de modos), e vale saber o básico dos dois.","blocks":[{"type":"compare","title":"Os dois editores","columns":[{"label":"nano","items":["abre pronto pra digitar","atalhos sempre visíveis na barra de baixo (`^` = `Ctrl`)","ótimo pra começar"]},{"label":"vim","items":["é **modal**: a mesma tecla faz coisas diferentes em cada modo","abre no modo Normal, não no de digitação","quase sempre disponível, nem que seja como `vi`"]}]},{"type":"table","title":"nano: o essencial","headers":["Atalho","Ação"],"rows":[["`Ctrl+O`","salva (depois Enter pra confirmar o nome)"],["`Ctrl+X`","sai (pergunta se quer salvar, se tiver mudança)"],["`Ctrl+W`","busca texto"],["`Ctrl+K` / `Ctrl+U`","recorta / cola a linha"]]},{"type":"table","title":"Os modos do vim","headers":["Modo","Como entra","Pra quê"],"rows":[["Normal","`Esc` (é onde o vim abre)","navegar e dar comandos"],["Insert","`i`","digitar texto"],["Visual","`v`","selecionar texto"],["Command","`:`","salvar, sair, substituir"],["Replace","`R`","escrever por cima do texto existente"]]},{"type":"steps","title":"Sobrevivendo ao vim","items":[{"label":"Abrir","text":"`vim notas.txt` abre (ou cria) o arquivo, no modo Normal"},{"label":"Digitar","text":"aperta `i` pra entrar no modo Insert e escreve à vontade"},{"label":"Parar","text":"`Esc` volta pro modo Normal"},{"label":"Salvar e sair","text":"`:wq` salva e sai; `:q!` sai descartando tudo"}]},{"type":"tip","text":"Só quer ler o arquivo, sem editar? `cat arquivo` despeja o conteúdo na tela."}],"deep":[{"type":"table","title":"Comandos do modo Normal","headers":["Tecla","Ação"],"rows":[["`x`","apaga o caractere sob o cursor"],["`dw` / `dd`","apaga palavra / linha"],["`yw` / `yy`","copia palavra / linha"],["`p`","cola depois do cursor"],["`u`","desfaz"],["`/texto`","busca (`n` vai pra próxima)"],["`gg` / `G`","vai pro início / fim do arquivo"]]},{"type":"table","title":"Comandos do modo Command","headers":["Comando","Faz"],"rows":[["`:w`","salva"],["`:q`","sai (só se não houver mudança pendente)"],["`:wq`","salva e sai"],["`:q!`","sai descartando tudo"]]},{"type":"commands","items":[{"cmd":"nano notas.txt","note":"abre (ou cria) o arquivo no nano"},{"cmd":"vim notas.txt","note":"abre (ou cria) no vim"},{"cmd":"vimtutor","note":"tutorial interativo de uns 30 minutos, costuma vir com o vim"}]},{"type":"text","text":"O vim é a evolução do antigo `vi`. Por ser modal, todo mundo já ficou preso nele pelo menos uma vez: não é só você."},{"type":"warn","text":"Num reverse shell sem TTY completo (um terminal interativo de verdade), editores de tela cheia costumam bugar. Aí dá pra escrever o arquivo com `echo` e redirecionamento, assunto de File Descriptors and Redirections."}],"terms":[{"en":"text editor","pt":"editor de texto"},{"en":"insert mode","pt":"modo de digitação do vim"},{"en":"normal mode","pt":"modo de comandos do vim"},{"en":"write (:w)","pt":"salvar"},{"en":"quit (:q)","pt":"sair"}],"practice":"Servidor mínimo às vezes não tem `nano`, mas quase sempre tem `vi`. Então entrar, editar, salvar e sair dele é obrigatório, nem que seja só o básico.","quiz":[{"q":"Você abriu um arquivo no vim, começou a digitar e as letras viraram comandos malucos. O que aconteceu?","options":["Você estava no modo Normal, não no Insert","O arquivo está corrompido","O vim abriu em modo somente leitura","O teclado está no layout errado"],"answer":0,"explain":"O vim abre no modo Normal, onde cada tecla é um comando. Pra digitar, aperta `i` antes."},{"q":"Como sair do vim jogando fora as mudanças?","options":["`:wq`","`Ctrl+X`","`:w`","`Esc` e depois `:q!`"],"answer":3,"explain":"O `Esc` garante que você tá no modo Normal, e o `:q!` sai sem salvar. O `:wq` salvaria tudo."}]},{"n":10,"title":"Find Files and Directories","titlePt":"Achando arquivos: which, find e locate","minutes":6,"gist":"`which` mostra onde está um programa, `find` varre o disco com filtros (nome, dono, tamanho, data) e `locate` busca rápido num índice pronto.","blocks":[{"type":"table","title":"Qual usar?","headers":["Ferramenta","Velocidade","Filtros","Sempre atualizado?"],"rows":[["`which`","instantâneo","só executáveis no `PATH`","sim"],["`find`","mais lento (varre o disco)","muitos","sim"],["`locate`","instantâneo","basicamente o nome","só até o último `updatedb`"]]},{"type":"text","text":"O `which` procura só nas pastas listadas no `$PATH` (onde o shell procura comandos). Se não imprimir nada, o programa não está ali, e talvez nem esteja instalado."},{"type":"code","title":"A receita do find","lang":"text","code":"find \u003conde procurar> \u003cfiltros> \u003cação opcional>"},{"type":"table","title":"Filtros mais usados do find","headers":["Opção","Filtra por"],"rows":[["`-type f` / `-type d`","só arquivos / só pastas"],["`-name \"*.conf\"`","nome, aceita curinga; `-iname` ignora maiúsculas/minúsculas"],["`-user root`","dono do arquivo"],["`-size +50k`","maior que 50 KiB (`-` = menor; unidades `c` bytes, `k`, `M`, `G`)"],["`-newermt 2024-01-01`","modificado depois dessa data"],["`-exec cmd {} \\;`","roda `cmd` em cada resultado (`{}` vira o arquivo achado)"]]},{"type":"commands","title":"Juntando tudo","items":[{"cmd":"which python3","note":"caminho do executável que seria rodado"},{"cmd":"find /etc -type f -name \"*.conf\" -user root -size +10k -newermt 2024-01-01 2>/dev/null","note":"arquivos `.conf` do root, maiores que 10 KiB, modificados depois de 01/01/2024"},{"cmd":"sudo updatedb","note":"atualiza o índice do `locate`"},{"cmd":"locate sshd_config","note":"busca instantânea pelo nome"}]},{"type":"tip","text":"O `2>/dev/null` no fim joga fora as mensagens de erro (tipo \"Permission denied\") que poluem a saída. O porquê fica pra seção de redirecionamentos."},{"type":"warn","text":"Põe aspas no padrão do `-name`. Sem elas, o shell pode expandir o `*.conf` antes de o `find` ver, e o resultado sai errado."}],"deep":[{"type":"commands","title":"Mais exemplos","items":[{"cmd":"find /var/log -type f -name \"*.log\" -exec ls -l {} \\; 2>/dev/null","note":"mostra os detalhes de cada `.log` achado com `ls -l`"},{"cmd":"find / -type f -size +1M -size -5M 2>/dev/null","note":"combina `+` e `-` pra pegar uma faixa de tamanho"}]},{"type":"warn","text":"Pegadinha do tamanho: o `find` arredonda o tamanho do arquivo **pra cima** na unidade escolhida antes de comparar. Por isso `-size -1M` só pega arquivos vazios: qualquer arquivo com 1 byte já \"vira\" 1M."},{"type":"text","text":"Pelo mesmo motivo, `-size +1M -size -5M` pega de pouco mais de 1 MiB até 4 MiB, não até 5. Em limites apertados, use bytes (`c`) pra ter precisão."}],"terms":[{"en":"PATH","pt":"lista de pastas onde o shell procura comandos"},{"en":"wildcard","pt":"curinga (`*`, `?`)"},{"en":"Permission denied","pt":"acesso negado por permissão"},{"en":"stderr","pt":"saída de erros de um programa"},{"en":"database","pt":"o índice que o `locate` consulta"}],"practice":"O `find` é peça central da enumeração: achar backups esquecidos, configs com senha, arquivos de um usuário específico ou modificados recentemente. Mais pra frente, ele também caça arquivos com permissões especiais na escalada de privilégio.","quiz":[{"q":"Por que o `locate` pode não achar um arquivo que você acabou de criar?","options":["Porque ele só procura nas pastas do `$PATH`","Porque ele consulta um índice, que só se atualiza com `updatedb`","Porque ele ignora arquivos pequenos","Porque ele só funciona como root"],"answer":1,"explain":"O `locate` não varre o disco: consulta um índice. Até alguém rodar `sudo updatedb`, o arquivo novo não está lá."},{"q":"Qual comando acha só arquivos (não pastas) terminados em `.conf` dentro de `/etc`?","options":["`find /etc -type d -name \"*.conf\"`","`which /etc/*.conf`","`find /etc -type f -name \"*.conf\"`","`locate -type f /etc`"],"answer":2,"explain":"O `-type f` limita a arquivos (o `d` seria pastas) e o `-name` com aspas filtra pelo padrão de nome."}]},{"n":11,"title":"File Descriptors and Redirections","titlePt":"Redirecionar entrada e saída","minutes":5,"gist":"Todo programa tem três canais padrão (entrada, saída e erro), e você pode desviar cada um pra um arquivo ou pra outro programa.","blocks":[{"type":"text","text":"Pensa num programa de terminal como uma máquina com três bocas: uma pra receber, uma pra falar e uma só pra reclamar."},{"type":"table","title":"Os três canais","headers":["FD","Nome","O que é","Padrão"],"rows":[["0","stdin","entrada","teclado"],["1","stdout","saída normal","tela"],["2","stderr","saída de erro","tela"]]},{"type":"text","text":"FD é **file descriptor**: o número que o sistema usa pra cada canal. **Redirecionar** é pegar um desses canos e apontar pra outro lugar."},{"type":"commands","title":"Desviando os canos","items":[{"cmd":"ls /etc > lista.txt","note":"manda a saída normal pra um arquivo (sobrescreve)"},{"cmd":"echo linha >> lista.txt","note":"`>>` acrescenta no fim em vez de apagar o que tinha"},{"cmd":"ls /naoexiste 2> erros.txt","note":"manda só os erros (FD 2) pra um arquivo"},{"cmd":"comando > tudo.txt 2>&1","note":"junta erro e saída normal no mesmo arquivo"},{"cmd":"comando 2> /dev/null","note":"descarta os erros no ralo do sistema"}]},{"type":"analogy","text":"O `/dev/null` é o ralo da pia: tudo que você joga lá some e não volta. Ótimo pra calar erro que não interessa."},{"type":"text","text":"O **pipe** `|` é primo do redirecionamento: em vez de mandar a saída pra um arquivo, ele liga direto na entrada do próximo programa. Em `ls -la /etc | grep conf`, a lista do `ls` vira a entrada do `grep`."},{"type":"warn","text":"`>` fala com um **arquivo**; `|` fala com outro **programa**. Trocar um pelo outro sem querer é erro clássico de iniciante."}],"deep":[{"type":"commands","title":"Desviando a entrada","items":[{"cmd":"wc -l \u003c lista.txt","note":"`\u003c` faz o comando ler de um arquivo em vez do teclado (aqui, conta as linhas)"}]},{"type":"text","text":"Existe também o **here-document** (`\u003c\u003c`), que joga várias linhas direto pra entrada de um comando, útil em scripts. Só saber que existe já basta por enquanto."}],"terms":[{"en":"stdin","pt":"entrada padrão (FD 0)"},{"en":"stdout","pt":"saída padrão (FD 1)"},{"en":"stderr","pt":"saída de erro (FD 2)"},{"en":"redirect","pt":"desviar um canal pra outro lugar"},{"en":"pipe","pt":"ligar a saída de um comando na entrada de outro"},{"en":"append","pt":"acrescentar no fim (o `>>`)"}],"practice":"Num pentest você vive redirecionando: salvar o resultado de um scan num arquivo, jogar fora o erro que não interessa e encadear ferramentas com pipe. Separar stdout de stderr evita que mensagem de erro polua o arquivo de resultado.","quiz":[{"q":"Qual a diferença entre `comando > out.txt` e `comando >> out.txt`?","options":["`>` acrescenta no fim e `>>` sobrescreve","`>` sobrescreve do zero e `>>` acrescenta no final","São exatamente a mesma coisa","`>>` só funciona com mensagens de erro"],"answer":1,"explain":"`>` recria o arquivo do zero; `>>` acrescenta mantendo o que já tinha. Trocar um pelo outro sem querer apaga trabalho."}]},{"n":12,"title":"Filter Contents","titlePt":"Recortar e contar texto","minutes":5,"gist":"Um punhado de comandos pequenos que recortam, contam, ordenam e enxugam texto, feitos pra serem encadeados com pipe.","blocks":[{"type":"text","text":"A filosofia do Unix é cada programa fazer uma coisa bem feita. Você junta vários com pipe e monta a resposta."},{"type":"table","title":"Os filtros clássicos","headers":["Comando","O que faz"],"rows":[["`cat`","despeja o arquivo inteiro"],["`head` / `tail`","primeiras / últimas linhas (`-n 20`)"],["`less`","lê página por página sem travar o terminal"],["`wc`","conta linhas, palavras, bytes (`wc -l` = só linhas)"],["`sort`","ordena (`-n` numérico, `-r` invertido)"],["`uniq`","tira duplicatas **adjacentes** (use depois do `sort`)"],["`cut`","recorta colunas (`-d` separador, `-f` campo)"],["`tr`","troca ou apaga caracteres (`tr ':' ' '` troca `:` por espaço)"],["`grep`","filtra linhas que batem com um padrão (`-v` inverte)"],["`awk`","trabalha por campos: `awk '{print $1}'` pega a 1ª coluna"],["`sed`","edita no caminho: `sed 's/velho/novo/g'`"]]},{"type":"commands","title":"Exemplos com /etc/passwd","items":[{"cmd":"cut -d: -f1 /etc/passwd","note":"pega só o nome de login (1º campo, separado por `:`)"},{"cmd":"cut -d: -f7 /etc/passwd | sort | uniq","note":"lista os shells em uso, sem repetição"},{"cmd":"cut -d: -f7 /etc/passwd | sort | uniq -c | sort -rn","note":"conta cada um e ordena do mais comum pro menos"},{"cmd":"grep -v nologin /etc/passwd","note":"esconde as contas que não têm shell de login"}]},{"type":"tip","text":"A dupla `sort | uniq -c | sort -rn` conta quantas vezes cada coisa aparece e mostra o ranking. Guarde essa, é das mais usadas."}],"deep":[{"type":"warn","text":"`uniq` sozinho só junta duplicatas que estão **coladas** uma na outra. Se os dados estão espalhados, ordene com `sort` antes, senão ele não enxerga as repetições."},{"type":"commands","title":"Mais dois truques","items":[{"cmd":"wc -l /etc/passwd","note":"conta as linhas = quantas contas existem (inclui contas de serviço)"},{"cmd":"cut -d: -f1,7 /etc/passwd | column -t -s:","note":"`column -t` alinha tudo em colunas bonitinhas (`-s:` diz que o separador é `:`)"}]}],"terms":[{"en":"filter","pt":"comando que transforma o texto que passa por ele"},{"en":"field","pt":"coluna / campo"},{"en":"delimiter","pt":"caractere que separa os campos"},{"en":"count","pt":"contagem (o `-c` do uniq)"},{"en":"unique","pt":"sem repetição"}],"practice":"Logs, saídas de ferramenta e arquivos de config são todos texto. Saber recortar o campo certo e contar ocorrências transforma uma parede de texto numa resposta em segundos, sem precisar de script nenhum.","quiz":[{"q":"Por que `sort` quase sempre aparece antes de `uniq`?","options":["Porque `uniq` só remove duplicatas em linhas vizinhas, e o `sort` agrupa as iguais primeiro","Porque o `uniq` dá erro se o arquivo não estiver em ordem alfabética","Porque o `sort` também apaga as linhas repetidas antes"],"answer":0,"explain":"`uniq` só enxerga duplicatas adjacentes. O `sort` coloca as linhas iguais lado a lado pra que ele consiga removê-las."}]},{"n":13,"title":"Regular Expressions","titlePt":"Regex: padrões de texto","minutes":5,"gist":"Regex é uma mini-linguagem pra descrever padrões de texto, tipo 'qualquer coisa que pareça um IP', em vez de procurar um texto exato.","blocks":[{"type":"text","text":"Em vez de buscar a palavra literal, você descreve o **formato** do que quer. Esses são os tijolos básicos."},{"type":"table","title":"Os símbolos essenciais","headers":["Símbolo","Significado"],"rows":[["`.`","qualquer um caractere"],["`*`","zero ou mais do que veio antes"],["`+`","um ou mais (regex estendida)"],["`?`","opcional (zero ou um)"],["`^`","início da linha"],["`$`","fim da linha"],["`[0-9]`","um dígito; `[abc]` um desses; `[^abc]` qualquer menos esses"],["`{n,m}`","repete o anterior de n a m vezes (`{3}` = exatamente 3)"],["`a|b`","casa `a` ou `b`; `( )` agrupa um pedaço"],["`\\`","escapa um símbolo especial (`\\.` = ponto literal)"]]},{"type":"commands","title":"grep na prática","items":[{"cmd":"grep '^root' /etc/passwd","note":"linhas que COMEÇAM com `root`"},{"cmd":"grep 'bash$' /etc/passwd","note":"linhas que TERMINAM com `bash`"},{"cmd":"grep -E 'nologin|false' /etc/passwd","note":"o 'ou': linhas com `nologin` ou `false`"},{"cmd":"grep -oE '[0-9]{1,3}(\\.[0-9]{1,3}){3}' arq.log","note":"extrai só os trechos parecidos com um IPv4"}]},{"type":"tip","text":"Por que `-E`? Ele liga a regex **estendida**, onde `+`, `?`, `|`, `( )` e `{ }` funcionam direto, sem precisar de `\\` na frente."},{"type":"warn","text":"O `*` do regex **não** é o `*` do shell: no terminal ele quer dizer 'qualquer nome de arquivo', no regex quer dizer 'repete o anterior'. Sempre ponha o padrão entre aspas simples, pro shell não mexer nele antes do grep."}],"deep":[{"type":"text","text":"Os dois dialetos têm nome: BRE (básica, o padrão do `grep`) e ERE (estendida, a do `grep -E`). Na BRE você teria que escrever `\\+`, `\\|` e por aí vai."},{"type":"text","text":"O `*` e o `+` são **gulosos** (greedy): pegam o máximo de texto possível que ainda casa com o padrão."},{"type":"tip","text":"Grave o `grep -oE`: ele mostra só o pedaço que casou, não a linha toda. Perfeito pra extrair IPs, e-mails ou hashes de dentro de um texto bagunçado."}],"terms":[{"en":"pattern","pt":"o padrão que você descreve"},{"en":"match","pt":"casar / bater com o padrão"},{"en":"anchor","pt":"âncora de posição (`^` e `$`)"},{"en":"character class","pt":"o conjunto entre `[ ]`"},{"en":"escape","pt":"neutralizar um caractere especial com `\\`"},{"en":"greedy","pt":"guloso: `*`/`+` pegam o máximo possível"}],"practice":"Regex é onipresente: filtrar log por formato de erro, extrair todos os IPs de um dump, validar entrada e buscar em código. Em ferramentas de segurança (grep em wordlists, parsing de saída) é habilidade do dia a dia.","quiz":[{"q":"O que `^admin$` casa que `admin` sozinho não casa?","options":["Nada, os dois são iguais","Qualquer linha que tenha `admin` no meio","Linhas que terminam em `admin`","Só uma linha que seja exatamente `admin`"],"answer":3,"explain":"As âncoras `^` e `$` prendem o padrão no início e no fim: só casa a linha que é exatamente `admin`, não `superadmin` nem `administrador`."}]},{"n":14,"title":"Permission Management","titlePt":"Permissões de arquivo","minutes":6,"gist":"Todo arquivo tem dono, grupo e três permissões (ler, escrever, executar), e saber ler isso é meio caminho pra entender o que dá pra fazer na máquina.","blocks":[{"type":"text","text":"Rode `ls -l` e olhe a primeira coluna, tipo `-rwxr-xr--`. Cada letra é `r` (read, ler), `w` (write, escrever) ou `x` (execute, executar); um `-` no lugar quer dizer que aquela permissão não existe."},{"type":"table","title":"Lendo `-rwxr-xr--` pedaço por pedaço","headers":["Posição","No exemplo","Quer dizer"],"rows":[["1º caractere","`-`","tipo: `-` arquivo, `d` diretório, `l` link"],["2º ao 4º","`rwx`","o que o **dono** (user) pode"],["5º ao 7º","`r-x`","o que o **grupo** pode"],["8º ao 10º","`r--`","o que **todos os outros** (others) podem"]]},{"type":"table","title":"Forma numérica (octal): é só somar r=4, w=2, x=1","headers":["Octal","Trio","Significado"],"rows":[["`7`","`rwx`","ler, escrever, executar"],["`6`","`rw-`","ler e escrever"],["`5`","`r-x`","ler e executar"],["`4`","`r--`","só ler"],["`0`","`---`","nada"]]},{"type":"commands","title":"Mudando permissões","items":[{"cmd":"chmod 755 script.sh","note":"vira `rwxr-xr-x`: dono faz tudo, o resto lê e executa"},{"cmd":"chmod 644 arquivo.txt","note":"vira `rw-r--r--`: dono lê e escreve, o resto só lê"},{"cmd":"chmod +x script.sh","note":"adiciona permissão de execução (pra todos, respeitando o umask)"},{"cmd":"chown usuario:grupo arquivo","note":"muda dono e grupo (precisa de root)"}]},{"type":"warn","text":"Em **diretório** as letras mudam de sentido: `x` é a permissão de **entrar** (`cd`), `r` é listar o conteúdo, `w` é criar e apagar arquivos lá dentro. Sem `x` você não atravessa a pasta."}],"deep":[{"type":"points","title":"Permissões especiais","items":["**SUID** (`s` no lugar do `x` do dono): o programa roda com o poder do dono do arquivo, não de quem executou","**SGID** (`s` no `x` do grupo): parecido, mas com o grupo; em pasta, arquivos novos herdam o grupo dela","**Sticky bit** (`t` no `x` dos outros): em pasta compartilhada (`/tmp`), só o dono do arquivo, o dono da pasta ou o root apagam ou renomeiam o arquivo"]},{"type":"text","text":"Um binário SUID de root que dá pra usar de um jeito não previsto é um dos caminhos clássicos de escalação de privilégio. Por isso listar os SUID é passo padrão de enumeração."},{"type":"commands","title":"Outras formas de chmod e chown","items":[{"cmd":"chmod u+x,go-w script.sh","note":"forma por letras: dono (`u`) ganha `x`; grupo (`g`) e outros (`o`) perdem `w`"},{"cmd":"chown usuario arquivo","note":"muda só o dono (precisa de root)"}]},{"type":"commands","title":"Caça a binários SUID","items":[{"cmd":"find / -perm -4000 -type f 2>/dev/null","note":"lista binários SUID; o `2>/dev/null` cala os 'Permission denied'"}]},{"type":"text","text":"Se aparecer `S` ou `T` maiúsculo, é o bit especial ligado mas **sem** o `x` por baixo."}],"terms":[{"en":"owner","pt":"o dono do arquivo (user)"},{"en":"group","pt":"o grupo dono do arquivo"},{"en":"permission","pt":"o que cada um pode fazer (r/w/x)"},{"en":"read/write/execute","pt":"ler / escrever / executar"},{"en":"SUID","pt":"roda com o privilégio do dono do arquivo"},{"en":"sticky bit","pt":"trava a remoção em pasta compartilhada"}],"practice":"Em qualquer máquina Linux, a primeira coisa é ver o que você pode ler, escrever e executar. Permissão mal configurada (um script de root editável, um binário SUID exótico) é um dos caminhos mais comuns pra sair de usuário comum pra root.","quiz":[{"q":"Um diretório tem `r--` pro seu usuário (ler, sem `x`). Você entra nele com `cd`?","options":["Sim, o `r` já basta pra entrar","Sim, mas só se você for root","Não: entrar num diretório exige o bit `x`"],"answer":2,"explain":"Em diretório, `x` é o que permite atravessar (`cd`). O `r` só deixa listar os nomes; sem `x` você não entra."},{"q":"A permissão `640` corresponde a qual conjunto de letras?","options":["`rwxr--r--`","`rw-r-----`","`rw-rw----`","`r--rw----`"],"answer":1,"explain":"Um dígito por trio, somando r=4, w=2, x=1: 6 = `rw-` (dono), 4 = `r--` (grupo), 0 = `---` (outros)."}]},{"n":15,"title":"User Management","titlePt":"Usuários e virar root","minutes":5,"gist":"Como criar, modificar e, principalmente, virar outro usuário pra rodar comandos com o privilégio certo.","blocks":[{"type":"text","text":"O Linux é multiusuário de nascença. Cada conta tem um UID (número de identificação); o `root` é o UID `0`, o todo-poderoso, e é aonde quase toda invasão quer chegar."},{"type":"commands","title":"Alternar de usuário e ver quem você é","items":[{"cmd":"su - usuario","note":"vira outro usuário (abre um shell como ele)"},{"cmd":"sudo comando","note":"roda UM comando como root, continuando como você"},{"cmd":"sudo -l","note":"mostra o que VOCÊ pode rodar com sudo"},{"cmd":"whoami","note":"mostra só o nome do usuário atual"},{"cmd":"id","note":"mostra seu UID, grupo principal e grupos secundários"}]},{"type":"tip","text":"O `id` é seu melhor amigo: entrega tudo de uma vez. Estar no grupo `sudo`, `docker` ou `adm` muda bastante o que você alcança."},{"type":"facts","title":"Onde as contas moram","items":[{"value":"/etc/passwd","label":"lista de contas (todos leem; a senha não fica aqui, só um `x`)"},{"value":"/etc/shadow","label":"hashes das senhas (só root)"},{"value":"/etc/group","label":"grupos e quem está em cada um"}]}],"deep":[{"type":"commands","title":"Administração (precisa de root)","items":[{"cmd":"useradd -m joao","note":"cria usuário com pasta `/home/joao`"},{"cmd":"passwd joao","note":"define ou troca a senha"},{"cmd":"groupadd devs","note":"cria um grupo"},{"cmd":"usermod -aG sudo joao","note":"adiciona joao ao grupo sudo"},{"cmd":"userdel -r joao","note":"remove o usuário e a home"},{"cmd":"groupdel devs","note":"remove o grupo"}]},{"type":"warn","text":"Sempre use `-aG` no `usermod` (o `-a` é append, acrescenta). Sem o `-a`, o `-G` **substitui** todos os grupos secundários e você tira a pessoa de grupos sem querer."}],"terms":[{"en":"UID","pt":"número do usuário (root = 0)"},{"en":"privilege","pt":"privilégio, o que você tem direito de fazer"},{"en":"sudo","pt":"rodar um comando como outro usuário (em geral root)"},{"en":"group","pt":"grupo que concede acessos coletivos"},{"en":"append","pt":"acrescentar (o `-a` do usermod)"}],"practice":"`sudo -l` e `id` são os dois primeiros comandos que todo pentester roda ao cair numa máquina: eles dizem exatamente quais atalhos pra root você já tem na mão. Uma regra de sudo mal configurada costuma ser o jogo inteiro.","quiz":[{"q":"Por que `usermod -aG docker joao` é diferente de `usermod -G docker joao`?","options":["Não há diferença nenhuma","Com `-aG` o joao ganha docker além dos grupos que já tinha; com `-G` sozinho ele fica só com docker","O `-G` sozinho é a forma mais segura"],"answer":1,"explain":"O `-a` (append) acrescenta o grupo. Sem ele, o `-G` substitui a lista inteira de grupos secundários e remove os antigos."}]},{"n":16,"title":"Package Management","titlePt":
