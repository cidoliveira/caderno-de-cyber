rização","Intenção maliciosa"]}]},{"type":"warn","text":"Boa intenção não vira autorização. O grey hat que invade \"só pra avisar\" continua podendo ter problema jurídico sério."},{"type":"text","text":"Por que isso importa? Por causa do **threat modeling**: uma padaria de bairro e um ministério da defesa não têm os mesmos inimigos. Saber quem provavelmente vai te atacar ajuda a gastar o orçamento onde faz diferença."}],"deep":[],"terms":[{"en":"threat actor","pt":"autor da ameaça"},{"en":"script kiddie","pt":"atacante iniciante que só usa ferramenta pronta"},{"en":"hacktivist","pt":"hacker movido por uma causa"},{"en":"nation-state","pt":"ator ligado a um governo"},{"en":"attribution","pt":"descobrir quem fez o ataque"},{"en":"threat modeling","pt":"mapear quem e o que ameaça um sistema"}],"practice":"Quando o cliente pede \"simule um atacante externo sem credenciais\" ou \"simule um funcionário mal-intencionado\", ele está escolhendo o threat actor do teste. E relatórios de threat intelligence sempre falam em ator, motivação e TTPs.","quiz":[{"q":"Um grupo derruba o site de uma empresa com DDoS e publica uma mensagem de protesto contra ela, sem pedir dinheiro. Qual o tipo de ator mais provável?","options":["Cibercriminoso","Hacktivista","Nation-state","Concorrente"],"answer":1,"explain":"A motivação é a causa (o protesto), não o lucro. DDoS e defacement são ferramentas típicas de hacktivista."},{"q":"Alguém invade o sistema de uma empresa sem permissão, não mexe em nada e manda um email avisando da falha. Como isso costuma ser classificado?","options":["White hat, porque a intenção era boa","Script kiddie, porque agiu sozinho","Pentester, porque achou uma falha","Grey hat: a intenção pode ser boa, mas não tinha autorização"],"answer":3,"explain":"White hat exige autorização. Sem ela, mesmo com boa intenção, é grey hat, e o problema jurídico continua possível."}]},{"n":17,"title":"Red Team","titlePt":"Red team: o adversário autorizado","minutes":5,"gist":"Red team é o time que se passa pelo adversário real, com autorização, pra testar se a empresa consegue detectar e responder a um ataque de verdade.","blocks":[{"type":"text","text":"O nome vem dos exercícios militares, em que o time vermelho fazia o papel do inimigo. A pergunta deixa de ser \"quais falhas existem?\" e vira \"**um atacante determinado chegaria no objetivo X sem ser pego?**\"."},{"type":"table","title":"Pentest x Red team, a confusão clássica","headers":["Aspecto","Pentest","Red team"],"rows":[["Objetivo","Achar o máximo de vulnerabilidades num escopo","Atingir um objetivo específico (ex.: acessar o sistema de pagamentos)"],["Furtividade","Geralmente não precisa se esconder","Ser discreto faz parte do teste"],["Quem sabe do teste","A equipe de TI/segurança costuma saber","Só um grupo pequeno; o blue team em geral não sabe"],["Duração","Dias a poucas semanas","Semanas a meses"],["O que testa","Principalmente a tecnologia","Tecnologia, pessoas e processos, incluindo a resposta do blue team"]]},{"type":"points","title":"Como um red team trabalha","items":["**Rules of Engagement (RoE):** o documento que define o que pode e o que não pode","**Adversary emulation:** imitar os TTPs de um grupo real que ameaça aquele setor","**C2 (Command and Control):** a infraestrutura pra controlar as máquinas comprometidas","**OPSEC:** cuidado pra não ser detectado nem deixar rastro que vire problema pro cliente"]},{"type":"warn","text":"Sem **Rules of Engagement** combinadas antes, não existe red team: existe crime."}],"deep":[{"type":"points","title":"O que vai nas Rules of Engagement","items":["Alvos permitidos","Horários","Técnicas proibidas","Contatos de emergência"]},{"type":"text","text":"Na adversary emulation o MITRE ATT&CK entra de novo: é nele que o time encontra as táticas e técnicas do grupo que vai imitar."},{"type":"text","text":"Frameworks de C2 bem conhecidos: Cobalt Strike, Sliver e Havoc."},{"type":"text","text":"O exercício pode incluir phishing e até intrusão física, se estiver no escopo."}],"terms":[{"en":"adversary emulation","pt":"imitar um adversário real"},{"en":"rules of engagement","pt":"regras do teste"},{"en":"C2","pt":"comando e controle"},{"en":"OPSEC","pt":"segurança operacional do próprio atacante"},{"en":"engagement","pt":"o projeto de teste contratado"},{"en":"objective","pt":"alvo final do exercício"}],"practice":"É comum quem vira red teamer ter passado antes por pentest, porque o trabalho exige dominar exploração, Active Directory e evasão. Por isso a base que você tá construindo agora (redes, Linux) é pré-requisito, não etapa opcional.","quiz":[{"q":"Uma empresa nunca fez teste de segurança nenhum e tem vários sistemas desatualizados. Por onde faz mais sentido começar?","options":["Pentest ou varredura de vulnerabilidades, pra arrumar o básico primeiro","Red team, porque é o teste mais completo","Red team, mas sem avisar a diretoria","Nenhum teste até contratar um SOC"],"answer":0,"explain":"O red team mede a maturidade da detecção e da resposta. Se o básico ainda tá furado, ele só confirma o óbvio e sai caro."},{"q":"Num exercício de red team, quem normalmente sabe que o teste está acontecendo?","options":["Toda a equipe de TI e segurança","Ninguém da empresa, nem a diretoria","Só um grupo pequeno; o blue team em geral não sabe","Só o blue team"],"answer":2,"explain":"Um grupo pequeno autoriza e acompanha. O blue team fica no escuro, porque a reação dele é justamente parte do que tá sendo testado."}]},{"n":18,"title":"Blue Team","titlePt":"Blue team: quem defende","minutes":5,"gist":"Blue team é o time de defesa: protege os sistemas, monitora o que acontece e responde quando algo dá errado.","blocks":[{"type":"text","text":"Se o red team é o atacante simulado, o blue team é quem precisa perceber e reagir. E ele não defende só contra o red team: defende contra ataques reais, todo santo dia."},{"type":"points","title":"O que o blue team faz","items":["**Hardening:** deixar os sistemas mais difíceis de atacar (desligar o desnecessário, configurar com segurança, trocar senhas padrão)","**Vulnerabilidades e patches:** achar o que tá vulnerável e corrigir antes do atacante","**Monitoramento e detecção:** coletar logs (os registros do que acontece nos sistemas) e gerar alertas, o dia a dia do SOC","**Resposta a incidentes:** conter, limpar e recuperar quando o ataque acontece","**Threat hunting:** procurar sinais de que alguém já tá dentro, sem esperar o alerta","**Forense digital:** investigar o que aconteceu, como e o que foi afetado"]},{"type":"steps","title":"Resposta a incidentes no modelo do SANS","items":[{"label":"Preparação","text":"Plano, ferramentas e gente treinada antes do problema."},{"label":"Identificação","text":"Perceber que algo aconteceu e confirmar que é incidente."},{"label":"Contenção","text":"Isolar o estrago pra ele não se espalhar."},{"label":"Erradicação","text":"Remover a causa: malware, acesso do invasor, falha explorada."},{"label":"Recuperação","text":"Voltar a operar normalmente, de olho em sinais de retorno."},{"label":"Lições aprendidas","text":"Revisar o que funcionou e o que falhou, e ajustar."}]},{"type":"table","title":"Ferramentas da defesa","headers":["Ferramenta","Pra que serve"],"rows":[["SIEM (ex.: Splunk, Elastic, Microsoft Sentinel)","Junta os logs num lugar só, cruza eventos de fontes diferentes e gera alertas"],["EDR","Monitora e reage em cada endpoint (computador ou servidor)"],["IDS / IPS (ex.: Snort, Suricata)","IDS detecta tráfego malicioso; IPS detecta e bloqueia"],["Firewall","Controla o que pode entrar e sair da rede"]]},{"type":"text","text":"A ideia central é **defense in depth** (defesa em camadas): nenhuma ferramenta é perfeita, então você empilha várias. Se o atacante passa por uma, a próxima tem chance de pegar."}],"deep":[{"type":"text","text":"Um **IOC** (indicador de comprometimento) é um rastro ligado a um ataque: um IP, o hash de um arquivo, um domínio. Dá pra procurar esses rastros nos logs pra ver se o ataque passou por ali."},{"type":"text","text":"Threat hunting e monitoramento se completam: o monitoramento espera a regra disparar, o hunting parte da hipótese de que algo passou despercebido."}],"terms":[{"en":"hardening","pt":"endurecer/blindar a configuração"},{"en":"incident response","pt":"resposta a incidentes"},{"en":"threat hunting","pt":"caça ativa a ameaças"},{"en":"SIEM","pt":"central de logs e alertas"},{"en":"EDR","pt":"proteção e resposta no endpoint"},{"en":"IOC","pt":"indicador de comprometimento (IP, hash, domínio ligado a um ataque)"}],"practice":"Mesmo se você quer ser pentester, entender como o blue team detecta te deixa melhor: você sabe o que dispara alarme e escreve recomendações de correção que fazem sentido pra quem vai aplicar.","quiz":[{"q":"Qual a diferença prática entre um IDS e um IPS?","options":["Os dois são a mesma coisa com nomes diferentes","O IDS bloqueia e o IPS só gera alerta","O IPS só funciona dentro de um endpoint","O IDS só observa e alerta; o IPS fica no caminho do tráfego e pode bloquear na hora"],"answer":3,"explain":"IDS é Intrusion Detection System (detecta e avisa); IPS é Intrusion Prevention System (previne). Por estar no caminho do tráfego, o IPS consegue barrar na hora."},{"q":"Um analista desconecta da rede uma máquina infectada pra o ataque não se espalhar. Em qual etapa da resposta a incidentes ele está?","options":["Identificação","Contenção","Erradicação","Lições aprendidas"],"answer":1,"explain":"Contenção é limitar o estrago. A erradicação vem depois: remover a causa de vez."}]},{"n":19,"title":"Purple Team","titlePt":"Purple team: ataque e defesa juntos","minutes":4,"gist":"Purple team é red e blue trabalhando lado a lado pra transformar cada técnica de ataque numa detecção melhor.","blocks":[{"type":"text","text":"Vermelho + azul = roxo. Num red team clássico, o blue team só descobre o que deixou passar no relatório final, semanas depois. No purple, o feedback é na hora."},{"type":"analogy","text":"É o coletivo do futebol: em vez de esperar o jogo de domingo pra descobrir que a zaga não marca bola aérea, o técnico põe ataque contra defesa no treino, para o lance, mostra o erro e repete até acertar."},{"type":"steps","title":"O ciclo do purple team","items":[{"label":"Ataca","text":"O lado ofensivo executa uma técnica específica, por exemplo um jeito de roubar credenciais mapeado no MITRE ATT&CK."},{"label":"Confere","text":"O lado defensivo verifica: gerou log? Gerou alerta? Alguém viu?"},{"label":"Ajusta","text":"Se não detectou, os dois ajustam juntos a coleta de logs ou a regra de detecção."},{"label":"Repete","text":"Executa de novo pra confirmar que agora pega, e parte pra próxima técnica."}]},{"type":"points","items":["Muitas vezes **não é um time separado**, e sim um jeito de trabalhar ou um tipo de exercício entre red e blue","O resultado é medido em **cobertura de detecção**: quais técnicas a empresa enxerga e quais ainda são ponto cego"]}],"deep":[{"type":"table","title":"Ferramentas que deixam o ciclo repetível","headers":["Ferramenta","O que faz"],"rows":[["Atomic Red Team","Biblioteca de testes pequenos, um por técnica"],["MITRE Caldera","Automatiza a emulação de adversário"]]}],"terms":[{"en":"detection engineering","pt":"criar e ajustar regras de detecção"},{"en":"coverage","pt":"cobertura de detecção"},{"en":"blind spot","pt":"ponto cego"},{"en":"feedback loop","pt":"ciclo de retorno rápido"},{"en":"adversary emulation","pt":"imitar um adversário real"}],"practice":"Exercícios de purple team são uma das formas mais eficientes de melhorar a defesa, porque cada teste vira uma melhoria concreta e verificável. É um ótimo lugar pra quem gosta dos dois lados.","quiz":[{"q":"Qual a principal diferença entre um exercício de purple team e um red team tradicional?","options":["O purple team usa ferramentas de ataque mais avançadas","O purple team não precisa de autorização","Ataque e defesa compartilham o que fizeram e ajustam as detecções durante o exercício","O purple team só testa a segurança física"],"answer":2,"explain":"A diferença é a colaboração em tempo real: no purple, as detecções são ajustadas durante o exercício, não só depois, no relatório final."}]},{"n":20,"title":"Chief Information Security Officer","titlePt":"CISO: quem comanda a segurança","minutes":5,"gist":"O CISO é o executivo responsável pela segurança da informação da empresa inteira: define a estratégia, gerencia riscos e responde à alta direção.","blocks":[{"type":"text","text":"O CISO não é \"o hacker mais brabo da empresa\". É um cargo de gestão e liderança, que traduz risco técnico pra linguagem de negócio."},{"type":"compare","title":"Mesma falha, dois idiomas","columns":[{"label":"Do jeito técnico","items":["\"Temos uma SQL injection no endpoint X\""]},{"label":"Do jeito que o conselho entende","items":["Existe risco de vazamento de dados de clientes","O impacto seria tal","Corrigir custa tanto"]}]},{"type":"points","title":"O que cai na mesa do CISO","items":["**Estratégia:** onde investir, o que priorizar, metas de médio e longo prazo","**Gestão de riscos:** identificar, avaliar e decidir o que fazer com cada risco","**Governança e políticas:** senhas, uso aceitável, classificação de dados","**Compliance:** seguir leis e normas como LGPD, ISO/IEC 27001 e PCI DSS (pra quem processa cartão)","**Orçamento e equipe:** contratar, montar times, escolher fornecedores","**Crise:** num incidente grave, coordenar com jurídico, comunicação e diretoria"]},{"type":"table","title":"As quatro saídas pra um risco","headers":["Decisão","O que significa"],"rows":[["Mitigar","Colocar um controle que reduz o risco"],["Transferir","Passar o prejuízo pra outro, como contratar um seguro"],["Aceitar","Conviver com o risco, de forma consciente e documentada"],["Evitar","Parar a atividade que gera o risco"]]},{"type":"warn","text":"Detalhe que confunde: a LGPD exige um **encarregado** (o DPO), que cuida dos dados pessoais e faz a ponte com a ANPD (a autoridade de proteção de dados) e com os titulares dos dados. É outra função, não o CISO, embora os dois trabalhem bem próximos."}],"deep":[{"type":"text","text":"A quem o CISO se reporta varia: CEO, CIO, diretor de risco. Muita gente defende que ele não fique abaixo do CIO, pra evitar o conflito entre \"entregar TI rápido\" e \"entregar TI seguro\"."},{"type":"text","text":"Entre os times que o CISO monta costumam estar SOC, red team e GRC (Governance, Risk and Compliance), o time que cuida de políticas, riscos e conformidade."}],"terms":[{"en":"risk management","pt":"gestão de riscos"},{"en":"governance","pt":"governança"},{"en":"compliance","pt":"conformidade com leis e normas"},{"en":"risk appetite","pt":"quanto risco a empresa topa correr"},{"en":"board","pt":"conselho/alta direção"},{"en":"GRC","pt":"Governance, Risk and Compliance"}],"practice":"Um bom relatório de pentest abre com um resumo executivo justamente pra pessoas como o CISO. Saber escrever pra esse público é o que faz o seu trabalho técnico virar orçamento e correção de verdade.","quiz":[{"q":"O CISO decide não corrigir uma vulnerabilidade de baixo impacto porque a correção custaria muito mais do que o prejuízo possível. Que tipo de decisão de risco é essa?","options":["Aceitação de risco","Transferência de risco","Mitigação de risco","Evitar o risco"],"answer":0,"explain":"É aceitar o risco (risk acceptance). Vale, desde que seja consciente, documentado e revisado de tempos em tempos."},{"q":"Pela LGPD, quem faz a ponte com a ANPD e com os titulares dos dados?","options":["O CISO, obrigatoriamente","O SOC Manager","O CIO","O encarregado (DPO)"],"answer":3,"explain":"É o encarregado, ou DPO. Ele trabalha perto do CISO, mas é outra função."}]},{"n":21,"title":"Penetration Testers","titlePt":"Pentester: o ataque autorizado","minutes":6,"gist":"Pentester é quem ataca sistemas com autorização, acha e explora falhas antes dos criminosos e entrega um relatório explicando como corrigir.","blocks":[{"type":"text","text":"A palavra-chave é **autorização**. A técnica do pentester e a do criminoso podem ser iguais; o que muda é o contrato assinado e o escopo definido."},{"type":"warn","text":"No Brasil, invadir dispositivo de outra pessoa sem autorização pra obter ou mexer em dados é crime (art. 154-A do Código Penal, a \"Lei Carolina Dieckmann\"). Por isso você treina em ambientes feitos pra isso."},{"type":"steps","title":"As fases de um pentest","items":[{"label":"Pre-engagement","text":"Contrato, escopo (o que pode ser testado), regras, janelas de horário, contatos."},{"label":"Information gathering","text":"Reconhecimento: mapear o alvo."},{"label":"Vulnerability assessment","text":"Identificar as possíveis falhas."},{"label":"Exploitation","text":"Explorar de fato, pra provar que a falha é real."},{"label":"Post-exploitation","text":"Escalar privilégio, se mover pela rede, mostrar o impacto."},{"label":"Reporting","text":"Achados, evidências, nível de risco e recomendação de correção."},{"label":"Retest","text":"Depois que o cliente corrige, testar de novo pra confirmar."}]},{"type":"table","title":"Quanta informação o pentester recebe","headers":["Formato","O que recebe"],"rows":[["Black box","Quase nada além do alvo (simula atacante de fora)"],["Grey box","Alguma informação, como credencial de usuário comum"],["White box","Acesso amplo: documentação, código-fonte, credenciais"]]},{"type":"compare","title":"Rodar scanner não é pentest","columns":[{"label":"Só vulnerability assessment","items":["Roda uma ferramenta automática","Entrega a lista do que ela achou","Para em identificar falhas, sem explorar nem provar nada"]},{"label":"Pentest","items":["Valida manualmente e explora","Encadeia falhas","Mostra o impacto real"]}]},{"type":"tip","text":"O relatório é o produto final. Um pentest brilhante com relatório ruim vale pouquíssimo pro cliente."}],"deep":[{"type":"text","text":"As 7 fases variam um pouco entre metodologias, mas a espinha dorsal é sempre essa."},{"type":"text","text":"O pentest também se divide por alvo: rede externa, rede interna/Active Directory, aplicação web, mobile, wireless, nuvem, engenharia social e físico."},{"type":"points","title":"A base que um pentester precisa","items":["Redes","Linux","Windows e Active Directory","Web","Um pouco de script: Bash, Python, PowerShell","Boa escrita"]},{"type":"text","text":"Certificações comuns na jornada: eJPT, OSCP e a CPTS, da própria HTB."}],"terms":[{"en":"scope","pt":"o que pode ser testado"},{"en":"exploit","pt":"código ou técnica que aproveita uma falha"},{"en":"privilege escalation","pt":"subir de usuário comum pra admin/root"},{"en":"finding","pt":"cada vulnerabilidade relatada"},{"en":"black box / white box","pt":"teste sem / com informação interna"},{"en":"report","pt":"relatório"}],"practice":"Cada máquina que você resolver na HTB é um mini-pentest: reconhecimento, exploração, escalada de privilégio. Já crie o hábito de anotar tudo como se fosse virar relatório.","quiz":[{"q":"Um cliente pede \"um pentest\", mas só quer que você rode um scanner automático e mande o PDF gerado. Isso é pentest?","options":["Sim, scanner automático já é um pentest completo","Não, isso é vulnerability assessment: falta validação, exploração e análise de impacto","Sim, desde que o scan pegue todos os IPs do escopo","Não, isso é red team"],"answer":1,"explain":"Isso é varredura (vulnerability assessment). Pentest envolve validação manual, exploração e análise do impacto real."},{"q":"O cliente te passa uma credencial de usuário comum, mas nada de documentação nem código-fonte. Que formato de teste é esse?","options":["Black box","White box","Grey box"],"answer":2,"explain":"Grey box: alguma informação, mas não o acesso amplo do white box. No black box você receberia quase nada além do alvo."}]},{"n":22,"title":"Security Operations Center","titlePt":"SOC: a central de monitoramento","minutes":5,"gist":"O SOC é a central de monitoramento de segurança: um time, muitas vezes 24/7, que acompanha alertas, investiga o suspeito e aciona a resposta.","blocks":[{"type":"analogy","text":"Pensa na central de uma empresa de alarme residencial. O sensor dispara, alguém olha a câmera, decide se é gato ou ladrão e só chama a viatura se for ladrão. O SOC faz isso com logs e alertas de computadores, servidores, rede e nuvem."},{"type":"layers","title":"Os níveis do SOC (o alerta entra por baixo e sobe)","items":[{"label":"SOC Manager","tag":"gestão","text":"Gestão do time, processos, métricas e comunicação com a liderança."},{"label":"Tier 3","tag":"L3","text":"Casos complexos, threat hunting, análise de malware, criação de detecções."},{"label":"Tier 2","tag":"L2","text":"Investigação mais profunda, tamanho do incidente, contenção e resposta."},{"label":"Tier 1","tag":"L1","text":"Triagem: recebe alertas, descarta falsos positivos, documenta e escala o que parece real."}]},{"type":"points","title":"Ferramentas do dia a dia","items":["**SIEM:** junta logs de tudo e correlaciona eventos (ex.: 5 logins falhos seguidos de um sucesso, vindo de um país incomum)","**SOAR:** automatiza respostas repetitivas com **playbooks** (isolar a máquina, bloquear o IP, abrir ticket)","**EDR**, sistema de tickets e feeds de **threat intelligence** (informação atualizada sobre ameaças conhecidas)"]},{"type":"compare","title":"Os dois erros que importam","columns":[{"label":"Falso positivo","items":["Alarme sem ataque","Custa tempo"]},{"label":"Falso negativo","items":["Ataque sem alarme","Custa caro"]}]},{"type":"warn","text":"**Alert fatigue**: alerta demais, a maioria falso positivo, e o analista cansado deixa passar o que importa."}],"deep":[{"type":"facts","title":"Métricas comuns","items":[{"value":"MTTD","label":"tempo médio pra detectar"},{"value":"MTTR","label":"tempo médio pra responder ou recuperar"}]},{"type":"text","text":"Nem toda empresa tem SOC próprio. Muitas contratam um **MSSP** (Managed Security Service Provider) ou um **MDR** (Managed Detection and Response), empresas que fazem esse monitoramento como serviço."},{"type":"text","text":"Escalar (escalation) é passar o caso pro nível de cima quando ele foge do que aquele nível resolve."}],"terms":[{"en":"alert","pt":"alerta"},{"en":"triage","pt":"triagem"},{"en":"false positive","pt":"alarme falso"},{"en":"escalation","pt":"passar o caso pro nível acima"},{"en":"playbook","pt":"roteiro padrão de resposta"},{"en":"SOAR","pt":"orquestração e automação de resposta"}],"practice":"Analista de SOC L1 é uma das portas de entrada mais comuns na área. E o que você vai aprender de redes e Linux nos próximos módulos é exatamente o que te faz ler um log e entender o que tá acontecendo.","quiz":[{"q":"Um SOC mexeu numa regra pra reduzir o número de alertas, e depois um ataque real passou sem disparar nada. Que tipo de erro é esse?","options":["Falso positivo","Alert fatigue","Escalation","Falso negativo"],"answer":3,"explain":"Ataque real sem alarme é falso negativo. Reduzir ruído é importante, mas cortar demais cria pontos cegos."},{"q":"Quem normalmente recebe os alertas primeiro e separa o falso positivo do que precisa subir?","options":["Tier 1 (L1)","Tier 3 (L3)","SOC Manager","Tier 2 (L2)"],"answer":0,"explain":"A triagem é o trabalho do Tier 1. O que parece real é escalado pro L2, que investiga mais a fundo."}]},{"n":23,"title":"Bug Bounty Hunter","titlePt":"Bug bounty: falha achada, falha paga","minutes":5,"gist":"Bug bounty hunter é o pesquisador independente que caça falhas em programas abertos por empresas e ganha recompensa por cada falha válida reportada.","blocks":[{"type":"text","text":"É um modelo de \"pagamos por resultado\": a empresa publica um programa com regras e valores, e os pesquisadores testam. Só recebe quem acha algo válido e, normalmente, só o primeiro a reportar."},{"type":"text","text":"Isso acontece em plataformas como HackerOne, Bugcrowd, Intigriti e YesWeHack (no Brasil existe a BugHunt), além de programas próprios de algumas empresas."},{"type":"compare","title":"Dois formatos de programa","columns":[{"label":"Bug bounty","items":["Paga uma recompensa (bounty) por falha válida"]},{"label":"VDP (Vulnerability Disclosure Program)","items":["Canal oficial pra reportar falhas","Geralmente sem pagamento"]}]},{"type":"points","title":"Regras de ouro","items":["**Leia a política do programa inteira.** O escopo diz o que vale; o **out of scope** diz o que é proibido","Quase sempre proibido: DoS, engenharia social e mexer em dados de outros usuários além do mínimo pra provar a falha","**Divulgação coordenada** (responsible disclosure): não publicar a falha antes da empresa corrigir e autorizar","**Safe harbor:** muitos programas se comprometem a não processar quem testou seguindo as regras"]},{"type":"warn","text":"Testar fora do escopo pode te tirar do programa e te dar problema jurídico."},{"type":"table","title":"Pentester x Bug bounty hunter","headers":["Aspecto","Pentester","Bug bounty hunter"],"rows":[["Pagamento","Por projeto ou salário","Por falha válida encontrada"],["Escopo","Fechado, com prazo definido","Aberto por meses, competindo com outros pesquisadores"],["Entrega","Relatório completo do teste","Um report por vulnerabilidade"]]}],"deep":[{"type":"points","title":"O que vai num bom report","items":["Título claro","Passos pra reproduzir","Prova de conceito (**PoC**)","Impacto real","Sugestão de correção, se possível"]},{"type":"text","text":"A severidade costuma ser avaliada com algo como o **CVSS**, o sistema de pontuação de vulnerabilidades."},{"type":"text","text":"Quem reporta uma falha que outra pessoa já mandou recebe um **duplicate**, e em geral fica sem recompensa."}],"terms":[{"en":"scope / out of scope","pt":"dentro / fora do que pode ser testado"},{"en":"duplicate","pt":"falha já reportada por outra pessoa"},{"en":"PoC","pt":"prova de conceito"},{"en":"triage","pt":"validação do report pela plataforma ou empresa"},{"en":"responsible disclosure","pt":"divulgação coordenada"},{"en":"safe harbor","pt":"proteção pra quem segue as regras"}],"practice":"A maioria dos programas é focada em web, então quem quer seguir por aqui precisa dominar HTTP e vulnerabilidades web. A renda é instável e a concorrência é grande, por isso muita gente começa com bug bounty como complemento.","quiz":[{"q":"Você encontra uma falha num subdomínio da empresa que não aparece na lista de escopo do programa. O que fazer?","options":["Explorar rápido e reportar, pra garantir a recompensa","Parar de testar e consultar a política (ou perguntar pela plataforma)","Publicar a falha nas redes sociais pra pressionar a empresa","Continuar testando, mas só de madrugada"],"answer":1,"explain":"Fora do escopo você não tem autorização, e o achado pode nem ser aceito. Na dúvida, pergunte antes de seguir."}]},{"n":24,"title":"Recommendations","titlePt":"E agora, por onde seguir?","minutes":3,"gist":"Acabou a parte conceitual: agora é construir a base técnica, começando por redes e Linux, antes de escolher entre ataque ou defesa.","blocks":[{"type":"text","text":"Este módulo é um mapa da área, não um curso técnico. Não se cobre por decorar tudo: a maioria desses termos vai voltar várias vezes até fazer sentido de verdade."},{"type":"steps","title":"A sua trilha daqui pra frente","items":[{"label":"Network Foundations","text":"Como um dado sai do seu PC e chega num site."},{"label":"Introduction to Networking","text":"Redes mais a fundo: modelos, endereços, protocolos."},{"label":"Linux Fundamentals","text":"O terminal na prática, rodando comando de verdade."},{"label":"Ataque ou defesa?","text":"Depois da base, experimente um pouco de cada lado e veja do que gosta mais."}]},{"type":"points","title":"Hábitos que fazem diferença","items":["**Anote desde já**, com suas palavras. Um caderno de comandos próprio vai te economizar muito tempo","**Pratique com as mãos** nos labs e máquinas, sempre em ambientes autorizados","**Não pule direto pro hackear:** sem rede e sistema operacional, você só copia comando sem saber o que tá fazendo","**Monte um glossário** com os termos em inglês de cada seção"]},{"type":"tip","text":"Write-ups ajudam, mas tente sozinho primeiro. Travar e pesquisar é onde o aprendizado acontece."}],"deep":[{"type":"text","text":"Pra anotar, tanto faz a ferramenta: Obsidian, Notion, CherryTree ou caderno de papel. O que importa é escrever com as suas palavras."},{"type":"text","text":"Quem pula a base vira o script kiddie da seção 16: roda ferramenta pronta sem entender o que ela faz nem ler o resultado."}],"terms":[{"en":"lab","pt":"ambiente de prática"},{"en":"write-up","pt":"explicação passo a passo de como alguém resolveu um desafio"},{"en":"CTF","pt":"Capture The Flag, desafio de encontrar flags escondidas"},{"en":"path","pt":"trilha de módulos"}],"practice":"Consistência ganha de intensidade: uma hora por dia rende mais do que um sábado inteiro por mês.","quiz":[{"q":"Por que faz sentido estudar redes e Linux antes de partir pra técnicas de ataque ou de defesa?","options":["Porque os módulos de ataque só abrem depois","Porque técnicas de ataque mudam e logo ficam ultrapassadas","Porque quase todo ataque e toda defesa acontecem em cima de rede e sistema operacional","Porque é o único conteúdo que cai em certificação"],"answer":2,"explain":"Sem essa base você executa ferramenta sem entender o que ela faz nem interpretar o resultado."}]}]},{"id":"netfound","title":"Network Foundations","titlePt":"Fundamentos de Redes","url":"https://academy.hackthebox.com/course/preview/network-foundations","blurb":"Como um dado sai do seu PC e chega num site: endereços, DHCP, NAT, DNS e o básico de segurança de rede.","sections":[{"n":1,"title":"Introduction to Networks","titlePt":"O que é uma rede","minutes":3,"gist":"Rede é um grupo de dispositivos conectados trocando dados, e o que separa um tipo do outro é basicamente o tamanho da área que ela cobre.","blocks":[{"type":"text","text":"Rede existe pra **compartilhar**: arquivos, impressora, um sistema, o acesso à internet. Do seu Wi-Fi até a internet inteira, é tudo aparelho conversando por regras combinadas, os **protocolos**."},{"type":"compare","title":"Os dois tipos que você mais vai ouvir","columns":[{"label":"LAN (Local Area Network)","items":["Cobre uma casa, um escritório, um prédio","Ex.: seu Wi-Fi com notebook, celular e smart TV"]},{"label":"WAN (Wide Area Network)","items":["Cobre cidades, países, o planeta","Ex.: a rede que liga as agências de um banco","A maior de todas é a própria internet"]}]},{"type":"text","text":"A internet é uma \"rede de redes\": milhões de LANs ligadas entre si pelos provedores (os **ISPs**). Quem liga a sua LAN à rede do provedor é o **roteador**, bem na fronteira."},{"type":"table","title":"Outras siglas que aparecem por aí","headers":["Sigla","Significa","Exemplo"],"rows":[["WLAN","Wireless LAN, uma LAN sem fio","o seu Wi-Fi"],["MAN","Metropolitan Area Network, cobre uma cidade","prefeitura ligando escolas e postos de saúde"],["PAN","Personal Area Network, poucos metros","fone Bluetooth pareado com o celular"],["VPN","Virtual Private Network, rede privada e criptografada montada por cima de outra rede","sua máquina ligada a um laboratório de hacking pela internet"]]}],"deep":[{"type":"text","text":"Repara que VPN não é um tamanho de rede como as outras. Ela é uma rede **virtual**, montada por cima de outra (normalmente a internet), com o tráfego criptografado."},{"type":"tip","text":"Sua casa é uma LAN, mais exatamente uma **WLAN**, já que é Wi-Fi. A internet é a WAN. E o roteador fica entre as duas."}],"terms":[{"en":"host","pt":"qualquer dispositivo com endereço na rede"},{"en":"node","pt":"nó, qualquer ponto conectado à rede"},{"en":"ISP","pt":"Internet Service Provider, o seu provedor/operadora"},{"en":"protocol","pt":"conjunto de regras de comunicação"}],"practice":"A primeira pergunta de quem ganha acesso a uma máquina num pentest é \"em que rede eu tô e quem mais tá aqui?\". E VPN você vai usar direto: é o jeito padrão de ligar sua máquina a laboratórios de hacking pela internet.","quiz":[{"q":"O Wi-Fi da sua casa e a internet são, nessa ordem, que tipo de rede?","options":["WAN e LAN","PAN e MAN","LAN (mais exatamente WLAN) e WAN","MAN e WAN"],"answer":2,"explain":"Sua casa é uma rede local sem fio, ou seja, uma WLAN. A internet é a maior WAN que existe."},{"q":"Qual aparelho fica na fronteira entre a rede da sua casa e a internet?","options":["O roteador","O notebook conectado no Wi-Fi","O fone Bluetooth pareado com o celular"],"answer":0,"explain":"O roteador liga a sua rede local à rede do provedor, então fica bem no limite entre LAN e WAN."}]},{"n":2,"title":"Network Concepts","titlePt":"Camadas: OSI e TCP/IP","minutes":7,"gist":"Pra máquinas diferentes se entenderem, a comunicação é dividida em camadas com funções definidas, e OSI e TCP/IP são os dois mapas dessas camadas.","blocks":[{"type":"text","text":"Ninguém resolve \"mandar um vídeo pela internet\" de uma vez. O problema é quebrado em pedaços: uma camada cuida do cabo, outra do endereço, outra de garantir que nada se perdeu."},{"type":"layers","title":"Modelo OSI (7 camadas)","items":[{"label":"7 · Application","text":"interface entre os programas e a rede","tag":"HTTP, DNS, FTP, SMTP"},{"label":"6 · Presentation","text":"formato dos dados: codificação, compressão, criptografia (o TLS costuma ser citado aqui)","tag":"UTF-8, JPEG"},{"label":"5 · Session","text":"abre, mantém e encerra sessões","tag":"NetBIOS, RPC"},{"label":"4 · Transport","text":"entrega entre processos (via ports), controle de erro e de fluxo","tag":"TCP, UDP"},{"label":"3 · Network","text":"endereço lógico e rota entre redes diferentes","tag":"IP, ICMP, router"},{"label":"2 · Data Link","text":"entrega dentro da mesma rede local","tag":"Ethernet, MAC, switch"},{"label":"1 · Physical","text":"transforma bits em sinal elétrico, luz ou rádio","tag":"cabo, fibra, hub"}]},{"type":"tip","text":"Pra decorar de baixo pra cima: **Please Do Not Throw Sausage Pizza Away**. Cada inicial é uma camada: Physical, Data Link, Network, Transport, Session, Presentation, Application."},{"type":"table","title":"TCP/IP: o modelo que a internet usa de verdade","headers":["TCP/IP (4 camadas)","Equivale no OSI"],"rows":[["Application","5, 6 e 7"],["Transport","4"],["Internet","3"],["Link (ou Network Access)","1 e 2"]]},{"type":"text","text":"Mesmo assim, no dia a dia o pessoal fala com os números do OSI: \"ataque de camada 7\", \"switch de camada 3\". Por isso vale conhecer os dois."},{"type":"analogy","text":"**Encapsulation** é despachar uma encomenda: o produto vai numa caixa, a caixa ganha etiqueta com CEP, a caixa vai num saco dentro do caminhão. Cada camada põe o seu cabeçalho por fora, e do outro lado cada uma tira o seu."},{"type":"compare","title":"TCP x UDP","columns":[{"label":"TCP","items":["Abre conexão com o three-way handshake (SYN, SYN-ACK, ACK)","Garante entrega e ordem, retransmite o que se perdeu","Mais pesado (mais overhead)","HTTP(S), SSH, FTP, SMTP"]},{"label":"UDP","items":["Não abre conexão, só manda","Não garante entrega nem ordem","Mais leve e rápido","DNS (maioria das consultas), DHCP, VoIP, streaming, jogos"]}]}],"deep":[{"type":"exchange","title":"Three-way handshake do TCP","actors":["Cliente","Servidor"],"messages":[{"from":0,"to":1,"label":"SYN","note":"quero abrir uma conexão"},{"from":1,"to":0,"label":"SYN-ACK","note":"recebi seu pedido, e topo abrir também"},{"from":0,"to":1,"label":"ACK","note":"confirmado, conexão aberta"}]},{"type":"table","title":"Nome da unidade de dado (PDU) em cada camada","headers":["Camada OSI","PDU"],"rows":[["7, 6 e 5 (Application, Presentation, Session)","data"],["4 (Transport)","segment (TCP) / datagram (UDP)"],["3 (Network)","packet"],["2 (Data Link)","frame"],["1 (Physical)","bit"]]},{"type":"text","text":"Do lado de quem recebe acontece o contrário, a **decapsulation**: cada camada tira o seu header e passa o resto pra camada de cima."},{"type":"points","title":"Modos de transmissão (quem fala e quando)","items":["**Simplex**: só um lado transmite, o outro só recebe. Tipo rádio FM.","**Half-duplex**: os dois transmitem, mas um de cada vez. Tipo walkie-talkie (\"câmbio\").","**Full-duplex**: os dois ao mesmo tempo. Tipo ligação de celular, e o normal num cabo ligado em switch hoje."]}],"terms":[{"en":"layer","pt":"camada"},{"en":"header","pt":"cabeçalho que cada camada adiciona"},{"en":"encapsulation","pt":"embrulhar o dado em cabeçalhos ao descer as camadas"},{"en":"PDU","pt":"Protocol Data Unit, o nome da unidade de dado em cada camada"},{"en":"three-way handshake","pt":"os 3 passos que abrem uma conexão TCP"},{"en":"overhead","pt":"custo extra (bytes, tempo) além do dado em si"}],"practice":"Saber a camada de um problema ou ataque corta caminho: ARP spoofing é camada 2, roteamento é 3, port scan é 4, SQL injection é 7. E quando o Nmap faz scan de portas TCP, ele tá mexendo justamente com o three-way handshake.","quiz":[{"q":"Um switch encaminha dados olhando o endereço MAC; um router olha o endereço IP. Em que camadas do OSI cada um trabalha?","options":["Switch na 3, router na 4","Os dois na camada 3","Switch na 1, router na 2","Switch na 2, router na 3"],"answer":3,"explain":"MAC é coisa da camada 2 (Data Link) e IP é da camada 3 (Network). O tipo de endereço que o equipamento lê entrega a camada dele."},{"q":"Qual protocolo de transporte não abre conexão nem garante entrega, e é usado na maioria das consultas DNS?","options":["TCP","UDP","ICMP","HTTP"],"answer":1,"explain":"O UDP só manda, sem handshake nem retransmissão. É mais leve, por isso DNS, DHCP, VoIP e jogos usam ele."}]},{"n":3,"title":"Components of a Network","titlePt":"As peças de uma rede","minutes":4,"gist":"Uma rede tem quem usa (end devices), quem encaminha (switch, router, AP), por onde os dados passam (meio físico) e quem oferece serviços (servers).","blocks":[{"type":"table","title":"Quem é quem","headers":["Componente","Camada OSI","Papel"],"rows":[["**End device** (PC, celular, smart TV, câmera IP)","—","origem ou destino dos dados"],["**NIC** (Network Interface Card)","1 e 2","a placa de rede do aparelho; é nela que fica o endereço MAC"],["**Hub**","1","repete tudo que chega pra todas as outras portas; praticamente extinto"],["**Switch**","2","liga os aparelhos da mesma LAN; aprende o MAC de quem tá em cada porta e entrega só pra porta certa"],["**Router**","3","liga redes diferentes e escolhe o caminho usando a sua routing table"],["**Access point** (AP)","2","ponte entre os dispositivos Wi-Fi e a rede cabeada"],["**Modem** / ONT","1","converte o sinal da operadora (cabo, DSL) pro formato da rede local; na fibra, o equivalente costuma ser a ONT"],["**Firewall**","3 a 7","filtra o tráfego por regras (mais na seção 10)"],["**Server**","—","oferece serviços: site, arquivos, e-mail, DNS, DHCP"]]},{"type":"analogy","text":"Pensa num condomínio: o **switch** é o porteiro que sabe em qual apartamento mora cada um e entrega a encomenda dentro do prédio. O **router** é a transportadora que leva de um prédio pro outro, escolhendo o caminho."},{"type":"points","title":"O \"roteador\" da operadora é vários equipamentos numa caixa só","items":["router","switch (as portas LAN atrás)","access point (o Wi-Fi)","servidor DHCP","NAT e um firewall básico","muitas vezes o modem ou a ONT também"]},{"type":"compare","title":"Meio físico: por onde os dados viajam","columns":[{"label":"Par trançado","items":["O cabo de rede comum, conector RJ-45","Cobre, barato, padrão em LAN"]},{"label":"Fibra óptica","items":["Transmite luz","Longas distâncias e velocidades altas"]},{"label":"Wireless","items":["Ondas de rádio","Wi-Fi, rede celular"]}]}],"deep":[{"type":"text","text":"O **gateway** é a \"porta de saída\" da rede, normalmente o router. Tudo que vai pra fora da LAN passa por ele."},{"type":"text","text":"Hub x switch: o hub manda tudo pra todo mundo. O switch aprende em qual porta está cada MAC e entrega só pra porta certa, por isso substituiu o hub."},{"type":"text","text":"E além do hardware tem a parte de software: sistema operacional, drivers e os serviços rodando nos servidores."}],"terms":[{"en":"end device","pt":"aparelho final, quem usa a rede"},{"en":"intermediary device","pt":"equipamento que só encaminha (switch, router, AP)"},{"en":"gateway","pt":"a porta de saída da rede, normalmente o router"},{"en":"NIC","pt":"placa de rede"},{"en":"routing table","pt":"tabela de rotas do router"}],"practice":"O gateway é peça-chave: todo tráfego que sai da rede passa por ele, o que faz dele um alvo valioso. E painel de administração de router ou switch com a senha padrão de fábrica é um achado clássico em pentest.","quiz":[{"q":"Dois PCs na mesma sub-rede, ligados no mesmo switch. Pra trocar dados entre si, eles precisam passar por um router?","options":["Sim, todo tráfego passa pelo router","Só se estiverem usando UDP","Não, o switch resolve isso dentro da mesma rede local"],"answer":2,"explain":"Dentro da mesma LAN o switch entrega na camada 2. O router só entra quando o destino tá em outra rede."},{"q":"Qual equipamento repete tudo que recebe pra todas as outras portas, sem olhar endereço nenhum?","options":["Hub","Switch","Router","Access point"],"answer":0,"explain":"O hub trabalha na camada 1 e só repete o sinal. O switch, ao contrário, aprende os MACs e entrega só pra porta certa."}]},{"n":4,"title":"Network Communication","titlePt":"MAC, IP e port: os 3 endereços","minutes":8,"gist":"Pra um dado chegar no lugar certo, ele usa três endereços: o MAC (qual placa, na rede local), o IP (qual máquina, em qualquer rede) e a port (qual programa).","blocks":[{"type":"analogy","text":"O IP é o endereço do prédio e a port é o número do apartamento. O MAC é outra história: só vale dentro da rede local, como você vai ver no ARP."},{"type":"compare","title":"Os três endereços","columns":[{"label":"MAC (camada 2)","items":["48 bits, em hexadecimal: `00:1A:2B:3C:4D:5E`","Identifica a placa de rede","Só vale dentro da rede local"]},{"label":"IP (camada 3)","items":["IPv4: 32 bits, tipo `192.168.1.10`","Identifica a máquina, em qualquer rede","É lógico: vem de configuração (manual ou DHCP)"]},{"label":"Port (camada 4)","items":["Número de 0 a 65535","Identifica o programa/serviço na máquina","TCP e UDP têm cada um o seu conjunto"]}]},{"type":"facts","title":"Ports pra saber de cor","items":[{"value":"22","label":"SSH"},{"value":"53","label":"DNS"},{"value":"80","label":"HTTP"},{"value":"443","label":"HTTPS"},{"value":"445","label":"SMB"},{"value":"3389","label":"RDP"}]},{"type":"text","text":"Pra entregar algo na rede local, sua máquina precisa do MAC do destino, mas normalmente só sabe o IP. Quem faz essa ponte IPv4 → MAC é o **ARP**, e a resposta fica guardada um tempo na **ARP cache**."},{"type":"exchange","title":"ARP em ação","actors":["Seu PC (192.168.1.10)","Toda a LAN","Router (192.168.1.1)"],"messages":[{"from":0,"to":1,"label":"ARP request (broadcast)","note":"Quem tem o 192.168.1.1? Responde pro 192.168.1.10."},{"from":2,"to":0,"label":"ARP reply (unicast)","note":"O 192.168.1.1 tá no MAC `aa:bb:cc:dd:ee:ff`."}]},{"type":"warn","text":"Destino fora da sua rede? O ARP pergunta o MAC do **gateway** (o router, a saída da sua rede), não do destino final. E o ARP não tem autenticação: qualquer um na LAN pode mandar uma resposta falsa."},{"type":"commands","title":"Veja na sua máquina","items":[{"cmd":"ip a","note":"Linux: suas interfaces, com IP (inet / inet6) e MAC (link/ether)"},{"cmd":"ip neigh","note":"Linux: tabela ARP/vizinhos, os pares IP → MAC que sua máquina já conhece"},{"cmd":"ss -tuln","note":"Linux: portas TCP (-t) e UDP (-u) escutando (-l), em número (-n)"},{"cmd":"ipconfig /all","note":"Windows: IP, MAC (\"Physical Address\"), gateway e DNS"},{"cmd":"arp -a","note":"Windows: tabela ARP"}]}],"deep":[{"type":"points","title":"MAC em detalhe","items":["Os 3 primeiros bytes (o **OUI**) identificam o fabricante da placa.","Vem gravado de fábrica, mas dá pra trocar por software (**MAC spoofing**).","Celulares modernos usam MAC aleatório por rede Wi-Fi. Então não trate MAC como identidade confiável.","`ff:ff:ff:ff:ff:ff` é o endereço de broadcast: \"pra todo mundo da rede local\"."]},{"type":"points","title":"IP em detalhe","items":["O IPv4 dá uns 4,3 bilhões de endereços, que já acabaram. A saída oficial pra isso tá na seção 6 (NAT).","**IPv6**: 128 bits em hexadecimal, tipo `2001:db8::1` (o `::` abrevia uma sequência de zeros).","Como é lógico, o IP muda quando você troca de rede.","A **máscara de sub-rede** diz que parte do IP é \"rede\" e que parte é \"host\" (destrinchada em Introduction to Networking).","`127.0.0.1` é o loopback (localhost): a própria máquina falando com ela mesma."]},{"type":"table","title":"As faixas de ports","headers":["Faixa","Nome","Pra quê"],"rows":[["0–1023","well-known","serviços clássicos"],["1024–49151","registered","serviços registrados na IANA"],["49152–65535","dynamic/private","faixa que a IANA reserva pras portas temporárias (ephemeral) do lado do cliente"]]},{"type":"text","text":"Na prática cada sistema escolhe a sua faixa efêmera (o Linux, por padrão, usa 32768–60999). Completando a lista clássica: 21 (FTP), 23 (Telnet) e 25 (SMTP)."},{"type":"text","text":"Um **socket** é IP + port: `192.168.1.10:51234` falando com `203.0.113.20:443`. E no IPv6 o papel do ARP fica com outro protocolo, o **NDP**."}],"terms":[{"en":"MAC address","pt":"endereço físico da placa de rede"},{"en":"IP address","pt":"endereço lógico da máquina"},{"en":"port","pt":"número que identifica o serviço/programa"},{"en":"socket","pt":"combinação IP + port"},{"en":"broadcast","pt":"mensagem pra todos da rede local"},{"en":"ARP cache","pt":"tabela que guarda os pares IP ↔ MAC já descobertos"}],"practice":"Port scan (Nmap) é descobrir quais ports estão abertas e que serviço responde nelas; e serviço pode rodar em porta não padrão. ARP spoofing (mentir nas respostas ARP pra ficar no meio do tráfego) é um man-in-the-middle clássico em rede interna.","quiz":[{"q":"Seu PC (192.168.1.10) quer falar com 8.8.8.8, que tá na internet. O ARP vai perguntar o MAC de quem?","options":["Do 8.8.8.8","Do gateway (o router da sua rede)","Do servidor DNS","Do switch"],"answer":1,"explain":"O 8.8.8.8 tá fora da LAN e o ARP só funciona dentro da rede local, então o frame vai primeiro pro gateway."},{"q":"Qual dos três endereços identifica o programa ou serviço dentro da máquina?","options":["MAC","IP","Port"],"answer":2,"explain":"O IP leva até a máquina; a port diz qual programa recebe, tipo a 443 pro servidor HTTPS."}]},{"n":5,"title":"Dynamic Host Configuration Protocol (DHCP)","titlePt":"DHCP: configuração automática","minutes":6,"gist":"DHCP é o serviço que entrega automaticamente IP, máscara, gateway e DNS pra quem entra na rede, como um empréstimo com prazo de validade.","blocks":[{"type":"text","text":"Sem DHCP, alguém teria que configurar na mão cada celular, notebook e impressora, e ia dar **conflito de IP** o tempo todo. Com ele, você conecta no Wi-Fi e em segundos tá tudo configurado."},{"type":"points","title":"O que o DHCP te entrega","items":["**IP**: o seu endereço na rede","**Máscara**: diz que parte do IP é a rede e que parte é a máquina","**Gateway**: a saída da rede, normalmente o roteador","**DNS**: o servidor que traduz nomes de site em IP"]},{"type":"compare","title":"Quem é quem","columns":[{"label":"DHCP server","items":["Guarda o **pool** (faixa) de IPs livres e as configurações da rede","Em casa é o próprio roteador; em empresa, costuma ser um servidor dedicado"]},{"label":"DHCP client","items":["Qualquer aparelho configurado pra \"obter IP automaticamente\""]}]},{"type":"facts","items":[{"value":"UDP 67","label":"porta do servidor DHCP"},{"value":"UDP 68","label":"porta do cliente DHCP"}]},{"type":"analogy","text":"É a recepção de um hotel: \"tem quarto?\", \"tenho o 204\", \"fico com o 204\", e você recebe a chave com data de checkout. O IP é emprestado, não dado."},{"type":"exchange","title":"O processo DORA","actors":["Cliente","Servidor DHCP"],"messages":[{"from":0,"to":1,"label":"Discover","note":"broadcast, com origem 0.0.0.0 (ainda sem IP): tem algum servidor DHCP aí?"},{"from":1,"to":0,"label":"Offer","note":"te ofereço o 192.168.1.50, com essa máscara, esse gateway e esse DNS"},{"from":0,"to":1,"label":"Request","note":"em broadcast: quero o 192.168.1.50 (assim outros servidores sabem que a oferta deles não foi aceita)"},{"from":1,"to":0,"label":"Acknowledge","note":"fechado, é seu por X horas"}]},{"type":"points","title":"Lease: o empréstimo","items":["O prazo do empréstimo é o **lease time**.","Antes de vencer, o cliente tenta renovar.","IP que não é renovado volta pro **pool** e pode ir pra outro aparelho."]},{"type":"warn","text":"Pegou um IP `169.254.x.x`? Nenhum servidor DHCP respondeu e o sistema se deu esse endereço sozinho. Sem gateway nem DNS, nada de internet."}],"deep":[{"type":"steps","title":"A renovação do lease","items":[{"label":"Metade do prazo","text":"o cliente tenta renovar direto com o mesmo servidor"},{"label":"Por volta de 87,5%","text":"não rolou? tenta com qualquer servidor DHCP"},{"label":"Prazo venceu","text":"perde o IP e recomeça o DORA do zero"}]},{"type":"text","text":"O empréstimo economiza endereços: não precisa ter um IP reservado pra cada visitante que passou uma vez pela rede."},{"type":"text","text":"**Reservation** amarra um MAC a um IP fixo. É útil pra impressora e servidor, que precisam de endereço previsível."},{"type":"text","text":"O `169.254.x.x` é um endereço **link-local**, que o Windows (e outros sistemas) se autoatribui quando o DHCP não responde."},{"type":"commands","title":"Veja o que o DHCP te entregou","items":[{"cmd":"ip a","note":"IP vindo de DHCP costuma aparecer como \"dynamic\", com o tempo restante (valid_lft)"},{"cmd":"ip route","note":"a linha \"default via ...\" mostra o gateway que você recebeu"},{"cmd":"cat /etc/resolv.conf","note":"servidor(es) DNS em uso; com systemd-resolved aparece 127.0.0.53, e \"resolvectl status\" mostra o real"},{"cmd":"ipconfig /all","note":"Windows: \"DHCP Enabled\", \"DHCP Server\", \"Lease Obtained\" e \"Lease Expires\""},{"cmd":"ipconfig /release","note":"Windows: devolve o IP"},{"cmd":"ipconfig /renew","note":"Windows: pede ou renova o IP (depois de um /release, roda o DORA completo)"}]}],"terms":[{"en":"lease","pt":"empréstimo do IP com prazo"},{"en":"pool / scope","pt":"faixa de IPs que o servidor pode distribuir"},{"en":"default gateway","pt":"por onde a máquina sai da rede"},{"en":"reservation","pt":"IP fixo reservado pra um MAC"},{"en":"renewal","pt":"renovação do lease"}],"practice":"DHCP não tem autenticação. Um **rogue DHCP server** (servidor falso) pode entregar o IP do atacante como gateway ou DNS e colocá-lo no meio do tráfego; e **DHCP starvation** é esgotar o pool com pedidos falsos pra ninguém mais conseguir IP.","quiz":[{"q":"Seu notebook conectou no cabo e pegou o IP 169.254.13.7. O que provavelmente aconteceu?","options":["O DHCP entregou um IP público","O NAT do roteador traduziu o endereço","O DNS falhou ao resolver um nome","Nenhum servidor DHCP respondeu e ele se deu um endereço sozinho"],"answer":3,"explain":"169.254.x.x é o endereço link-local (só vale no próprio trecho de rede) que o sistema se autoatribui quando o DHCP não responde. Sem gateway nem DNS, ele não sai pra internet."},{"q":"O lease de um IP venceu e o aparelho não renovou. O que acontece com o endereço?","options":["Fica com o aparelho pra sempre","Volta pro pool e pode ir pra outro aparelho","Vira um IP público","Passa a ser o IP do gateway"],"answer":1,"explain":"O IP é emprestado: sem renovação, ele volta pra faixa do servidor e pode ser entregue a outro aparelho."}]},{"n":6,"title":"Network Address Translation (NAT)","titlePt":"NAT: muitos IPs atrás de um","minutes":6,"gist":"NAT é o router reescrevendo o IP (e às vezes a port) dos pacotes na fronteira com a internet, pra várias máquinas dividirem poucos IPs públicos.","blocks":[{"type":"text","text":"Os IPv4 acabaram. A saída foi criar faixas de **IP privado**: qualquer rede pode reusar esses endereços do lado de dentro, e eles não são roteados na internet."},{"type":"table","title":"As faixas de IP privado","headers":["Faixa","Notação CIDR"],"rows":[["10.0.0.0 – 10.255.255.255","10.0.0.0/8"],["172.16.0.0 – 172.31.255.255","172.16.0.0/12"],["192.168.0.0 – 192.168.255.255","192.168.0.0/16"]]},{"type":"text","text":"Por isso a sua casa e a do vizinho podem ter, as duas, um PC com `192.168.0.10` sem conflito. Pra sair pra internet, o router troca esse IP privado pelo IP público que o provedor deu."},{"type":"compare","title":"Os três tipos de NAT","columns":[{"label":"Static NAT","items":["1 IP privado ↔ 1 IP público, fixo","Pra servidor interno que precisa ser alcançado sempre pelo mesmo IP"]},{"label":"Dynamic NAT","items":["Pool de IPs públicos emprestados enquanto a máquina precisa","Pool acabou? Quem chega depois espera liberar"]},{"label":"PAT (NAT overload)","items":["Muitos IPs privados → 1 IP público","Diferencia cada conexão pela port","É o que o roteador da sua casa faz"]}]},{"type":"table","title":"PAT funcionando: a tabela de tradução do router","headers":["Interno (IP:port)","Sai como (IP público:port)","Destino"],"rows":[["192.168.0.10:51000","203.0.113.5:40001","198.51.100.7:443"],["192.168.0.11:51000","203.0.113.5:40002","198.51.100.7:443"]]},{"type":"text","text":"Quando a resposta chega em `203.0.113.5:40002`, o router consulta a tabela, vê que é do `192.168.0.11` e desfaz a troca."},{"type":"analogy","text":"Parece o PABX de uma empresa: de fora todo mundo liga pro mesmo número, e o sistema sabe pra qual ramal transferir."},{"type":"warn","text":"Conexão iniciada de fora não tem entrada na tabela, então é descartada, a não ser que exista **port forwarding**. Isso esconde a rede interna, mas NAT não é firewall: é efeito colateral, não política de segurança."}],"deep":[{"type":"code","title":"Exemplo de regra de port forwarding","lang":"text","code":"porta pública 8080   ->   192.168.0.20:80\n\nQuem acessa \u003cip-publico>:8080 chega no servidor web interno 192.168.0.20, porta 80."},{"type":"text","text":"Bônus Brasil: muitos provedores usam **CGNAT** (Carrier-Grade NAT), colocando vários clientes atrás do mesmo IP público, um NAT em cima do seu NAT."},{"type":"tip","text":"Se o IP da WAN do seu roteador tá entre `100.64` e `100.127` (faixa `100.64.0.0/10`), é CGNAT. Por isso às vezes abrir porta não funciona."},{"type":"commands","title":"Tem NAT no seu caminho?","items":[{"cmd":"ip a","note":"mostra o seu IP privado (ex.: 192.168.x.x)"},{"cmd":"curl https://ifconfig.me","note":"consulta um serviço externo que mostra o IP público com que a internet te vê; se for diferente do anterior, tem NAT no caminho"}]}],"terms":[{"en":"private IP","pt":"IP de uso interno, não roteável na internet"},{"en":"public IP","pt":"IP visível na internet"},{"en":"PAT / NAT overload","pt":"muitos pra um, usando ports"},{"en":"port forwarding","pt":"regra que encaminha uma porta pública pra uma máquina interna"},{"en":"translation table","pt":"tabela de traduções do NAT"},{"en":"CGNAT","pt":"NAT feito pelo provedor"}],"practice":"O IP que você vê de dentro de uma máquina nem sempre é o que o mundo vê. Numa reverse shell (o alvo conectando de volta em você), informe o IP da sua interface da VPN do lab, não o `192.168` de casa: ele só existe atrás do seu NAT.","quiz":[{"q":"Dois PCs da sua casa acessam o mesmo site ao mesmo tempo, os dois com porta de origem 51000. Como o roteador sabe pra quem devolver cada resposta?","options":["Com PAT: dá uma porta pública diferente pra cada conexão e anota na tabela de tradução","Manda cada resposta pros dois PCs e cada um descarta o que não é seu","Pelo MAC de cada PC, que viaja junto até o site","Não sabe: só um dos dois consegue acessar"],"answer":0,"explain":"O PAT troca a porta de origem de cada um por uma porta diferente no IP público. A resposta volta pra porta certa e o router desfaz a troca."},{"q":"Qual destes é um IP privado?","options":["8.8.8.8","172.32.0.1","203.0.113.5","172.20.5.1"],"answer":3,"explain":"A faixa privada 172.16.0.0/12 vai de 172.16 até 172.31. O 172.20.5.1 tá dentro dela; o 172.32.0.1 já tá fora."}]},{"n":7,"title":"Domain Name System (DNS)","titlePt":"DNS: a agenda da internet","minutes":7,"gist":"DNS é a agenda de contatos da internet: traduz nomes como `www.exemplo.com.br` em endereços IP, consultando uma hierarquia de servidores.","blocks":[{"type":"analogy","text":"Você não decora o telefone da sua mãe: procura \"Mãe\" na agenda e o celular disca o número. O DNS faz isso pros nomes de site, porque a rede só sabe entregar pacote pra IP."},{"type":"tree","title":"A hierarquia (o nome se lê da direita pra esquerda)","items":[{"label":". (root)","depth":0,"text":"o topo: 13 identidades de root servers (A a M), com mais de mil cópias pelo mundo"},{"label":".br","depth":1,"text":"TLD, administrado pelo Registro.br"},{"label":".com.br","depth":2,"text":"categoria debaixo do .br, assim como .gov.br"},{"label":"exemplo.com.br","depth":3,"text":"domínio: quem registrou controla, e os servidores authoritative dele dão a palavra final"},{"label":"www.exemplo.com.br","depth":4,"text":"subdomínio, criado à vontade pelo dono (www, mail, vpn...)"},{"label":".com, .org, .net...","depth":1,"text":"outros TLDs"}]},{"type":"text","text":"Antes de ir pra rede, o sistema olha o próprio cache e o arquivo **hosts**. Achou, acabou. Não achou, pergunta pro **resolver** configurado, o servidor DNS que corre atrás da resposta por você."},{"type":"exchange","title":"Resolução de um nome, passo a passo","actors":["Seu PC","Resolver","Root, TLD e autoritativo"],"messages":[{"from":0,"to":1,"label":"Qual o IP de www.exemplo.com.br?","note":"me traz a resposta pronta"},{"from":1,"to":2,"label":"Root, qual o IP?","note":"só se o resolver não tiver a resposta em cache"},{"from":2,"to":1,"label":"Root: não sei, pergunta pros servidores do .br"},{"from":1,"to":2,"label":".br, qual o IP?","note":"agora pro servidor do TLD"},{"from":2,"to":1,"label":".br: pergunta pros autoritativos de exemplo.com.br"},{"from":1,"to":2,"label":"Autoritativo, qual o IP?"},{"from":2,"to":1,"label":"Autoritativo: é 203.0.113.10","note":"a palavra final sobre o domínio"},{"from":1,"to":0,"label":"É 203.0.113.10","note":"e guarda em cache pelo tempo do TTL"}]},{"type":"table","title":"Tipos de registro mais comuns","headers":["Registro","Pra quê"],"rows":[["A","nome → IPv4"],["AAAA","nome → IPv6"],["CNAME","apelido → outro nome"],["MX","servidor de e-mail do domínio"],["NS","servidores autoritativos do domínio"],["TXT","texto livre (SPF, verificação de domínio...)"],["PTR","IP → nome (reverse DNS)"]]},{"type":"facts","items":[{"value":"53","label":"porta do DNS"},{"value":"UDP","label":"na maioria das consultas"},{"value":"TCP","label":"respostas grandes e transferência de zona"}]},{"type":"commands","title":"Pra testar","items":[{"cmd":"cat /etc/hosts","note":"resolução local, normalmente consultada antes do DNS"},{"cmd":"nslookup example.com","note":"consulta simples (existe no Linux e no Windows)"},{"cmd":"dig example.com","note":"resposta detalhada (registro A por padrão)"}]}],"deep":[{"type":"points","title":"Detalhes que ajudam","items":["Seu PC faz uma consulta **recursive** (\"me traz a resposta pronta\"); o resolver faz consultas **iterative** (cada servidor só indica o próximo).","O resolver pode ser o do roteador, o do provedor ou um público, como `1.1.1.1` e `8.8.8.8`.","O nome completo termina com um ponto que costuma ficar escondido: `www.exemplo.com.br.`. Esse último `.` é o root.","**Transferência de zona** é a cópia dos registros de um domínio de um servidor DNS pra outro.","No Windows, o arquivo hosts fica em `C:\\Windows\\System32\\drivers\\etc\\hosts`."]},{"type":"commands","title":"Mais consultas com o dig","items":[{"cmd":"dig MX example.com +short","note":"só o registro MX, resumido"},{"cmd":"dig -x 8.8.8.8","note":"reverse lookup (PTR): de IP pra nome"},{"cmd":"dig +trace example.com","note":"mostra o caminho todo: root → TLD → autoritativo"}]}],"terms":[{"en":"resolver","pt":"servidor que corre atrás da resposta por você"},{"en":"authoritative server","pt":"quem tem a palavra final sobre um domínio"},{"en":"TLD","pt":"Top-Level Domain, o \"sobrenome\" final do domínio (.br, .com)"},{"en":"record","pt":"registro (A, MX...)"},{"en":"TTL","pt":"por quanto tempo a resposta pode ficar em cache"},{"en":"reverse lookup","pt":"descobrir o nome a partir do IP"}],"practice":"Enumerar DNS (subdomínios, registros, servidores de e-mail) é um dos primeiros passos do reconhecimento de um alvo. E em labs é comum adicionar uma linha no `/etc/hosts` apontando um nome pro IP do alvo, porque aquele domínio não existe no DNS público.","quiz":[{"q":"Você colocou a linha `10.0.0.5 site.lab` no `/etc/hosts`. Ao abrir `site.lab` no navegador, o servidor DNS vai ser consultado?","options":["Sim, o DNS é sempre consultado primeiro","Normalmente não: o hosts é lido antes e já resolve o nome","Só se o TTL do arquivo hosts tiver vencido","Sim, porque o hosts só vale pra IPv6"],"answer":1,"explain":"O sistema olha o cache e o arquivo hosts antes de perguntar pro DNS. Achou lá, a busca acaba."},{"q":"Qual registro DNS indica o servidor de e-mail de um domínio?","options":["A","CNAME","MX","PTR"],"answer":2,"explain":"MX aponta o servidor de e-mail do domínio. A é nome pra IPv4, CNAME é apelido e PTR vai de IP pra nome."}]},{"n":8,"title":"Internet Architecture","titlePt":"Quem serve quem: arquiteturas","minutes":4,"gist":"Arquitetura é como as máquinas se organizam pra oferecer e consumir serviços: um centro servindo todos, todos servindo todos, ou uma mistura.","blocks":[{"type":"analogy","text":"Client-server é restaurante: você pede e a cozinha central prepara. Peer-to-peer é almoço de família em que cada um leva um prato e todo mundo come de tudo."},{"type":"table","title":"Os modelos","headers":["Modelo","Como funciona","Exemplo","Ponto fraco"],"rows":[["**Client-server**","clientes pedem, um servidor central responde","sites, e-mail, app do banco","o servidor central é ponto único de falha e concentra o alvo"],["**Peer-to-peer (P2P)**","cada nó é cliente e servidor ao mesmo tempo","BitTorrent","difícil controlar e confiar em quem tá do outro lado"],["**Hybrid**","um servidor central coordena (login, quem tá online), mas os dados podem ir direto entre os pares","alguns apps de chamada de vídeo e jogos online","herda um pouco dos problemas dos dois"],["**Cloud**","servidores, armazenamento e aplicações alugados de um provedor e acessados pela rede","AWS, Azure, Google Cloud","depende de configuração correta: um bucket (armazenamento) público vaza dados"]]},{"type":"layers","title":"Cloud: do mais pronto (em cima) ao mais trabalhoso (embaixo)","items":[{"label":"SaaS","text":"Software as a Service: o software pronto pra usar, tipo Gmail ou Microsoft 365","tag":"você só usa"},{"label":"PaaS","text":"Platform as a Service: a plataforma tá pronta, você só sobe o seu código","tag":"você traz o código"},{"label":"IaaS","text":"Infrastructure as a Service: você aluga a máquina virtual e cuida do resto","tag":"você cuida de mais coisa"}]}],"deep":[{"type":"text","text":"Pode aparecer também **SDN** (Software-Defined Networking): as decisões de como encaminhar o tráfego saem de cada equipamento e ficam centralizadas num software controlador."}],"terms":[{"en":"client","pt":"quem pede o serviço"},{"en":"server","pt":"quem oferece o serviço"},{"en":"peer","pt":"par, nó que faz os dois papéis"},{"en":"cloud provider","pt":"empresa que aluga a infraestrutura"},{"en":"single point of failure","pt":"peça que, se cair, derruba tudo"}],"practice":"A arquitetura diz onde tá a superfície de ataque (tudo que dá pra atacar). Em client-server, o foco é o servidor e os serviços expostos; em cloud, permissões mal configuradas e credenciais vazadas são a causa de muito incidente.","quiz":[{"q":"No BitTorrent, enquanto você baixa um arquivo, também envia pedaços dele pra outras pessoas. Que arquitetura é essa?","options":["Client-server","SaaS","SDN","Peer-to-peer"],"answer":3,"explain":"Cada participante é cliente e servidor ao mesmo tempo, sem um servidor central entregando o arquivo: isso é P2P."},{"q":"Você usa o Gmail no navegador, sem instalar nem administrar nada. Que modelo de cloud é esse?","options":["IaaS","PaaS","SaaS"],"answer":2,"explain":"No SaaS o software já vem pronto e o provedor cuida de tudo por trás; você só usa."}]},{"n":9,"title":"Wireless Networks","titlePt":"Wi-Fi e redes sem fio","minutes":5,"gist":"Rede wireless troca dados por ondas de rádio em vez de cabo, e a frequência usada define o equilíbrio entre alcance e velocidade.","blocks":[{"type":"text","text":"Wi-Fi é o nome comercial da família de padrões **IEEE 802.11**."},{"type":"points","title":"Os personagens","items":["**Access point**: o aparelho (ou o roteador com Wi-Fi) que cria a rede sem fio","**Clientes**: notebook, celular, TV conectados","**SSID**: o nome da rede que aparece na lista","**BSSID**: o MAC do access point"]},{"type":"table","title":"Frequências","headers":["Faixa","Alcance","Velocidade","Observação"],"rows":[["2.4 GHz","maior, atravessa melhor parede","menor","congestionada (vizinhos, Bluetooth, micro-ondas); só 3 canais sem sobreposição: 1, 6 e 11"],["5 GHz","menor","maior","mais canais e menos interferência"],["6 GHz","menor ainda","alta","só em aparelhos Wi-Fi 6E e Wi-Fi 7"]]},{"type":"table","title":"Segurança do Wi-Fi","headers":["Padrão","Situação"],"rows":[["WEP","quebrado; cai em minutos"],["WPA","transição, também ultrapassado"],["WPA2","foi o padrão por muito tempo; com senha compartilhada (PSK), quem captura o handshake pode testar senhas offline, e senha fraca cai"],["WPA3","o atual; o método SAE dificulta muito esse ataque offline"]]},{"type":"warn","text":"Esconder o SSID não é segurança: a rede continua detectável. E cuidado com **evil twin**, um access point falso com o mesmo nome da rede legítima."}],"deep":[{"type":"text","text":"Por que WPA2 com senha fraca é problema: quem captura o **handshake** (a troca inicial ao conectar) pode testar senhas offline com uma wordlist, sem nem estar mais perto da rede."},{"type":"table","title":"Gerações que aparecem na caixa do roteador","headers":["Nome comercial","Padrão"],"rows":[["Wi-Fi 4","802.11n"],["Wi-Fi 5","802.11ac"],["Wi-Fi 6 / 6E","802.11ax"],["Wi-Fi 7","802.11be"]]},{"type":"points","title":"Outras tecnologias sem fio","items":["**Rede celular** (4G/5G)","**Bluetooth**: curto alcance, também em 2.4 GHz","**NFC**: poucos centímetros, o pagamento por aproximação na maquininha"]},{"type":"text","text":"No **mobile hotspot**, o celular pega a internet móvel (4G/5G) e cria uma rede Wi-Fi local. Ele vira o roteador: distribui IP por DHCP e faz NAT pra sair pela operadora."},{"type":"warn","text":"Hotspot com senha fraca, ou esquecido ligado em lugar público, é convite pra gente estranha na sua rede."},{"type":"commands","title":"Pra ver as redes ao redor","items":[{"cmd":"nmcli dev wifi list","note":"Linux (NetworkManager): redes ao alcance com SSID, canal, sinal e segurança"},{"cmd":"iw dev","note":"Linux: suas interfaces wireless e o canal em uso"},{"cmd":"netsh wlan show interfaces","note":"Windows: rede conectada, canal, tipo de rádio e sinal"},{"cmd":"netsh wlan show networks mode=bssid","note":"Windows: redes ao redor com BSSID e canal"}]}],"terms":[{"en":"SSID","pt":"nome da rede Wi-Fi"},{"en":"BSSID","pt":"MAC do access point"},{"en":"channel","pt":"canal, a faixa exata dentro da frequência"},{"en":"handshake","pt":"troca inicial de mensagens ao conectar"},{"en":"PSK","pt":"Pre-Shared Key, a senha compartilhada do Wi-Fi"},{"en":"hotspot","pt":"ponto de acesso, tipo o celular compartilhando internet"}],"practice":"Pentest wireless é um mundo à parte, mas os achados básicos se repetem: WPA2 com senha fraca, protocolo antigo ainda ligado e rede de visitantes misturada com a rede interna da empresa.","quiz":[{"q":"No quarto dos fundos, o notebook pega mal o Wi-Fi de 5 GHz e bem o de 2.4 GHz. Por quê?","options":["Frequência mais baixa perde menos força atravessando parede e alcança mais longe","O 5 GHz é mais lento que o 2.4 GHz","O 2.4 GHz tem mais canais livres","O 5 GHz só funciona com WPA3"],"answer":0,"explain":"O 2.4 GHz alcança mais e atravessa melhor parede. O 5 GHz troca alcance por velocidade."},{"q":"Qual padrão de segurança Wi-Fi é o atual e dificulta muito o ataque offline de adivinhar a senha?","options":["WEP","WPA","WPA2","WPA3"],"answer":3,"explain":"O WPA3 usa o método SAE, que dificulta muito testar senhas offline a partir de um handshake capturado."}]},{"n":10,"title":"Network Security","titlePt":"Firewall, IDS e IPS","minutes":6,"gist":"Proteger uma rede é garantir a tríade CIA com camadas de controle, principalmente firewalls (que filtram) e IDS/IPS (que detectam ou barram ataques).","blocks":[{"type":"compare","title":"A tríade CIA aplicada a redes","columns":[{"label":"Confidentiality","items":["Só quem pode, vê","Ex.: criptografia (HTTPS, VPN)"]},{"label":"Integrity","items":["O dado não muda no caminho sem alguém perceber","Ex.: hashes, assinaturas digitais, TLS"]},{"label":"Availability","items":["O serviço tá no ar quando alguém precisa","Ex.: redundância, proteção contra DoS/DDoS (ataques que derrubam o serviço)"]}]},{"type":"text","text":"**Firewall** deixa passar ou bloqueia tráfego por regras (allow/deny) baseadas em IP, port, protocolo, estado da conexão ou conteúdo. Boa prática: **default deny**, ou seja, bloqueia tudo e libera só o necessário."},{"type":"table","title":"Tipos de firewall (pensa na portaria do condomínio)","headers":["Tipo","O que analisa","Na portaria"],"rows":[["**Packet-filtering** (stateless)","cada pacote isolado: IPs, ports, protocolo","porteiro que só confere a placa do carro"],["**Stateful inspection**","o mesmo, mais o estado da conexão (sabe se o pacote é resposta de algo que saiu)","porteiro que lembra quem saiu e libera a volta"],["**Application-layer / proxy**","conteúdo da camada 7 (ex.: requisições HTTP)","porteiro que abre o porta-malas"],["**NGFW** (Next-Generation)","tudo acima, mais identificação de aplicação, inspeção profunda (DPI) e IPS embutido","portaria com câmera, raio-X e lista de procurados"]]},{"type":"compare","title":"IDS x IPS","columns":[{"label":"IDS (Intrusion Detection System)","items":["Fora do caminho, analisa uma cópia do tráfego","Detecta e alerta","Risco: o ataque passa e alguém precisa reagir"]},{"label":"IPS (Intrusion Prevention System)","items":["Inline, no meio do caminho","Detecta e bloqueia","Risco: um falso positivo derruba tráfego legítimo"]}]},{"type":"compare","title":"Como eles detectam","columns":[{"label":"Signature-based","items":["Compara com padrões de ataques conhecidos","Preciso pro conhecido, cego pro novo (zero-day, ainda sem assinatura)"]},{"label":"Anomaly-based","items":["Aprende o que é \"normal\" na rede e alerta desvios","Pega novidade, mas gera mais falso positivo"]}]}],"deep":[{"type":"compare","title":"Onde o firewall fica","columns":[{"label":"Network-based","items":["Na borda da rede, protegendo todo mundo"]},{"label":"Host-based","items":["Em cada máquina","Ex.: Windows Defender Firewall, iptables/nftables no Linux"]}]},{"type":"text","text":"Nomes que você vai ver: **Snort** e **Suricata** (IDS/IPS) e **Zeek** (monitoramento e análise de tráfego)."},{"type":"commands","title":"Pra ver o firewall de uma máquina","items":[{"cmd":"sudo ufw status verbose","note":"firewall simplificado do Ubuntu: tá ligado? quais regras?"},{"cmd":"sudo iptables -L -n -v","note":"regras do iptables (-n = sem resolver nomes, -v = com contadores)"},{"cmd":"sudo nft list ruleset","note":"regras do nftables, o sucessor do iptables"},{"cmd":"netsh advfirewall show allprofiles","note":"Windows: estado do firewall em cada perfil (domínio, privado, público)"}]}],"terms":[{"en":"rule","pt":"regra de allow/deny"},{"en":"stateful","pt":"que acompanha o estado das conexões"},{"en":"inline","pt":"posicionado no caminho do tráfego"},{"en":"signature","pt":"assinatura, padrão de um ataque conhecido"},{"en":"false positive","pt":"alarme de algo que era legítimo"},{"en":"false negative","pt":"ataque real que passou batido"}],"practice":"Quando o Nmap marca uma porta como `filtered`, normalmente tem um firewall descartando os pacotes. E IDS/IPS é o motivo de um scan barulhento te entregar (ou te bloquear) num teste real.","quiz":[{"q":"A empresa quer que um ataque conhecido seja barrado automaticamente na hora, sem esperar um analista. IDS ou IPS?","options":["IDS, porque analisa uma cópia do tráfego","IPS, porque fica inline e pode descartar o tráfego","Tanto faz, os dois bloqueiam do mesmo jeito"],"answer":1,"explain":"O IPS fica no meio do caminho e pode descartar o tráfego na hora. O IDS só detecta e alerta."},{"q":"Qual método de detecção consegue pegar um ataque totalmente novo, ao custo de mais falsos positivos?","options":["Anomaly-based","Signature-based","Packet-filtering"],"answer":0,"explain":"O anomaly-based alerta tudo que foge do normal, então pega novidade. O signature-based só reconhece o que já tem assinatura."}]},{"n":11,"title":"Data Flow Example","titlePt":"Do endereço digitado à página","minutes":7,"gist":"Juntando tudo: o que acontece, passo a passo, entre você digitar um endereço no navegador e a página aparecer na tela.","blocks":[{"type":"text","text":"Cenário: seu notebook tá no Wi-Fi de casa e você abre `https://www.example.com`. Antes de tudo, ele já recebeu IP, máscara, gateway e DNS via DHCP (seção 5)."},{"type":"steps","title":"A ida até o servidor","items":[{"label":"DNS","text":"olha o cache e o hosts; sem resposta, pergunta pro resolver e recebe o IP do servidor"},{"label":"Rota","text":"o IP de destino tá fora da minha rede, então o pacote vai pro default gateway"},{"label":"ARP","text":"se o MAC do gateway não tá no cache, pergunta por broadcast"},{"label":"TCP","text":"three-way handshake com o servidor na porta 443; do seu lado, uma porta alta temporária (efêmera)"},{"label":"TLS","text":"cliente e servidor negociam a criptografia, e o servidor apresenta o certificado"},{"label":"HTTP","text":"o navegador manda o request (`GET /`) dentro do túnel TLS"}]},{"type":"layers","title":"Encapsulation: o dado descendo as camadas","items":[{"label":"HTTP","text":"o request do navegador","tag":"camada 7"},{"label":"Segmento TCP","text":"ganha as ports","tag":"camada 4"},{"label":"Pacote IP","text":"ganha os IPs","tag":"camada 3"},{"label":"Frame Wi-Fi","text":"ganha os MACs","tag":"camada 2"},{"label":"Ondas de rádio","text":"o frame vira sinal no ar","tag":"camada 1"}]},{"type":"steps","title":"O caminho e a volta","items":[{"label":"NAT","text":"o roteador troca o IP:port privado pelo IP público com outra porta e anota na tabela"},{"label":"Internet","text":"o pacote passa por vários routers; a cada hop, o TTL cai 1"},{"label":"Servidor","text":"o firewall de lá libera a 443, o servidor web processa e manda a response"},{"label":"Volta","text":"o NAT consulta a tabela e entrega pro notebook; o dado sobe as camadas até o navegador desenhar a página"}]},{"type":"tip","text":"A cada hop muda o **MAC** de destino, porque o frame é refeito pro próximo equipamento. O **IP** de destino fica igual de ponta a ponta: quem reescreve IP é o NAT, nas bordas."},{"type":"commands","title":"Cada passo na sua máquina","items":[{"cmd":"dig +short www.example.com","note":"DNS: o IP que o DNS devolve"},{"cmd":"ip route get 1.1.1.1","note":"Rota: por qual gateway e interface um pacote pra fora sairia"},{"cmd":"ip neigh","note":"ARP: o MAC do gateway já tá no cache?"},{"cmd":"curl -v https://www.example.com","note":"TCP, TLS e HTTP: conexão, handshake TLS, request e response"},{"cmd":"traceroute www.example.com","note":"Internet: os saltos no caminho (pode precisar instalar; no Windows é tracert)"}]}],"deep":[{"type":"text","text":"A própria consulta DNS também passa pela rota e pelo ARP pra chegar no resolver. O roteiro conta isso uma vez só pra não ficar repetitivo."},{"type":"text","text":"O TLS é onde entram a confidencialidade e a integridade da seção 10: quem tá no meio do caminho não lê nem altera o conteúdo sem ser percebido."},{"type":"warn","text":"Não confunda os dois TTL. No cabeçalho IP, é um contador que cai 1 a cada hop e evita pacote rodando pra sempre. No DNS, é quanto tempo a resposta pode ficar em cache."}],"terms":[{"en":"hop","pt":"cada router atravessado no caminho"},{"en":"TTL (IP)","pt":"Time To Live, contador que cai 1 a cada hop"},{"en":"request / response","pt":"pedido e resposta"},{"en":"TLS handshake","pt":"negociação da criptografia antes dos dados"},{"en":"decapsulation","pt":"tirar os cabeçalhos ao subir as camadas"}],"practice":"Esse mapa é o que você usa pra diagnosticar (\"o site não abre: é DNS, rota ou firewall?\") e pra situar cada ataque: DNS spoofing mexe no passo do DNS, ARP spoofing no do ARP, e um certificado falso tenta enganar o passo do TLS.","quiz":[{"q":"Quando o pacote atravessa um router no meio da internet, o que muda nele?","options":["O IP de destino","A porta de destino","O MAC de destino, porque o frame é refeito a cada hop","Nada, ele chega idêntico"],"answer":2,"explain":"O frame é refeito a cada salto pra apontar pro próximo equipamento. O IP de destino fica igual de ponta a ponta."},{"q":"Na ida até o site, o que acontece antes do three-way handshake TCP com o servidor?","options":["O request HTTP","A resolução DNS do nome","O handshake TLS","A decapsulation no navegador"],"answer":1,"explain":"Sem o IP do servidor não dá pra abrir conexão, então o DNS vem primeiro. TLS e HTTP só rolam depois do handshake TCP."}]},{"n":12,"title":"Skills Assessment","titlePt":"Skills Assessment: como se preparar","minutes":5,"gist":"É onde você mostra que consegue juntar os conceitos do módulo pra raciocinar sobre uma rede de verdade, não só repetir definição.","blocks":[{"type":"table","title":"O que costuma ser cobrado (e onde revisar)","headers":["Assunto","Revise"],"rows":[["tipos de rede e papel de cada equipamento","seções 1 e 3"],["camadas OSI/TCP-IP e onde cada protocolo vive","seção 2"],["MAC x IP x port, ARP","seção 4"],["DHCP, DORA e lease","seção 5"],["IP privado x público, NAT/PAT","seção 6"],["hierarquia DNS, registros e resolução","seção 7"],["client-server, P2P, cloud","seção 8"],["Wi-Fi: frequências e segurança","seção 9"],["CIA, firewall, IDS/IPS","seção 10"],["o caminho completo de uma requisição","seção 11"]]},{"type":"steps","title":"Como pensar","items":[{"label":"Qual camada?","text":"diante de qualquer pergunta, pense \"isso é de qual camada, de qual protocolo?\". Isso já diz em qual seção e ferramenta procurar"},{"label":"Não chute","text":"se a pergunta é sobre a configuração de uma máquina, vá no lugar certo e leia o que tá lá"},{"label":"Confira o formato","text":"veja se a resposta pede um IP, um número de porta ou um nome antes de enviar"},{"label":"Travou?","text":"volte na seção correspondente e refaça o quiz dela"}]},{"type":"table","title":"Onde procurar cada informação numa máquina","headers":["Se perguntarem sobre...","Linux","Windows"],"rows":[["IP e MAC","`ip a`","`ipconfig /all`"],["gateway","`ip route`","`ipconfig` ou `route print`"],["servidor DNS em uso","`/etc/resolv.conf` ou `resolvectl status`","`ipconfig /all`"],["resolução de um nome","`dig`, `nslookup`, `/etc/hosts`","`nslookup`, arquivo hosts"],["cache ARP","`ip neigh`","`arp -a`"],["portas escutando e conexões","`ss -tuln` (escutando) e `ss -tun` (conexões)","`netstat -ano`"],["regras de firewall","`ufw`, `iptables`, `nft`","`netsh advfirewall`"]]},{"type":"tip","text":"O formato exato das perguntas pode variar, mas o raciocínio é sempre o mesmo: identificar o conceito, saber qual ferramenta mostra aquela informação e l
