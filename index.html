"Instalar programas","minutes":4,"gist":"O jeito oficial de instalar, atualizar e remover programas no Linux, puxando de repositórios confiáveis em vez de baixar instalador solto.","blocks":[{"type":"text","text":"No Windows você baixa um instalador. No Linux você pede ao gerenciador de pacotes, que resolve dependências e baixa tudo de repositórios verificados."},{"type":"table","title":"Cada família tem o seu","headers":["Família","Baixo nível","Alto nível"],"rows":[["Debian / Ubuntu","`dpkg`","`apt`"],["Red Hat / Fedora","`rpm`","`dnf` / `yum`"]]},{"type":"text","text":"**Baixo nível** instala um pacote de cada vez e não resolve dependências sozinho. **Alto nível** é o do dia a dia: ele busca e instala tudo que o pacote precisa."},{"type":"commands","title":"O fluxo normal no Debian/Ubuntu","items":[{"cmd":"sudo apt update","note":"atualiza a LISTA de pacotes disponíveis"},{"cmd":"sudo apt upgrade","note":"atualiza de fato os programas instalados"},{"cmd":"sudo apt install nmap","note":"instala um pacote"},{"cmd":"apt list --installed","note":"mostra o que está instalado"}]},{"type":"warn","text":"`apt update` **não** atualiza seus programas, só o catálogo de versões. Quem atualiza de verdade é o `apt upgrade`. Confundir os dois é erro clássico de quem começa."}],"deep":[{"type":"commands","title":"Mais comandos úteis","items":[{"cmd":"sudo apt remove nmap","note":"remove um pacote"},{"cmd":"apt search palavra","note":"procura um pacote pelo nome ou descrição"},{"cmd":"sudo dpkg -i pacote.deb","note":"instala um `.deb` solto que você baixou"},{"cmd":"dpkg -l","note":"lista o que está instalado e em qual versão"}]},{"type":"text","text":"Fora o nativo, há formatos universais que empacotam o programa com as dependências juntas: `snap`, `flatpak`, `AppImage`. E linguagens têm o próprio: `pip` (Python), `gem` (Ruby). Muita ferramenta de segurança vem direto do GitHub com `git clone \u003curl>`."}],"terms":[{"en":"package","pt":"o programa empacotado"},{"en":"repository","pt":"repositório, a fonte oficial dos pacotes"},{"en":"dependency","pt":"outro pacote de que o seu precisa"},{"en":"update","pt":"atualizar o catálogo de versões"},{"en":"upgrade","pt":"atualizar os programas instalados"}],"practice":"Em máquinas de lab e servidores você instala ferramentas o tempo todo. Olhar o que está instalado e em qual versão também aponta software velho: uma das portas de entrada mais comuns e onde procurar CVE (vulnerabilidade pública catalogada) conhecida.","quiz":[{"q":"Você rodou `sudo apt update`, achou que atualizou os programas, mas nada mudou. Por quê?","options":["`apt update` só baixa a lista de versões disponíveis; quem instala as novas é o `apt upgrade`","O repositório estava fora do ar","Faltou reiniciar a máquina"],"answer":0,"explain":"`update` atualiza só o catálogo. Pra efetivamente trocar os programas pelas versões novas, roda `apt upgrade`."}]},{"n":17,"title":"Service and Process Management","titlePt":"Processos e serviços","minutes":6,"gist":"Todo programa rodando é um processo com PID; serviços são processos de longa duração que o sistema liga e desliga.","blocks":[{"type":"points","title":"Dois conceitos irmãos","items":["**Processo**: qualquer programa em execução, identificado por um número, o **PID**","**Serviço / daemon**: processo que roda em segundo plano o tempo todo (web, SSH, banco); o nome costuma terminar em `d`, como `sshd`"]},{"type":"commands","title":"Controlar serviços com systemctl","items":[{"cmd":"sudo systemctl start ssh","note":"inicia o serviço agora"},{"cmd":"sudo systemctl status ssh","note":"mostra se está rodando e as últimas linhas de log"},{"cmd":"sudo systemctl enable ssh","note":"faz ele subir automaticamente no boot"},{"cmd":"journalctl -u ssh","note":"mostra os logs daquele serviço"}]},{"type":"commands","title":"Processos crus","items":[{"cmd":"ps aux","note":"lista todos os processos do sistema"},{"cmd":"top","note":"painel ao vivo de CPU e memória (`q` pra sair)"},{"cmd":"kill \u003cPID>","note":"pede educadamente pro processo encerrar (SIGTERM)"},{"cmd":"kill -9 \u003cPID>","note":"força o encerramento (SIGKILL), último recurso"}]},{"type":"compare","title":"start x enable: não são a mesma coisa","columns":[{"label":"systemctl start","items":["liga o serviço **agora**","depois de reiniciar a máquina, ele não volta sozinho"]},{"label":"systemctl enable","items":["faz o serviço subir **em todo boot**","não liga na hora (a menos que você use `enable --now`)"]}]}],"deep":[{"type":"commands","title":"O resto do systemctl","items":[{"cmd":"sudo systemctl stop ssh","note":"para o serviço agora"},{"cmd":"sudo systemctl restart ssh","note":"reinicia (útil depois de mudar a config)"},{"cmd":"sudo systemctl disable ssh","note":"tira o serviço do boot"},{"cmd":"systemctl list-units --type=service","note":"lista os serviços carregados"}]},{"type":"tip","text":"Em distros da família Red Hat o serviço do SSH se chama `sshd`, não `ssh`."},{"type":"commands","title":"Mais sobre processos","items":[{"cmd":"ps aux | grep nginx","note":"filtra a lista de processos pelo que te interessa"},{"cmd":"htop","note":"versão mais bonita do `top` (se estiver instalado)"},{"cmd":"kill -l","note":"lista todos os sinais disponíveis"}]},{"type":"text","text":"O `kill` sem número manda **SIGTERM**: pede pro programa fechar direito (salvar e sair). O `kill -9` manda **SIGKILL**, que é puxar o cabo da tomada: o processo não pode ignorar nem se arrumar antes."},{"type":"text","text":"Primeiro e segundo plano: `comando &` já começa em background; `Ctrl+Z` pausa o que está na frente (sinal SIGTSTP) e `bg` faz continuar atrás; `jobs` lista e `fg` traz de volta pra frente."},{"type":"text","text":"Pra encadear comandos numa linha só: `a ; b` roda os dois sempre, `a && b` só roda o `b` se o `a` deu certo, `a || b` só roda o `b` se o `a` falhou."}],"terms":[{"en":"process","pt":"programa em execução"},{"en":"PID","pt":"número que identifica o processo"},{"en":"daemon","pt":"serviço que roda de fundo sozinho"},{"en":"service","pt":"serviço gerenciado pelo systemd"},{"en":"signal","pt":"aviso enviado a um processo (SIGTERM, SIGKILL)"},{"en":"foreground/background","pt":"primeiro / segundo plano"}],"practice":"Ver o que está rodando com `ps aux` revela serviços internos, credenciais passadas na linha de comando e processos de root que talvez dê pra influenciar. Reiniciar um serviço é essencial quando você altera uma config e precisa que entre em vigor.","quiz":[{"q":"Você deu `systemctl start` num serviço, funcionou, mas após reiniciar a máquina ele não subiu. O que faltou?","options":["Nada, é bug do systemd","Faltou rodar `systemctl restart`","Faltou o `systemctl enable`, que marca o serviço pra subir no boot"],"answer":2,"explain":"`start` só liga na sessão atual. O `enable` é que registra o serviço pra iniciar automaticamente toda vez que a máquina liga."},{"q":"Qual sinal o `kill -9` manda, e o que ele faz?","options":["SIGTERM, que pede pro programa fechar direito","SIGKILL, que força o encerramento sem o processo poder se arrumar","SIGINT, o mesmo que apertar `Ctrl+C`"],"answer":1,"explain":"`kill -9` manda SIGKILL, o 'puxar o cabo': o processo não pode ignorar nem salvar antes. Use só quando ele travou e não atende o pedido educado."}]},{"n":18,"title":"Task Scheduling","titlePt":"Agendar tarefas","minutes":5,"gist":"É pedir ao Linux pra rodar um comando sozinho num horário certo ou de tempos em tempos, sem você estar na frente da máquina.","blocks":[{"type":"text","text":"A forma veterana é o **cron**, baseado numa tabela de horários (a crontab). Cada linha tem cinco campos de tempo mais o comando."},{"type":"code","title":"Os cinco campos de tempo","lang":"text","code":"┌───────── minuto (0-59)\n│ ┌─────── hora (0-23)\n│ │ ┌───── dia do mês (1-31)\n│ │ │ ┌─── mês (1-12)\n│ │ │ │ ┌─ dia da semana (0-7, domingo=0 ou 7)\n│ │ │ │ │\n* * * * *  comando-a-rodar"},{"type":"text","text":"Leia sempre da esquerda pra direita: minuto, hora, dia, mês, dia da semana. O `*` significa 'qualquer valor' e o `*/5` significa 'de 5 em 5'."},{"type":"table","title":"Linhas de exemplo (vão dentro da crontab, não no terminal)","headers":["Linha","Quando roda"],"rows":[["`0 2 * * * /home/user/backup.sh`","todo dia às 02:00"],["`*/5 * * * * /home/user/check.sh`","a cada 5 minutos"],["`0 9 * * 1 /home/user/relatorio.sh`","toda segunda às 09:00"]]},{"type":"commands","title":"Mexendo na sua crontab","items":[{"cmd":"crontab -e","note":"abre a tabela do seu usuário pra editar"},{"cmd":"crontab -l","note":"lista o que está agendado"}]}],"deep":[{"type":"warn","text":"O `/etc/crontab` e os arquivos em `/etc/cron.d/` (os do sistema) têm um campo extra, o **usuário** que vai rodar o comando, entre o dia da semana e o comando. A crontab pessoal não tem esse campo."},{"type":"text","text":"Cron também é um jeito comum de manter **persistência**: uma tarefa que reabre o acesso sozinha de tempos em tempos. Vale conferir as crontabs ao investigar uma máquina."},{"type":"text","text":"Os **systemd timers** são a alternativa moderna (um `.timer` mais um `.service`): mais verbosos, porém com log melhor e capazes de rodar tarefas que perderam a hora enquanto a máquina estava desligada."},{"type":"commands","title":"Uma vez só no futuro","items":[{"cmd":"echo \"comando\" | at 23:00","note":"roda às 23h (hoje, ou amanhã se já passou), uma única vez"}]}],"terms":[{"en":"cron","pt":"o agendador clássico"},{"en":"crontab","pt":"a tabela de agendamentos"},{"en":"job","pt":"a tarefa agendada"},{"en":"timer","pt":"o agendador do systemd"},{"en":"interval","pt":"intervalo de repetição"}],"practice":"Tarefa agendada é faca de dois gumes: pro admin é backup automático, pro atacante um cron de root que roda um script que VOCÊ consegue editar é escalação na bandeja. Olhar `/etc/crontab`, `/etc/cron.d/` e as pastas `/etc/cron.*` é passo obrigatório na enumeração.","quiz":[{"q":"O que a linha `30 3 * * 0 /script.sh` faz?","options":["Roda `/script.sh` todo dia às 03:30","Roda a cada 30 minutos","Roda no dia 3 de todo mês","Roda às 03:30, mas só aos domingos"],"answer":3,"explain":"Os campos são minuto hora dia-do-mês mês dia-da-semana. Aqui: 30 min, 3h, qualquer dia e mês, e o último campo 0 = domingo."}]},{"n":19,"title":"Network Services","titlePt":"Serviços de rede e SSH","minutes":6,"gist":"São os serviços que põem a máquina na rede (SSH, compartilhamento, web, VPN), e você precisa saber ver quais portas estão abertas.","blocks":[{"type":"text","text":"Um serviço escuta numa **porta** e espera conexões. O mais importante pra você é o **SSH** (Secure Shell), que dá um terminal remoto criptografado em outra máquina."},{"type":"commands","title":"Acesso remoto com SSH","items":[{"cmd":"ssh usuario@\u003cip-alvo>","note":"conecta como 'usuario' na máquina alvo"},{"cmd":"ssh -p 2222 usuario@\u003cip-alvo>","note":"usa uma porta diferente da padrão (22)"},{"cmd":"scp arquivo.txt usuario@\u003cip-alvo>:/tmp/","note":"copia um arquivo pra máquina remota via SSH"}]},{"type":"commands","title":"Que portas a máquina está escutando?","items":[{"cmd":"ss -tlnp","note":"o moderno: portas TCP escutando, em número, com o processo dono"},{"cmd":"netstat -tulpn","note":"o clássico, ainda muito usado (com `u`, mostra UDP também)"}]},{"type":"table","title":"Decodificando as flags","headers":["Flag","Quer dizer"],"rows":[["`t`","TCP"],["`u`","UDP"],["`l`","só o que está escutando (listening)"],["`n`","mostra o número da porta, não o nome"],["`p`","mostra qual processo é dono da porta"]]},{"type":"warn","text":"`ss` e `netstat` mostram as portas **de dentro** da máquina. Um serviço preso em `127.0.0.1` (localhost) só aceita conexão da própria máquina, então um scan feito de fora não enxerga ele."},{"type":"points","title":"Outros serviços que aparecem muito","items":["**FTP** (porta 21): transferência de arquivo, antigo e sem criptografia","**SMB / NFS**: compartilhamento de arquivo em rede (SMB vem do Windows, no Linux é o Samba; NFS é o nativo do Unix e monta com `mount` como pasta local)","**Servidor web** (Apache, nginx): serve páginas via HTTP","**VPN**: túnel criptografado até outra rede, tipo `sudo openvpn arquivo.ovpn`"]}],"deep":[{"type":"commands","title":"Testar conectividade","items":[{"cmd":"ping \u003cip-alvo>","note":"a máquina responde?"},{"cmd":"curl http://\u003cip-alvo>","note":"busca uma página (ver próxima seção)"}]},{"type":"text","text":"No lado do servidor, quem atende o SSH é o daemon `sshd` (pacote OpenSSH), configurado em `/etc/ssh/sshd_config`."},{"type":"tip","text":"Rodar `ss -tlnp` por dentro é ótimo pra achar um banco de dados ou painel admin 'escondido' que só escuta em localhost."}],"terms":[{"en":"port","pt":"a porta onde o serviço escuta"},{"en":"listening","pt":"serviço aguardando conexões"},{"en":"SSH","pt":"shell remoto criptografado"},{"en":"daemon","pt":"o processo do serviço (ex.: `sshd`)"},{"en":"bind","pt":"a qual endereço/porta o serviço está preso"}],"practice":"SSH é o jeito padrão de operar máquinas Linux remotas, inclusive as que você compromete. Rodar `ss -tlnp` numa máquina invadida costuma revelar serviços internos (um painel na 8080, um banco na 3306) que são o próximo passo lógico do ataque.","quiz":[{"q":"Por que um serviço preso em `127.0.0.1:3306` não aparece num scan de portas feito de outra máquina?","options":["Porque a porta 3306 está sempre fechada","Porque o firewall bloqueia qualquer scan","Porque ele só escuta no loopback, aceitando conexões só da própria máquina"],"answer":2,"explain":"Preso em `127.0.0.1`, o serviço só atende quem vem de dentro. O `ss -tlnp` local o mostra, mas pra quem vem de fora não tem nada escutando ali."}]},{"n":20,"title":"Working with Web Services","titlePt":"curl, wget e HTTP","minutes":5,"gist":"É mexer com serviços web direto do terminal: buscar páginas, baixar arquivos e disparar requests HTTP sem abrir navegador nenhum.","blocks":[{"type":"text","text":"As duas ferramentas centrais são `curl` e `wget`. Grosso modo: o `curl` é o canivete suíço que **conversa** com o servidor; o `wget` é feito pra **baixar** arquivos de forma robusta."},{"type":"commands","title":"curl e wget na prática","items":[{"cmd":"curl http://\u003cip-alvo>","note":"busca uma página e joga na tela"},{"cmd":"curl -I http://\u003cip-alvo>","note":"só os cabeçalhos da resposta (faz um request HEAD, que pede o cabeçalho sem o corpo da página)"},{"cmd":"curl -L http://\u003cip-alvo>/x -o x","note":"segue redirecionamentos (`-L`) e salva no arquivo (`-o`)"},{"cmd":"curl -d 'user=a&pass=b' http://\u003cip-alvo>/login","note":"manda dados num POST (com `-d` o curl já usa POST; `-X POST` só deixaria explícito)"},{"cmd":"wget http://\u003cip-alvo>/backup.zip","note":"baixa um arquivo mantendo o nome original"}]},{"type":"table","title":"O status code da resposta","headers":["Código","Significado"],"rows":[["`200`","OK, deu certo"],["`301` / `302`","redirecionado pra outro lugar"],["`401`","precisa autenticar"],["`403`","proibido, você não tem acesso"],["`404`","não existe"],["`500`","erro no servidor"]]},{"type":"tip","text":"O `curl -I` é ouro na enumeração: o cabeçalho `Server:` entrega qual software e às vezes qual versão está rodando, o que já aponta pra vulnerabilidades conhecidas."}],"deep":[{"type":"commands","title":"Servidor web instantâneo","items":[{"cmd":"python3 -m http.server 8000","note":"sobe um servidor HTTP servindo a pasta atual na porta 8000"},{"cmd":"wget http://\u003cseu-ip>:8000/arquivo","note":"na outra máquina, baixa o arquivo servido"}]},{"type":"text","text":"É o truque clássico pra mover ferramentas pra dentro do alvo. Há equivalentes (`php -S 0.0.0.0:8000`), e pra algo permanente o caminho é instalar um servidor de verdade, como o Apache."},{"type":"warn","text":"O `http.server` expõe a pasta inteira pra quem alcançar aquela porta. Rode na pasta certa e desligue com `Ctrl+C` quando terminar."}],"terms":[{"en":"request","pt":"o pedido que o cliente manda ao servidor"},{"en":"response","pt":"a resposta do servidor"},{"en":"header","pt":"cabeçalho com metadados do pedido/resposta"},{"en":"status code","pt":"código de resultado (200, 404...)"},{"en":"GET/POST","pt":"métodos HTTP: buscar / enviar dados"},{"en":"endpoint","pt":"um caminho/URL específico do serviço"}],"practice":"Boa parte de um pentest é web. O `curl` deixa sondar cabeçalhos, testar endpoints e mandar payloads em POST, tudo em script e sem a lentidão de um navegador. E o truque do `http.server` resolve a maior parte das transferências de arquivo em lab.","quiz":[{"q":"Você roda `curl http://site/pagina` e volta uma resposta quase vazia com status `301`. Como chegar no conteúdo de verdade?","options":["Adicionar `-L` pra o curl seguir o redirecionamento","Usar `-I` pra ver só os cabeçalhos","Trocar para HTTPS na marra","Rodar o comando como root"],"answer":0,"explain":"`301` é um redirecionamento (o header `Location:` diz pra onde ir). Por padrão o curl não segue; com `-L` ele segue até o conteúdo final."}]},{"n":21,"title":"Backup and Restore","titlePt":"Backup e restauração","minutes":4,"gist":"Backup é copiar seus dados pra outro lugar de um jeito que dê pra restaurar depois, de preferência automático e já testado.","blocks":[{"type":"text","text":"Backup bom não é só copiar arquivo: é copiar pra **outro lugar** (outro disco, outra máquina, nuvem) e conseguir **restaurar** depois. Backup que você nunca testou restaurar é só esperança."},{"type":"points","title":"As duas ferramentas de sempre","items":["`tar` empacota (e comprime) uma pasta inteira num único arquivo, ótimo pra uma foto completa.","`rsync` sincroniza pastas copiando **só o que mudou**: rápido pro backup repetido, até pela rede via SSH."]},{"type":"commands","title":"Empacotar, restaurar, sincronizar","items":[{"cmd":"tar -czvf backup-home.tar.gz /home","note":"empacota e comprime a pasta `/home`: -c cria, -z comprime, -v mostra, -f define o nome"},{"cmd":"tar -xzvf backup-home.tar.gz","note":"restaura (extrai) o conteúdo; o -x é de extrair"},{"cmd":"rsync -avz -e ssh /dados/ usuario@servidor:/backup/dados/","note":"sincroniza uma pasta local com um servidor remoto via SSH, copiando só o que mudou: -a preserva permissões/datas/links (e é recursivo), -v lista, -z comprime na transferência"}]},{"type":"facts","title":"A regra 3-2-1","items":[{"value":"3","label":"cópias dos dados"},{"value":"2","label":"tipos de mídia"},{"value":"1","label":"cópia offsite (fora do local)"}]}],"deep":[{"type":"text","text":"Ferramentas que já vêm com mais coisa pronta: o **Duplicity** faz backup incremental e criptografado (usa rsync por baixo), e o **Déjà Dup** é a interface gráfica dele."},{"type":"warn","text":"Backup com dado sensível deve ser **criptografado**, senão quem pegar o arquivo leva tudo."},{"type":"tip","text":"Pra deixar automático, coloque o comando de backup num agendamento com o `cron` (lembra de \"Task Scheduling\"?)."}],"terms":[{"en":"backup","pt":"cópia de segurança dos dados"},{"en":"restore","pt":"restaurar/recuperar a partir do backup"},{"en":"archive","pt":"arquivo empacotado (ex: .tar)"},{"en":"incremental","pt":"backup só do que mudou desde o último"},{"en":"snapshot","pt":"foto do estado num instante"}],"practice":"Numa avaliação de segurança, achar um backup esquecido (um `.tar.gz` no `/tmp`, um dump de banco) costuma ser mina de ouro: senhas antigas, configs, código-fonte. Do lado defensivo, backup testado é o que salva de ransomware.","quiz":[{"q":"Por que o `rsync` costuma ser melhor que o `tar` pra um backup que roda todo dia?","options":["Porque comprime melhor que o tar","Porque copia só os arquivos que mudaram desde a última vez","Porque criptografa o backup sozinho","Porque não precisa de rede"],"answer":1,"explain":"O `rsync` transfere apenas o que mudou, então o backup diário fica muito mais rápido e usa menos banda que reempacotar tudo com `tar`."}]},{"n":22,"title":"File System Management","titlePt":"Discos e montagem","minutes":5,"gist":"No Linux, pra usar um disco você precisa **montá-lo** num diretório, e aquele diretório vira a porta de entrada pros arquivos dele.","blocks":[{"type":"text","text":"No Linux, disco não ganha letra tipo `C:` ou `D:`. Tudo vive numa única árvore que começa em `/`, e cada disco é **montado** (mount) num diretório dela."},{"type":"analogy","text":"Pensa numa tomada: o disco é o aparelho e o ponto de montagem (tipo `/mnt/pendrive`) é a tomada onde você pluga. Enquanto não plugar, o conteúdo não aparece na árvore."},{"type":"table","title":"Conceitos que andam juntos","headers":["Conceito","O que é"],"rows":[["Filesystem","O formato do disco (ext4, XFS, Btrfs; NTFS/FAT no Windows)"],["Partition","Uma fatia do disco físico"],["Mount point","O diretório onde o disco aparece"],["inode","A ficha de metadados de cada arquivo (dono, permissões, tamanho, onde os dados estão)"],["Swap","Espaço em disco usado como RAM de emergência"]]},{"type":"commands","title":"O dia a dia","items":[{"cmd":"lsblk","note":"lista discos e partições em formato de árvore"},{"cmd":"df -h","note":"mostra espaço livre/usado por filesystem, em formato humano"},{"cmd":"du -sh /var/*","note":"descobre quem está comendo o espaço dentro de uma pasta"},{"cmd":"sudo mount /dev/sdb1 /mnt/dados","note":"monta a partição `/dev/sdb1` no diretório `/mnt/dados` (precisa de root)"},{"cmd":"sudo umount /mnt/dados","note":"desmonta quando terminar. Repara: é `umount`, sem o \"n\""}]}],"deep":[{"type":"text","text":"O arquivo `/etc/fstab` é a lista de \"montar isso automaticamente no boot\". Cada linha diz: qual dispositivo, onde montar, qual filesystem e com quais opções."},{"type":"warn","text":"Mexer errado no `fstab` pode travar o boot. Por isso costuma-se identificar o disco pelo **UUID** (um ID que não muda), e não por `/dev/sdb1`, que pode trocar de nome."},{"type":"text","text":"Todo arquivo gasta um inode. Se o `df -h` diz que tem espaço livre mas dá \"disco cheio\", pode ser que os **inodes** acabaram, geralmente por milhões de arquivinhos minúsculos. Cheque com `df -i`."},{"type":"commands","items":[{"cmd":"sudo blkid","note":"mostra o UUID de uma partição (pra usar no fstab)"},{"cmd":"df -i","note":"mostra o uso de inodes, não de bytes"}]}],"terms":[{"en":"mount","pt":"montar/acoplar um disco na árvore"},{"en":"unmount","pt":"desmontar (o comando é `umount`, sem o n)"},{"en":"partition","pt":"partição, uma fatia do disco"},{"en":"filesystem","pt":"sistema de arquivos (o formato do disco)"},{"en":"inode","pt":"estrutura de metadados de cada arquivo"}],"practice":"Em máquina comprometida, olhar os discos montados (`mount`, `lsblk`, `/etc/fstab`) revela compartilhamentos de rede e volumes com possíveis credenciais. E um `fstab` com permissão errada ou opções frouxas (tipo sem `nosuid`) às vezes vira caminho de escalada.","quiz":[{"q":"O `df -h` mostra 30% de uso, mas o sistema não consegue criar arquivos. O que você checa?","options":["O uso de inodes com `df -i`","A memória RAM com `free -h`","As permissões com `ls -l`","A tabela de rotas com `ip route`"],"answer":0,"explain":"Mesmo sobrando espaço em bytes, os inodes (a ficha de cada arquivo) podem ter se esgotado, o que é comum com milhões de arquivos minúsculos. O `df -i` mostra isso."}]},{"n":23,"title":"Containerization","titlePt":"Containers vs VMs","minutes":5,"gist":"Container empacota um app com tudo que ele precisa e roda isolado, mas **compartilhando o kernel** do host, por isso é muito mais leve que uma VM.","blocks":[{"type":"text","text":"Container é uma caixa que roda seu app isolado do resto, mas usando o **kernel** (o núcleo do sistema) da própria máquina, o **host**. Por isso sobe em segundos, enquanto uma VM (máquina virtual) dá boot num sistema operacional inteiro."},{"type":"compare","title":"Máquina virtual x container","columns":[{"label":"Máquina Virtual (VM)","items":["Isola um computador inteiro (hardware virtual)","Tem o próprio kernel","Pesada: geralmente GBs","Ex: VirtualBox, VMware"]},{"label":"Container","items":["Isola processos, rede, usuários e arquivos (via namespaces do kernel)","Usa o kernel do host","Leve: geralmente MBs","Ex: Docker, LXC"]}]},{"type":"points","title":"O vocabulário do Docker","items":["**Image** (imagem): o molde, só leitura, tipo uma receita com ingredientes congelados.","**Container**: uma instância rodando daquela imagem, o prato pronto.","**Dockerfile**: o arquivo de texto que descreve como construir a imagem."]},{"type":"commands","title":"Comandos básicos (precisam de sudo ou grupo docker)","items":[{"cmd":"docker pull ubuntu","note":"baixa uma imagem do repositório público (Docker Hub)"},{"cmd":"docker run -it ubuntu /bin/bash","note":"sobe um container interativo e cai num shell dentro dele"},{"cmd":"docker ps","note":"lista os containers que estão rodando"},{"cmd":"docker stop \u003cid>","note":"para um container (o `\u003cid>` aparece no `docker ps`)"},{"cmd":"docker rm \u003cid>","note":"remove um container parado"}]}],"deep":[{"type":"text","text":"Existe também o **LXC**, que entrega containers mais parecidos com máquinas Linux completas e leves, em vez de focar num único app. E o **Docker Compose** sobe vários containers de uma vez a partir de um arquivo `.yml`."},{"type":"warn","text":"Container **não é** uma fronteira de segurança perfeita: como compartilha o kernel, um container mal configurado (rodando como root, com `--privileged`, com o socket do Docker exposto ou com capabilities, pedaços de poder de root, sobrando) pode virar porta de escape pro host inteiro."}],"terms":[{"en":"image","pt":"molde imutável do container"},{"en":"container","pt":"instância rodando da imagem"},{"en":"host","pt":"a máquina que roda os containers"},{"en":"registry","pt":"repositório de imagens (ex: Docker Hub)"},{"en":"privileged","pt":"container com acesso elevado ao host (perigoso)"},{"en":"namespace","pt":"recurso do kernel que dá a cada container sua própria visão de processos, rede e arquivos"}],"practice":"Caiu dentro de um container? A pergunta imediata é se dá pra escapar pro host: socket do Docker montado (`/var/run/docker.sock`) e flag `--privileged` são os caminhos clássicos. E no host, usuário no grupo `docker` (ou `lxd`) é, na prática, quase root.","quiz":[{"q":"Por que um container costuma subir bem mais rápido que uma VM?","options":["Porque usa menos espaço em disco","Porque não precisa de rede","Porque usa o kernel que já roda no host, sem dar boot num SO inteiro","Porque roda sempre como root"],"answer":2,"explain":"O container reaproveita o kernel do host; a VM precisa inicializar um sistema operacional completo, com kernel próprio, o que demora bem mais."}]},{"n":24,"title":"Network Configuration","titlePt":"Configuração de rede","minutes":6,"gist":"Configurar como o Linux fala com a rede (IP, máscara, gateway e DNS), via DHCP (automático) ou estático (na mão).","blocks":[{"type":"points","title":"O que toda máquina precisa pra se comunicar","items":["**IP**: o endereço dela na rede.","**Máscara (netmask)**: diz qual pedaço da rede é vizinho direto.","**Gateway**: a saída pra fora da rede local (a portaria do condomínio).","**DNS**: quem traduz nome (`google.com`) em IP."]},{"type":"compare","title":"Dois jeitos de configurar","columns":[{"label":"DHCP (automático)","items":["A máquina pede o IP pra rede","O normal em casa e em notebook"]},{"label":"Estático (na mão)","items":["Você fixa o IP manualmente","Comum em servidor"]}]},{"type":"text","text":"No Linux moderno, o comando central é o `ip`. O velho `ifconfig` (pacote net-tools) é considerado obsoleto, mas você ainda tromba muito com ele em tutorial e máquina antiga, então vale reconhecer os dois."},{"type":"commands","title":"Ver e mexer na rede","items":[{"cmd":"ip a","note":"mostra os endereços IP das interfaces (abreviação de `ip addr`)"},{"cmd":"ifconfig","note":"O equivalente antigo do `ip a`; ainda aparece muito por aí"},{"cmd":"ip route","note":"mostra a tabela de rotas, incluindo o gateway padrão (linha `default`)"},{"cmd":"sudo ip link set eth0 up","note":"sobe a interface `eth0` (troca por `down` pra derrubar)"},{"cmd":"nslookup google.com","note":"testa a resolução de DNS (o `dig` faz o mesmo com mais detalhe)"}]},{"type":"text","text":"Junto com rede, aparece o tema **controle de acesso**: quem pode acessar o quê. São três modelos (aqui MAC não tem nada a ver com endereço MAC)."},{"type":"table","title":"Quem decide o acesso: 3 modelos","headers":["Modelo","Quem decide","No Linux"],"rows":[["**DAC** (Discretionary)","O dono do recurso","As permissões `rwx` de sempre"],["**MAC** (Mandatory)","Uma política central que o dono não afrouxa","SELinux, AppArmor (seção 26)"],["**RBAC** (Role-Based)","O papel (role) da pessoa","Grupos e regras de `sudo` por função"]]}],"deep":[{"type":"table","title":"Onde a config fica salva","headers":["Arquivo / ferramenta","Onde aparece"],"rows":[["`/etc/netplan/`","Ubuntu mais novo"],["`/etc/network/interfaces`","Debian e Ubuntu antigo"],["NetworkManager (`nmcli`)","Muitas distros desktop"],["`/etc/resolv.conf`","Servidores DNS que a máquina usa"],["`/etc/hosts`","Atalho manual nome → IP, consultado antes do DNS (na config padrão)"]]},{"type":"points","title":"Kit básico quando algo não conecta","items":["`ping`: o outro lado responde?","`traceroute`: por onde o pacote passa até lá?","`ss` ou `netstat`: quais portas estão abertas/conectadas aqui?","`nslookup` ou `dig`: o DNS está resolvendo?"]},{"type":"commands","items":[{"cmd":"dig google.com","note":"testa o DNS mostrando a resposta com mais detalhe que o `nslookup`"},{"cmd":"nmcli connection show","note":"lista as conexões gerenciadas pelo NetworkManager"},{"cmd":"ss -tulnp","note":"mostra portas TCP/UDP escutando e o processo dono (o `-p` precisa de root pra ver tudo)"}]}],"terms":[{"en":"interface","pt":"placa/porta de rede (ex: eth0)"},{"en":"gateway","pt":"a saída pra outras redes"},{"en":"DHCP","pt":"atribuição automática de IP"},{"en":"static IP","pt":"IP fixo configurado na mão"},{"en":"resolver","pt":"o que traduz nome em IP (DNS)"}],"practice":"Ao cair numa máquina nova, `ip a` e `ip route` dizem em que redes ela está plugada. Às vezes tem uma segunda interface numa rede interna que você ainda não enxergava, e isso abre caminho pra avançar pra dentro do ambiente.","quiz":[{"q":"Qual comando mostra o gateway padrão da máquina?","options":["`ip addr`","`nslookup google.com`","`ip route`","`ss -tulnp`"],"answer":2,"explain":"O `ip route` lista a tabela de rotas, e a linha `default` aponta pro gateway: a saída pra fora da rede local."}]},{"n":25,"title":"Remote Desktop Protocols in Linux","titlePt":"Desktop remoto no Linux","minutes":5,"gist":"Jeitos de controlar a interface gráfica de uma máquina Linux de longe, não só o terminal: X11 forwarding, VNC e RDP.","blocks":[{"type":"text","text":"SSH te dá o terminal remoto. Mas quando você quer a **interface gráfica**, entram os protocolos de desktop remoto."},{"type":"table","title":"Os principais no mundo Linux","headers":["Protocolo","Resumo"],"rows":[["**X11 forwarding** (via SSH)","Manda só a janela de um app pra sua tela, dentro do túnel SSH"],["**VNC**","Compartilha a tela inteira; multiplataforma, mas o clássico não criptografa"],["**RDP** (via `xrdp`)","O protocolo de desktop da Microsoft rodando em Linux"]]},{"type":"commands","title":"Conectar","items":[{"cmd":"ssh -X usuario@servidor","note":"ativa o X11 forwarding. Depois é só rodar o app (ex: `firefox`) que a janela abre na sua tela. O servidor precisa ter `X11Forwarding yes` no `sshd_config`"},{"cmd":"vncviewer servidor:1","note":"conecta no VNC do display 1 (que é a porta 5901 = 5900 + 1)"},{"cmd":"vncviewer servidor::5901","note":"mesma coisa, mas com dois-pontos duplos você passa a porta direto"}]},{"type":"facts","title":"Portas pra reconhecer num scan","items":[{"value":"22","label":"SSH (e X11 forwarding por dentro)"},{"value":"5900 + N","label":"VNC (display N)"},{"value":"3389","label":"RDP"},{"value":"6000 + N","label":"servidor X11 aberto (display N)"}]},{"type":"warn","text":"VNC clássico trafega **sem criptografia** e a autenticação padrão é fraca (senha limitada a 8 caracteres). Nunca exponha VNC direto na internet: passe ele por dentro de um túnel SSH."}],"deep":[{"type":"text","text":"Por baixo da interface gráfica tradicional do Linux está o **X11** (X Window System). O protocolo X11 não criptografa nada, e um servidor X aberto pra rede escuta nas portas TCP 6000+ (6000 + número do display). Por isso o jeito recomendado de usar X remoto é por dentro do SSH."},{"type":"text","text":"Algumas implementações de VNC (o TigerVNC, por exemplo) suportam TLS, mas o caminho seguro continua sendo não expor o VNC e usar um túnel SSH."},{"type":"commands","title":"Tunelar o VNC com segurança","items":[{"cmd":"ssh -L 5901:localhost:5901 usuario@servidor","note":"cria o túnel: tudo que entrar na sua porta local 5901 viaja pelo SSH até a porta 5901 (VNC) do servidor"},{"cmd":"vncviewer localhost::5901","note":"em outro terminal, conecta o cliente no túnel local; o trecho que passa pela rede vai criptografado dentro do SSH"}]}],"terms":[{"en":"X11 forwarding","pt":"encaminhar janelas gráficas pelo SSH"},{"en":"VNC","pt":"compartilhamento de tela (Virtual Network Computing)"},{"en":"RDP","pt":"Remote Desktop Protocol (padrão Microsoft)"},{"en":"xrdp","pt":"servidor que fala RDP no Linux"},{"en":"display","pt":"a tela numerada do ambiente gráfico (ex: :0, :1)"}],"practice":"VNC e RDP expostos (portas 5900 e 3389) são alvos clássicos numa varredura: senha fraca ou versão vulnerável dá acesso gráfico direto. Vale sempre checar se a autenticação está fraca ou ausente.","quiz":[{"q":"Você precisa acessar o VNC de um servidor sem expô-lo na internet. Qual o jeito seguro?","options":["Trocar a porta do VNC pra uma aleatória","Criar um túnel SSH (`ssh -L`) e conectar no localhost","Usar uma senha de 8 caracteres bem forte","Abrir a porta 5900 só no firewall"],"answer":1,"explain":"Um túnel SSH (`ssh -L`) faz o tráfego do VNC viajar criptografado dentro do SSH; o cliente conecta no `localhost` e nada fica exposto na rede."}]},{"n":26,"title":"Linux Security","titlePt":"Segurança no Linux","minutes":6,"gist":"Segurança no Linux não é um botão: são várias camadas: atualizar, menor privilégio, SSH endurecido, MAC e menos serviço rodando.","blocks":[{"type":"points","title":"As camadas de um Linux bem configurado","items":["**Manter atualizado**: falha conhecida sem patch é convite aberto.","**Menor privilégio**: cada um só com o que precisa; usar `sudo` em vez de ficar como root.","**SSH endurecido**: desligar login de root por SSH (`PermitRootLogin no`), exigir chave em vez de senha e limitar quem conecta.","**Menos serviço rodando**: cada porta ativa à toa é superfície de ataque.","**MAC** (SELinux/AppArmor): uma camada extra que limita o que cada processo pode fazer, mesmo rodando como root."]},{"type":"text","text":"Um binário **SUID** roda com as permissões do dono dele (geralmente root). Isso é normal pra alguns programas (tipo `passwd`), mas um SUID indevido que você consegue manipular vira escada direta pra root."},{"type":"commands","title":"Checar o estado","items":[{"cmd":"sudo aa-status","note":"vê se o AppArmor está ativo e quais perfis carregou"},{"cmd":"sestatus","note":"vê o estado do SELinux"},{"cmd":"find / -perm -4000 -type f 2>/dev/null","note":"procura arquivos com o bit SUID (`-perm -4000`) no sistema todo; o `2>/dev/null` esconde os erros de permissão"}]}],"deep":[{"type":"points","items":["**SELinux** é o padrão na família Red Hat; **AppArmor**, no Ubuntu e no Debian.","Trocar a porta do SSH só diminui o barulho de robô tentando senha; não é proteção de verdade.","O **fail2ban** lê os logs e bloqueia o IP que fica errando senha: o anti força-bruta clássico."]},{"type":"text","text":"**TCP Wrappers** é um mecanismo mais antigo (ainda aparece em máquina legada): dois arquivos dizem quais IPs acessam cada serviço. O `/etc/hosts.allow` é consultado primeiro, e a primeira regra que bater vale."},{"type":"code","title":"Exemplo de TCP Wrappers","lang":"text","code":"# /etc/hosts.allow: quem PODE (consultado primeiro)\nsshd : 192.168.1.\n\n# /etc/hosts.deny: quem NÃO pode\nALL : ALL"},{"type":"text","text":"No exemplo, só a rede `192.168.1.x` entra no SSH e o resto é barrado. Se nenhum dos dois arquivos tiver regra pro acesso, ele é **liberado**."},{"type":"warn","text":"TCP Wrappers só protege serviços compilados com suporte a ele (libwrap), e várias distros novas já removeram. Não substitui firewall (próxima seção)."}],"terms":[{"en":"hardening","pt":"endurecimento, reduzir a superfície de ataque"},{"en":"least privilege","pt":"o menor privilégio necessário"},{"en":"MAC","pt":"controle de acesso obrigatório (SELinux/AppArmor)"},{"en":"SUID","pt":"bit que faz o binário rodar como o dono"},{"en":"privilege escalation","pt":"subir de usuário comum pra root"}],"practice":"Boa parte de uma avaliação de segurança em Linux é a escalada de privilégio: você entra como usuário comum e procura caminhos pra root. SUID mal configurado, `sudo` permissivo e serviço desatualizado são o cardápio, e é o mesmo checklist que o defensor usa pra fechar.","quiz":[{"q":"Por que um binário com bit **SUID** de root interessa tanto pra quem ataca quanto pra quem defende?","options":["Porque ocupa mais espaço em disco","Porque roda com privilégios de root: se for manipulável, vira caminho de escalada","Porque sempre está desatualizado","Porque não aparece no `ls -l`"],"answer":1,"explain":"O binário roda como root; se der pra abusar dele, o atacante sobe pra root. Por isso o defensor remove os SUID que não são necessários."}]},{"n":27,"title":"Firewall Setup","titlePt":"Configurando firewall","minutes":6,"gist":"Firewall é o porteiro da rede: olha cada pacote e decide se passa ou não, com base em regras de origem, destino, porta e protocolo.","blocks":[{"type":"text","text":"No Linux, quem filtra de fato é o **netfilter**, dentro do kernel. O que muda é a ferramenta que você usa pra escrever as regras."},{"type":"table","title":"As ferramentas","headers":["Ferramenta","Perfil"],"rows":[["`iptables`","Clássico, poderoso e verboso (tables e chains)"],["`nftables`","Sucessor moderno do iptables, sintaxe mais limpa"],["`ufw`","Uncomplicated Firewall, camada fácil por cima (Ubuntu)"],["`firewalld`","Camada de alto nível com zonas (Red Hat/Fedora)"]]},{"type":"table","title":"Como o iptables organiza as regras","headers":["Peça","O que é"],"rows":[["Chain `INPUT`","O que chega pra máquina"],["Chain `OUTPUT`","O que a máquina manda"],["Chain `FORWARD`","O que só passa por ela (roteando)"],["Alvo `ACCEPT`","Deixa o pacote passar"],["Alvo `DROP`","Descarta calado"],["Alvo `REJECT`","Nega avisando a origem"]]},{"type":"commands","title":"No iptables","items":[{"cmd":"sudo iptables -L -n -v","note":"lista as regras atuais (-n mostra IPs e portas em número, -v dá detalhes)"},{"cmd":"sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT","note":"permite SSH entrando: -A acrescenta no fim da chain INPUT, -p tcp é o protocolo, --dport a porta de destino, -j a ação"}]},{"type":"commands","title":"O caminho amigável: ufw","items":[{"cmd":"sudo ufw allow 22/tcp","note":"libera o SSH primeiro (se você está remoto, evita se trancar pra fora)"},{"cmd":"sudo ufw default deny incoming","note":"nega por padrão tudo que chega"},{"cmd":"sudo ufw enable","note":"só agora liga o firewall"},{"cmd":"sudo ufw status numbered","note":"vê o estado e as regras numeradas"}]},{"type":"compare","title":"DROP x REJECT","columns":[{"label":"DROP","items":["Descarta o pacote sem responder nada","Quem mandou fica esperando até dar timeout","No `nmap`, a porta aparece como `filtered`"]},{"label":"REJECT","items":["Nega avisando a origem (ICMP por padrão; dá pra configurar TCP reset)","A resposta volta rápido, mas entrega que tem alguém filtrando","No `nmap`: com ICMP, `filtered`; com TCP reset, `closed`"]}]}],"deep":[{"type":"tip","text":"A filosofia padrão boa é **\"nega tudo, libera só o necessário\"** (default deny). É exatamente o que a sequência do `ufw` acima faz."},{"type":"warn","text":"Pegadinha: regra criada com `iptables` na mão some no reboot, a não ser que você salve (ex: `iptables-save` + o pacote `iptables-persistent` no Debian/Ubuntu)."}],"terms":[{"en":"firewall","pt":"filtro de tráfego de rede"},{"en":"chain","pt":"corrente de regras (INPUT/OUTPUT/FORWARD)"},{"en":"rule","pt":"regra individual de filtragem"},{"en":"DROP","pt":"descartar o pacote em silêncio"},{"en":"REJECT","pt":"negar avisando a origem"},{"en":"default deny","pt":"bloquear por padrão, liberar só exceções"}],"practice":"Quando um scan (tipo `nmap`) mostra portas `filtered`, é sinal de firewall no caminho: ou o pacote foi descartado (DROP) ou voltou um erro ICMP (REJECT). Entender isso ajuda a mapear o que está realmente aberto.","quiz":[{"q":"Qual a diferença prática entre `DROP` e `REJECT` numa regra de firewall?","options":["`DROP` descarta sem responder; `REJECT` responde avisando que negou","`DROP` é pra TCP e `REJECT` é pra UDP","`DROP` libera a porta e `REJECT` bloqueia","Não há diferença, são sinônimos"],"answer":0,"explain":"`DROP` joga o pacote fora em silêncio (a origem espera até dar timeout); `REJECT` manda uma resposta avisando que foi negado."}]},{"n":28,"title":"System Logs and Monitoring","titlePt":"Logs e monitoramento","minutes":4,"gist":"Logs são a câmera de segurança da máquina: quase tudo fica registrado, a maioria em `/var/log/`, e você lê pra achar problema ou invasão.","blocks":[{"type":"text","text":"Se algo aconteceu no sistema, provavelmente ficou registrado em algum log. É a câmera de segurança da máquina, e a maioria mora em `/var/log/`."},{"type":"table","title":"Onde olhar","headers":["Arquivo / alvo","O que registra"],"rows":[["`/var/log/syslog` (Debian/Ubuntu) ou `/var/log/messages` (Red Hat)","Eventos gerais do sistema"],["`/var/log/auth.log` (Debian/Ubuntu) ou `/var/log/secure` (Red Hat)","Autenticação, logins, uso de `sudo`"],["`/var/log/kern.log`","Mensagens do kernel"],["Logs de app (ex: `/var/log/apache2/`)","O que cada serviço faz"]]},{"type":"text","text":"O Linux moderno também tem o **systemd-journald**, um log central do systemd. Você consulta ele com o comando `journalctl`."},{"type":"commands","title":"Ler os logs","items":[{"cmd":"journalctl -f","note":"mostra as últimas linhas do log e continua acompanhando ao vivo (-f = follow, igual `tail -f`)"},{"cmd":"journalctl -u ssh","note":"logs de um serviço específico. No Debian/Ubuntu a unit é `ssh`; no Red Hat, `sshd`"},{"cmd":"journalctl -b","note":"só os registros desde o último boot"},{"cmd":"dmesg","note":"mensagens do kernel (boot, hardware, drivers)"},{"cmd":"tail -f /var/log/auth.log","note":"no modo arquivo clássico: segue o log de autenticação ao vivo"}]},{"type":"points","title":"Pra monitorar ao vivo","items":["`top`/`htop`: processos e uso de CPU/RAM em tempo real.","`free -h`: a memória.","`df -h`: o espaço em disco."]}],"deep":[{"type":"text","text":"Em muitas distros os arquivos clássicos de `/var/log/` continuam existindo junto com o journald, então vale saber ler os dois jeitos."},{"type":"warn","text":"Logs são a primeira coisa que um invasor mais caprichado tenta apagar ou editar pra sumir com os rastros. Por isso ambiente sério manda cópia pra um servidor **separado** (log remoto / SIEM), onde o atacante não alcança."},{"type":"text","text":"O `rsyslog` é o serviço que, entre outras coisas, consegue encaminhar os logs pra outra máquina. **SIEM** é a plataforma que junta e analisa logs de vários sistemas num lugar só."}],"terms":[{"en":"log","pt":"registro de eventos do sistema"},{"en":"journald","pt":"o sistema de logs do systemd"},{"en":"syslog","pt":"padrão/serviço clássico de logs"},{"en":"facility / severity","pt":"categoria e gravidade de uma mensagem"},{"en":"rotation","pt":"arquivar e limpar logs antigos automaticamente"}],"practice":"Investigando um incidente, o `auth.log`/`secure` conta a história: tentativas de login, de onde vieram, qual `sudo` rodou. Saber onde ficam os logs é o primeiro passo pra entender o que foi registrado sobre o que aconteceu ali.","quiz":[{"q":"Você quer ver só os registros do serviço SSH no systemd. Qual comando usa?","options":["`dmesg | grep ssh`","`journalctl -u ssh`","`tail -f /var/log/kern.log`","`top`"],"answer":1,"explain":"O `-u` do `journalctl` filtra por unidade (unit) do systemd, ou seja, por serviço: `journalctl -u ssh` (ou `-u sshd`, dependendo da distro)."}]},{"n":29,"title":"Solaris","titlePt":"Solaris: o primo Unix","minutes":4,"gist":"Solaris é um Unix primo do Linux (Sun/Oracle): parece familiar, mas pacotes, serviços e vários comandos mudam. É comum em servidor legado.","blocks":[{"type":"text","text":"Solaris **não é Linux**, mas é da mesma família Unix. Muita coisa parece igual (shell, permissões, estrutura de arquivos), mas vários comandos e caminhos mudam."},{"type":"table","title":"O que muda vindo do Linux","headers":["Tema","Linux","Solaris"],"rows":[["Gerenciar pacotes","`apt` / `dnf`","`pkg` (IPS), antes `pkgadd`"],["Gerenciar serviços","`systemctl`","`svcs` / `svcadm` (SMF)"],["Isolamento tipo container","Docker / LXC","**Zones** (desde 2005)"],["Filesystem de destaque","ext4 / XFS","**ZFS** (snapshots nativos)"],["Rastrear syscalls","`strace`","`truss`"]]},{"type":"commands","title":"Comandos do Solaris","items":[{"cmd":"svcs -a","note":"lista todos os serviços (framework SMF)"},{"cmd":"svcadm enable \u003cservico>","note":"habilita um serviço (use `disable` pra desabilitar)"},{"cmd":"pkg install \u003cpacote>","note":"instala um pacote pelo IPS (Image Packaging System)"}]},{"type":"points","title":"Dois nomes pra guardar","items":["**ZFS**: filesystem que nasceu no Solaris, famoso por checar integridade e fazer snapshots (depois foi pro Linux e FreeBSD).","**Zones**: isolamento leve estilo container, lá de 2005, bem antes do Docker."]}],"deep":[],"terms":[{"en":"Solaris","pt":"Unix da Sun/Oracle"},{"en":"SMF","pt":"Service Management Facility (gerência de serviços)"},{"en":"Zones","pt":"containers nativos do Solaris"},{"en":"ZFS","pt":"sistema de arquivos avançado, com snapshots"},{"en":"IPS","pt":"Image Packaging System (pacotes)"}],"practice":"Encontrou Solaris numa avaliação? Trate como Unix, mas não assuma que os comandos do Linux funcionam igual: caminhos, flags e ferramentas diferem. Sistema legado assim costuma estar desatualizado e sem patch, o que chama atenção.","quiz":[{"q":"Você está num Solaris e o `systemctl` não existe. Como lista os serviços?","options":["`service --list`","`ps aux`","`journalctl`","`svcs -a`"],"answer":3,"explain":"No Solaris a gerência de serviços é o SMF (Service Management Facility), não o systemd. Você lista com `svcs -a`."}]},{"n":30,"title":"Shortcuts","titlePt":"Atalhos do terminal","minutes":4,"gist":"Atalhos de teclado do terminal (via biblioteca readline) pra navegar e editar comandos sem ficar segurando a seta igual tartaruga.","blocks":[{"type":"text","text":"O Bash usa a biblioteca **readline** pra editar a linha de comando. Decorar meia dúzia desses atalhos já muda seu ritmo de trabalho (a maioria vale igual no zsh)."},{"type":"table","title":"Mover o cursor e editar a linha","headers":["Atalho","O que faz"],"rows":[["`Ctrl + A`","Vai pro começo da linha"],["`Ctrl + E`","Vai pro fim da linha"],["`Ctrl + U`","Apaga do cursor até o começo"],["`Ctrl + K`","Apaga do cursor até o fim"],["`Ctrl + W`","Apaga a palavra anterior"],["`Ctrl + Y`","Cola o que você apagou com U/K/W"],["`Alt + B` / `Alt + F`","Pula uma palavra pra trás / pra frente"]]},{"type":"table","title":"Histórico e controle","headers":["Atalho","O que faz"],"rows":[["`Ctrl + R`","Busca reversa no histórico (aperta de novo pra ir pra ocorrência anterior)"],["`Seta ↑` / `Seta ↓`","Comando anterior / próximo do histórico"],["`Ctrl + L`","Limpa a tela (igual `clear`)"],["`Ctrl + C`","Interrompe o comando que está rodando"],["`Ctrl + D`","Fim de entrada; com a linha vazia, fecha o shell"],["`Ctrl + Z`","Pausa o processo; `fg` traz de volta, `bg` deixa em background"],["`Tab`","Autocompleta comando, arquivo ou caminho"]]},{"type":"tip","text":"O `Tab` merece destaque: aperta uma vez pra completar, aperta duas vezes pra ver todas as opções possíveis. Economiza digitação e evita erro de nome."}],"deep":[{"type":"text","text":"`Ctrl + S` congela a saída do terminal e `Ctrl + Q` descongela. Se a tela 'travou' do nada, tenta o `Ctrl + Q` antes de achar que o programa morreu."},{"type":"tip","text":"Achou o comando com `Ctrl + R`? `Enter` executa direto, a seta pra direita traz ele pra linha pra você editar antes, e `Ctrl + G` cancela a busca."}],"terms":[{"en":"shortcut","pt":"atalho de teclado"},{"en":"readline","pt":"biblioteca que trata a edição da linha de comando"},{"en":"history","pt":"histórico de comandos digitados"},{"en":"reverse search","pt":"busca pra trás no histórico (Ctrl+R)"},{"en":"tab completion","pt":"autocompletar com Tab"}],"practice":"No terminal normal, `Ctrl+A`, `Ctrl+R` e `Tab` aceleram muito o trabalho. Mas num reverse shell cru (sem TTY, tipo via `netcat`) esses atalhos não funcionam e um `Ctrl+C` costuma derrubar a sua própria conexão. Por isso o pessoal faz o \"upgrade\" do shell pra um TTY completo antes.","quiz":[{"q":"Você digitou um comando enorme há uns minutos e não quer digitar de novo nem apertar seta pra cima mil vezes. O que usa?","options":["`Ctrl + R` e digita um pedaço do comando","`Ctrl + L`","`Ctrl + C`","`Ctrl + A`"],"answer":0,"explain":"O `Ctrl + R` abre a busca reversa no histórico: você digita um trecho e ele acha o comando na hora."}]}]}]}</script>
<script>
(() => {
  'use strict'

  document.documentElement.lang = 'pt-BR'

  const DATA = JSON.parse(document.getElementById('caderno-data').textContent)
  const MODS = DATA.modules
  const STORE_KEY = 'caderno-cyber:v1'
  const THEME_KEY = 'caderno-cyber:tema'
  const view = document.getElementById('view')

  const SHORT = { infosec: 'InfoSec', netfound: 'Net Foundations', intronet: 'Intro Networking', linux: 'Linux' }
  const LETTERS = 'ABCD'

  // ---------- armazenamento local: só conveniência, a página funciona sem ele ----------
  const readJSON = (key, fallback) => {
    try {
      const raw = localStorage.getItem(key)
      return raw ? JSON.parse(raw) : fallback
    } catch (e) {
      return fallback
    }
  }
  const writeJSON = (key, value) => {
    try {
      localStorage.setItem(key, JSON.stringify(value))
    } catch (e) {
      // aba anônima ou storage bloqueado: o progresso vale só enquanto a página estiver aberta
    }
  }

  let progress = { studied: {}, last: null, ...readJSON(STORE_KEY, {}) }
  const saveProgress = next => { progress = next; writeJSON(STORE_KEY, next) }
  const isStudied = key => Boolean(progress.studied && progress.studied[key])
  const setStudied = (key, value) => saveProgress({ ...progress, studied: { ...progress.studied, [key]: value } })
  const setLast = key => saveProgress({ ...progress, last: key })

  // ---------- helpers ----------
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c])
  const plain = s => String(s == null ? '' : s).replace(/[`*]/g, '')
  const inline = s => String(s == null ? '' : s)
    .split(/(`[^`]+`)/g)
    .map(part => (part.length > 1 && part.startsWith('`') && part.endsWith('`')
      ? `<code>${esc(part.slice(1, -1))}</code>`
      : esc(part).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')))
    .join('')
  const list = (items, fn) => (items || []).map(fn).join('')
  const norm = s => plain(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()

  const keyOf = (mod, sec) => `${mod.id}-${sec.n}`
  const modById = id => MODS.find(m => m.id === id)
  const modIndex = mod => MODS.indexOf(mod)
  const totalMinutes = mod => mod.sections.reduce((n, s) => n + (s.minutes || 0), 0)
  const studiedCount = mod => mod.sections.filter(s => isStudied(keyOf(mod, s))).length
  const firstPending = mod => mod.sections.find(s => !isStudied(keyOf(mod, s))) || mod.sections[0]
  const fmtMinutes = min => (min < 60 ? `${min} min` : `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}`)

  function findByKey(key) {
    const m = /^([a-z]+)-(\d+)$/.exec(key || '')
    const mod = m && modById(m[1])
    const sec = mod && mod.sections.find(s => s.n === Number(m[2]))
    return sec ? { mod, sec } : null
  }

  const ICON = {
    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    ext: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    target: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  }

  // ---------- blocos de conteúdo ----------
  const fig = (b, inner) => `<figure class="b-fig">${b.title ? `<figcaption>${inline(b.title)}</figcaption>` : ''}${inner}</figure>`

  function renderExchange(b) {
    const n = b.actors.length
    const pos = i => ((i + 0.5) / n) * 100
    const pct = v => `${v.toFixed(2)}%`
    const msgs = list(b.messages, (m, i) => {
      const a = pos(m.from)
      const z = pos(m.to)
      const left = Math.min(a, z)
      const width = Math.abs(z - a)
      const textWidth = Math.min(100, Math.max(width, n === 2 ? 84 : 58))
      const textLeft = Math.min(100 - textWidth, Math.max(0, left + width / 2 - textWidth / 2))
      const dir = m.to > m.from ? 'right' : 'left'
      const route = `<span class="sr"> (de ${esc(plain(b.actors[m.from]))} para ${esc(plain(b.actors[m.to]))})</span>`
      return `<li class="ex-msg ${dir}" style="--l:${pct(left)};--w:${pct(width)};--tl:${pct(textLeft)};--tw:${pct(textWidth)}">`
        + `<span class="ex-label"><span class="ex-in"><span class="ex-n">${i + 1}</span>${inline(m.label)}${route}</span></span>`
        + '<span class="ex-arrow" aria-hidden="true"></span>'
        + (m.note ? `<span class="ex-note"><span class="ex-in">${inline(m.note)}</span></span>` : '')
        + '</li>'
    })
    const lifelines = list(b.actors, (_, i) => `<span class="ex-life" style="left:${pct(pos(i))}" aria-hidden="true"></span>`)
    const actors = list(b.actors, a => `<span class="ex-actor">${inline(a)}</span>`)
    return fig(b, `<div class="b-exchange" style="--n:${n}"><div class="ex-head">${actors}</div><div class="ex-lane">${lifelines}<ol class="ex-body">${msgs}</ol></div></div>`)
  }

  const BLOCKS = {
    text: b => `<p class="b-text">${inline(b.text)}</p>`,
    points: b => `<div class="b-group">${b.title ? `<p class="b-label">${inline(b.title)}</p>` : ''}<ul class="b-points">${list(b.items, i => `<li>${inline(i)}</li>`)}</ul></div>`,
    analogy: b => `<aside class="b-analogy"><span class="hand">pensa assim</span><p>${inline(b.text)}</p></aside>`,
    tip: b => `<aside class="b-note tip"><span class="hand">dica</span><p>${inline(b.text)}</p></aside>`,
    warn: b => `<aside class="b-note warn"><span class="hand">atenção</span><p>${inline(b.text)}</p></aside>`,
    steps: b => fig(b, `<ol class="b-steps">${list(b.items, (it, i) => `<li><span class="step-n">${i + 1}</span><div><strong>${inline(it.label)}</strong><p>${inline(it.text)}</p></div></li>`)}</ol>`),
    layers: b => fig(b, `<ol class="b-layers">${list(b.items, (it, i, all) => `<li style="--depth:${(i / Math.max(1, all.length - 1)).toFixed(3)}"><span class="layer-label">${inline(it.label)}</span><span class="layer-text">${inline(it.text)}</span>${it.tag ? `<span class="layer-tag">${esc(plain(it.tag))}</span>` : ''}</li>`)}</ol>`),
    compare: b => fig(b, `<div class="b-compare">${list(b.columns, c => `<div class="cmp-col"><h4>${inline(c.label)}</h4><ul>${list(c.items, i => `<li>${inline(i)}</li>`)}</ul></div>`)}</div>`),
    table: b => fig(b, `<div class="scroll-x"><table class="b-table"><thead><tr>${list(b.headers, h => `<th scope="col">${inline(h)}</th>`)}</tr></thead><tbody>${list(b.rows, r => `<tr>${list(r, c => `<td>${inline(c)}</td>`)}</tr>`)}</tbody></table></div>`),
    commands: b => fig(b, `<div class="b-term"><div class="term-bar"><span>terminal</span><span>não digite o $</span></div><ul>${list(b.items, it => `<li><div class="cmd-row"><code class="cmd">${esc(it.cmd)}</code><button type="button" class="copy" data-copy="${esc(it.cmd)}">copiar</button></div><p class="cmd-note">${inline(it.note)}</p></li>`)}</ul></div>`),
    code: b => fig(b, `<pre class="b-code" data-lang="${esc(b.lang)}"><code>${esc(b.code)}</code></pre>`),
    exchange: renderExchange,
    facts: b => fig(b, `<div class="b-facts">${list(b.items, it => `<div class="fact"><span class="fact-v">${esc(plain(it.value))}</span><span class="fact-l">${inline(it.label)}</span></div>`)}</div>`),
    tree: b => fig(b, `<ul class="b-tree">${list(b.items, it => `<li data-d="${it.depth}" style="--d:${it.depth}"><code class="tree-label">${esc(plain(it.label))}</code>${it.text ? `<span class="tree-text">${inline(it.text)}</span>` : ''}</li>`)}</ul>`),
  }

  const renderBlocks = blocks => list(blocks, b => {
    const render = b && BLOCKS[b.type]
    if (!render) {
      console.warn('Bloco de tipo desconhecido ignorado:', b)
      return ''
    }
    return render(b)
  })

  // ---------- peças da página de seção ----------
  const tocHTML = (mod, sec) => `
    <aside class="toc" aria-label="Seções do módulo">
      <a class="toc-mod" href="#m-${mod.id}">${esc(mod.titlePt)}</a>
      <ol>${list(mod.sections, s => {
        const k = keyOf(mod, s)
        return `<li class="${isStudied(k) ? 'is-done' : ''}" data-key="${k}"><a href="#${k}"${s === sec ? ' aria-current="page"' : ''}><span class="num">${s.n}</span><span>${esc(s.titlePt)}</span><span class="dot" aria-hidden="true"></span></a></li>`
      })}</ol>
    </aside>`

  const deepHTML = blocks => `
    <details class="deep">
      <summary><span>Quero me aprofundar<small>detalhes, comandos extras e casos especiais</small></span>${ICON.chev}</summary>
      <div class="blocks">${renderBlocks(blocks)}</div>
    </details>`

  const termsHTML = terms => `
    <section class="panel" aria-labelledby="t-terms">
      <h2 id="t-terms">Termos em inglês que vão aparecer</h2>
      <ul class="terms">${list(terms, t => `<li><span class="en">${esc(plain(t.en))}</span><span class="pt">${inline(t.pt)}</span></li>`)}</ul>
    </section>`

  const practiceHTML = text => `
    <section class="panel" aria-labelledby="t-prat">
      <h2 id="t-prat">Na prática</h2>
      <div class="practice-box">${ICON.target}<p>${inline(text)}</p></div>
    </section>`

  const quizHTML = quiz => `
    <section class="panel" aria-labelledby="t-quiz">
      <h2 id="t-quiz">Teste rápido</h2>
      <div class="quiz">${list(quiz, (q, qi) => `
        <div class="q" data-qi="${qi}">
          <p class="q-text">${quiz.length > 1 ? `${qi + 1}. ` : ''}${inline(q.q)}</p>
          <div class="opts" role="group" aria-label="Alternativas">${list(q.options, (o, oi) => `<button type="button" class="opt" data-oi="${oi}"><span class="opt-key">${LETTERS[oi]}</span><span>${inline(o)}</span></button>`)}</div>
          <div class="q-feedback" hidden aria-live="polite"></div>
        </div>`)}
      </div>
    </section>`

  function secNavHTML(prev, next, key) {
    const done = isStudied(key)
    const link = (target, cls, label) => (target
      ? `<a class="nav-link ${cls}" href="#${keyOf(target.mod, target.sec)}"><small>${label}</small><span>${esc(target.sec.titlePt)}</span></a>`
      : `<span class="${cls}"></span>`)
    return `
      <footer class="sec-nav">
        ${link(prev, 'prev', '← anterior')}
        <div class="done-wrap"><button type="button" class="done-btn" data-key="${key}" aria-pressed="${done}">${ICON.check}<span>${done ? 'Estudada' : 'Marcar como estudada'}</span></button></div>
        ${link(next, 'next', next && next.newModule ? 'próximo módulo →' : 'próxima →')}
      </footer>`
  }

  const progressHTML = mod => {
    const done = studiedCount(mod)
    const total = mod.sections.length
    return `<div class="progress">
      <div class="progress-bar" role="progressbar" aria-label="Seções estudadas" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><span style="--p:${Math.round((done / total) * 100)}%"></span></div>
      <small>${done} de ${total} seções estudadas · ~${fmtMinutes(totalMinutes(mod))} de leitura</small>
    </div>`
  }

  // ---------- telas ----------
  function renderHome() {
    const last = findByKey(progress.last)
    const start = MODS[0] && keyOf(MODS[0], MODS[0].sections[0])
    const resume = last
      ? `<a class="btn" href="#${keyOf(last.mod, last.sec)}">Continuar de onde parei ${ICON.arrow}</a><small>${esc(last.mod.titlePt)} · seção ${last.sec.n}: ${esc(last.sec.titlePt)}</small>`
      : `<a class="btn" href="#${start}">Começar pelo módulo 1 ${ICON.arrow}</a>`
    view.innerHTML = `
      <section class="hero">
        <p class="eyebrow">HTB Academy, em português</p>
        <h1>Caderno de Cyber</h1>
        <p class="lede">Os módulos que você tá fazendo no HTB, explicados do jeito que um amigo explicaria: uma seção por vez, com desenho, exemplo e um teste rápido no final.</p>
        <div class="resume">${resume}</div>
      </section>
      <section class="howto" aria-label="Como usar">
        <ol>
          <li><span class="hand">1</span><span>Abre o módulo no HTB numa aba e o caderno na outra. Cada seção daqui tem o mesmo número da de lá.</span></li>
          <li><span class="hand">2</span><span>Lê o essencial aqui primeiro. Quer mais detalhe? Abre <strong>Quero me aprofundar</strong>.</span></li>
          <li><span class="hand">3</span><span>Faz o teste rápido. Acertou tudo, a seção fica marcada como estudada.</span></li>
        </ol>
      </section>
      <section class="mod-grid" aria-label="Módulos">${list(MODS, modCardHTML)}</section>
      <a class="gloss-link" href="#glossario"><span><strong>Glossário</strong><br>Todos os termos em inglês dos módulos, traduzidos, com a seção onde aparecem.</span>${ICON.arrow}</a>`
  }

  function modCardHTML(mod, i) {
    const done = studiedCount(mod)
    const total = mod.sections.length
    const next = firstPending(mod)
    const label = done === 0 ? 'Começar' : done === total ? 'Revisar' : `Continuar na seção ${next.n}`
    return `
      <article class="mod-card">
        <p class="eyebrow">Módulo ${i + 1}</p>
        <h2><a href="#m-${mod.id}">${esc(mod.titlePt)}</a></h2>
        <p class="en">${esc(mod.title)}</p>
        <p class="blurb">${esc(mod.blurb)}</p>
        ${progressHTML(mod)}
        <div class="mod-actions"><a class="btn" href="#${keyOf(mod, next)}">${label} ${ICON.arrow}</a></div>
      </article>`
  }

  function renderModule(mod) {
    const done = studiedCount(mod)
    const total = mod.sections.length
    const next = firstPending(mod)
    const label = done === 0 ? 'Começar' : done === total ? 'Revisar do início' : `Continuar na seção ${next.n}`
    view.innerHTML = `
      <header class="mod-head">
        <p class="eyebrow">Módulo ${modIndex(mod) + 1} de ${MODS.length}</p>
        <h1>${esc(mod.titlePt)}</h1>
        <p class="en">${esc(mod.title)}</p>
        <p class="blurb">${esc(mod.blurb)}</p>
        ${progressHTML(mod)}
        <div class="actions">
          <a class="btn" href="#${keyOf(mod, next)}">${label} ${ICON.arrow}</a>
          <a class="btn ghost" href="${esc(mod.url)}" target="_blank" rel="noopener">Abrir no HTB ${ICON.ext}</a>
        </div>
      </header>
      <ol class="sec-list">${list(mod.sections, s => {
        const k = keyOf(mod, s)
        const done = isStudied(k)
        return `<li class="${done ? 'is-done' : ''}"><a href="#${k}">
          <span class="num">${s.n}</span>
          <span class="names"><span class="pt">${esc(s.titlePt)}</span><span class="htb">${esc(s.title)}</span></span>
          <span class="meta">${s.minutes} min<span class="check" role="img" aria-label="${done ? 'estudada' : 'não estudada'}">${ICON.check}</span></span>
        </a></li>`
      })}</ol>`
  }

  function renderSection(mod, sec) {
    const key = keyOf(mod, sec)
    setLast(key)
    const idx = mod.sections.indexOf(sec)
    const nextMod = MODS[modIndex(mod) + 1]
    const prev = idx > 0 ? { mod, sec: mod.sections[idx - 1] } : null
    const next = idx < mod.sections.length - 1
      ? { mod, sec: mod.sections[idx + 1] }
      : (nextMod ? { mod: nextMod, sec: nextMod.sections[0], newModule: true } : null)

    view.innerHTML = `
      <div class="study">
        ${tocHTML(mod, sec)}
        <article class="sheet" aria-labelledby="sec-title">
          <nav class="crumbs" aria-label="Você está em">
            <a href="#m-${mod.id}">← ${esc(mod.titlePt)}</a>
            <span>Seção ${sec.n} de ${mod.sections.length} · ~${sec.minutes} min</span>
          </nav>
          <header class="sec-head">
            <p class="htb-title"><span class="n">${sec.n}</span><span class="lbl">no HTB:</span> ${esc(sec.title)}</p>
            <h1 id="sec-title">${esc(sec.titlePt)}</h1>
            <p class="gist"><mark>${inline(sec.gist)}</mark></p>
          </header>
          <div class="blocks">${renderBlocks(sec.blocks)}</div>
          ${sec.deep && sec.deep.length ? deepHTML(sec.deep) : ''}
          ${termsHTML(sec.terms)}
          ${practiceHTML(sec.practice)}
          ${quizHTML(sec.quiz)}
          ${secNavHTML(prev, next, key)}
        </article>
      </div>`

    const toc = view.querySelector('.toc')
    const cur = toc && toc.querySelector('[aria-current="page"]')
    if (cur) toc.scrollTop = cur.offsetTop - toc.clientHeight / 2
  }

  let glossary = null
  function buildGlossary() {
    const byTerm = new Map()
    MODS.forEach(mod => mod.sections.forEach(sec => (sec.terms || []).forEach(t => {
      const en = plain(t.en).trim()
      const id = en.toLowerCase()
      const entry = byTerm.get(id) || { en, pt: t.pt, refs: [] }
      const ref = { mod, sec, key: keyOf(mod, sec) }
      const refs = entry.refs.some(r => r.key === ref.key) ? entry.refs : [...entry.refs, ref]
      byTerm.set(id, { ...entry, refs })
    })))
    return [...byTerm.values()].sort((a, b) => a.en.localeCompare(b.en, 'en', { sensitivity: 'base' }))
  }

  function renderGlossary() {
    glossary = glossary || buildGlossary()
    view.innerHTML = `
      <header class="gloss-head">
        <p class="eyebrow">Glossário</p>
        <h1>Termos em inglês, traduzidos</h1>
        <p>Tudo que aparece em "Termos em inglês" nas seções, num lugar só. Clica na referência pra ir direto pra seção.</p>
        <label class="sr" for="gloss-q">Buscar termo</label>
        <input id="gloss-q" class="search" type="search" placeholder="Buscar: port, shell, sub-rede..." autocomplete="off">
        <p class="gloss-count" id="gloss-count"></p>
      </header>
      <ul class="gloss-list" id="gloss-list"></ul>`

    const input = view.querySelector('#gloss-q')
    const paint = () => {
      const q = norm(input.value.trim())
      const items = q ? glossary.filter(t => norm(t.en).includes(q) || norm(t.pt).includes(q)) : glossary
      view.querySelector('#gloss-count').textContent = `${items.length} ${items.length === 1 ? 'termo' : 'termos'}`
      view.querySelector('#gloss-list').innerHTML = items.length
        ? list(items, t => `<li><span class="en">${esc(t.en)}</span><span class="pt">${inline(t.pt)}</span><span class="refs">${list(t.refs, r => `<a href="#${r.key}">${esc(SHORT[r.mod.id] || r.mod.titlePt)} · ${r.sec.n}</a>`)}</span></li>`)
        : `<li class="gloss-empty">Nada encontrado pra "${esc(input.value)}". Tenta em inglês ou em português.</li>`
    }
    input.addEventListener('input', paint)
    paint()
  }

  function renderNotFound() {
    view.innerHTML = `<div class="not-found"><h1>Essa página não existe</h1><p>O link pode estar incompleto.</p><a class="btn" href="#inicio">Voltar pros módulos ${ICON.arrow}</a></div>`
  }

  // ---------- interações ----------
  let current = null

  function markStudied(key, value) {
    setStudied(key, value)
    view.querySelectorAll(`.done-btn[data-key="${key}"]`).forEach(btn => {
      btn.setAttribute('aria-pressed', String(value))
      btn.querySelector('span').textContent = value ? 'Estudada' : 'Marcar como estudada'
    })
    view.querySelectorAll(`.toc li[data-key="${key}"]`).forEach(li => li.classList.toggle('is-done', value))
  }

  function onAnswer(btn) {
    if (!current) return
    const qEl = btn.closest('.q')
    const q = current.sec.quiz[Number(qEl.dataset.qi)]
    const chosen = Number(btn.dataset.oi)
    const ok = chosen === q.answer
    qEl.querySelectorAll('.opt').forEach((opt, i) => {
      opt.disabled = true
      opt.classList.add(i === q.answer ? 'right' : i === chosen ? 'wrong' : 'dim')
    })
    const fb = qEl.querySelector('.q-feedback')
    fb.className = `q-feedback ${ok ? 'ok' : 'no'}`
    fb.innerHTML = `<strong>${ok ? 'Isso!' : `Quase. A certa é a ${LETTERS[q.answer]}.`}</strong><p>${inline(q.explain)}</p>${ok ? '' : '<button type="button" class="q-retry">Tentar de novo</button>'}`
    fb.hidden = false
    qEl.dataset.result = ok ? 'ok' : 'no'
    const all = [...view.querySelectorAll('.quiz .q')]
    if (all.every(el => el.dataset.result === 'ok')) markStudied(keyOf(current.mod, current.sec), true)
  }

  function onRetry(btn) {
    const qEl = btn.closest('.q')
    qEl.querySelectorAll('.opt').forEach(opt => {
      opt.disabled = false
      opt.classList.remove('right', 'wrong', 'dim')
    })
    const fb = qEl.querySelector('.q-feedback')
    fb.hidden = true
    fb.innerHTML = ''
    delete qEl.dataset.result
    qEl.querySelector('.opt').focus()
  }

  function onCopy(btn) {
    const flash = label => {
      btn.textContent = label
      btn.classList.add('done')
      setTimeout(() => { btn.textContent = 'copiar'; btn.classList.remove('done') }, 1400)
    }
    const selectInstead = () => {
      const code = btn.parentElement.querySelector('.cmd')
      const range = document.createRange()
      range.selectNodeContents(code)
      const sel = window.getSelection()
      sel.removeAllRanges()
      sel.addRange(range)
      flash('selecionado')
    }
    try {
      navigator.clipboard.writeText(btn.dataset.copy).then(() => flash('copiado'), selectInstead)
    } catch (e) {
      selectInstead()
    }
  }

  view.addEventListener('click', e => {
    const opt = e.target.closest('.opt')
    if (opt && !opt.disabled) return onAnswer(opt)
    const retry = e.target.closest('.q-retry')
    if (retry) return onRetry(retry)
    const done = e.target.closest('.done-btn')
    if (done) return markStudied(done.dataset.key, !isStudied(done.dataset.key))
    const copy = e.target.closest('.copy')
    if (copy) return onCopy(copy)
    return undefined
  })

  document.addEventListener('keydown', e => {
    if (!current || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable], .scroll-x, .b-code')) return
    const link = e.key === 'ArrowRight' ? view.querySelector('.sec-nav a.next')
      : e.key === 'ArrowLeft' ? view.querySelector('.sec-nav a.prev') : null
    if (link) {
      e.preventDefault()
      location.hash = link.getAttribute('href')
    }
  })

  // ---------- tema ----------
  const THEMES = ['system', 'light', 'dark']
  const THEME_LABEL = { system: 'Sistema', light: 'Claro', dark: 'Escuro' }
  const hostTheme = document.documentElement.getAttribute('data-theme')
  let theme = readJSON(THEME_KEY, 'system')
  if (!THEMES.includes(theme)) theme = 'system'

  function applyTheme(t) {
    const attr = t === 'system' ? hostTheme : t
    if (attr) document.documentElement.setAttribute('data-theme', attr)
    else document.documentElement.removeAttribute('data-theme')
    document.getElementById('theme-label').textContent = THEME_LABEL[t]
    document.getElementById('theme-btn').setAttribute('aria-label', `Tema: ${THEME_LABEL[t]}. Clique pra trocar`)
  }

  document.getElementById('theme-btn').addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]
    writeJSON(THEME_KEY, theme)
    applyTheme(theme)
  })
  applyTheme(theme)

  // ---------- rotas ----------
  function route() {
    const hash = decodeURIComponent(location.hash.replace(/^#/, ''))
    const modMatch = /^m-([a-z]+)$/.exec(hash)
    const found = findByKey(hash)
    let nav = 'inicio'
    current = null

    if (!hash || hash === 'inicio') renderHome()
    else if (hash === 'glossario') { nav = 'glossario'; renderGlossary() }
    else if (modMatch && modById(modMatch[1])) renderModule(modById(modMatch[1]))
    else if (found) { current = found; renderSection(found.mod, found.sec) }
    else renderNotFound()

    document.querySelectorAll('[data-nav]').forEach(a => {
      if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page')
      else a.removeAttribute('aria-current')
    })
    window.scrollTo(0, 0)
    view.focus({ preventScroll: true })
  }

  window.addEventListener('hashchange', route)
  route()
})()

</script>

</body>
</html>
