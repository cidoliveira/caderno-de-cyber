<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Caderno de Cyber</title>
<meta name="description" content="Os módulos do HTB Academy explicados em português, uma seção por vez, com diagramas e teste rápido.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: caderno quadriculado. Sumário na margem esquerda, página de estudo numa coluna de ~68ch,
   caneta azul pro que é clicável/estrutura, marca-texto amarelo pro que é essencial. */
:root {
  --paper: #F4F6FB;
  --sheet: #FFFFFF;
  --grid: rgba(31, 79, 209, 0.055);
  --ink: #16213A;
  --ink-2: #46526D;
  --ink-3: #6B7792;
  --line: #DAE1EE;
  --pen: #1F4FD1;
  --pen-ink: #FFFFFF;
  --pen-soft: rgba(31, 79, 209, 0.08);
  --pen-mid: rgba(31, 79, 209, 0.18);
  --marker: rgba(255, 219, 40, 0.55);
  --marker-soft: rgba(255, 219, 40, 0.16);
  --ok: #157A4B;
  --ok-soft: rgba(21, 122, 75, 0.1);
  --bad: #BF3A31;
  --bad-soft: rgba(191, 58, 49, 0.08);
  --term: #101A33;
  --term-ink: #E1E8FF;
  --term-dim: #8E9CC2;
  --term-accent: #9DB6FF;
  --shadow: 0 1px 2px rgba(22, 33, 58, 0.05), 0 6px 20px rgba(22, 33, 58, 0.06);

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;

  --t-xs: 0.8125rem;
  --t-sm: 0.9375rem;
  --t-base: 1.0625rem;
  --t-lg: 1.25rem;
  --t-xl: 1.6rem;
  --t-2xl: clamp(1.85rem, 1.2rem + 2.6vw, 2.6rem);
  --t-3xl: clamp(2.3rem, 1.4rem + 4.4vw, 3.8rem);

  --gutter: 16px;
  --radius: 10px;
  --grid-size: 24px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1322;
    --sheet: #131B2E;
    --grid: rgba(138, 170, 255, 0.045);
    --ink: #E6EBF6;
    --ink-2: #AAB4CC;
    --ink-3: #8390AD;
    --line: #26314C;
    --pen: #8DACFF;
    --pen-ink: #0D1322;
    --pen-soft: rgba(141, 172, 255, 0.1);
    --pen-mid: rgba(141, 172, 255, 0.22);
    --marker: rgba(255, 214, 51, 0.3);
    --marker-soft: rgba(255, 214, 51, 0.09);
    --ok: #52C892;
    --ok-soft: rgba(82, 200, 146, 0.12);
    --bad: #F07C72;
    --bad-soft: rgba(240, 124, 114, 0.12);
    --term: #0A1020;
    --term-ink: #E1E8FF;
    --term-dim: #7F8DB3;
    --term-accent: #9DB6FF;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --paper: #0D1322;
  --sheet: #131B2E;
  --grid: rgba(138, 170, 255, 0.045);
  --ink: #E6EBF6;
  --ink-2: #AAB4CC;
  --ink-3: #8390AD;
  --line: #26314C;
  --pen: #8DACFF;
  --pen-ink: #0D1322;
  --pen-soft: rgba(141, 172, 255, 0.1);
  --pen-mid: rgba(141, 172, 255, 0.22);
  --marker: rgba(255, 214, 51, 0.3);
  --marker-soft: rgba(255, 214, 51, 0.09);
  --ok: #52C892;
  --ok-soft: rgba(82, 200, 146, 0.12);
  --bad: #F07C72;
  --bad-soft: rgba(240, 124, 114, 0.12);
  --term: #0A1020;
  --term-ink: #E1E8FF;
  --term-dim: #7F8DB3;
  --term-accent: #9DB6FF;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

@media (min-width: 640px) {
  :root { --gutter: 24px; }
}

/* ---------- base ---------- */
* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--grid-size) var(--grid-size);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--t-base);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  font-family: var(--f-display);
  line-height: 1.15;
  text-wrap: balance;
  margin: 0;
  color: var(--ink);
}

p { margin: 0; }
a { color: var(--pen); text-underline-offset: 3px; }
code {
  font-family: var(--f-mono);
  font-size: 0.88em;
  background: var(--pen-soft);
  color: var(--ink);
  padding: 0.08em 0.36em;
  border-radius: 4px;
  overflow-wrap: anywhere;
}
strong { font-weight: 700; }

:focus-visible {
  outline: 2px solid var(--pen);
  outline-offset: 3px;
  border-radius: 4px;
}

.sr {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

.view {
  flex: 1;
  width: 100%;
  max-width: 1180px;
  margin-inline: auto;
  padding-inline: var(--gutter);
  padding-block: 28px 56px;
  outline: none;
}

.eyebrow {
  font-family: var(--f-mono);
  font-size: var(--t-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.hand {
  font-family: var(--f-hand);
  font-weight: 600;
  font-size: 1.35rem;
  line-height: 1;
  color: var(--pen);
}

/* ---------- topbar ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}

.topbar-inner {
  max-width: 1180px;
  margin-inline: auto;
  padding-inline: var(--gutter);
  padding-block: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--ink);
  text-decoration: none;
  white-space: nowrap;
}

.brand-mark { width: 26px; height: 26px; color: var(--ink); flex: none; }

.topnav {
  display: flex;
  align-items: center;
  gap: 4px;
}

.topnav a,
.theme-btn {
  font: inherit;
  font-size: var(--t-sm);
  color: var(--ink-2);
  text-decoration: none;
  padding: 6px 10px;
  border-radius: 8px;
  border: 0;
  background: none;
  cursor: pointer;
}

.topnav a:hover,
.theme-btn:hover { background: var(--pen-soft); color: var(--ink); }
.topnav a[aria-current="page"] { color: var(--pen); font-weight: 700; }

.theme-btn { display: inline-flex; align-items: center; gap: 6px; }
.theme-btn svg { width: 16px; height: 16px; }

@media (max-width: 520px) {
  .brand span { font-size: 1rem; }
  #theme-label { display: none; }
  .topnav a, .theme-btn { padding: 6px 8px; }
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: inherit;
  font-weight: 700;
  font-size: var(--t-sm);
  padding: 10px 16px;
  border-radius: 999px;
  border: 1.5px solid var(--pen);
  background: var(--pen);
  color: var(--pen-ink);
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.12s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--pen); }
.btn.ghost:hover { background: var(--pen-soft); }
.btn svg { width: 16px; height: 16px; flex: none; }

/* ---------- home ---------- */
.hero {
  display: grid;
  gap: 14px;
  max-width: 46rem;
  padding-block: 20px 8px;
}

.hero h1 {
  font-size: var(--t-3xl);
  font-weight: 800;
  letter-spacing: -0.02em;
}

.hero .lede {
  font-size: var(--t-lg);
  color: var(--ink-2);
  max-width: 38rem;
}

.resume {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  margin-top: 6px;
}
.resume small { color: var(--ink-3); font-size: var(--t-sm); }

.howto {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px 28px;
  margin-block: 30px 34px;
  padding-block: 18px;
  border-block: 1px dashed var(--line);
}

.howto li {
  list-style: none;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  align-items: baseline;
  color: var(--ink-2);
  font-size: var(--t-sm);
}
.howto ol { margin: 0; padding: 0; display: contents; }
.howto .hand { font-size: 1.6rem; }

.mod-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr));
  gap: 18px;
}

.mod-card {
  position: relative;
  display: grid;
  gap: 12px;
  align-content: start;
  padding: 22px;
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  min-width: 0;
}

.mod-card h2 { font-size: var(--t-xl); font-weight: 800; }
.mod-card h2 a { color: inherit; text-decoration: none; }
.mod-card h2 a::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); }
.mod-card:hover { border-color: var(--pen-mid); }
.mod-card .en { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-3); }
.mod-card .blurb { color: var(--ink-2); font-size: var(--t-sm); }
.mod-card .mod-actions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; }

.progress {
  display: grid;
  gap: 6px;
}
.progress-bar {
  height: 8px;
  border-radius: 999px;
  background: var(--pen-soft);
  overflow: hidden;
}
.progress-bar span {
  display: block;
  height: 100%;
  width: var(--p, 0%);
  background: var(--pen);
  border-radius: inherit;
}
.progress small {
  font-size: var(--t-xs);
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

.gloss-link {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 26px;
  padding: 18px 22px;
  border: 1.5px dashed var(--pen-mid);
  border-radius: var(--radius);
  color: var(--ink-2);
  text-decoration: none;
}
.gloss-link strong { color: var(--ink); font-family: var(--f-display); font-size: var(--t-lg); }
.gloss-link:hover { background: var(--pen-soft); }
.gloss-link svg { width: 22px; height: 22px; color: var(--pen); flex: none; }
.mod-head .progress { max-width: 28rem; }
.resume .btn svg,
.mod-actions .btn svg,
.actions .btn svg { width: 16px; height: 16px; }

/* ---------- module overview ---------- */
.mod-head {
  display: grid;
  gap: 12px;
  max-width: 46rem;
  padding-block: 12px 26px;
}
.mod-head h1 { font-size: var(--t-2xl); font-weight: 800; letter-spacing: -0.015em; }
.mod-head .en { font-family: var(--f-mono); font-size: var(--t-sm); color: var(--ink-3); }
.mod-head .blurb { color: var(--ink-2); font-size: var(--t-lg); }
.mod-head .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }

.sec-list {
  list-style: none;
  margin: 0;
  padding: 0;
  max-width: 52rem;
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.sec-list li + li { border-top: 1px solid var(--line); }

.sec-list a {
  display: grid;
  grid-template-columns: 2.4rem 1fr auto;
  gap: 4px 12px;
  align-items: center;
  padding: 14px 18px;
  color: var(--ink);
  text-decoration: none;
}
.sec-list a:hover { background: var(--pen-soft); }
.sec-list .num {
  font-family: var(--f-mono);
  font-size: var(--t-sm);
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.sec-list .names { display: grid; min-width: 0; }
.sec-list .pt { font-weight: 700; }
.sec-list .htb { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-3); overflow-wrap: anywhere; }
.sec-list .meta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: var(--t-xs);
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

.check {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  display: inline-grid;
  place-items: center;
  flex: none;
}
.check svg { width: 12px; height: 12px; opacity: 0; }
.is-done .check { background: var(--ok); border-color: var(--ok); }
.is-done .check svg { opacity: 1; color: var(--sheet); }

/* ---------- section ---------- */
.study {
  display: grid;
  gap: 32px;
  grid-template-columns: minmax(0, 1fr);
}

@media (min-width: 1000px) {
  .study { grid-template-columns: 250px minmax(0, 1fr); }
}

.toc {
  display: none;
}

@media (min-width: 1000px) {
  .toc {
    display: block;
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 72px);
    align-self: start;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    padding-right: 6px;
  }
}

.toc .toc-mod {
  display: block;
  font-family: var(--f-display);
  font-weight: 800;
  font-size: var(--t-sm);
  color: var(--ink);
  text-decoration: none;
  margin-bottom: 10px;
}
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.toc a {
  display: grid;
  grid-template-columns: 1.7rem 1fr auto;
  gap: 6px;
  align-items: center;
  padding: 6px 8px;
  border-radius: 6px;
  color: var(--ink-2);
  font-size: var(--t-xs);
  line-height: 1.35;
  text-decoration: none;
}
.toc a:hover { background: var(--pen-soft); color: var(--ink); }
.toc a[aria-current="page"] { background: var(--pen-soft); color: var(--pen); font-weight: 700; }
.toc .num { font-family: var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.toc .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--line); }
.toc .is-done .dot { background: var(--ok); border-color: var(--ok); }

.sheet {
  min-width: 0;
  max-width: 46rem;
  display: grid;
  gap: 22px;
}

.crumbs {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 6px 16px;
  font-size: var(--t-sm);
  color: var(--ink-3);
}
.crumbs a { text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs span { font-variant-numeric: tabular-nums; }

.sec-head { display: grid; gap: 10px; }

.htb-title {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-family: var(--f-mono);
  font-size: var(--t-sm);
  color: var(--ink-2);
}
.htb-title .n {
  display: inline-grid;
  place-items: center;
  min-width: 2rem;
  height: 2rem;
  padding-inline: 6px;
  border-radius: 6px;
  background: var(--pen);
  color: var(--pen-ink);
  font-weight: 600;
}
.htb-title .lbl { color: var(--ink-3); }

.sec-head h1 {
  font-size: var(--t-2xl);
  font-weight: 800;
  letter-spacing: -0.015em;
}

.gist {
  font-size: clamp(1.2rem, 1.05rem + 0.7vw, 1.45rem);
  line-height: 1.5;
  font-weight: 700;
  color: var(--ink);
}

.gist mark {
  color: inherit;
  background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%);
  background-repeat: no-repeat;
  background-size: 100% 100%;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  padding-inline: 2px;
  animation: marker-sweep 0.9s 0.15s ease-out both;
}

@keyframes marker-sweep {
  from { background-size: 0% 100%; }
  to { background-size: 100% 100%; }
}

.blocks { display: grid; gap: 18px; }

/* text-ish blocks */
.b-text { max-width: 65ch; }

.b-group { display: grid; gap: 8px; }
.b-label {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: var(--t-base);
}

.b-points {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 8px;
  max-width: 65ch;
}
.b-points li {
  position: relative;
  padding-left: 1.4rem;
}
.b-points li::before {
  content: "";
  position: absolute;
  left: 0.2rem;
  top: 0.62em;
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: var(--pen);
  transform: rotate(45deg);
}

.b-analogy,
.b-note {
  display: grid;
  gap: 4px;
  padding: 14px 18px;
  border-radius: var(--radius);
  max-width: 65ch;
}
.b-analogy { background: var(--marker-soft); border: 1px dashed color-mix(in srgb, var(--marker) 100%, var(--ink-3) 30%); }
.b-analogy p { font-style: italic; }
.b-note.tip { background: var(--ok-soft); }
.b-note.tip .hand { color: var(--ok); }
.b-note.warn { background: var(--bad-soft); }
.b-note.warn .hand { color: var(--bad); }

/* figures */
.b-fig {
  margin: 0;
  display: grid;
  gap: 10px;
  min-width: 0;
}
.b-fig figcaption {
  font-family: var(--f-display);
  font-weight: 800;
  font-size: var(--t-base);
}

/* steps */
.b-steps {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0;
}
.b-steps li {
  position: relative;
  display: grid;
  grid-template-columns: 2.1rem 1fr;
  gap: 12px;
  padding-bottom: 16px;
}
.b-steps li:not(:last-child)::after {
  content: "";
  position: absolute;
  left: calc(1.05rem - 1px);
  top: 2.2rem;
  bottom: 2px;
  width: 2px;
  background: var(--pen-mid);
}
.step-n {
  display: grid;
  place-items: center;
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 50%;
  background: var(--sheet);
  border: 2px solid var(--pen);
  color: var(--pen);
  font-family: var(--f-mono);
  font-weight: 600;
  font-size: var(--t-sm);
}
.b-steps strong { display: block; padding-top: 0.25rem; }
.b-steps p { color: var(--ink-2); }

/* layers */
.b-layers {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 4px;
}
.b-layers li {
  display: grid;
  grid-template-columns: minmax(7.5rem, 30%) 1fr auto;
  gap: 4px 14px;
  align-items: center;
  padding: 11px 14px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--pen) calc(6% + var(--depth, 0) * 16%), var(--sheet));
  border: 1px solid var(--pen-mid);
}
.layer-label { font-family: var(--f-display); font-weight: 800; font-size: var(--t-sm); }
.layer-text { color: var(--ink-2); font-size: var(--t-sm); min-width: 0; }
.layer-tag {
  font-family: var(--f-mono);
  font-size: var(--t-xs);
  color: var(--pen);
  background: var(--sheet);
  border: 1px solid var(--pen-mid);
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
}
@media (max-width: 560px) {
  .b-layers li { grid-template-columns: 1fr auto; }
  .layer-text { grid-column: 1 / -1; }
}

/* compare */
.b-compare {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
  gap: 10px;
}
.cmp-col {
  min-width: 0;
  padding: 14px 16px;

ncidentes, treinamento e compliance (seguir leis e normas). É o que costura tudo.","tag":"por cima"},{"label":"Domínios","text":"cada área cuida de um pedaço: rede, aplicações, processos, nuvem, prédio, celulares, IoT."},{"label":"Terreno","text":"clients, servers, rede e nuvem: onde os dados ficam ou por onde passam."},{"label":"Dados","text":"o que realmente precisa ser protegido.","tag":"o alvo"}]},{"type":"tip","text":"Nenhuma peça sozinha resolve. A segurança vem do **conjunto**: áreas, processos e pessoas trabalhando juntos."}],"deep":[{"type":"text","text":"**Compliance** é estar de acordo com leis e normas. No Brasil, a mais famosa é a **LGPD** (Lei Geral de Proteção de Dados). No mundo corporativo, a **ISO 27001** é a norma de referência pra gestão de segurança da informação."},{"type":"text","text":"Você vai ler muito a palavra **asset** nos textos do HTB: é qualquer coisa de valor pra organização, seja um dado, um sistema ou um equipamento."}],"terms":[{"en":"asset","pt":"qualquer coisa de valor pra organização (dado, sistema, equipamento)"},{"en":"client","pt":"dispositivo de quem usa um serviço"},{"en":"server","pt":"máquina que oferece um serviço"},{"en":"policy","pt":"regra formal da empresa"},{"en":"compliance","pt":"estar de acordo com leis e normas"}],"practice":"Seja num pentest ou num alerta do SOC (o time que monitora a segurança), a primeira pergunta é sempre \"o que existe aqui e o que vale proteger?\". Saber em qual área o problema cai mostra quem é o responsável e onde procurar.","quiz":[{"q":"Se o objetivo final é proteger dados, por que gastar tanto esforço com servidores, rede e nuvem?","options":["Porque os dados já vêm protegidos de fábrica","Porque equipamento caro vale mais que os dados","Porque é ali que os dados ficam ou por onde eles passam","Porque a lei proíbe proteger os dados diretamente"],"answer":2,"explain":"Servidores, rede e nuvem são onde a informação mora ou circula. Proteger o caminho e o armazenamento é o jeito de proteger o dado."},{"q":"Uma lâmpada inteligente ligada ao Wi-Fi do escritório ainda usa a senha de fábrica. Esse problema cai em qual domínio?","options":["IoT Security","Mobile Security","Cloud Security","Disaster Recovery"],"answer":0,"explain":"Lâmpada inteligente é um dispositivo \"inteligente\" conectado, o território da IoT Security."}]},{"n":2,"title":"Principles of Information Security","titlePt":"CIA triad: os três pilares","minutes":6,"gist":"Todo controle de segurança existe pra proteger pelo menos um de três pilares: confidencialidade, integridade e disponibilidade, a famosa CIA triad.","blocks":[{"type":"text","text":"Nada a ver com a agência americana: aqui **CIA** é a sigla de **Confidentiality**, **Integrity** e **Availability**."},{"type":"table","title":"A CIA triad","headers":["Pilar","Pergunta que responde","Ataque típico","Proteção típica"],"rows":[["Confidentiality","Só quem deve consegue ver?","vazamento de banco de dados","criptografia, controle de acesso"],["Integrity","O dado tá certo, sem alteração indevida?","golpe do boleto adulterado","hash (uma \"impressão digital\" do dado), assinatura digital"],["Availability","Funciona quando alguém precisa?","DDoS (enxurrada de acessos) derrubando um site","redundância, backup"]]},{"type":"compare","title":"Duas coisas que todo mundo confunde","columns":[{"label":"Authentication","items":["Prova **quem você é**","Ex.: senha, biometria, token","Vem primeiro"]},{"label":"Authorization","items":["Decide **o que você pode fazer**","Ex.: usuário comum ou admin","Vem depois de autenticar"]}]},{"type":"analogy","text":"Na balada, mostrar o RG na porta é **authentication**. A pulseira que diz se você pode subir pro camarote é **authorization**. Uma não substitui a outra."},{"type":"points","title":"Outros conceitos que andam junto","items":["**Non-repudiation:** garantir que alguém não consiga negar que fez algo (ex.: contrato com assinatura digital).","**Least privilege:** cada pessoa ou sistema recebe só o acesso mínimo necessário pro trabalho.","**Defense in depth:** várias camadas de proteção, pra uma falha isolada não derrubar tudo."]},{"type":"text","text":"**Risco** junta três ideias: a **threat** (quem ou o que pode causar dano), a **vulnerability** (a fraqueza que permite o dano) e o **impacto** (o tamanho do estrago)."},{"type":"warn","text":"Segurança 100% não existe, e segurança exagerada atrapalha o negócio. Um servidor desligado e trancado num cofre é super confidencial, mas tem disponibilidade zero. O trabalho é achar o equilíbrio."}],"deep":[{"type":"text","text":"Sem uma vulnerabilidade explorável, ou sem impacto real, o risco cai bastante. Por isso, corrigir a falha ou diminuir o estrago possível já reduz o risco."},{"type":"steps","title":"Gestão de risco é um ciclo","items":[{"label":"Identificar","text":"os assets e o que ameaça cada um."},{"label":"Analisar","text":"a probabilidade e o impacto de cada risco."},{"label":"Tratar","text":"escolher o que fazer com cada risco (veja a tabela abaixo)."},{"label":"Monitorar","text":"e revisar sempre, porque o cenário muda."}]},{"type":"table","title":"As 4 formas de tratar um risco","headers":["Opção","O que significa"],"rows":[["Mitigar","colocar um controle que reduz o risco"],["Transferir","passar o prejuízo pra outro (ex.: seguro)"],["Evitar","parar a atividade arriscada"],["Aceitar","conviver com o risco, quando corrigir custa mais do que ele"]]}],"terms":[{"en":"CIA triad","pt":"confidencialidade, integridade e disponibilidade"},{"en":"threat","pt":"ameaça: quem ou o que pode causar dano"},{"en":"vulnerability","pt":"fraqueza que dá pra explorar"},{"en":"risk","pt":"chance de algo dar errado combinada com o impacto"},{"en":"least privilege","pt":"acesso mínimo necessário"},{"en":"defense in depth","pt":"proteção em várias camadas"}],"practice":"Quando você reporta uma vulnerabilidade, descreve o impacto em termos de CIA (\"permite ler dados de outros usuários\" afeta confidencialidade). O CVSS, sistema que pontua vulnerabilidades, mede o impacto em cada um dos três pilares separadamente.","quiz":[{"q":"Um atacante copia os arquivos de um hospital, depois criptografa tudo e ameaça publicar o que copiou. Quais pilares foram atingidos principalmente?","options":["Só integridade","Disponibilidade e confidencialidade","Só disponibilidade","Nenhum, porque nada foi apagado"],"answer":1,"explain":"Os arquivos ficaram inacessíveis (disponibilidade) e os dados copiados podem vazar (confidencialidade). Dá pra argumentar integridade também, já que os arquivos foram alterados sem autorização."},{"q":"Você fez login no sistema da empresa, mas não consegue abrir a área de admin. Qual conceito barrou você?","options":["Authentication","Non-repudiation","Availability","Authorization"],"answer":3,"explain":"Você já provou quem é (authentication). Quem decide o que você pode fazer depois disso é a authorization."}]},{"n":3,"title":"Network Security","titlePt":"As peças da segurança de rede","minutes":5,"gist":"Network security é proteger a infraestrutura de rede e os dados que trafegam nela contra acesso indevido, abuso e interrupção.","blocks":[{"type":"text","text":"A rede é a estrada por onde tudo passa. Se o atacante entra nela, pode tentar alcançar qualquer máquina conectada."},{"type":"table","title":"As peças principais","headers":["Peça","O que faz"],"rows":[["Firewall","filtra o tráfego com base em regras: de onde vem, pra onde vai, qual port (o número do serviço, tipo 443 pro HTTPS) e qual protocolo"],["VPN (Virtual Private Network)","túnel criptografado entre dois pontos, tipo do seu notebook em casa até a rede da empresa"],["Segmentação","divide a rede em partes isoladas (com VLANs, que são redes virtuais separadas, e regras de firewall), pra uma máquina invadida não enxergar todo o resto"],["DMZ","zona separada pros servidores expostos à internet (site, e-mail), longe da rede interna"],["NAC (Network Access Control)","verifica se o dispositivo pode se conectar antes de liberar o acesso"]]},{"type":"compare","title":"IDS ou IPS? Os vigias da rede","columns":[{"label":"IDS (Intrusion Detection System)","items":["Observa o tráfego","Gera **alerta** quando vê algo suspeito","Só avisa: alguém precisa agir"]},{"label":"IPS (Intrusion Prevention System)","items":["Observa o tráfego","Gera alerta **e bloqueia**","Age sozinho, na hora"]}]},{"type":"tip","text":"Firewall bem configurado segue uma lógica simples: **bloqueia tudo que não foi explicitamente liberado**."},{"type":"analogy","text":"Segmentação é como um prédio comercial em que o cartão do 3º andar não abre o 10º. Se alguém rouba o cartão de um funcionário, o estrago fica limitado àquele andar."},{"type":"text","text":"IP, port e protocolo você vai ver com calma em Network Foundations e Introduction to Networking. Por enquanto, basta entender o papel de cada peça."}],"deep":[{"type":"text","text":"**Port** é o número que identifica um serviço numa máquina. Exemplo: o 443 é o port padrão do HTTPS. Cada port aberto é um serviço respondendo, e potencialmente uma porta de entrada."},{"type":"text","text":"A **DMZ** existe porque site e e-mail precisam ser acessíveis da internet. Se um desses servidores for invadido, o atacante ainda não está dentro da rede interna."},{"type":"text","text":"**Lateral movement** é quando o atacante pula de uma máquina comprometida pra outras da mesma rede. Uma rede sem segmentação deixa esse pulo fácil demais."}],"terms":[{"en":"firewall","pt":"filtro de tráfego baseado em regras"},{"en":"port","pt":"número que identifica um serviço numa máquina (ex.: 443 pra HTTPS)"},{"en":"IDS/IPS","pt":"sistemas que detectam / detectam e bloqueiam intrusões"},{"en":"VPN","pt":"túnel criptografado entre dois pontos"},{"en":"segmentation","pt":"divisão da rede em zonas isoladas"},{"en":"lateral movement","pt":"pular de uma máquina comprometida pra outras da rede"}],"practice":"Num pentest, um dos primeiros passos é descobrir quais ports e serviços estão expostos: cada serviço aberto sem necessidade é mais uma porta de entrada. Lá dentro, a falta de segmentação é o que permite o lateral movement.","quiz":[{"q":"Qual a diferença essencial entre um IDS e um IPS?","options":["O IDS detecta e alerta; o IPS detecta e também bloqueia","O IDS bloqueia; o IPS só gera alerta","O IDS só funciona na nuvem; o IPS, na rede local","Os dois são nomes diferentes pra uma VPN"],"answer":0,"explain":"O IDS só avisa que viu algo suspeito. O IPS faz o mesmo e ainda bloqueia o tráfego na hora."},{"q":"O site da empresa precisa ser acessado por qualquer pessoa na internet. Onde faz mais sentido colocar esse servidor?","options":["Na rede interna, junto dos notebooks","Dentro do túnel da VPN","Na DMZ","Na mesma VLAN do banco de dados interno"],"answer":2,"explain":"A DMZ é a zona separada pros servidores expostos. Se ele for invadido, o atacante não cai direto na rede interna."}]},{"n":4,"title":"Application Security","titlePt":"AppSec: blindando sites e apps","minutes":6,"gist":"AppSec é garantir que o software (sites, apps, APIs) seja construído e mantido de um jeito que não dê pra abusar dele.","blocks":[{"type":"text","text":"Se a aplicação tem uma falha, o atacante **passa direto pelo firewall**: ele usa o mesmo caminho do usuário legítimo, tipo o port 443 do site, que precisa estar aberto."},{"type":"points","title":"Problemas clássicos","items":["**Injection** (ex.: SQL injection): a aplicação mistura o que o usuário digitou com um comando, e o usuário consegue mudar o comando.","**XSS** (Cross-Site Scripting): o site entrega um script do atacante, que roda no navegador de outro usuário.","**Broken access control:** usuário comum acessa função de admin, ou dados de outra pessoa trocando um ID na URL.","**Autenticação fraca:** login sem limite de tentativas, sessões que nunca expiram.","**Componentes desatualizados:** bibliotecas com vulnerabilidades já conhecidas."]},{"type":"code","title":"Como uma SQL injection funciona","lang":"sql","code":"-- O código cola a entrada do usuário direto na consulta:\nSELECT * FROM users WHERE username = '\u003centrada>';\n\n-- Se a entrada for:  ' OR '1'='1\n-- a consulta vira:\nSELECT * FROM users WHERE username = '' OR '1'='1';\n\n-- '1'='1' é sempre verdadeiro,\n-- então a consulta devolve TODOS os usuários"},{"type":"points","title":"Como se defende","items":["Validar toda entrada: nunca confiar no que vem do usuário.","Usar **consultas parametrizadas** (prepared statements) em vez de concatenar texto.","Pensar em segurança desde o design (secure SDLC), não só no fim do projeto.","Testar com **SAST** (lê o código-fonte) e **DAST** (testa a aplicação rodando)."]},{"type":"tip","text":"A referência mais famosa da área é o **OWASP Top 10**: uma lista das categorias de risco mais comuns em aplicações web."},{"type":"warn","text":"Um **WAF** (Web Application Firewall) filtra requests maliciosas na frente da aplicação. É uma camada extra, **não substitui** código seguro."}],"deep":[{"type":"text","text":"Hoje quase tudo é aplicação: o app do banco, o iFood, o sistema interno da empresa. Por isso a superfície de ataque web é tão grande."},{"type":"text","text":"Com consulta parametrizada, a entrada do usuário vai **separada** do comando e é sempre tratada como dado. Por isso o truque do `' OR '1'='1` para de funcionar."},{"type":"compare","title":"SAST x DAST","columns":[{"label":"SAST (Static)","items":["Analisa o **código-fonte**","Não precisa da aplicação rodando"]},{"label":"DAST (Dynamic)","items":["Testa a aplicação **rodando**","Testa de fora, sem ver o código, mandando requests como um atacante faria"]}]},{"type":"text","text":"**Secure SDLC** é encaixar segurança em todas as fases do desenvolvimento (design, código, testes, deploy), em vez de deixar pra revisar só no final."}],"terms":[{"en":"input validation","pt":"checar se a entrada é o que se espera"},{"en":"injection","pt":"entrada do usuário virando comando"},{"en":"XSS","pt":"script malicioso rodando no navegador de outro usuário"},{"en":"OWASP Top 10","pt":"lista dos riscos web mais comuns"},{"en":"WAF","pt":"firewall específico pra tráfego web"},{"en":"request","pt":"pedido que o cliente manda pro servidor"}],"practice":"Web é a maior fatia do bug bounty (programas que pagam por falhas encontradas) e aparece em muitas máquinas do HTB. Com frequência o primeiro acesso vem de uma falha na aplicação, não de um serviço de rede.","quiz":[{"q":"Por que um firewall de rede comum não impede SQL injection num site?","options":["Porque o ataque usa um port escondido que o firewall não enxerga","Porque firewall só bloqueia vírus","Porque SQL injection só funciona dentro da rede interna","Porque o ataque chega pelo mesmo port liberado pro tráfego legítimo"],"answer":3,"explain":"O firewall vê uma conexão normal no port do site. O problema está em como a aplicação trata a entrada, e isso ele não enxerga."},{"q":"Qual é a principal defesa contra SQL injection dentro do próprio código?","options":["Colocar um WAF e pronto","Usar consultas parametrizadas (prepared statements)","Trocar o port padrão do site","Esconder a página de login"],"answer":1,"explain":"Consulta parametrizada separa o dado do comando, então a entrada nunca vira SQL. O WAF ajuda, mas é só uma camada extra."}]},{"n":5,"title":"Operational Security","titlePt":"OpSec: segurança no dia a dia","minutes":4,"gist":"OpSec cuida dos processos e decisões do dia a dia sobre como dados e acessos são tratados, pra que a segurança não dependa de sorte.","blocks":[{"type":"text","text":"Não adianta ter o melhor firewall se o estagiário tem acesso de admin, ninguém aplica atualização e a senha do Wi-Fi tá colada na parede. OpSec é o **\"como a gente trabalha\"** da segurança."},{"type":"table","title":"O que entra aqui","headers":["Prática","Na prática, significa"],"rows":[["Controle de acesso + least privilege","quem acessa o quê, com revisão periódica. Quem sai da empresa perde o acesso no mesmo dia."],["Separation of duties","tarefas críticas divididas entre pessoas diferentes"],["Patch management","aplicar atualizações de segurança com regularidade"],["Change management","mudanças em sistemas planejadas, aprovadas e registradas"],["Logging e monitoramento","registrar o que acontece pra detectar e investigar problemas"],["Regras pra dados","onde guardar cada tipo de informação, como compartilhar e como descartar"],["Treinamento","pessoas sabendo reconhecer golpes e seguir os procedimentos"]]},{"type":"analogy","text":"Separation of duties é tipo condomínio: o síndico gasta, mas quem confere as contas é o conselho fiscal. Uma pessoa sozinha não fecha o ciclo inteiro."},{"type":"compare","title":"OPSEC tem dois sentidos","columns":[{"label":"No dia a dia da empresa","items":["Processos sobre dados e acessos","Ex.: patch, revisão de acesso, treinamento"]},{"label":"No sentido militar","items":["Controlar o que **vaza** sobre suas operações","Ex.: não postar foto do crachá","No red team: não se expor nem deixar rastros"]}]}],"deep":[{"type":"text","text":"No sentido militar, a ideia é identificar quais informações, **mesmo parecendo inofensivas**, ajudariam um adversário. Funcionário postando a foto da mesa com a tela aberta é um presente pra quem quer atacar."},{"type":"text","text":"**Access review** é a revisão periódica de quem tem acesso a quê. É ela que pega a conta de ex-funcionário que continuou ativa ou a permissão que ninguém lembra por que foi dada."}],"terms":[{"en":"least privilege","pt":"acesso mínimo necessário"},{"en":"separation of duties","pt":"dividir tarefas críticas entre pessoas"},{"en":"patch","pt":"atualização que corrige uma falha"},{"en":"change management","pt":"controle formal de mudanças"},{"en":"access review","pt":"revisão periódica de quem tem acesso a quê"},{"en":"OPSEC","pt":"controle do que vaza sobre suas operações"}],"practice":"Muita invasão real não usa nada sofisticado: aproveita uma conta de ex-funcionário ainda ativa ou um servidor sem patch há anos. Num relatório de pentest, falhas de processo pesam tanto quanto as técnicas.","quiz":[{"q":"O mesmo analista consegue cadastrar um fornecedor no sistema e aprovar pagamentos pra ele. Qual princípio está faltando?","options":["Patch management","Separation of duties","Change management","Defense in depth"],"answer":1,"explain":"Uma pessoa sozinha completa um processo crítico inteiro, o que abre espaço pra fraude sem ninguém perceber."}]},{"n":6,"title":"Disaster Recovery and Business Continuity","titlePt":"BC e DR: sobreviver ao desastre","minutes":6,"gist":"Business continuity é manter a empresa funcionando durante uma crise; disaster recovery é trazer a TI de volta depois dela.","blocks":[{"type":"text","text":"Ransomware, incêndio no datacenter, enchente, queda de energia, alguém apagando um banco sem querer. A pergunta não é **\"se\"**, é **\"quando\"**, e quem tem plano sofre bem menos."},{"type":"compare","title":"As duas metades do plano","columns":[{"label":"Business Continuity (BC)","items":["Foco: o **negócio** continuar operando","\"Como a gente continua atendendo agora?\"","Ex.: atender clientes por telefone enquanto o sistema está fora","É o plano maior: o DR costuma ser uma parte dele"]},{"label":"Disaster Recovery (DR)","items":["Foco: **sistemas e dados** de TI voltarem","\"Como a gente restaura tudo?\"","Ex.: restaurar os servidores a partir do backup"]}]},{"type":"analogy","text":"Pensa numa padaria com o forno quebrado. BC é continuar vendendo com pão de um fornecedor reserva. DR é consertar o forno e voltar a produzir."},{"type":"facts","title":"Os números que guiam o plano","items":[{"value":"RTO","label":"tempo máximo que o sistema pode ficar parado (ex.: e-commerce de volta em até 4 horas)"},{"value":"RPO","label":"quanto dado a empresa aceita perder, medido em tempo"},{"value":"3-2-1","label":"regra de backup: 3 cópias, 2 tipos de mídia, 1 fora do local"}]},{"type":"text","text":"RPO de 1 hora exige backup **pelo menos de hora em hora**. Se o último backup é de ontem, tudo que foi feito hoje está em risco."},{"type":"warn","text":"Plano nunca testado é só um documento. **Backup que nunca foi restaurado não garante nada.**"}],"deep":[{"type":"text","text":"Hoje, além da regra 3-2-1, se recomenda ter **pelo menos uma cópia offline ou imutável**: uma cópia que um ransomware não consiga apagar nem criptografar."},{"type":"points","title":"Outras peças comuns","items":["**Redundância:** servidores, links de internet e energia duplicados (nobreak, gerador), pra não haver ponto único de falha.","**BIA** (Business Impact Analysis): levanta quais processos são críticos e quanto custa cada hora parada. É daí que saem o RTO e o RPO de cada sistema."]},{"type":"table","title":"Sites alternativos","headers":["Tipo","Como está","Tempo pra assumir"],"rows":[["Hot site","pronto pra operar","quase na hora"],["Warm site","parcialmente pronto","intermediário"],["Cold site","só espaço e infraestrutura básica","demora pra subir"]]}],"terms":[{"en":"backup","pt":"cópia de segurança"},{"en":"RTO","pt":"tempo máximo aceitável parado"},{"en":"RPO","pt":"perda máxima aceitável de dados, medida em tempo"},{"en":"redundancy","pt":"componentes duplicados pra não haver ponto único de falha"},{"en":"BIA","pt":"análise de impacto no negócio"},{"en":"hot site","pt":"local alternativo pronto pra assumir"}],"practice":"No lado defensivo, RTO e RPO ajudam a priorizar o que restaurar primeiro durante um incidente. No lado ofensivo, backup exposto ou mal protegido é achado sério, porque costuma conter uma cópia de tudo.","quiz":[{"q":"Uma empresa faz backup só à meia-noite. Um ransomware ataca às 18h do mesmo dia. Quanto de dado ela pode perder, e qual métrica trata desse tipo de perda?","options":["Nada, porque existe backup","Até 18 horas de dados; quem trata disso é o RTO","Até 18 horas de dados; quem trata disso é o RPO","Até 6 horas de dados; quem trata disso é o RPO"],"answer":2,"explain":"Tudo que foi feito desde a meia-noite se perde, e é contra o RPO (perda de dados aceitável, em tempo) que essa perda se compara; o RTO fala de quanto tempo o sistema pode ficar parado. Com backup uma vez por dia, a perda no pior caso chega a quase 24 horas, então um RPO menor que isso exige backups mais frequentes."},{"q":"Qual destas ações é de **business continuity**, e não de disaster recovery?","options":["Atender os clientes por telefone enquanto o sistema está fora","Restaurar o servidor a partir do backup","Reinstalar o banco de dados que foi apagado","Trocar o disco que queimou no servidor"],"answer":0,"explain":"BC é manter o negócio rodando durante a crise. As outras opções são trazer a TI de volta, que é DR."}]},{"n":7,"title":"Cloud Security","titlePt":"Nuvem: quem cuida do quê","minutes":5,"gist":"Cloud security é proteger dados, apps e identidades na infraestrutura de um provedor, sabendo o que é responsabilidade sua e o que é dele.","blocks":[{"type":"text","text":"Nuvem é, no fundo, o computador de outra empresa alugado sob demanda. O provedor protege muito bem o datacenter dele, mas **não configura a sua conta por você**."},{"type":"table","title":"Shared responsibility model: quem cuida do quê","headers":["Modelo","O provedor cuida de","Você cuida de"],"rows":[["IaaS (ex.: máquina virtual na AWS): infraestrutura crua","hardware, datacenter, rede física, virtualização","sistema operacional, patches, aplicações, dados, acessos"],["PaaS (ex.: Azure App Service, Heroku): plataforma pronta pro seu código","tudo do IaaS + sistema operacional e runtime (o ambiente que roda seu código)","sua aplicação, dados, acessos"],["SaaS (ex.: Gmail, Microsoft 365)","quase tudo","seus dados, usuários e configurações de acesso"]]},{"type":"analogy","text":"IaaS é alugar um apartamento vazio: você mobilia e cuida da fechadura. PaaS é o apartamento mobiliado. SaaS é o quarto de hotel. Nos três, se você deixar a porta aberta ou emprestar a chave, o problema é seu."},{"type":"points","title":"Onde costuma dar ruim (do lado do cliente)","items":["**Misconfiguration:** tipo um bucket de armazenamento (como o Amazon S3) configurado como público, expondo arquivos internos.","**Identidades mal protegidas:** contas sem MFA (segundo fator no login, tipo código no celular), permissões amplas demais, chaves de acesso esquecidas em código publicado no GitHub.","**Falta de visibilidade:** recursos criados e esquecidos, logs desligados."]},{"type":"points","title":"Defesas básicas","items":["IAM (onde se define quem pode fazer o quê) com least privilege, e MFA em todas as contas.","Criptografia dos dados armazenados e em trânsito.","Logs habilitados e revisão contínua das configurações."]}],"deep":[{"type":"text","text":"**Misconfiguration** é uma das causas mais frequentes de incidentes na nuvem. Quase nunca o problema é a AWS ser invadida, e sim algo que o próprio cliente deixou aberto."},{"type":"text","text":"**IAM** (Identity and Access Management) é onde você define quem pode fazer o quê na conta de nuvem. Aplicar least privilege ali é uma das defesas mais importantes."},{"type":"text","text":"Logs como o **AWS CloudTrail** registram as ações feitas na conta. Sem eles ligados, fica difícil investigar depois quem fez o quê."}],"terms":[{"en":"shared responsibility model","pt":"divisão de responsabilidades entre provedor e cliente"},{"en":"IaaS/PaaS/SaaS","pt":"infraestrutura / plataforma / software como serviço"},{"en":"misconfiguration","pt":"configuração errada ou insegura"},{"en":"IAM","pt":"gestão de identidades e permissões"},{"en":"bucket","pt":"\"contêiner\" de armazenamento de arquivos na nuvem"},{"en":"MFA","pt":"autenticação com mais de um fator"}],"practice":"Em testes de ambientes cloud, o alvo quase nunca é \"invadir a AWS\". É achar o bucket público, a chave de acesso vazada ou a permissão exagerada que o próprio cliente configurou.","quiz":[{"q":"Uma empresa usa uma máquina virtual (IaaS) e ela é invadida por causa de um sistema operacional sem atualização. De quem era a responsabilidade de atualizar?","options":["Do provedor de nuvem","Dos dois, meio a meio","Do fabricante do processador","Do cliente que contratou a máquina"],"answer":3,"explain":"Em IaaS, o provedor entrega a infraestrutura crua. Sistema operacional e patches ficam por conta do cliente."}]},{"n":8,"title":"Physical Security","titlePt":"Segurança física: portas, crachás, câmeras","minutes":4,"gist":"Physical security protege prédios, salas, equipamentos e pessoas, porque quem põe a mão no hardware muitas vezes contorna as proteções digitais.","blocks":[{"type":"text","text":"Dá pra ter a rede mais blindada do mundo e perder tudo porque alguém entrou na sala de servidores e levou um disco. Ou plugou um dispositivo num ponto de rede da recepção."},{"type":"layers","title":"As camadas, de fora pra dentro","items":[{"label":"Perímetro","text":"muros, grades, iluminação, cancelas.","tag":"fora"},{"label":"Controle de acesso","text":"crachá, biometria, catraca, recepção, visitante registrado e acompanhado."},{"label":"Monitoramento","text":"câmeras (CCTV), alarmes, vigilantes."},{"label":"Áreas críticas","text":"sala de servidores trancada, com acesso restrito e registrado.","tag":"dentro"}]},{"type":"points","title":"Também faz parte","items":["**Proteção ambiental:** combate a incêndio, climatização, energia estável (nobreak, gerador).","**Descarte seguro:** destruir HDs e papéis sensíveis em vez de jogar no lixo.","**Clean desk e tela bloqueada:** nada de senha em post-it nem computador destravado quando a pessoa sai da mesa."]},{"type":"text","text":"O ataque físico mais clássico é o **tailgating**: entrar colado atrás de alguém autorizado."},{"type":"analogy","text":"Sabe quando o portão da garagem do condomínio abre pro morador e outro carro entra junto? É exatamente isso."},{"type":"warn","text":"Segurar a porta por educação é um dos furos mais comuns. O controle físico também depende do **comportamento das pessoas**."}],"deep":[{"type":"text","text":"Um **mantrap** é um espaço entre duas portas em que só uma abre por vez. Isso dificulta entrar de carona: a segunda porta só abre depois que a primeira fechou."},{"type":"text","text":"Quando a pessoa autorizada **percebe** e deixa entrar (segurando a porta, por exemplo), muita gente chama de **piggybacking**. Na prática, você vai ver os dois termos usados quase como sinônimos."}],"terms":[{"en":"tailgating","pt":"entrar junto com alguém autorizado"},{"en":"badge","pt":"crachá de acesso"},{"en":"CCTV","pt":"sistema de câmeras de vigilância"},{"en":"mantrap","pt":"antecâmara com duas portas intertravadas"},{"en":"UPS","pt":"nobreak"},{"en":"access control","pt":"controle de quem entra onde"}],"practice":"Existe pentest físico de verdade: o contratado tenta entrar no prédio e chegar a áreas sensíveis, sempre com autorização por escrito. No lado defensivo, registros de catraca e crachá ajudam a reconstruir o que aconteceu num incidente.","quiz":[{"q":"Como alguém sem crachá pode entrar numa sala de servidores com fechadura eletrônica, sem quebrar nada?","options":["Forçando a porta até a fechadura ceder","Entrando colado atrás de alguém autorizado","Observando a sala pelas câmeras de segurança","Deixando a própria mesa limpa e a tela bloqueada"],"answer":1,"explain":"Isso é tailgating: alguém autorizado abre a porta e o invasor entra junto. Forçar a porta quebra algo, e as outras opções não fazem ninguém entrar."},{"q":"Qual destas medidas foi pensada especificamente pra dificultar o tailgating?","options":["Mantrap: duas portas que não abrem ao mesmo tempo","Descarte seguro de HDs","Nobreak na sala de servidores","Clean desk"],"answer":0,"explain":"No mantrap, a segunda porta só abre depois que a primeira fechou, então fica bem mais difícil entrar de carona. As outras medidas protegem outras coisas."}]},{"n":9,"title":"Mobile Security","titlePt":"Mobile: o computador no bolso","minutes":5,"gist":"Mobile security protege celulares e tablets, que hoje carregam e-mail, banco, autenticação e dados da empresa no bolso de alguém.","blocks":[{"type":"text","text":"O celular é um computador completo que vive na rua: é perdido, roubado, conecta no Wi-Fi do aeroporto e instala app de qualquer lugar. E muitas vezes é ele que recebe o código de **MFA** (o segundo fator do login)."},{"type":"table","title":"Ameaças comuns","headers":["Ameaça","Como aparece"],"rows":[["Perda ou roubo","quem pega o aparelho desbloqueado tem acesso a tudo"],["Apps maliciosos","instalados por fora da loja oficial (sideloading) ou pedindo permissão sem sentido, tipo app de lanterna querendo ler seus SMS"],["Smishing","phishing (mensagem falsa pra roubar dado ou dinheiro) por SMS ou WhatsApp: \"sua encomenda está retida, pague a taxa neste link\""],["Wi-Fi não confiável","rede aberta ou falsa pode permitir interceptar tráfego não criptografado"],["Sistema desatualizado","aparelho antigo que não recebe mais correções de segurança"],["Root / jailbreak","liberar acesso total ao sistema enfraquece as proteções de fábrica"]]},{"type":"points","title":"Defesas","items":["Bloqueio de tela forte e biometria.","Criptografia do armazenamento (já vem ativada na maioria dos aparelhos modernos).","Apps só da loja oficial, revisando as permissões.","Atualizações em dia.","Nas empresas: **MDM** e uma política de **BYOD**."]},{"type":"text","text":"**MDM** (Mobile Device Management) aplica políticas nos aparelhos, separa dados pessoais dos corporativos e permite apagar o aparelho à distância (**remote wipe**)."},{"type":"warn","text":"Root (Android) ou jailbreak (iOS) parece liberdade, mas com privilégio total um app malicioso consegue furar o isolamento entre apps e ler os dados dos outros."}],"deep":[{"type":"text","text":"**BYOD** (Bring Your Own Device) é quando o funcionário usa o próprio celular no trabalho. A política de BYOD define as regras pra isso, e o MDM costuma ser a ferramenta que aplica essas regras."},{"type":"text","text":"**Sideloading** é instalar app por fora da loja oficial. Esse app não passou pela revisão da loja (imperfeita, mas que filtra muita coisa) e pode ser uma versão adulterada de um app legítimo."}],"terms":[{"en":"MDM","pt":"gerenciamento centralizado de dispositivos móveis"},{"en":"BYOD","pt":"funcionário usando aparelho próprio no trabalho"},{"en":"sideloading","pt":"instalar app por fora da loja oficial"},{"en":"smishing","pt":"phishing por SMS"},{"en":"remote wipe","pt":"apagar o aparelho à distância"},{"en":"root/jailbreak","pt":"remover as restrições do sistema do celular"}],"practice":"Pentest de app mobile é uma especialidade: analisar o app, achar dado guardado sem proteção no aparelho e interceptar a comunicação com a API. E como o celular costuma ser o segundo fator do login, comprometê-lo abre várias outras portas.","quiz":[{"q":"Por que instalar um app de fora da loja oficial é mais arriscado?","options":["Porque apps de fora da loja sempre gastam mais bateria","Porque ele desativa a criptografia do celular automaticamente","Porque ele não passou pela revisão da loja e pode ser uma versão adulterada","Porque só apps da loja conseguem acessar a internet"],"answer":2,"explain":"A revisão da loja não é perfeita, mas filtra muita coisa. Por fora dela, o app pode ser a cópia de um app legítimo com código malicioso embutido."}]},{"n":10,"title":"Internet of Things Security","titlePt":"IoT: os aparelhos esquecidos na rede","minutes":5,"gist":"IoT security cuida dos dispositivos \"inteligentes\" conectados (câmeras, TVs, fechaduras, sensores), que costumam ser baratos, numerosos e mal protegidos.","blocks":[{"type":"text","text":"**IoT** (Internet of Things) é tudo que não é um computador tradicional mas está na rede: câmera Wi-Fi, smart TV, assistente de voz, lâmpada inteligente, impressora, sensor de fábrica."},{"type":"points","title":"Por que dão tanta dor de cabeça","items":["**Credenciais padrão:** saem de fábrica com algo tipo `admin/admin`, e ninguém troca.","**Falta de atualização:** o fabricante para de lançar firmware (o software interno do aparelho), ou ninguém aplica.","**Serviços inseguros ligados:** Telnet (acesso remoto antigo, sem criptografia), painel web sem HTTPS, ports abertos sem necessidade.","**Exposição na internet:** buscadores como o **Shodan** indexam muitos desses aparelhos acessíveis publicamente.","**Quantidade e invisibilidade:** pode haver mais IoT que notebook na empresa, muitos sem ninguém lembrar que existem."]},{"type":"steps","title":"Caso real: a botnet Mirai (2016)","items":[{"label":"Procura","text":"achou câmeras e roteadores acessíveis pela internet."},{"label":"Senha padrão","text":"testou uma lista de credenciais de fábrica."},{"label":"Infecção","text":"centenas de milhares de aparelhos viraram parte da botnet, um exército de aparelhos controlados pelo atacante."},{"label":"Ataque","text":"usou todos juntos em ataques DDoS (enxurrada de tráfego pra derrubar um serviço) que chegaram a tirar grandes sites do ar."}]},{"type":"points","title":"Defesas","items":["Trocar a senha padrão logo na instalação.","Atualizar o firmware e preferir fabricantes que dão suporte.","Desligar o que não usa (acesso remoto, Telnet, UPnP, que abre ports no roteador sozinho).","**Segmentar:** IoT numa rede separada, sem acesso aos computadores principais.","Manter um inventário do que está conectado."]},{"type":"tip","text":"Em casa, colocar os aparelhos IoT na **rede de convidados** do roteador já ajuda a segmentar."}],"deep":[{"type":"text","text":"No ambiente industrial aparece um primo próximo: **OT/ICS** (tecnologia operacional / sistemas de controle industrial), que controla máquinas, energia e água. Ali, uma falha pode ter efeito no mundo físico."},{"type":"text","text":"**Firmware** é o software embutido que controla o dispositivo. Quando o fabricante para de atualizar, as falhas descobertas depois ficam sem correção."},{"type":"text","text":"**Botnet** é uma rede de dispositivos infectados controlados por um atacante. O DDoS, que a Mirai usou, tem uma seção só dele logo adiante."}],"terms":[{"en":"firmware","pt":"software embutido que controla o dispositivo"},{"en":"default credentials","pt":"usuário e senha de fábrica"},{"en":"botnet","pt":"rede de dispositivos infectados controlados por um atacante"},{"en":"Shodan","pt":"buscador de dispositivos expostos na internet"},{"en":"OT/ICS","pt":"tecnologia operacional / sistemas de controle industrial"}],"practice":"Ao encontrar um painel de login de algum dispositivo, testar as credenciais padrão é um dos primeiros passos, e o manual do fabricante costuma listá-las. Em testes internos, impressoras e câmeras viram ponto de entrada ou de apoio com frequência.","quiz":[{"q":"Por que colocar os dispositivos IoT numa rede separada ajuda, mesmo que um deles seja invadido?","options":["Porque rede separada impede o aparelho de ser invadido","Porque o atacante fica preso naquela rede e não chega direto aos computadores importantes","Porque rede separada atualiza o firmware sozinha","Porque o Shodan não consegue ver redes separadas"],"answer":1,"explain":"Segmentação não evita a invasão, mas limita o alcance: quem cai na rede IoT não enxerga direto os servidores e notebooks."},{"q":"Qual foi a principal arma da botnet Mirai pra infectar câmeras e roteadores?","options":["Uma falha desconhecida e sofisticada no Wi-Fi","Phishing mandado pros donos dos aparelhos","Pendrives infectados deixados em lojas","Uma lista de senhas padrão de fábrica"],"answer":3,"explain":"A Mirai não precisou de nada sofisticado: só testou credenciais de fábrica que ninguém tinha trocado."}]},{"n":11,"title":"Distributed Denial of Service","titlePt":"DDoS: derrubar pelo excesso","minutes":5,"gist":"DDoS é inundar um serviço com tráfego vindo de milhares de máquinas ao mesmo tempo, até ele ficar lento ou cair pra quem realmente precisa usar.","blocks":[{"type":"text","text":"Lembra da tríade CIA (Confidencialidade, Integridade, Disponibilidade)? O DDoS não rouba nem altera nada: ele ataca a **disponibilidade**, o A de Availability."},{"type":"analogy","text":"Pensa numa pizzaria com 5 linhas de telefone. Se mil pessoas ligam ao mesmo tempo só pra ficar caladas na linha, o cliente de verdade só ouve \"ocupado\". Ninguém invadiu a pizzaria, mas ela não vende nada naquela noite."},{"type":"compare","title":"DoS x DDoS","columns":[{"label":"DoS (Denial of Service)","items":["O ataque vem de uma origem só","Mais fácil de barrar: dá pra filtrar ou bloquear aquela origem"]},{"label":"DDoS (Distributed DoS)","items":["O ataque vem de milhares de máquinas ao mesmo tempo","Normalmente uma **botnet**: PCs, roteadores e câmeras infectados","Bloquear um IP não resolve nada"]}]},{"type":"table","title":"Os três tipos de DDoS","headers":["Tipo","O que esgota","Exemplos"],"rows":[["Volumétrico","A banda, o \"cano\" de internet da vítima","UDP flood, amplificação via DNS ou NTP"],["De protocolo","Recursos de servidores, firewalls e balanceadores","SYN flood"],["De aplicação (camada 7)","Recursos da aplicação: conexões, CPU, memória","HTTP flood, Slowloris"]]},{"type":"points","title":"Como se defende","items":["CDNs e serviços de mitigação (**scrubbing**) que absorvem e filtram o tráfego antes de chegar no servidor","**Rate limiting**: limitar quantas requisições cada origem pode fazer","Filtragem no provedor e redundância"]},{"type":"tip","text":"Contra um DDoS grande, quem segura a bronca quase sempre é o provedor ou um serviço especializado, não o firewall da empresa."}],"deep":[{"type":"text","text":"A botnet é controlada pelo atacante a partir de um servidor de comando, o **C2** (Command and Control). As máquinas infectadas ficam esperando a ordem de atacar."},{"type":"points","title":"Os exemplos da tabela, em uma linha","items":["**UDP flood:** uma enxurrada de pacotes UDP pra entupir a banda da vítima","**HTTP flood:** um monte de requisições ao site, que parecem de usuários normais","**Slowloris:** abre muitas conexões com o servidor web e manda a requisição bem devagar, pra deixar todas presas"]},{"type":"exchange","title":"Amplificação: a vítima recebe o que não pediu","actors":["Atacante","Servidores DNS públicos","Vítima"],"messages":[{"from":0,"to":1,"label":"Pergunta pequena","note":"com o IP da vítima forjado como remetente (spoofing)"},{"from":1,"to":2,"label":"Resposta bem maior","note":"vai pra quem \"perguntou\": a vítima"},{"from":0,"to":1,"label":"Repete em milhares de servidores","note":"cada um devolve muito mais do que recebeu"},{"from":1,"to":2,"label":"Enxurrada de respostas","note":"o link de internet da vítima se afoga"}]},{"type":"text","text":"Pra entender o SYN flood: toda conexão TCP começa com um aperto de mão em 3 passos, o three-way handshake (SYN, SYN-ACK, ACK). Você vai ver ele com calma nos módulos de redes."},{"type":"exchange","title":"SYN flood: conexões pela metade","actors":["Atacante","Servidor"],"messages":[{"from":0,"to":1,"label":"SYN","note":"quero abrir uma conexão"},{"from":1,"to":0,"label":"SYN-ACK","note":"beleza, reservei um espaço pra você"},{"from":0,"to":1,"label":"SYN (outra conexão)","note":"o ACK final da anterior nunca vem"},{"from":1,"to":0,"label":"SYN-ACK","note":"mais um espaço reservado, esperando"},{"from":0,"to":1,"label":"SYN, SYN, SYN...","note":"até a fila de conexões pela metade lotar e ninguém mais conseguir entrar"}]}],"terms":[{"en":"botnet","pt":"rede de máquinas infectadas controladas pelo atacante"},{"en":"flood","pt":"inundação de pacotes ou requisições"},{"en":"amplification","pt":"usar servidores de terceiros pra multiplicar o tráfego"},{"en":"spoofing","pt":"falsificar o remetente"},{"en":"rate limiting","pt":"limitar quantas requisições cada origem pode fazer"}],"practice":"Em pentest, DoS quase sempre fica fora do escopo: derrubar o sistema do cliente sem querer é o pesadelo de qualquer pentester. Se um teste pode causar indisponibilidade, isso precisa estar combinado por escrito antes.","quiz":[{"q":"Uma empresa sofreu um DDoS de 6 horas. O que dá pra afirmar só com essa informação?","options":["Dados de clientes vazaram, com certeza","A disponibilidade foi atingida, mas isso sozinho não prova vazamento","O atacante alterou registros no banco de dados","Algum funcionário entregou a senha pro atacante"],"answer":1,"explain":"DDoS ataca a disponibilidade, não a confidencialidade. Às vezes ele serve de distração pra outro ataque, mas aí o vazamento viria desse outro ataque."},{"q":"Por que bloquear o IP de origem quase não ajuda contra um DDoS?","options":["Porque firewalls não conseguem bloquear endereços IP","Porque DDoS só funciona com IPv6","Porque o tráfego vem de milhares de máquinas diferentes ao mesmo tempo","Porque o ataque não passa pela rede"],"answer":2,"explain":"No DDoS o tráfego vem de uma botnet inteira. Bloquear um IP tira uma gota do oceano; por isso a defesa costuma ficar no provedor ou num serviço de mitigação."}]},{"n":12,"title":"Ransomware","titlePt":"Ransomware: o sequestro de dados","minutes":5,"gist":"Ransomware é um malware que criptografa os arquivos da vítima e cobra um resgate, geralmente em criptomoeda, pra devolver o acesso.","blocks":[{"type":"text","text":"O nome já entrega: é um sequestro de dados. **Criptografar** aqui é embaralhar os arquivos com uma chave que só o criminoso tem."},{"type":"steps","title":"O roteiro típico contra empresas","items":[{"label":"Acesso inicial","text":"Phishing, RDP (acesso remoto do Windows) exposto na internet com senha fraca, credenciais vazadas ou VPN/firewall sem a atualização de segurança (patch)."},{"label":"Movimentação lateral","text":"Se espalha pela rede e tenta virar administrador."},{"label":"Exfiltração","text":"Copia dados sensíveis pra fora antes de qualquer coisa."},{"label":"Sabotar a recuperação","text":"Apaga ou criptografa os backups e as cópias de sombra do Windows (shadow copies)."},{"label":"Criptografia + nota de resgate","text":"Tudo de uma vez, muitas vezes de madrugada ou em feriado, quando tem menos gente olhando."}]},{"type":"points","title":"Dois conceitos que aparecem em todo lugar","items":["**Dupla extorsão:** \"paga pra eu te dar a chave e paga de novo pra eu não vazar seus dados\". Hoje é o padrão dos grupos grandes","**RaaS (Ransomware-as-a-Service):** desenvolvedores alugam o ransomware pra afiliados, que fazem as invasões e dividem o lucro. Uma franquia do crime"]},{"type":"facts","title":"Regra 3-2-1 de backup","items":[{"value":"3","label":"cópias dos dados"},{"value":"2","label":"tipos de mídia diferentes"},{"value":"1","label":"cópia fora do local"}]},{"type":"tip","text":"Backup que aguenta ransomware é **offline ou imutável** (ninguém consegue alterar nem apagar), **e testado**. Backup que nunca foi restaurado é só esperança."},{"type":"warn","text":"Pagar o resgate não garante nada: a chave pode não funcionar direito, os dados podem vazar mesmo assim e a empresa vira alvo conhecido de quem paga."}],"deep":[{"type":"text","text":"O exemplo clássico é o **WannaCry (2017)**. Ele se espalhava sozinho, como um **worm**, explorando uma falha no SMBv1, o protocolo de compartilhamento de arquivos do Windows (o exploit EternalBlue)."},{"type":"warn","text":"O patch pra essa falha já existia fazia uns dois meses quando o WannaCry estourou. Patch atrasado é porta aberta."},{"type":"points","title":"O resto da defesa","items":["Patches em dia","MFA (segundo fator, tipo um código no celular) em todo acesso remoto e nada de RDP aberto direto pra internet","Segmentação de rede e menor privilégio","EDR, a ferramenta que monitora e reage em cada computador ou servidor","Um plano de resposta a incidentes ensaiado"]}],"terms":[{"en":"ransom note","pt":"nota de resgate"},{"en":"encryption","pt":"criptografia"},{"en":"double extortion","pt":"dupla extorsão"},{"en":"RaaS","pt":"ransomware como serviço"},{"en":"exfiltration","pt":"tirar dados da rede da vítima"},{"en":"worm","pt":"malware que se espalha sozinho"}],"practice":"Quando a criptografia começa, o atacante geralmente já tá dentro há dias ou semanas, então a defesa precisa pegar ele nas etapas anteriores. E movimentação lateral e escalada de privilégio, que você vai aprender como pentester, são exatamente o caminho desses grupos.","quiz":[{"q":"Por que um HD externo de backup que fica sempre conectado ao servidor protege mal contra ransomware?","options":["Porque o ransomware também criptografa o que estiver conectado e acessível","Porque HD externo é lento demais pra restaurar","Porque a regra 3-2-1 proíbe HD externo","Porque backup em HD não pode ser criptografado"],"answer":0,"explain":"Se o ransomware chega no servidor, ele alcança tudo que tá plugado nele. Backup que resiste fica offline, isolado ou é imutável."},{"q":"Um grupo criptografa os arquivos de uma empresa e ameaça publicar os dados que copiou se ela não pagar. Como se chama essa tática?","options":["RaaS","Movimentação lateral","Amplificação","Dupla extorsão"],"answer":3,"explain":"Dupla extorsão: cobra pela chave e cobra de novo pra não vazar o que foi copiado na fase de exfiltração."}]},{"n":13,"title":"Social Engineering","titlePt":"Engenharia social: hackeando pessoas","minutes":5,"gist":"Engenharia social é hackear a pessoa em vez do computador: manipular alguém pra entregar uma senha, clicar num link ou abrir uma porta.","blocks":[{"type":"text","text":"Firewall não tem empatia, gente tem. O \"oi mãe, troquei de número\" e a falsa central do banco são engenharia social pura: nenhum sistema foi invadido, a própria vítima fez tudo."},{"type":"table","title":"Os gatilhos que o golpista aperta","headers":["Gatilho","Como aparece"],"rows":[["Urgência","\"sua conta vai ser bloqueada em 1 hora\""],["Autoridade","\"aqui é do TI / da diretoria / do banco\""],["Medo","\"detectamos uma compra suspeita de R$ 3.000\""],["Curiosidade e ganância","\"você ganhou um prêmio\", um anexo chamado `salarios_2024.xlsx`"],["Vontade de ajudar","alguém que parece estar com um problema e pede uma mão"]]},{"type":"table","title":"As técnicas e seus nomes","headers":["Técnica","Como funciona"],"rows":[["Phishing","Email falso em massa imitando banco, loja ou serviço"],["Spear phishing","Phishing sob medida pra uma pessoa ou empresa, usando informações reais sobre ela"],["Whaling","Spear phishing mirando executivos (a \"baleia\")"],["Vishing","Golpe por voz, numa ligação"],["Smishing","Golpe por SMS"],["Pretexting","Inventar um personagem e uma história crível (\"sou o técnico da operadora\")"],["Baiting","Isca, tipo um pendrive \"perdido\" no estacionamento esperando alguém plugar"],["Tailgating","Entrar colado atrás de alguém autorizado numa porta com crachá"]]},{"type":"points","title":"Como se defender","items":["Treinamento de conscientização e simulações de phishing","**MFA** (segundo fator, tipo um código no celular): reduz muito o estrago de uma senha roubada, mas não é à prova de tudo","Um jeito fácil de reportar email suspeito","Help desk verificando a identidade antes de resetar senha"]},{"type":"tip","text":"Crie o hábito de **confirmar por outro canal**: ligou dizendo que é o diretor? Desliga e liga você pro número oficial."}],"deep":[{"type":"text","text":"Um caso clássico de spear phishing é o **golpe do CEO**, também chamado de BEC (Business Email Compromise): um email em nome do chefe, citando coisas reais da empresa, pedindo uma transferência urgente."},{"type":"text","text":"Repara que o BEC junta dois gatilhos de uma vez: autoridade (o nome do CEO) e urgência (\"antes do fim do dia\")."}],"terms":[{"en":"phishing","pt":"golpe por mensagem falsa"},{"en":"spear phishing","pt":"phishing direcionado a uma pessoa ou empresa"},{"en":"pretexting","pt":"criar um pretexto/personagem"},{"en":"tailgating","pt":"entrar de carona atrás de alguém"},{"en":"vishing","pt":"golpe por voz"},{"en":"awareness training","pt":"treinamento de conscientização"}],"practice":"Muitas invasões reais começam com phishing ou credencial roubada, não com um exploit sofisticado. Em pentest, engenharia social só entra se estiver explicitamente no escopo, porque envolve pessoas reais da empresa.","quiz":[{"q":"O financeiro recebe um email com o nome do CEO, citando um fornecedor real da empresa e pedindo uma transferência urgente \"antes do fim do dia\". Que ataque é esse?","options":["Phishing genérico, disparado em massa","Tailgating","Spear phishing no estilo golpe do CEO","Baiting"],"answer":2,"explain":"É direcionado (cita o CEO e um fornecedor real) e aperta dois gatilhos: autoridade e urgência. Esse golpe também é chamado de BEC."},{"q":"Alguém liga dizendo ser do banco e pede um código que acabou de chegar no seu celular. Qual a melhor reação?","options":["Passar o código, já que a pessoa sabia seu nome","Desligar e ligar você mesmo pro número oficial do banco","Pedir que a pessoa confirme seu CPF antes","Passar só metade do código"],"answer":1,"explain":"Confirmar por um canal que você mesmo escolheu quebra o golpe. Saber seu nome ou CPF não prova nada: o golpista pode ter tirado isso de um vazamento."}]},{"n":14,"title":"Insider Threat","titlePt":"A ameaça que já tá dentro","minutes":4,"gist":"Insider threat é a ameaça que vem de quem tem (ou teve) acesso legítimo: funcionário, ex-funcionário, terceirizado ou parceiro.","blocks":[{"type":"analogy","text":"O problema não é quem pula o muro do condomínio, é quem já tem a chave do portão. Essa pessoa passa pelas defesas da borda (firewall, portaria, crachá) sem esforço, porque o acesso dela é legítimo."},{"type":"table","title":"Os três tipos de insider","headers":["Tipo","O que acontece","Exemplo"],"rows":[["Malicioso","Age de propósito: vingança, dinheiro, espionagem","Funcionário de saída que leva a base de clientes pro concorrente"],["Negligente","Erra sem querer","Manda planilha de clientes pro email pessoal ou deixa um storage na nuvem público"],["Comprometido","A conta da pessoa foi tomada por alguém de fora","Credenciais roubadas por phishing usadas pelo atacante"]]},{"type":"points","title":"Sinais de luz amarela","items":["Acesso fora do horário de costume","Download em massa","Acesso a sistemas que não têm nada a ver com a função","Pendrive ou upload pra nuvem pessoal logo antes de um pedido de demissão"]},{"type":"points","title":"Controles mais importantes","items":["**Least privilege:** cada um acessa só o que precisa pro trabalho","**Separation of duties:** ninguém faz sozinho uma operação crítica de ponta a ponta. Ex.: quem cadastra o fornecedor não aprova o pagamento","**Offboarding rápido:** saiu da empresa, os acessos caem no mesmo dia","**Revisão periódica de acessos**, pra ninguém acumular permissão que não usa mais","**Monitoramento e DLP:** ferramentas que detectam ou bloqueiam dados sensíveis saindo da empresa"]}],"deep":[{"type":"text","text":"Por que a segregação de funções funciona: pra fraudar um pagamento, uma pessoa sozinha não consegue fechar o ciclo. Ela precisaria de um cúmplice, o que torna a fraude bem mais difícil."},{"type":"text","text":"A revisão de acessos evita o **privilege creep**: a pessoa troca de área várias vezes e vai acumulando permissões antigas que não usa mais."},{"type":"text","text":"DLP vem de Data Loss Prevention, prevenção contra perda (ou vazamento) de dados."},{"type":"text","text":"Algumas classificações tratam a conta comprometida como ataque externo, não insider. A lógica de defesa é a mesma: monitorar o uso das contas internas."}],"terms":[{"en":"insider","pt":"alguém de dentro"},{"en":"least privilege","pt":"menor privilégio"},{"en":"separation of duties","pt":"segregação de funções"},{"en":"privilege creep","pt":"acúmulo gradual de permissões"},{"en":"offboarding","pt":"processo de desligamento"},{"en":"DLP","pt":"prevenção contra vazamento de dados"}],"practice":"Um tipo comum de pentest interno é o assumed breach: parte do princípio de que um usuário comum já foi comprometido e mede até onde dá pra ir dali. Pra quem defende, é por isso que logs internos importam tanto quanto o firewall de borda.","quiz":[{"q":"Um estagiário cai num phishing e o atacante passa a usar a conta dele. Dá pra chamar isso de insider threat?","options":["Não, porque o estagiário não teve má intenção","Não, insider só vale pra quem já saiu da empresa","Sim, do tipo malicioso","Sim, do tipo comprometido: o ataque age por dentro usando um acesso legítimo"],"answer":3,"explain":"A intenção do estagiário não muda o fato de que o atacante tá usando um acesso interno legítimo. Algumas classificações chamam isso de ataque externo, mas a defesa é a mesma."},{"q":"Numa empresa, quem cadastra um fornecedor não pode ser a mesma pessoa que aprova o pagamento pra ele. Que controle é esse?","options":["Separation of duties (segregação de funções)","Least privilege (menor privilégio)","Offboarding","Privilege creep"],"answer":0,"explain":"Segregação de funções: nenhuma operação crítica fica inteira na mão de uma pessoa só. Least privilege é parecido, mas fala do tamanho do acesso de cada um."}]},{"n":15,"title":"Advanced Persistent Threats","titlePt":"APT: o invasor paciente","minutes":5,"gist":"APT é um grupo atacante organizado e com muito recurso, que escolhe um alvo específico e fica escondido dentro dele por muito tempo.","blocks":[{"type":"table","title":"Destrinchando a sigla","headers":["Palavra","O que quer dizer"],"rows":[["Advanced","Gente qualificada e dinheiro. Pode usar ferramentas próprias e até zero-days (falhas que ainda não têm correção), mas muitas vezes prefere ferramentas comuns e recursos do próprio sistema, que chamam menos atenção."],["Persistent","Não é \"entra, pega e sai\": o objetivo é ficar. Se for expulso, tenta voltar."],["Threat","Tem intenção, objetivo e organização. Não é um vírus aleatório."]]},{"type":"steps","title":"O ciclo de vida típico","items":[{"label":"Reconhecimento","text":"Estuda a empresa, os funcionários e as tecnologias usadas."},{"label":"Acesso inicial","text":"Spear phishing, exploit em algo exposto na internet ou um fornecedor comprometido (ataque de **supply chain**)."},{"label":"Persistência","text":"Instala formas de voltar mesmo se a máquina reiniciar ou a senha mudar."},{"label":"Escalada e movimentação lateral","text":"Ganha mais privilégio e pula de máquina em máquina até chegar no que interessa."},{"label":"Exfiltração","text":"Tira os dados aos poucos, misturados ao tráfego normal."}]},{"type":"text","text":"**Dwell time** é o tempo entre a invasão e a detecção. Em casos de APT, isso pode passar de meses."},{"type":"tip","text":"Guarda esse nome: **MITRE ATT&CK**, uma base pública que cataloga as táticas e técnicas vistas em ataques reais. Os **TTPs** (Tactics, Techniques and Procedures) descrevem o jeito de trabalhar de cada grupo."}],"deep":[{"type":"text","text":"Muitos APTs são ligados a governos (espionagem, sabotagem), e alguns a grupos criminosos com muito recurso. Os nomes dos grupos são dados por empresas de segurança."},{"type":"table","title":"Dois nomes famosos","headers":["Grupo","Atribuído a"],"rows":[["APT28","Inteligência militar russa"],["Lazarus","Coreia do Norte"]]},{"type":"warn","text":"Atribuição (descobrir quem fez) é difícil e sempre carrega algum grau de incerteza."}],"terms":[{"en":"TTPs","pt":"táticas, técnicas e procedimentos"},{"en":"dwell time","pt":"tempo que o invasor fica sem ser detectado"},{"en":"persistence","pt":"mecanismo pra manter o acesso"},{"en":"lateral movement","pt":"se mover entre máquinas da rede"},{"en":"zero-day","pt":"falha sem correção conhecida"},{"en":"supply chain attack","pt":"ataque via fornecedor"}],"practice":"Red teams usam relatórios sobre APTs pra imitar o comportamento de um grupo real, e blue teams usam os mesmos relatórios pra criar detecções. O MITRE ATT&CK vai aparecer muito na sua vida, dos dois lados.","quiz":[{"q":"Um malware se espalhou por milhares de empresas aleatórias pra minerar criptomoeda e foi removido em poucos dias. Isso é um APT?","options":["Sim, porque atingiu milhares de empresas","Sim, porque usou malware","Não: falta um alvo escolhido e a persistência com objetivo definido","Só seria APT se tivesse usado um zero-day"],"answer":2,"explain":"É um ataque oportunista em massa. APT escolhe o alvo e fica lá dentro com um objetivo; zero-day não é requisito."},{"q":"O que o dwell time mede?","options":["Quanto tempo o ransomware leva pra criptografar tudo","O tempo entre a invasão e a detecção","A duração de um exercício de red team","O tempo que a vítima leva pra pagar o resgate"],"answer":1,"explain":"É quanto tempo o invasor fica lá dentro sem ser percebido. Em APT, pode passar de meses."}]},{"n":16,"title":"Threat Actors","titlePt":"Quem está por trás do ataque","minutes":4,"gist":"Threat actor é quem está por trás de um ataque. Entender a motivação e a capacidade de cada tipo ajuda a saber contra quem você tá se defendendo.","blocks":[{"type":"text","text":"**Threat** é a ameaça; **actor** é quem executa. Cada perfil quer uma coisa diferente e tem um nível de habilidade diferente."},{"type":"table","title":"Os perfis mais citados","headers":["Ator","Motivação principal","Capacidade"],"rows":[["Script kiddie","Curiosidade, diversão, reputação","Baixa: roda ferramentas e exploits prontos sem entender direito"],["Hacktivista","Causa política ou social","Variável: muito DDoS, defacement (pichar o site) e vazamento"],["Cibercriminoso / crime organizado","Dinheiro","Média a alta: ransomware, fraude, venda de dados"],["Nation-state (Estado)","Espionagem, sabotagem, vantagem geopolítica","Muito alta (os APTs da seção anterior)"],["Insider","Vingança, dinheiro ou simples descuido","Alta onde importa: já tem acesso"],["Concorrente","Espionagem industrial, vantagem de mercado","Variável, às vezes contrata terceiros"]]},{"type":"compare","title":"A classificação por chapéu","columns":[{"label":"White hat","items":["Age com autorização","Pentesters, pesquisadores"]},{"label":"Grey hat","items":["Fica no meio","Ex.: invadir sem permissão \"só pra avisar a empresa\""]},{"label":"Black hat","items":["Age sem auto
