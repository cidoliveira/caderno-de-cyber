er a saída com calma."}],"deep":[{"type":"text","text":"Lembra que **interface** pode ser física ou virtual. Conectado na VPN de um lab, sua máquina ganha uma interface a mais, com um IP próprio daquela rede."}],"terms":[{"en":"default gateway","pt":"por onde a máquina sai da rede"},{"en":"DNS server","pt":"quem resolve os nomes pra máquina"},{"en":"listening","pt":"porta aberta esperando conexão"},{"en":"interface","pt":"placa de rede, física ou virtual (tipo a da VPN)"}],"practice":"Ler a configuração de rede de uma máquina (IP, gateway, DNS, portas abertas) é a primeira coisa que você faz depois de ganhar acesso a ela num pentest. É exatamente esse reflexo que o assessment treina.","quiz":[{"q":"Numa máquina Linux, o `/etc/resolv.conf` mostra `nameserver 127.0.0.53`. Esse é o servidor DNS de verdade da rede?","options":["Sim, sempre","Não, é o endereço do gateway","Não, é um endereço de broadcast","Não necessariamente: é o resolver local do systemd-resolved, que repassa as consultas"],"answer":3,"explain":"O 127.0.0.53 é um endereço local da própria máquina. O servidor real, pra onde ele repassa, aparece em `resolvectl status`."},{"q":"Você quer saber o default gateway de uma máquina Linux. Qual comando mostra isso?","options":["`ip route`","`ip neigh`","`ss -tuln`","`dig`"],"answer":0,"explain":"No `ip route`, a linha \"default via ...\" mostra o gateway. O `ip neigh` mostra a tabela ARP, e o `ss` mostra portas."}]}]},{"id":"intronet","title":"Introduction to Networking","titlePt":"Introdução a Redes","url":"https://academy.hackthebox.com/course/preview/introduction-to-networking","blurb":"Redes mais a fundo: OSI vs TCP/IP, subnetting, IPv6, protocolos, VPN e criptografia.","sections":[{"n":1,"title":"Networking Overview","titlePt":"O que é uma rede, afinal","minutes":4,"gist":"Rede é um grupo de dispositivos trocando dados por regras combinadas (os protocolos), e o jeito de organizar a rede define o quanto ela é fácil de proteger.","blocks":[{"type":"text","text":"Rede existe pra que dois ou mais dispositivos troquem dados: notebook, celular, impressora, servidor, roteador. Pra todo mundo se entender, cada conversa segue um **protocolo**, um conjunto de regras sobre como falar e o que esperar de volta (HTTP, DNS, TCP e muitos outros)."},{"type":"steps","title":"Você abre um site lá fora: quem entra em jogo","items":[{"label":"DNS","text":"Traduz o nome (tipo `example.com`) pro endereço IP do servidor."},{"label":"Roteador","text":"Seu roteador (router) manda o pedido pra fora, pro seu provedor de internet (ISP)."},{"label":"Internet","text":"O pedido vai pulando de roteador em roteador até o destino. Cada pulo é um **hop**."},{"label":"Firewalls","text":"No caminho, firewalls decidem o que passa e o que é barrado."}]},{"type":"compare","title":"Rede plana vs. rede segmentada","columns":[{"label":"Flat network (plana)","items":["Tudo no mesmo espaço","Qualquer máquina alcança qualquer outra","Simples de montar, ruim de proteger"]},{"label":"Rede segmentada","items":["Dividida em pedaços isolados (sub-redes, VLANs)","Uma \"portaria\" entre eles: regras de acesso (ACLs) e firewalls","Invadiu um pedaço? O estrago fica contido"]}]},{"type":"analogy","text":"Rede plana é um condomínio em que a mesma chave abre o portão, a garagem e todos os apartamentos. Segmentar é botar uma portaria entre os blocos, dizendo quem pode entrar onde."},{"type":"warn","text":"Senha forte em cada máquina não salva uma rede plana: comprometeu a impressora, já tá do lado do servidor do RH."}],"deep":[{"type":"text","text":"Se o recurso fica na rede privada de uma empresa, quem está de fora normalmente só chega nele por uma **VPN**, um túnel criptografado que te coloca \"dentro\" daquela rede."},{"type":"text","text":"**ACL** (Access Control List) é uma lista de regras dizendo quem pode acessar o quê. **VLAN** é um jeito de dividir uma mesma rede física em redes lógicas separadas."},{"type":"commands","title":"Pra testar na sua máquina","items":[{"cmd":"traceroute example.com","note":"Linux: mostra por quais roteadores (hops) o tráfego passa até o destino"},{"cmd":"tracert example.com","note":"Windows: a mesma coisa"},{"cmd":"ip a","note":"Linux: mostra os endereços de rede da sua máquina"},{"cmd":"ipconfig","note":"Windows: a mesma coisa"}]}],"terms":[{"en":"host","pt":"qualquer dispositivo ligado à rede"},{"en":"ISP","pt":"provedor de internet"},{"en":"hop","pt":"cada salto entre roteadores no caminho"},{"en":"flat network","pt":"rede sem divisão interna"},{"en":"segmentation","pt":"dividir a rede em partes isoladas"},{"en":"ACL","pt":"lista de regras de quem acessa o quê"}],"practice":"Depois de ganhar acesso a uma máquina, a pergunta do pentester é \"o que mais eu alcanço daqui?\". Rede plana facilita o lateral movement (pular de máquina em máquina); rede bem segmentada segura o estrago.","quiz":[{"q":"Por que uma rede plana ajuda o atacante mesmo que cada máquina tenha senha forte?","options":["Porque numa rede plana as senhas sempre trafegam sem criptografia","Porque, comprometida uma máquina, todas as outras ficam alcançáveis direto, sem barreira no meio","Porque rede plana não tem roteador, então não existe firewall em lugar nenhum","Porque rede plana usa o mesmo endereço IP pra todas as máquinas"],"answer":1,"explain":"Não existe portaria entre os pedaços da rede. A partir da primeira máquina invadida, o atacante alcança todas as outras e pode tentar a próxima."},{"q":"No caminho até um site lá fora, quem traduz `example.com` pro IP do servidor?","options":["O ISP","O firewall","O DNS","A VPN"],"answer":2,"explain":"O DNS é o serviço que transforma nomes em endereços IP. Sem ele, você teria que decorar o IP de cada site."}]},{"n":2,"title":"Network Types","titlePt":"LAN, WAN, VPN e outras siglas","minutes":4,"gist":"Redes são classificadas pelo alcance e pelo jeito de conectar (cabo, sem fio, túnel), e siglas como LAN, WAN e VPN resumem isso.","blocks":[{"type":"table","title":"As siglas que você vai ver o tempo todo","headers":["Sigla","Nome","O que é"],"rows":[["WAN","Wide Area Network","Rede de grande alcance; na prática, quase sempre \"a internet\" ou o link entre filiais"],["LAN","Local Area Network","Rede local (casa, escritório), normalmente com IPs privados"],["WLAN","Wireless LAN","LAN sem fio, ou seja, o Wi-Fi"],["VPN","Virtual Private Network","Túnel criptografado que te coloca \"dentro\" de outra rede"]]},{"type":"text","text":"Quando alguém fala do \"IP da WAN\" do roteador, normalmente é o IP público, o que a internet enxerga. O \"lado LAN\" é a sua rede interna."},{"type":"compare","title":"Três tipos de VPN","columns":[{"label":"Site-to-site","items":["Liga duas redes inteiras (matriz e filial)","Túnel fixo entre roteadores ou firewalls","Os usuários nem percebem que ele existe"]},{"label":"Remote access","items":["Um usuário se conecta com um cliente VPN","Cria uma interface de rede virtual na máquina dele","Conectar no HTB com o arquivo `.ovpn` (OpenVPN) é exatamente isso"]},{"label":"SSL VPN","items":["Usa TLS (a mesma criptografia do HTTPS) em vez de IPsec, outro protocolo de VPN","Muitas vezes funciona direto pelo navegador, sem instalar cliente dedicado"]}]},{"type":"text","text":"Numa remote access VPN, **full tunnel** manda todo o seu tráfego pelo túnel. **Split tunnel** manda só o da rede de destino; o resto sai direto pra internet."},{"type":"commands","title":"Conectando no lab do HTB","items":[{"cmd":"sudo openvpn arquivo.ovpn","note":"conecta usando o arquivo de configuração da VPN"},{"cmd":"ip a show tun0","note":"mostra a interface virtual criada (normalmente `tun0`)"}]},{"type":"tip","text":"Nenhum alvo responde? Antes de tudo, confere se a `tun0` subiu. Sem a interface da VPN, você não alcança nada do lab."}],"deep":[{"type":"points","title":"Termos de livro (menos comuns, mas bom reconhecer)","items":["**GAN** (Global Area Network): alcance mundial, como a internet ou a rede que liga escritórios de uma multinacional em vários países.","**MAN** (Metropolitan Area Network): liga várias LANs numa cidade ou região, tipo prédios de uma universidade espalhados pela cidade.","**PAN / WPAN** (Personal Area Network): poucos metros ao redor de uma pessoa, tipo celular + fone Bluetooth. WPAN é a versão sem fio."]},{"type":"text","text":"Exceção ao \"IP da WAN é público\": quando o provedor usa **CGNAT**, ele te dá um IP que não é público até no lado WAN do roteador (um IP privado ou da faixa `100.64.0.0/10`, reservada pra isso). O IP público fica com o provedor, compartilhado entre vários clientes."},{"type":"text","text":"Os protocolos de VPN (IPsec, OpenVPN, WireGuard) e como o túnel funciona por dentro aparecem mais pra frente, na seção Virtual Private Networks."}],"terms":[{"en":"WAN","pt":"rede de longa distância; na prática, a internet"},{"en":"LAN","pt":"rede local"},{"en":"tunnel","pt":"túnel criptografado da VPN"},{"en":"site-to-site","pt":"VPN ligando duas redes inteiras"},{"en":"split tunneling","pt":"só parte do tráfego vai pela VPN"}],"practice":"Saber se um IP é da LAN, da WAN ou de uma interface de VPN muda tudo na hora de entender onde você está e o que consegue alcançar.","quiz":[{"q":"Uma empresa quer ligar a matriz em São Paulo à filial em Recife de forma permanente, sem cada funcionário rodar um cliente VPN. Qual tipo de VPN faz sentido?","options":["Site-to-site","Remote access","SSL VPN pelo navegador","Full tunnel em cada notebook"],"answer":0,"explain":"O túnel fica fixo entre as duas redes, nos roteadores ou firewalls, e os usuários nem percebem que ele existe."},{"q":"Você está numa VPN em split tunnel e abre um site qualquer da internet, fora da rede da empresa. Por onde esse tráfego sai?","options":["Pelo túnel, criptografado até a empresa","Por lugar nenhum: fica bloqueado enquanto a VPN estiver ligada","Direto pra internet, fora do túnel"],"answer":2,"explain":"No split tunnel só o tráfego da rede de destino entra no túnel. O resto segue o caminho normal da sua conexão."}]},{"n":3,"title":"Networking Topologies","titlePt":"Topologias: o desenho da rede","minutes":6,"gist":"Topologia é o desenho da rede: como os dispositivos estão ligados (físico) e como os dados realmente circulam (lógico).","blocks":[{"type":"text","text":"O assunto tem três partes: as **conexões** (o meio por onde o dado passa), os **nós** (os dispositivos, cada um ligado por uma **NIC**, a placa de rede) e as **classificações** (os formatos)."},{"type":"compare","title":"1. Conexões","columns":[{"label":"Com fio","items":["Cabo coaxial","Par trançado: o cabo de rede comum, com conector RJ45","Fibra óptica"]},{"label":"Sem fio","items":["Wi-Fi","Rede celular","Satélite"]}]},{"type":"text","text":"Na tabela abaixo, a **camada OSI** diz em que nível o equipamento trabalha: 1 = só o sinal no cabo, 2 = endereço MAC (o endereço físico da placa de rede), 3 = endereço IP. O modelo OSI vem com calma mais pra frente."},{"type":"table","title":"2. Nós: os equipamentos principais","headers":["Dispositivo","Camada OSI","O que faz"],"rows":[["Repeater","1 (sinal)","Regenera o sinal pra ele ir mais longe"],["Hub","1 (sinal)","Repete tudo que chega pra todas as portas, sem critério"],["Bridge","2 (MAC)","Liga dois segmentos de rede, filtrando por endereço MAC"],["Switch","2 (MAC)","Manda cada frame (bloco de dados) só pra porta do destino, usando a tabela de MACs"],["Router","3 (IP)","Encaminha pacotes entre redes diferentes, usando o IP"],["Gateway","varia","Ponto de passagem/tradução entre redes ou protocolos diferentes"],["Firewall","3 a 7","Filtra o tráfego conforme regras"]]},{"type":"table","title":"3. Classificações: os formatos","headers":["Topologia","Como é","Ponto forte","Ponto fraco"],"rows":[["Point-to-point","Ligação direta entre dois hosts","Simples e dedicada","Só serve pra dois"],["Bus","Todos no mesmo cabo central","Barata","Cabo principal rompe, rede cai; colisões (dois transmitindo ao mesmo tempo)"],["Star","Todos ligados a um nó central (switch)","Um cabo ruim só derruba um host","Nó central é ponto único de falha"],["Ring","Cada nó ligado a dois vizinhos, formando um anel","Tráfego ordenado (ex.: Token Ring)","Um nó quebrado pode interromper o anel"],["Mesh","Nós com vários links entre si","Muita redundância","Cara e complexa"],["Tree","Estrelas organizadas em hierarquia","Escala bem em prédios e campus","Falha num nó de cima isola os de baixo"],["Hybrid","Mistura de topologias","Flexível","Mais difícil de gerenciar"],["Daisy chain","Um dispositivo ligado no próximo, em série","Cabeamento simples","Um elo quebrado separa o resto"]]},{"type":"text","text":"**Físico vs. lógico:** físico é como os cabos estão; lógico é como os dados andam. Uma rede com hub tem cara de estrela, mas se comporta como barramento (bus), porque todo mundo recebe tudo."}],"deep":[{"type":"points","title":"Detalhes de algumas topologias","items":["**Mesh** pode ser full (todo nó ligado a todos) ou partial (só alguns nós com vários links).","**Ring** clássico é o Token Ring: só transmite quem está com o \"token\", por isso o tráfego é ordenado. Com anel redundante, um nó quebrado não derruba tudo."]},{"type":"text","text":"Gateway não tem camada fixa: depende do que ele traduz. O firewall vai da camada 3 (filtra por IP) até a 7 (olha o conteúdo da aplicação), conforme o tipo."}],"terms":[{"en":"node","pt":"qualquer ponto ou dispositivo da rede"},{"en":"NIC","pt":"placa de rede"},{"en":"MAC address","pt":"endereço físico da placa de rede"},{"en":"single point of failure","pt":"peça que, se cair, derruba tudo"},{"en":"redundancy","pt":"caminhos ou peças de reserva"},{"en":"physical / logical topology","pt":"como está cabeado / como o dado flui"}],"practice":"Hub vs. switch importa pra quem captura tráfego: num hub, seu sniffer (tipo o Wireshark) vê o tráfego de todo mundo; num switch, só o seu, os broadcasts e um pouco de multicast, a não ser que você use ARP spoofing ou port mirroring.","quiz":[{"q":"Por que backbones de provedores costumam usar topologia mesh, mesmo sendo cara?","options":["Porque é a topologia mais barata de cabear em longas distâncias","Porque dispensa roteadores no caminho entre as cidades","Porque é a única topologia que funciona com fibra óptica","Por redundância: se um link cai, o tráfego tem outros caminhos"],"answer":3,"explain":"Com vários links entre os nós, a falha de um cabo ou equipamento não derruba o serviço. Pra quem não pode ficar fora do ar, isso vale o custo."},{"q":"Uma rede liga todos os PCs a um hub. Fisicamente ela parece uma estrela. Logicamente, ela se comporta como qual topologia?","options":["Ring","Bus","Mesh","Point-to-point"],"answer":1,"explain":"O hub repete tudo pra todas as portas, então todo mundo recebe tudo, como num barramento (bus) compartilhado."}]},{"n":4,"title":"Proxies","titlePt":"Proxy: o intermediário","minutes":5,"gist":"Proxy é um intermediário: recebe seu pedido, faz ele em seu nome e te devolve a resposta, podendo inspecionar, filtrar, guardar ou modificar o que passa.","blocks":[{"type":"analogy","text":"Proxy é um despachante: você pede, ele vai ao Detran em seu nome, e o Detran fala com o despachante, não com você."},{"type":"exchange","title":"Forward proxy em ação","actors":["Você","Proxy","Site"],"messages":[{"from":0,"to":1,"label":"Request","note":"quero o example.com"},{"from":1,"to":2,"label":"Request","note":"o proxy pede em seu nome; o site vê o IP dele, não o seu"},{"from":2,"to":1,"label":"Response","note":"o site responde pro proxy"},{"from":1,"to":0,"label":"Response","note":"o proxy te entrega (e pode filtrar, registrar ou guardar em cache)"}]},{"type":"points","title":"O que um proxy costuma fazer","items":["**Filtrar** conteúdo: bloquear sites, malware","**Cache**: guardar respostas pra entregar mais rápido da próxima vez","**Ocultar** quem está de cada lado: o destino vê o IP do proxy, não o seu","**Registrar** tudo em log pra auditoria"]},{"type":"compare","title":"Forward vs. reverse proxy","columns":[{"label":"Forward proxy","items":["Fica do lado do cliente: você → proxy → internet","Representa o cliente","Quem coloca: usuário ou empresa, pra controlar a navegação","Ex.: Burp Suite, proxy corporativo"]},{"label":"Reverse proxy","items":["Fica do lado do servidor: internet → proxy → servidores internos","Representa o servidor","Quem coloca: o dono do site ou serviço","Ex.: Nginx como reverse proxy, Cloudflare"]}]},{"type":"text","text":"Com reverse proxy, o cliente acha que fala direto com o site. Mas tem alguém na frente distribuindo carga, cuidando do TLS (a criptografia do HTTPS), fazendo cache ou rodando um **WAF** (firewall que filtra ataques web)."},{"type":"commands","title":"Passando uma request pelo Burp","items":[{"cmd":"curl -x http://127.0.0.1:8080 http://example.com","note":"manda a request pelo proxy escutando na sua máquina, na porta 8080 (a padrão do Burp)"}]}],"deep":[{"type":"text","text":"Normalmente se diz que o proxy trabalha na camada 7 (aplicação): ele entende o protocolo da conversa, tipo HTTP, e consegue olhar o conteúdo."},{"type":"text","text":"Existem proxies mais genéricos, como os **SOCKS**, que só repassam conexões, sem interpretar o que vai dentro."},{"type":"compare","title":"Transparent vs. non-transparent","columns":[{"label":"Transparent","items":["Intercepta o tráfego sem o cliente configurar nada","Muitas vezes sem ele nem saber"]},{"label":"Non-transparent","items":["O cliente precisa ser configurado pra usar","Configuração de proxy no navegador/sistema ou variável de ambiente"]}]},{"type":"commands","title":"Variáveis de ambiente de proxy","items":[{"cmd":"export http_proxy=http://127.0.0.1:8080","note":"muitos programas de terminal passam a mandar o tráfego HTTP por esse proxy"},{"cmd":"export https_proxy=http://127.0.0.1:8080","note":"a mesma coisa pro tráfego HTTPS"}]}],"terms":[{"en":"forward / dedicated proxy","pt":"proxy do lado do cliente (dois nomes pra mesma coisa)"},{"en":"reverse proxy","pt":"proxy na frente do servidor"},{"en":"transparent proxy","pt":"intercepta sem o cliente configurar nem saber"},{"en":"WAF","pt":"Web Application Firewall, filtra ataques web"},{"en":"intercept","pt":"interceptar e poder alterar a request"},{"en":"load balancing","pt":"distribuir a carga entre servidores"}],"practice":"O Burp Suite, ferramenta básica de web pentest, é um forward proxy na sua máquina: o navegador passa tudo por ele e você lê e edita cada request. Do outro lado, um reverse proxy/WAF pode bloquear seus payloads ou esconder o servidor real.","quiz":[{"q":"Você resolve o nome de um site e o IP que volta pertence à Cloudflare. O que isso provavelmente indica?","options":["Que você está falando direto com o servidor da aplicação","Que a Cloudflare está agindo como reverse proxy na frente do servidor real","Que você está atrás de um forward proxy corporativo sem saber","Que o DNS do site está mal configurado"],"answer":1,"explain":"A Cloudflare fica na frente do site como reverse proxy. O servidor real da aplicação fica escondido atrás dela."},{"q":"O Burp Suite, rodando na sua máquina entre o navegador e os sites, funciona como que tipo de proxy?","options":["Forward proxy","Reverse proxy","Transparent proxy do provedor"],"answer":0,"explain":"Ele fica do lado do cliente (você) e faz as requests em seu nome. Por isso dá pra ler e editar cada uma antes de ela sair."}]},{"n":5,"title":"Networking Models","titlePt":"Camadas e encapsulamento","minutes":4,"gist":"Modelos de rede dividem a comunicação em camadas, cada uma com um trabalho. Os dois que importam são o OSI e o TCP/IP.","blocks":[{"type":"text","text":"Por que camadas? Cada uma cuida só da sua parte, então dá pra trocar cabo por Wi-Fi sem mexer no navegador, e fica mais fácil achar problema (\"é cabo ou é DNS?\")."},{"type":"compare","title":"Os dois modelos","columns":[{"label":"OSI","items":["Modelo de referência, mais teórico","Vira vocabulário (\"ataque de camada 7\"), ensino e troubleshooting"]},{"label":"TCP/IP","items":["Modelo prático, baseado nos protocolos da internet","É o que roda de verdade"]}]},{"type":"text","text":"Quem envia desce as camadas, e cada uma embrulha o que veio de cima com o seu **header** (cabeçalho): é o **encapsulamento**. O nome do pedaço em cada camada é a **PDU** (Protocol Data Unit), que aparece na etiqueta à direita de cada camada abaixo."},{"type":"layers","title":"Descendo as camadas, embrulho por embrulho","items":[{"label":"Aplicação (Application)","text":"Gera os dados, tipo uma request HTTP. No OSI, junta as camadas 5, 6 e 7.","tag":"Data"},{"label":"Transporte (Transport)","text":"Põe o header TCP (vira segment) ou UDP (vira datagram), com as portas: o número que diz qual programa recebe.","tag":"Segment / Datagram"},{"label":"Rede (Network)","text":"Põe o header IP, com os endereços IP de origem e destino.","tag":"Packet"},{"label":"Enlace (Data Link)","text":"Põe o header com os endereços MAC (o endereço físico da placa de rede) e um **trailer** no final, pra detectar erros.","tag":"Frame"},{"label":"Física (Physical)","text":"Manda tudo como bits: sinal elétrico, luz ou rádio.","tag":"Bits"}]},{"type":"text","text":"Quem recebe faz o caminho inverso: sobe as camadas tirando um embrulho de cada vez. Isso é o **desencapsulamento**."},{"type":"analogy","text":"Encomenda dos Correios: a carta vai num envelope com o setor (a porta), ganha etiqueta com endereço e CEP (o IP) e viaja num malote diferente a cada trecho (o frame). O malote muda em cada centro de distribuição; a etiqueta segue igual até o fim."}],"deep":[{"type":"text","text":"**Payload** é o conteúdo útil que uma camada carrega, ou seja, o que veio da camada de cima. Aqui não tem nada a ver com payload de exploit."},{"type":"text","text":"Em cada roteador, o frame é desfeito e montado de novo pro próximo trecho, com novos endereços MAC. Já o IP de destino normalmente segue o mesmo de ponta a ponta, salvo casos como NAT."},{"type":"text","text":"Os detalhes de cada modelo vêm nas próximas duas seções: The OSI Model e The TCP/IP Model."}],"terms":[{"en":"layer","pt":"camada"},{"en":"encapsulation / decapsulation","pt":"embrulhar / desembrulhar os dados"},{"en":"header","pt":"cabeçalho com as informações de controle"},{"en":"PDU","pt":"nome da unidade de dados em cada camada"},{"en":"payload","pt":"o conteúdo útil carregado (não é o payload de exploit)"}],"practice":"Abre qualquer captura no Wireshark: cada pacote aparece \"descascado\" por camada (Ethernet, IP, TCP e, por fim, HTTP). É o encapsulamento na sua tela.","quiz":[{"q":"Um pacote sai do seu PC, passa por três roteadores e chega ao servidor. O que é refeito a cada salto?","options":["O IP de destino, trocado pelo do próximo roteador","O header TCP, com as portas de origem e destino","O frame, com os endereços MAC do trecho","Nada: o pacote chega exatamente como saiu"],"answer":2,"explain":"Os MACs só valem dentro de cada trecho local, então o frame é remontado a cada roteador. O IP de destino normalmente segue o mesmo até o fim (salvo casos como NAT)."},{"q":"Como se chama a PDU da camada de rede, onde fica o IP?","options":["Frame","Segment","Bits","Packet"],"answer":3,"explain":"Na camada de rede o pedaço se chama packet. Frame é da camada de enlace, e segment é do TCP, na camada de transporte."}]},{"n":6,"title":"The OSI Model","titlePt":"Modelo OSI: as 7 camadas","minutes":5,"gist":"O OSI é um modelo de referência em 7 camadas que descreve tudo numa comunicação, do sinal no cabo até o aplicativo.","blocks":[{"type":"text","text":"OSI vem de Open Systems Interconnection, padronizado pela ISO. A internet roda TCP/IP, mas todo mundo usa o OSI como vocabulário: \"switch camada 3\" (switch que também roteia por IP), \"ataque de camada 7\", \"problema de camada 1\" (cabo solto)."},{"type":"layers","title":"As 7 camadas, de cima pra baixo","items":[{"label":"7 · Application","text":"Interface entre a rede e os programas. Ex.: HTTP, FTP, SMTP, DNS.","tag":"Data"},{"label":"6 · Presentation","text":"Formato dos dados: codificação, compressão, criptografia. Ex.: ASCII/UTF-8, JPEG.","tag":"Data"},{"label":"5 · Session","text":"Abre, mantém e encerra sessões entre aplicações. Ex.: NetBIOS, RPC.","tag":"Data"},{"label":"4 · Transport","text":"Comunicação fim a fim entre programas (processos): portas, segmentação, confiabilidade. Ex.: TCP, UDP.","tag":"Segment / Datagram"},{"label":"3 · Network","text":"Endereçamento lógico e roteamento entre redes. Ex.: IP, ICMP, roteadores.","tag":"Packet"},{"label":"2 · Data Link","text":"Entrega dentro da rede local, por endereço MAC, com detecção de erros. Ex.: Ethernet, Wi-Fi, switches.","tag":"Frame"},{"label":"1 · Physical","text":"Transmite bits como sinal elétrico, luz ou rádio. Ex.: cabos, fibra, hubs, repetidores.","tag":"Bits"}]},{"type":"compare","title":"Duas metades","columns":[{"label":"Camadas 5 a 7","items":["Orientadas à aplicação","O que os dados significam"]},{"label":"Camadas 1 a 4","items":["Orientadas ao transporte","Como os dados chegam"]}]},{"type":"tip","text":"Pra decorar de baixo pra cima: **Please Do Not Throw Sausage Pizza Away** (Physical, Data Link, Network, Transport, Session, Presentation, Application)."},{"type":"table","title":"Onde segurança encosta em cada camada","headers":["Camada","O que um atacante ou analista faz ali"],"rows":[["7","Ataques web (SQL injection, XSS), enumeração de serviços"],["4","Port scan, como o nmap descobrindo portas TCP/UDP abertas"],["3","Ping sweep com ICMP (pingar uma faixa de IPs pra ver quem está ligado), IP spoofing (falsificar o IP de origem)"],["2","ARP spoofing, MAC flooding em switch"],["1","Acesso físico, grampo em cabo, plugar um dispositivo na rede"]]}],"deep":[{"type":"text","text":"Cada camada \"conversa\" com a equivalente do outro lado: o TCP do seu PC com o TCP do servidor, o HTTP do navegador com o HTTP do site. As camadas de baixo só servem de transporte pra essa conversa."},{"type":"text","text":"Sobre a camada 6: o TLS costuma ser colocado aqui por cuidar de criptografia, mas na real ele não se encaixa perfeitamente em nenhuma camada. Não se apegue: o modelo é um mapa, não uma lei."},{"type":"facts","title":"O jeito curto de falar","items":[{"value":"L1","label":"Physical (cabo, sinal)"},{"value":"L2","label":"Data Link (switch, MAC)"},{"value":"L3","label":"Network (roteador, IP)"},{"value":"L4","label":"Transport (TCP, UDP)"},{"value":"L7","label":"Application (HTTP, DNS)"}]}],"terms":[{"en":"reference model","pt":"modelo de referência, usado pra explicar e padronizar"},{"en":"L2 / L3 / L7","pt":"jeito curto de dizer camada 2, 3, 7"},{"en":"upper / lower layers","pt":"camadas de cima (aplicação) / de baixo (transporte)"},{"en":"frame / packet / segment","pt":"PDUs das camadas 2, 3 e 4"}],"practice":"O OSI é o mapa pra se localizar. Se o ping responde mas o site não abre, a camada 3 tá funcionando e o problema provavelmente está acima dela: porta bloqueada, serviço caído ou erro na aplicação.","quiz":[{"q":"Um switch comum (camada 2) usa o quê pra decidir pra qual porta mandar o frame?","options":["O endereço IP de destino","A porta TCP do serviço","O nome DNS do destino","O endereço MAC de destino"],"answer":3,"explain":"MAC é coisa da camada 2, então é por ele que o switch decide. Quem decide com base em IP é o roteador, na camada 3."},{"q":"Um port scan com nmap, descobrindo portas TCP/UDP abertas, atua principalmente em qual camada do OSI?","options":["Camada 4 (Transport)","Camada 2 (Data Link)","Camada 7 (Application)","Camada 1 (Physical)"],"answer":0,"explain":"Portas, TCP e UDP são assunto da camada de transporte, a camada 4."}]},{"n":7,"title":"The TCP/IP Model","titlePt":"TCP/IP: o modelo que roda de verdade","minutes":4,"gist":"O TCP/IP é o modelo que a internet usa de verdade, com só 4 camadas porque junta várias camadas do OSI.","blocks":[{"type":"text","text":"O nome vem dos dois protocolos centrais, **TCP** (Transmission Control Protocol) e **IP** (Internet Protocol). Mas o modelo cobre uma família inteira: UDP, ICMP, DNS, HTTP e companhia."},{"type":"layers","title":"As 4 camadas (e o equivalente no OSI)","items":[{"label":"Application","text":"Tudo que é específico do aplicativo: formato, sessão, serviço. Ex.: HTTP, DNS, SSH, FTP, SMTP.","tag":"OSI 5, 6 e 7"},{"label":"Transport","text":"Conexão entre processos via portas: confiável (TCP) ou leve e rápido (UDP).","tag":"OSI 4"},{"label":"Internet","text":"Endereçamento IP e roteamento entre redes. Ex.: IP, ICMP.","tag":"OSI 3"},{"label":"Link (Network Access)","text":"Entrega os dados no meio físico local. Ex.: Ethernet, Wi-Fi, ARP.","tag":"OSI 1 e 2"}]},{"type":"points","title":"O que o TCP/IP resolve","items":["**Logical addressing:** o IP identifica hosts e redes.","**Routing:** achar o caminho entre redes diferentes.","**Error and flow control:** o TCP confirma o recebimento, retransmite o que se perdeu e controla o ritmo pra não afogar o outro lado.","**Application support:** portas deixam várias aplicações usarem a rede ao mesmo tempo.","**Name resolution:** o DNS traduz nomes em IPs."]},{"type":"text","text":"Por isso você ouve \"camada 7\" (termo do OSI) num mundo que roda TCP/IP: o OSI é o vocabulário, o TCP/IP é o que funciona de fato."},{"type":"commands","title":"Enxergando as camadas na sua máquina (Linux)","items":[{"cmd":"ip link","note":"Link: interfaces de rede e endereços MAC"},{"cmd":"ip addr","note":"Internet: endereços IP de cada interface"},{"cmd":"ip route","note":"Internet: rotas, ou seja, por onde os pacotes saem"},{"cmd":"ss -tuln","note":"Transport: portas TCP (`-t`) e UDP (`-u`) escutando (`-l`), em número (`-n`)"}]}],"deep":[{"type":"text","text":"Algumas fontes desenham o TCP/IP com 5 camadas, separando Physical de Data Link. É a mesma ideia, só com outro corte."},{"type":"text","text":"O endereçamento IP em detalhe vem mais pra frente, nas seções IPv4 Addresses e Subnetting."}],"terms":[{"en":"protocol suite","pt":"família de protocolos que trabalham juntos"},{"en":"Network Access / Link layer","pt":"camada mais baixa do TCP/IP"},{"en":"Internet layer","pt":"camada do IP e do roteamento"},{"en":"flow control","pt":"controle do ritmo de envio"},{"en":"name resolution","pt":"traduzir nome em IP"}],"practice":"Todas as ferramentas de pentest falam TCP/IP. Saber em que camada cada uma atua ajuda a entender o que você está vendo: port scan mexe com Transport, consulta DNS é Application, ping é Internet.","quiz":[{"q":"O DNS lida com endereços IP. Por que ele fica na camada Application, e não na Internet?","options":["Porque o DNS só funciona dentro da rede local, sem passar por roteadores","Porque ele é um serviço que usa a rede pra responder \"qual IP tem esse nome?\"","Porque o DNS roda direto em cima do Ethernet, sem usar o IP","Porque nas redes modernas o DNS substituiu o IP no roteamento"],"answer":1,"explain":"O DNS só fornece a informação, normalmente via UDP na porta 53. Quem endereça e roteia os pacotes é o IP, na camada Internet."},{"q":"A camada Link (Network Access) do TCP/IP equivale a quais camadas do OSI?","options":["3 e 4","5, 6 e 7","1 e 2","Só a 3"],"answer":2,"explain":"Ela junta a Physical (1) e a Data Link (2): é a parte que entrega os dados no meio físico local."}]},{"n":8,"title":"Network Layer","titlePt":"Camada 3: o caminho dos pacotes","minutes":4,"gist":"A camada de rede (camada 3 do OSI) escolhe por onde cada pacote passa pra sair de uma rede e chegar em outra, usando endereços IP.","blocks":[{"type":"text","text":"A camada 2 só entrega dados **dentro da mesma rede local**. Quando o destino tá em outra rede, quem assume é a camada 3."},{"type":"points","title":"As três tarefas dela","items":["**Endereçamento lógico:** cada host tem um IP, que diz em qual rede ele está e quem ele é dentro dela.","**Routing:** descobrir o caminho até a rede de destino.","**Forwarding:** passar o pacote que chegou pro próximo salto (hop) do caminho."]},{"type":"analogy","text":"Pensa nos Correios: cada centro de distribuição olha o CEP e só decide pra qual próximo centro mandar a encomenda, sem conhecer o trajeto inteiro. O roteador faz igualzinho."},{"type":"steps","title":"O que o roteador faz com cada pacote","items":[{"label":"Lê o IP de destino","text":"Ele só olha até a camada 3. Se lá dentro vai e-mail ou vídeo, tanto faz pra ele."},{"label":"Consulta a routing table","text":"Procura a rota que leva até a rede de destino. Sem rota específica, vai pela rota **default** (o default gateway)."},{"label":"Desconta o TTL","text":"O TTL é um contador que impede o pacote de rodar em loop pra sempre. O roteador tira 1; se chegar a zero, descarta o pacote e avisa a origem com uma mensagem de erro ICMP \"Time Exceeded\"."},{"label":"Passa adiante","text":"Encaminha o pacote pro próximo roteador do caminho, o próximo hop."}]},{"type":"facts","title":"TTL: o contador anti-loop","items":[{"value":"TTL","label":"nome do contador no IPv4 (Time To Live)"},{"value":"Hop Limit","label":"o mesmo contador no IPv6"},{"value":"-1","label":"a cada roteador que o pacote atravessa"},{"value":"0","label":"pacote descartado + aviso ICMP Time Exceeded pra origem"}]},{"type":"commands","title":"Vendo a camada 3 na sua máquina (Linux)","items":[{"cmd":"ip route","note":"mostra a tabela de roteamento; a linha `default` aponta pro gateway"},{"cmd":"ping -c 4 8.8.8.8","note":"manda 4 pings (ICMP echo request) e espera as respostas; o TTL aparece em cada resposta"},{"cmd":"traceroute 8.8.8.8","note":"lista os roteadores (hops) até o destino"}]}],"deep":[{"type":"table","title":"Protocolos ligados à camada 3","headers":["Protocolo","Pra que serve"],"rows":[["IPv4 / IPv6","Endereçar e carregar os pacotes"],["ICMP","Mensagens de erro e diagnóstico (o `ping` usa)"],["IGMP","Gerenciar grupos de multicast no IPv4"],["IPsec","Autenticar e criptografar pacotes IP"],["RIP / OSPF","Roteadores trocarem rotas entre si (o RIP, tecnicamente, roda em cima de UDP)"]]},{"type":"text","text":"O `traceroute` usa o TTL de propósito: manda pacotes com TTL 1, 2, 3... e cada roteador onde o contador zera se denuncia com um ICMP Time Exceeded."},{"type":"tip","text":"O TTL na resposta do ping dá uma pista do sistema operacional: Linux costuma começar em **64** e Windows em **128**. É pista, não prova."},{"type":"commands","title":"No Windows","items":[{"cmd":"route print","note":"mostra a tabela de roteamento"},{"cmd":"tracert 8.8.8.8","note":"o traceroute do Windows"}]}],"terms":[{"en":"routing","pt":"escolher o caminho até a rede de destino"},{"en":"forwarding","pt":"repassar o pacote pro próximo salto"},{"en":"hop","pt":"cada roteador no caminho"},{"en":"routing table","pt":"tabela de rotas do roteador ou da máquina"},{"en":"default gateway","pt":"pra onde vai tudo que não tem rota específica"},{"en":"TTL","pt":"quantos saltos o pacote ainda pode dar"}],"practice":"Quando você compromete uma máquina, `ip route` (ou `route print`) mostra que outras redes ela alcança. É assim que você descobre pra onde dá pra pivotar, ou seja, usar essa máquina como ponte pra redes internas.","quiz":[{"q":"Um pacote sai com TTL 64 e passa por 3 roteadores até chegar no destino. Com que TTL ele chega?","options":["61","64","3","67"],"answer":0,"explain":"Cada roteador do caminho tira 1 do TTL: 64 - 3 = 61."},{"q":"O que o roteador usa pra decidir pra onde mandar um pacote?","options":["O conteúdo do pacote (e-mail, vídeo...)","O MAC address do destino final","O IP de destino, consultando a routing table","O nome do site que você digitou"],"answer":2,"explain":"O roteador trabalha na camada 3: lê o IP de destino e consulta a tabela de rotas. O conteúdo não importa pra ele."}]},{"n":9,"title":"IPv4 Addresses","titlePt":"IPv4 por dentro","minutes":5,"gist":"Um IPv4 é um número de 32 bits, escrito como quatro números de 0 a 255, que diz ao mesmo tempo qual é a rede e qual é o host.","blocks":[{"type":"facts","title":"Os números do IPv4","items":[{"value":"32 bits","label":"tamanho do endereço"},{"value":"4 octetos","label":"de 8 bits cada, separados por ponto"},{"value":"0 a 255","label":"valores possíveis em cada octeto"},{"value":"~4,3 bilhões","label":"endereços no total; acabaram faz tempo, por isso existem NAT, faixas privadas e IPv6"}]},{"type":"text","text":"Todo IPv4 tem duas partes: a primeira identifica a **rede**, a segunda identifica o **host** dentro dela. Quem marca a divisão é a **máscara de sub-rede** (subnet mask)."},{"type":"analogy","text":"Pensa num condomínio: o número do condomínio é a rede, o do apartamento é o host. Vizinhos se falam direto; pra falar com outro condomínio, passa pela portaria, que é o **default gateway** (o roteador)."},{"type":"points","title":"Máscara e CIDR","items":["A máscara é uma fila de bits **1** (parte de rede) seguida de bits **0** (parte de host).","`255.255.255.0` tem 24 bits ligados, então vira `/24` na notação **CIDR**.","Ou seja: o número depois da barra diz quantos bits são de rede."]},{"type":"code","title":"Rede + host num exemplo","lang":"text","code":"192.168.10.39/24\nmáscara 255.255.255.0 = 24 bits de rede\n\n192 . 168 . 10  |  39\n----- rede -----|  host"},{"type":"table","title":"Endereços especiais de toda rede (ex.: 192.168.10.0/24)","headers":["Endereço","Regra","No exemplo"],"rows":[["Rede (network address)","todos os bits de host em 0","192.168.10.0"],["Broadcast","todos os bits de host em 1","192.168.10.255"],["Hosts utilizáveis","todo o resto",".1 a .254 (254 hosts)"],["Gateway","o roteador da rede; costuma ser o primeiro ou o último utilizável, mas é convenção, não regra","ex.: 192.168.10.1"]]}],"deep":[{"type":"text","text":"Cada octeto tem 8 bits com os pesos 128, 64, 32, 16, 8, 4, 2 e 1. Pra converter, você vê quais pesos somam o número."},{"type":"code","title":"Binário sem sofrimento","lang":"text","code":"pesos:  128  64  32  16   8   4   2   1\n\n200      = 128 + 64 + 8   ->  11001000\n255      = todos ligados  ->  11111111\n10101000 = 128 + 32 + 8   ->  168"},{"type":"table","title":"Classes: o jeito antigo (antes do CIDR, em 1993)","headers":["Classe","1º octeto","Máscara padrão","Uso"],"rows":[["A","1 – 126 (*)","/8 (255.0.0.0)","redes enormes"],["B","128 – 191","/16 (255.255.0.0)","redes médias"],["C","192 – 223","/24 (255.255.255.0)","redes pequenas"],["D","224 – 239","—","multicast"],["E","240 – 255","—","reservado/experimental"]]},{"type":"text","text":"Hoje as classes são legado, mas o vocabulário ainda aparece. (*) O 0 e o 127 são tecnicamente da classe A, mas são reservados."},{"type":"facts","title":"Faixas pra reconhecer de cara","items":[{"value":"10.0.0.0/8","label":"faixa privada"},{"value":"172.16.0.0/12","label":"faixa privada"},{"value":"192.168.0.0/16","label":"faixa privada"},{"value":"127.0.0.0/8","label":"loopback: a própria máquina"}]},{"type":"commands","items":[{"cmd":"ip -4 addr show","note":"seu IPv4 e o prefixo (/24, /16...) em cada interface"},{"cmd":"python3 -c \"print(format(200, '08b'))\"","note":"decimal pra binário (11001000)"},{"cmd":"python3 -c \"print(int('10101000', 2))\"","note":"binário pra decimal (168)"},{"cmd":"ipconfig","note":"Windows: mostra IP, máscara e gateway"}]}],"terms":[{"en":"octet","pt":"grupo de 8 bits"},{"en":"subnet mask","pt":"máscara que separa a parte de rede da parte de host"},{"en":"CIDR","pt":"notação /n: quantos bits são de rede"},{"en":"broadcast address","pt":"endereço que fala com todo mundo da rede"},{"en":"loopback","pt":"a própria máquina (127.0.0.1)"}],"practice":"IP + máscara te dizem o tamanho da rede que dá pra varrer: um /24 tem 254 hosts possíveis, um /16 passa de 65 mil. Isso muda completamente quanto tempo o scan leva e o que entra no escopo.","quiz":[{"q":"No endereço 172.20.5.9/16, qual parte identifica a rede?","options":["172","172.20.5","172.20","5.9"],"answer":2,"explain":"/16 = 16 bits de rede = os dois primeiros octetos. Então 172.20 é a rede e 5.9 é o host."},{"q":"Na rede 10.0.5.0/24, qual é o endereço de broadcast?","options":["10.0.5.0","10.0.5.1","10.0.5.254","10.0.5.255"],"answer":3,"explain":"Broadcast = todos os bits de host em 1. Num /24 o último octeto inteiro é host, então fica .255."}]},{"n":10,"title":"Subnetting","titlePt":"Sub-redes passo a passo","minutes":8,"gist":"Subnetting é dividir um bloco de IPs em redes menores e saber calcular rede, broadcast e faixa de hosts a partir de qualquer `IP/prefixo`.","blocks":[{"type":"text","text":"Por que dividir? Pra separar setores (servidores, RH, Wi-Fi de visitante), diminuir o broadcast circulando e controlar o tráfego entre eles com roteador e firewall."},{"type":"text","text":"De qualquer `IP/prefixo` (o prefixo é o número depois da barra, tipo `/26`) você quer tirar 5 coisas: **máscara**, **rede**, **broadcast**, **primeiro e último host** e **quantidade de hosts**."},{"type":"code","title":"As fórmulas base","lang":"text","code":"bits de host = 32 - prefixo\nhosts úteis  = 2^(bits de host) - 2      (tira rede e broadcast)\n\nno octeto interessante (onde a máscara não é 255 nem 0):\nbloco        = 2^(bits de host que caem nele)\nmáscara      = 256 - bloco"},{"type":"steps","title":"Método do bloco, exemplo 192.168.50.100/26","items":[{"label":"Ache o octeto interessante","text":"É onde a máscara não é 255 nem 0. Aqui sobram 32 - 26 = 6 bits de host, todos no último octeto."},{"label":"Calcule o bloco","text":"2⁶ = 64. A máscara nesse octeto é 256 - 64 = 192, então `255.255.255.192`."},{"label":"Liste os múltiplos","text":"As redes começam em 0, 64, 128 e 192. O 100 cai entre 64 e 127."},{"label":"Monte o resultado","text":"A rede é o múltiplo logo antes do IP (.64). O broadcast é o próximo múltiplo menos 1 (.127). Os hosts ficam no meio: .65 a .126."}]},{"type":"table","title":"Resultado de 192.168.50.100/26","headers":["Item","Valor"],"rows":[["Máscara","255.255.255.192"],["Rede","192.168.50.64"],["Primeiro host","192.168.50.65"],["Último host","192.168.50.126"],["Broadcast","192.168.50.127"],["Hosts úteis","2⁶ - 2 = 62"]]},{"type":"tip","text":"Pra dividir uma rede em partes iguais, você **empresta bits** do host: 2 sub-redes = 1 bit, 4 = 2 bits, 8 = 3 bits. O prefixo aumenta e o bloco diminui."},{"type":"warn","text":"Faz na mão primeiro e usa o `ipcalc` só pra conferir. O objetivo é entender o raciocínio, não depender da ferramenta."},{"type":"commands","title":"Pra conferir","items":[{"cmd":"ipcalc 192.168.50.100/26","note":"mostra máscara, rede, broadcast e faixa de hosts"},{"cmd":"sudo apt install ipcalc","note":"instala, se não tiver (Debian/Kali)"}]}],"deep":[{"type":"text","text":"Dá pra conferir em binário. O AND dá 1 só onde os dois bits são 1, então IP AND máscara = endereço de rede. Ligando todos os bits de host, você chega no broadcast."},{"type":"code","title":"Conferindo o exemplo (só o último octeto)","lang":"text","code":"IP       100 = 01100100\nMáscara  192 = 11000000\nAND          = 01000000 = 64    -> endereço de rede\n\nbits de host todos em 1: 01111111 = 127 -> broadcast"},{"type":"text","text":"Exemplo de divisão: `192.168.50.64/26` em 4 partes. Empresta 2 bits, o prefixo vira `/28` e o bloco cai pra 16. Repara no truque: o broadcast de cada sub-rede é sempre a **próxima** rede menos 1."},{"type":"table","title":"192.168.50.64/26 dividido em 4 (vira /28, bloco de 16)","headers":["Sub-rede","Rede","Hosts","Broadcast"],"rows":[["1ª",".64",".65 – .78",".79"],["2ª",".80",".81 – .94",".95"],["3ª",".96",".97 – .110",".111"],["4ª",".112",".113 – .126",".127"]]},{"type":"text","text":"Prefixo menor que /24? A lógica é a mesma, só muda o octeto interessante. Em `10.1.37.5/20` são 12 bits de host: 8 no último octeto e 4 no terceiro. Bloco de 2⁴ = 16 no terceiro octeto; o 37 cai em 32–47, então a rede é `10.1.32.0` e o broadcast `10.1.47.255`."},{"type":"warn","text":"/31 e /32 são exceções de uso especial: a conta de \"menos 2\" não vale pra elas."}],"terms":[{"en":"subnet","pt":"sub-rede"},{"en":"prefix length","pt":"o número depois da barra (/26, /24...)"},{"en":"network address","pt":"primeiro endereço, identifica a rede"},{"en":"usable hosts","pt":"endereços que dá pra atribuir a máquinas"},{"en":"borrow bits","pt":"emprestar bits do host pra criar sub-redes"}],"practice":"Calcular a faixa certa evita escanear IP fora do escopo autorizado do pentest, o que pode virar problema contratual. E quando você acha uma rede interna nova, bater o olho no prefixo já te diz o tamanho do terreno.","quiz":[{"q":"Qual é a rede e o broadcast de 172.16.8.37/29?","options":["Rede 172.16.8.32, broadcast 172.16.8.39","Rede 172.16.8.36, broadcast 172.16.8.43","Rede 172.16.8.0, broadcast 172.16.8.255","Rede 172.16.8.32, broadcast 172.16.8.47"],"answer":0,"explain":"/29 deixa 3 bits de host, então o bloco é 8. Os múltiplos são 32, 40...; o 37 cai entre 32 e 39."},{"q":"Quantos hosts utilizáveis cabem numa rede /28?","options":["16","28","12","14"],"answer":3,"explain":"32 - 28 = 4 bits de host. 2⁴ = 16 endereços, menos rede e broadcast = 14."}]},{"n":11,"title":"MAC Addresses","titlePt":"MAC: o endereço físico","minutes":6,"gist":"O MAC address é o endereço físico de 48 bits da interface de rede, usado pra entregar frames dentro da mesma rede local (camada 2).","blocks":[{"type":"text","text":"O IP leva o pacote até a **rede** certa; o MAC entrega pro **dispositivo** certo dentro dela. Toda interface de rede (cabeada ou Wi-Fi) tem o seu."},{"type":"code","title":"Anatomia de um MAC","lang":"text","code":"00:1A:2B:3C:4D:5E      48 bits = 6 octetos em hexadecimal\n\n00:1A:2B  ->  OUI: código do fabricante (atribuído pelo IEEE)\n3C:4D:5E  ->  a placa específica (quem escolhe é o fabricante)"},{"type":"text","text":"Seu PC sabe o IP do destino, mas pra montar o frame (o \"envelope\" da camada 2) precisa do MAC. Quem descobre é o **ARP** (Address Resolution Protocol)."},{"type":"exchange","title":"ARP: descobrindo o MAC a partir do IP","actors":["Seu PC (.39)","Toda a LAN","Gateway (.1)"],"messages":[{"from":0,"to":1,"label":"ARP request (broadcast)","note":"Quem tem o 192.168.10.1? Responde pro 192.168.10.39."},{"from":2,"to":0,"label":"ARP reply (unicast)","note":"Sou eu, meu MAC é tal. Os outros ignoram a pergunta."},{"from":0,"to":2,"label":"Frame com o MAC certo","note":"o PC guarda a resposta no ARP cache e manda direto, sem perguntar de novo"}]},{"type":"analogy","text":"É tipo perguntar no grupo do WhatsApp do condomínio: \"quem mora no apê 1? Me chama no privado\". Todo mundo lê, mas só o morador responde, direto pra você. O problema: qualquer um pode responder \"sou eu\", porque o ARP não tem autenticação nenhuma."},{"type":"warn","text":"Pegadinha clássica: se o destino tá em **outra rede**, seu PC pergunta o MAC do **gateway**, não do destino final. O frame vai pro roteador, e ele segue dali."},{"type":"points","title":"Ataques pra reconhecer pelo nome","items":["**MAC spoofing:** trocar o MAC da sua interface pra passar por filtro de MAC ou se passar por outro dispositivo.","**ARP spoofing / poisoning:** mandar ARP replies falsas dizendo \"o gateway sou eu\". O tráfego da vítima passa por você (man-in-the-middle).","**MAC flooding:** lotar a tabela de MACs do switch (CAM table). Cheia, muitos switches passam a mandar tráfego pra todas as portas, como um hub."]},{"type":"commands","items":[{"cmd":"ip link show","note":"MAC de cada interface (linha `link/ether`)"},{"cmd":"ip neigh","note":"cache de vizinhos: IP -> MAC que sua máquina já conhece"},{"cmd":"arp -a","note":"mesma ideia, comando antigo (também existe no Windows)"}]}],"deep":[{"type":"text","text":"O MAC também aparece com hífen (`00-1A-2B-...`, comum no Windows) ou como `001a.2b3c.4d5e` em equipamento Cisco. É o mesmo endereço, só escrito de outro jeito."},{"type":"table","title":"Dois bits espertos no 1º octeto","headers":["Bit do 1º octeto","Se for 0","Se for 1"],"rows":[["Menos significativo (I/G)","unicast (um destino)","multicast (um grupo)"],["Segundo menos significativo (U/L)","global (gravado pelo fabricante)","local (definido por software/admin)"]]},{"type":"text","text":"Exemplo: `02` em binário é `00000010`, ou seja, unicast e administrado localmente. Máquinas virtuais e celulares com MAC aleatório costumam usar endereços assim."},{"type":"facts","items":[{"value":"FF:FF:FF:FF:FF:FF","label":"MAC de broadcast: todo mundo da rede local"},{"value":"NDP","label":"faz o papel do ARP no IPv6 (lá não existe ARP)"}]},{"type":"commands","title":"No Windows","items":[{"cmd":"getmac","note":"lista os MACs das interfaces"},{"cmd":"ipconfig /all","note":"o MAC aparece no campo \"Physical Address\""}]}],"terms":[{"en":"OUI","pt":"prefixo do fabricante (3 primeiros octetos)"},{"en":"NIC","pt":"placa de rede (Network Interface Card)"},{"en":"frame","pt":"unidade de dados da camada 2"},{"en":"ARP cache","pt":"tabela local IP -> MAC"},{"en":"spoofing","pt":"falsificar identidade"},{"en":"CAM table","pt":"tabela de MACs do switch"}],"practice":"Quando você escaneia a mesma rede local, o Nmap usa o OUI pra mostrar o fabricante de cada dispositivo, o que ajuda a separar impressora, câmera e servidor. E ARP spoofing é a base de vários ataques MITM em rede interna.","quiz":[{"q":"Seu PC (192.168.10.39/24) quer falar com 8.8.8.8. O ARP request vai perguntar o MAC de quem?","options":["Do próprio 8.8.8.8","Do default gateway","Do servidor DNS","De ninguém: ARP não é usado nesse caso"],"answer":1,"explain":"O 8.8.8.8 tá fora da rede local, então o frame vai pro roteador (gateway), que encaminha dali pra frente."},{"q":"Por que o ARP spoofing funciona?","options":["O ARP não tem autenticação: qualquer um pode responder \"sou eu\"","O ARP usa uma criptografia fraca que dá pra quebrar","O switch só repassa ARP pro gateway"],"answer":0,"explain":"O ARP acredita em quem responder. O atacante manda replies falsas dizendo que é o gateway e se coloca no meio do tráfego da vítima."}]},{"n":12,"title":"IPv6 Addresses","titlePt":"IPv6: endereço de sobra","minutes":6,"gist":"O IPv6 é o sucessor do IPv4, com endereços de 128 bits escritos em hexadecimal. Nasceu porque os endereços IPv4 iam acabar (e acabaram mesmo).","blocks":[{"type":"facts","title":"Os números do IPv6","items":[{"value":"128 bits","label":"tamanho do endereço"},{"value":"8 grupos","label":"de 16 bits (4 dígitos hex, de 0-9 e a-f), separados por :"},{"value":"~3,4 × 10³⁸","label":"endereços possíveis: pra dar e vender"},{"value":"/64","label":"prefixo padrão numa LAN"}]},{"type":"steps","title":"Abreviando um IPv6","items":[{"label":"Endereço completo","text":"`2001:0db8:00a0:0000:0000:0000:0000:0051`"},{"label":"Tire os zeros à esquerda","text":"Em cada grupo: `0db8` vira `db8`, `0051` vira `51`, `0000` vira `0`."},{"label":"Junte os zeros com ::","text":"**Uma única** sequência de grupos zerados vira `::` (por convenção, a mais longa)."},{"label":"Resultado","text":"`2001:db8:a0::51`"}]},{"type":"warn","text":"O `::` só pode aparecer **uma vez**. Com dois, não teria como saber quantos zeros cada um esconde."},{"type":"code","title":"Prefixo + interface ID (padrão /64)","lang":"text","code":"2001:0db8:00a0:0000:0000:0000:0000:0051\n|---- prefixo -----||-- interface ID -|\n     (64 bits)            (64 bits)\n\nprefixo      = a rede\ninterface ID = a interface dentro dela"},{"type":"points","title":"Tipos de endereço","items":["**Unicast:** de um pra um.","**Anycast:** de um pro membro \"mais próximo\" de um grupo (os servidores DNS raiz usam isso).","**Multicast:** de um pra muitos.","**Não existe broadcast.** O multicast cobre esse papel, por exemplo `ff02::1` = todos os nós do link local."]},{"type":"table","title":"Prefixos pra reconhecer de cara","headers":["Prefixo","O que é","Parecido com (IPv4)"],"rows":[["::1/128","loopback","127.0.0.1"],["fe80::/10","link-local: só vale no enlace (a rede local direta), não é roteado; toda interface IPv6 tem um","169.254.x.x"],["fc00::/7 (na prática fd00::/8)","unique local","faixas privadas"],["2000::/3","global unicast","IP público"],["ff00::/8","multicast","224.0.0.0/4"]]},{"type":"commands","items":[{"cmd":"ip -6 addr show","note":"seus endereços IPv6 (repara no `fe80::` em cada interface)"},{"cmd":"nmap -6 \u003cendereço>","note":"o Nmap só varre IPv6 com a flag `-6`"}]}],"deep":[{"type":"text","text":"A faixa `2001:db8::/32` é reservada pra documentação, por isso aparece em todo exemplo (inclusive aqui)."},{"type":"points","title":"De onde vem o interface ID","items":["**Aleatório** (privacy extensions), comum em sistemas modernos.","**EUI-64**, derivado do MAC: divide o MAC no meio, enfia `ff:fe` e inverte o bit U/L (lembra de MAC Addresses)."]},{"type":"code","title":"EUI-64 passo a passo","lang":"text","code":"MAC              00:1a:2b:3c:4d:5e\ndivide no meio   00:1a:2b | 3c:4d:5e\nenfia ff:fe      00:1a:2b:ff:fe:3c:4d:5e\ninverte o U/L    02:1a:2b:ff:fe:3c:4d:5e\ninterface ID     021a:2bff:fe3c:4d5e"},{"type":"tip","text":"Viu `ff:fe` no meio de um IPv6? Provavelmente é EUI-64, e dá pra recuperar o MAC da máquina."},{"type":"points","title":"O que mais muda em relação ao IPv4","items":["**SLAAC:** o host se autoconfigura com o prefixo que o roteador anuncia, sem precisar de DHCP.","**NDP** substitui o ARP.","Cabeçalho fixo de 40 bytes, sem checksum, e roteadores não fragmentam pacotes: processamento mais simples.","Suporte a IPsec nasceu obrigatório na especificação (depois virou recomendado).","Com endereço sobrando, NAT deixa de ser necessário."]},{"type":"commands","title":"Mais comandos pra brincar","items":[{"cmd":"ping -6 ::1","note":"ping no loopback IPv6"},{"cmd":"ping -6 -I eth0 ff02::1","note":"chama todos os nós IPv6 do link (troque `eth0` pela sua interface)"},{"cmd":"ip -6 neigh","note":"vizinhos descobertos via NDP, o \"ARP cache\" do IPv6"}]}],"terms":[{"en":"prefix","pt":"parte de rede do endereço"},{"en":"interface ID","pt":"parte que identifica a interface (o host)"},{"en":"link-local","pt":"endereço que só vale no enlace local (fe80::)"},{"en":"global unicast","pt":"endereço público, roteável na internet"},{"en":"SLAAC","pt":"autoconfiguração do endereço sem DHCP"},{"en":"NDP","pt":"descoberta de vizinhos, substitui o ARP"}],"practice":"Muita rede corporativa tem IPv6 ligado por padrão sem ninguém olhando. Firewall configurado só pra IPv4 com serviço exposto no IPv6 é achado clássico, e ferramentas como o mitm6 abusam justamente do IPv6 ativo por padrão no Windows.","quiz":[{"q":"Seguindo a convenção (o :: na sequência mais longa de zeros), como fica fe80:0000:0000:0000:0a1b:0000:0000:00ff abreviado?","options":["fe80::a1b::ff","fe80:0:0:0:a1b::ff","fe8::a1b:0:0:ff","fe80::a1b:0:0:ff"],"answer":3,"explain":"O :: vai na sequência mais longa (3 grupos zerados) e a outra fica como 0:0. Dois :: seriam ambíguos, e o zero final de fe80 não é zero à esquerda."},{"q":"Qual prefixo indica um endereço link-local, que toda interface IPv6 tem?","options":["fe80::/10","::1/128","2000::/3","ff00::/8"],"answer":0,"explain":"fe80::/10 é link-local: só vale no enlace e não é roteado. ::1 é loopback, 2000::/3 é público e ff00::/8 é multicast."}]},{"n":13,"title":"Networking Key Terminology","titlePt":"Dicionário de siglas de rede","minutes":7,"gist":"É o dicionário de siglas de rede que aparece o tempo todo no HTB: não precisa decorar, mas precisa bater o olho e saber de que área cada uma é.","blocks":[{"type":"text","text":"Aqui o objetivo é **reconhecer**, não decorar. Portas e funcionamento detalhado vêm nas próximas seções: Common Protocols, Wireless Networks, Virtual Private Networks e Authentication Protocols."},{"type":"tip","text":"Em vez de decorar, **classifique**. Saber \"isso é de Wi-Fi\", \"isso é coisa da Cisco\" ou \"isso manda senha em texto puro\" já resolve muito."},{"type":"tree","title":"Mapa das siglas por área","items":[{"label":"Siglas de rede","depth":0},{"label":"Serviços e arquivos","depth":1,"text":"SSH, RSH, FTP, SMB, NFS, SNMP, NTP, NAT, NNTP"},{"label":"Web, e-mail e voz","depth":1,"text":"HTTP, URL/URI, AJAX, CRLF, ISAPI, SMTP, VoIP, SIP"},{"label":"Wi-Fi e autenticação","depth":1,"text":"WEP, WPA, TKIP, EAP, LEAP, PEAP, TACACS"},{"label":"VPN e túneis","depth":1,"text":"VPN, IPsec, IKE, GRE, PPTP, PGP"},{"label":"Switching e roteamento","depth":1,"text":"VLAN, VTP, STP, CDP, HSRP/VRRP, RIP, OSPF, IGRP/EIGRP"},{"label":"Gestão e indústria","depth":1,"text":"SMS, MBSA, SCADA"}]},{"type":"table","title":"Serviços de rede e arquivos","headers":["Sigla","Nome","Em uma linha"],"rows":[["SSH","Secure Shell","Terminal remoto criptografado"],["RSH","Remote Shell","Terminal remoto antigo, em texto puro, que confia no IP/nome de quem conecta"],["FTP","File Transfer Protocol","Transferência de arquivos; credenciais em texto puro"],["SMB","Server Message Block","Compartilhamento de arquivos e impressoras no Windows"],["NFS","Network File System","Compartilhamento de arquivos no mundo Unix/Linux"],["SNMP","Simple Network Management Protocol","Monitora e gerencia equipamentos; v1/v2c usam \"community string\" em texto puro"],["NTP","Network Time Protocol","Sincroniza relógios; logs e autenticação (Kerberos) dependem disso"],["NAT","Network Address Translation","Troca IPs privados por um público na saída pra internet"],["NNTP","Network News Transfer Protocol","Protocolo dos grupos de discussão da Usenet; bem antigo"]]},{"type":"compare","title":"Sinal vermelho vs. protegido","columns":[{"label":"Fraco ou texto puro","items":["FTP: credenciais em texto puro","RSH: tudo em texto puro","SNMP v1/v2c: community string em texto puro","WEP (Wi-Fi antigo): quebrado em minutos","LEAP (login de Wi-Fi da Cisco): cai com ataque de dicionário","PPTP (VPN antiga) e TKIP (remendo do WPA): inseguros","GRE sozinho: túnel sem criptografia"]},{"label":"Protegido","items":["SSH: terminal remoto criptografado","Wi-Fi com WPA2 + AES, ou WPA3","PEAP: login de Wi-Fi corporativo dentro de um túnel criptografado (TLS)","IPsec: autentica e criptografa no nível do IP"]}]}],"deep":[{"type":"table","title":"Web, e-mail e voz","headers":["Sigla","Nome","Em uma linha"],"rows":[["HTTP","Hypertext Transfer Protocol","O protocolo da web"],["URL / URI","Uniform Resource Locator / Identifier","URI identifica um recurso; URL é a URI que também diz onde e como acessar (`https://site.com/pagina`)"],["AJAX","Asynchronous JavaScript and XML","Técnica da página buscar dados no servidor sem recarregar"],["CRLF","Carriage Return Line Feed","A quebra de linha `\\r\\n`, que separa as linhas de um request HTTP"],["ISAPI","Internet Server API","Interface de extensões do servidor web IIS, da Microsoft"],["SMTP","Simple Mail Transfer Protocol","Envio de e-mail entre servidores"],["VoIP","Voice over IP","Ligação de voz trafegando pela rede IP"],["SIP","Session Initiation Protocol","Sinalização que abre e encerra as chamadas VoIP"]]},{"type":"table","title":"Wi-Fi e autenticação","headers":["Sigla","Nome","Em uma linha"],"rows":[["WEP","Wired Equivalent Privacy","Criptografia de Wi-Fi antiga, quebrada em minutos"],["WPA","Wi-Fi Protected Access","Sucessor do WEP; hoje o mínimo aceitável é WPA2 com AES (ou WPA3)"],["TKIP","Temporal Key Integrity Protocol","Remendo do WPA original pra rodar em hardware de WEP; obsoleto"],["EAP","Extensible Authentication Protocol","\"Moldura\" de autenticação usada no Wi-Fi corporativo (802.1X)"],["LEAP","Lightweight EAP","Variante da Cisco, fraca: dá pra quebrar com ataque de dicionário"],["PEAP","Protected EAP","Coloca a autenticação EAP dentro de um túnel TLS"],["TACACS","Terminal Access Controller Access-Control System","Autenticação centralizada de quem administra roteadores e switches (a versão usada hoje é a TACACS+)"]]},{"type":"table","title":"VPN e túneis","headers":["Sigla","Nome","Em uma linha"],"rows":[["VPN","Virtual Private Network","Túnel que liga você a uma rede remota como se estivesse lá dentro (é assim que você entra nos labs do HTB)"],["IPsec","Internet Protocol Security","Autentica e criptografa no nível do IP; base de muitas VPNs"],["IKE","Internet Key Exchange","Negocia as chaves que o IPsec vai usar"],["GRE","Generic Routing Encapsulation","Encapsula um pacote dentro de outro pra criar túnel; sozinho, não criptografa"],["PPTP","Point-to-Point Tunneling Protocol","Protocolo de VPN antigo, considerado inseguro"],["PGP","Pretty Good Privacy","Criptografa e assina e-mails e arquivos (não é VPN, mas é da turma da criptografia)"]]},{"type":"table","title":"Switching e roteamento","headers":["Sigla","Nome","Em uma linha"],"rows":[["VLAN","Virtual LAN","Divide um switch físico em várias redes lógicas separadas"],["VTP","VLAN Trunking Protocol","Protocolo da Cisco que espalha a configuração de VLANs entre switches"],["STP","Spanning Tree Protocol","Bloqueia links redundantes entre switches pra não formar loop"],["CDP","Cisco Discovery Protocol","Equipamentos Cisco anunciam pros vizinhos modelo, versão e IP"],["HSRP / VRRP","Hot Standby Router Protocol / Virtual Router Redundancy Protocol","Vários roteadores dividem um gateway virtual; se um cai, outro assume. HSRP é da Cisco, VRRP é padrão aberto"],["RIP","Routing Information Protocol","Roteamento por contagem de saltos (máximo 15); simples e antigo"],["OSPF","Open Shortest Path First","Roteamento por estado de enlace; calcula o caminho mais curto"],["IGRP / EIGRP","(Enhanced) Interior Gateway Routing Protocol","Protocolos de roteamento criados pela Cisco; o IGRP é obsoleto e foi substituído pelo EIGRP"]]},{"type":"table","title":"Gestão e ambiente corporativo/industrial","headers":["Sigla","Nome","Em uma linha"],"rows":[["SMS","Systems Management Server","Ferramenta da Microsoft pra gerenciar e atualizar PCs em massa (virou o SCCM/Configuration Manager); não é o SMS do celular"],["MBSA","Microsoft Baseline Security Analyzer","Ferramenta antiga da Microsoft que apontava patches faltando e configuração fraca; descontinuada"],["SCADA","Supervisory Control and Data Acquisition","Sistemas que controlam indústria e infraestrutura (energia, água, fábricas)"]]}],"terms":[{"en":"plaintext / cleartext","pt":"texto puro, sem criptografia"},{"en":"legacy","pt":"antigo, mantido por compatibilidade"},{"en":"deprecated","pt":"oficialmente desaconselhado"},{"en":"proprietary","pt":"de um fabricante só (tipo os da Cisco)"},{"en":"community string","pt":"a \"senha\" do SNMP"},{"en":"tunnel","pt":"encapsular um tráfego dentro de outro"}],"practice":"Quando o Nmap lista os serviços de uma máquina, essa lista vira seu mapa: FTP, RSH ou SNMP v1/v2c já indicam credencial trafegando sem proteção. No Wi-Fi, WEP e LEAP são o mesmo sinal vermelho, e o CDP entrega de graça modelo e versão dos equipamentos de rede.","quiz":[{"q":"Uma máquina tem RSH e SSH abertos. Qual dos dois interessa mais a quem está escutando o tráfego da rede?","options":["SSH, porque é o mais usado hoje","Nenhum: terminal remoto não trafega dados sensíveis","RSH, porque manda tudo em texto puro","Tanto faz: os dois são criptografados"],"answer":2,"explain":"O RSH manda tudo em texto puro, comandos e saídas incluídos. O SSH é criptografado."},{"q":"Você achou SNMP v2c ativo num equipamento. Por que isso chama atenção?","options":["Porque o SNMP é um protocolo de VPN antigo e inseguro","Porque a community string, a \"senha\" do SNMP, trafega em texto puro","Porque o SNMP sincroniza o relógio e pode quebrar o Kerberos"],"answer":1,"explain":"SNMP v1/v2c usa community string em texto puro: quem escuta a rede consegue capturar. Sincronizar relógio é papel do NTP."}]},{"n":14,"title":"Common Protocols","titlePt":"Protocolos e ports clássicas","minutes":6,"gist":"Protocolo é a regra da conversa entre máquinas, e cada serviço clássico mora numa port conhecida que você vai decorar de tanto ver.","blocks":[{"type":"text","text":"Um protocolo define o formato das mensagens e a ordem da conversa. Por baixo de HTTP, SSH e companhia quase sempre tem um de dois transportadores: **TCP** ou **UDP**."},{"type":"compare","title":"Os dois transportadores (a seção 20 aprofunda)","columns":[{"label":"TCP","items":["Abre conexão antes de falar","Confirma a entrega e reenvia o que se perdeu","Pra quando não pode faltar pedaço: página web, arquivo, login"]},{"label":"UDP","items":["Manda e não espera confirmação","Mais leve e mais rápido","Pra quando velocidade vale mais que perfeição: DNS, streaming, voz"]}]},{"type":"analogy","text":"O IP é o endereço do prédio e a **port** é o número do apartamento: o IP leva o pacote até a máquina certa, e a port diz qual serviço lá dentro vai atender."},{"type":"table","title":"As ports clássicas","headers":["Port","Transporte","Protocolo","Pra quê"],"rows":[["20/21","TCP","FTP","transferência de arquivos, sem criptografia"],["22","TCP","SSH","shell remoto (linha de comando à distância), criptografado"],["23","TCP","Telnet","shell remoto, mas em texto puro (inseguro)"],["25","TCP","SMTP","envio de e-mail"],["53","UDP e TCP","DNS","traduz nome em IP"],["67/68","UDP","DHCP","entrega IP automaticamente"],["69","UDP","TFTP","transferência simples, sem autenticação"],["80 / 443","TCP","HTTP / HTTPS","web (443 = com a criptografia TLS)"],["110 / 143","TCP","POP3 / IMAP","leitura de e-mail"],["123","UDP","NTP","sincroniza o relógio"],["161/162","UDP","SNMP","monitoramento de equipamentos"],["445","TCP","SMB","compartilhamento de arquivos no Windows"],["3389","TCP","RDP","área de trabalho remota do Windows"]]},{"type":"text","text":"O **ICMP** (Internet Control Message Protocol) não carrega dados de aplicação e não usa port: ele serve pra mensagens de controle e de erro."},{"type":"facts","title":"Tipos de ICMP que você mais vai ver","items":[{"value":"Type 8 / 0","label":"echo request / echo reply: é o ping"},{"value":"Type 3","label":"destination unreachable: não deu pra chegar no destino"},{"value":"Type 11","label":"time exceeded: o TTL zerou no caminho (o traceroute usa isso)"}]},{"type":"text","text":"O **TTL** (Time To Live) é um contador no cabeçalho IP que cai 1 a cada roteador, pra nenhum pacote rodar em loop pra sempre. De brinde, o valor inicial dá uma pista do sistema:"},{"type":"facts","title":"TTL inicial típico (é pista, não prova: dá pra alterar)","items":[{"value":"64","label":"Linux"},{"value":"128","label":"Windows"},{"value":"255","label":"muitos equipamentos de rede"}]}],"deep":[{"type":"text","text":"Em **VoIP** (voz sobre IP), o protocolo mais comum pra combinar a chamada é o **SIP** (Session Initiation Protocol), na port 5060 (texto puro) ou 5061 (com TLS)."},{"type":"text","text":"O SIP só faz a **sinalização**; o áudio em si vai em outro protocolo, o **RTP**. Existe também o H.323, um padrão mais antigo."},{"type":"table","title":"Métodos SIP que você vai ver","headers":["Método","Pra quê"],"rows":[["INVITE","chamar"],["ACK","confirmar"],["BYE","desligar"],["REGISTER","registrar o aparelho"]]},{"type":"commands","items":[{"cmd":"ping -c 1 \u003cip-alvo>","note":"manda 1 echo request; repare no campo ttl= da resposta"},{"cmd":"traceroute \u003cip-alvo>","note":"lista os roteadores do caminho (usa o TTL)"},{"cmd":"grep -w 445 /etc/services","note":"mostra qual serviço é o dono oficial dessa port"},{"cmd":"ss -tuln","note":"ports TCP/UDP escutando na sua própria máquina"}]}],"terms":[{"en":"port","pt":"número que identifica o serviço dentro da máquina"},{"en":"well-known ports","pt":"de 0 a 1023, reservadas pros serviços clássicos"},{"en":"echo request / reply","pt":"a pergunta e a resposta do ping"},{"en":"TTL","pt":"contador de saltos que cai 1 a cada roteador"},{"en":"signaling","pt":"a parte que combina a chamada, separada do áudio"}],"practice":"Em toda máquina do HTB o primeiro passo é descobrir quais ports estão abertas. Ver 445 e 3389 e pensar 'provavelmente é Windows' já diz por onde começar, e o TTL do ping é o palpite de sistema mais barato que existe.","quiz":[{"q":"Um ping volta com `ttl=127`. Qual é o palpite mais provável?","options":["Linux, que começa em 128","Equipamento de rede, que sempre responde com 127","Windows, que saiu com 128 e passou por um roteador no caminho","Nenhum: o TTL não dá pista de sistema"],"answer":2,"explain":"Windows costuma começar em 128 e cada roteador desconta 1, então 127 indica um salto no meio. É pista, não prova."},{"q":"Por que o ICMP não aparece numa lista de ports abertas?","options":["Porque ele não usa port: serve pra mensagens de controle e erro","Porque ele sempre usa a port 0","Porque ele roda em cima do TCP","Porque firewalls bloqueiam ICMP em qualquer rede"],"answer":0,"explain":"O ICMP não carrega dados de aplicação nem usa port. Ele existe pra coisas como o ping e os avisos de erro (unreachable, time exceeded)."}]},{"n":15,"title":"Wireless Networks","titlePt":"Wi-Fi: rede pelo ar","minutes":6,"gist":"Wi-Fi é rede local por ondas de rádio, e como qualquer um no alcance consegue ouvir o ar, a segurança depende de autenticação e criptografia bem feitas.","blocks":[{"type":"text","text":"O padrão por trás do Wi-Fi é o **IEEE 802.11** (versões a/b/g/n/ac/ax). Os dispositivos conversam com um **access point** (AP), o famoso roteador Wi-Fi."},{"type":"facts","title":"As faixas de frequência","items":[{"value":"2.4 GHz","label":"alcance maior, mais interferência"},{"value":"5 GHz","label":"mais rápido, alcance menor"},{"value":"6 GHz","label":"faixa adicionada pelo Wi-Fi 6E"}]},{"type":"points","title":"Três nomes pra não confundir","items":["**SSID**: o nome da rede (tipo NET_2G_Apto302)","**BSSID**: o MAC address do AP","**Canal**: a fatia de frequência usada dentro da faixa"]},{"type":"steps","title":"Como um dispositivo entra na rede (simplificado)","items":[{"label":"Descobre","text":"O AP anuncia a rede com **beacons**, ou o cliente pergunta por ela com um **probe request**."},{"label":"Associa","text":"O dispositivo autentica e se associa ao AP (association request e response)."},{"label":"4-way handshake","text":"No WPA2/WPA3, gera as chaves da sessão **sem mandar a senha pelo ar**."}]},{"type":"compare","title":"Personal vs Enterprise","columns":[{"label":"Personal (PSK)","items":["Todo mundo usa a mesma senha, a **PSK** (pre-shared key)","A rede é tão forte quanto essa senha"]},{"label":"Enterprise","items":["Cada usuário tem login próprio","Quem confere é um servidor, normalmente RADIUS, via **802.1X** com **EAP**"]}]},{"type":"table","title":"Evolução da segurança","headers":["Padrão","Criptografia","Situação"],"rows":[["WEP","RC4 com IV de 24 bits","quebrado: a chave sai com tráfego suficiente"],["WPA","TKIP (remendo em cima do RC4)","obsoleto"],["WPA2","AES-CCMP","ainda o mais comum; seguro com senha forte"],["WPA3","AES; no modo Personal, o SAE substitui a troca baseada em PSK (a senha continua existindo)","atual; resiste a ataque de dicionário offline"]]},{"type":"warn","text":"Esconder o SSID e filtrar MAC **não** seguram ninguém sozinhos: o nome vaza quando clientes se conectam e MAC dá pra clonar. No máximo, são uma camada extra."}],"deep":[{"type":"text","text":"No WPA3 Personal a senha continua existindo, mas a troca baseada em PSK do WPA2 dá lugar ao **SAE** (Simultaneous Authentication of Equals). Com ele, capturar a conexão de alguém não basta pra ficar testando senhas no seu próprio computador, que é o tal ataque de dicionário offline."},{"type":"points","title":"Variantes de EAP (modo Enterprise)","items":["**EAP-TLS**: certificado nos dois lados; a mais forte","**PEAP**: a senha vai protegida dentro de um túnel TLS","**LEAP**: antiga, da Cisco, fraca"]},{"type":"points","title":"Hardening que funciona de verdade","items":["WPA2 ou WPA3 com senha longa","WPS desligado: aquele PIN de 8 dígitos tem falha de projeto","Rede de visitantes separada da rede interna","PMF (Protected Management Frames, 802.11w) ativado"]},{"type":"warn","text":"Sem PMF, alguém pode forjar pacotes de **deauthentication** e derrubar clientes da rede. O WPA3 já exige PMF."},{"type":"commands","items":[{"cmd":"nmcli dev wifi list","note":"redes ao alcance: SSID, BSSID, canal, sinal e tipo de segurança"},{"cmd":"iw dev","note":"suas interfaces wireless e o modo de cada uma"}]}],"terms":[{"en":"access point (AP)","pt":"o equipamento que cria a rede sem fio"},{"en":"SSID / BSSID","pt":"nome da rede / MAC do AP"},{"en":"handshake","pt":"troca inicial que gera as chaves da sessão"},{"en":"PSK","pt":"pre-shared key, a senha compartilhada da rede"},{"en":"802.1X","pt":"controle de acesso com login por usuário"},{"en":"deauthentication","pt":"mensagem que desconecta um cliente da rede"}],"practice":"Num pentest de Wi-Fi a primeira pergunta é: qual criptografia e qual modo? WEP ou WPS ativo já vira achado na hora, e uma rede Personal é exatamente tão forte quanto a senha dela.","quiz":[{"q":"Esconder o SSID deixa a rede segura?","options":["Sim: sem o nome, ninguém consegue achar a rede","Sim, desde que o filtro de MAC também esteja ligado","Não, porque o SSID é o MAC do AP e não dá pra esconder","Não: o nome aparece nos pacotes quando clientes se conectam"],"answer":3,"explain":"O nome vaza assim que alguém se conecta, então esconder o SSID só atrapalha o usuário legítimo."},{"q":"Qual é a diferença central entre os modos Personal e Enterprise?","options":["Personal usa AES e Enterprise usa RC4","Personal usa uma senha compartilhada; Enterprise dá login próprio a cada usuário via 802.1X","Enterprise dispensa senha e autentica só pelo MAC","Personal só funciona na faixa de 2.4 GHz"],"answer":1,"explain":"No Personal (PSK) todo mundo divide a mesma senha. No Enterprise, um servidor (normalmente RADIUS) confere o login de cada usuário."}]},{"n":16,"title":"Virtual Private Networks","titlePt":"VPN: o túnel criptografado","minutes":6,"gist":"VPN cria um túnel criptografado por cima de uma rede insegura (a internet), pra você funcionar como se estivesse plugado dentro de outra rede.","blocks":[{"type":"text","text":"A VPN pega o seu pacote original, criptografa e coloca dentro de outro pacote. Isso se chama **encapsulation**: pacote dentro de pacote."},{"type":"layers","title":"O que trafega pela internet","items":[{"label":"Pacote externo","text":"Vai de você até o servidor de VPN. É só isso que quem está no meio enxerga.","tag":"visível"},{"label":"Pacote original","text":"IP interno e dados de verdade, embrulhados lá dentro. Ninguém no caminho lê o conteúdo nem pra onde ele vai depois.","tag":"cifrado"}]},{"type":"analogy","text":"É como mandar sua carta dentro de um malote trancado até a sede da empresa: o carteiro sabe que o malote vai pra sede, mas não lê a carta nem sabe pra quem ela vai depois."},{"type":"compare","title":"Os dois tipos de VPN","columns":[{"label":"Remote access (client-to-site)","items":["Seu notebook se conecta na rede da empresa","O clássico do home office"]},{"label":"Site-to-site","items":["Dois escritórios ligados de forma permanente","Roteador com roteador (ou firewall com firewall)"]}]},{"type":"table","title":"Protocolos mais comuns","headers":["Protocolo","Como funciona","Port / protocolo IP","Observação"],"rows":[["IPsec","atua na camada de rede; autentica e criptografa","IKE em UDP 500, NAT-T em UDP 4500","padrão corporativo"],["L2TP/IPsec","L2TP faz o túnel, IPsec criptografa","UDP 1701 + IPsec","L2TP sozinho não criptografa nada"],["PPTP","túnel antigo da Microsoft","TCP 1723 + GRE","autenticação quebrada; evite"],["OpenVPN","baseado em TLS","UDP 1194 (padrão)","é o formato do .ovpn que o HTB te dá pros labs"],["WireGuard","moderno e enxuto","UDP (51820 é o comum)","rápido e simples de configurar"]]},{"type":"compare","title":"Os dois modos do IPsec","columns":[{"label":"Transport mode","items":["Criptografa só o conteúdo (payload)","O cabeçalho IP original continua visível","Comum entre dois hosts"]},{"label":"Tunnel mode","items":["Embrulha o pacote inteiro dentro de um novo","Esconde até os IPs internos","É o usado em site-to-site"]}]},{"type":"commands","title":"Subindo a VPN dos labs","items":[{"cmd":"sudo openvpn arquivo.ovpn","note":"sobe o túnel usando o perfil de configuração"},{"cmd":"ip a show tun0","note":"a interface virtual (tun0) e o IP que você ganhou dentro da VPN"},{"cmd":"ip route","note":"quais redes agora passam pelo túnel"}]},{"type":"warn","text":"No HTB, quando nada responde, confira primeiro se o túnel caiu ou se você abriu duas conexões de VPN ao mesmo tempo."}],"deep":[{"type":"table","title":"As peças do IPsec","headers":["Peça","O que faz","Como é identificada"],"rows":[["ESP","criptografa (e pode garantir integridade)","protocolo IP 50"],["AH","garante integridade e origem, mas não cifra nada","protocolo IP 51"],["IKE","negocia as chaves que o IPsec vai usar (seção 18)","UDP 500; NAT-T em UDP 4500"]]},{"type":"tip","text":"ESP e AH não usam port: eles aparecem no campo Protocol do cabeçalho IP (50 e 51), do mesmo jeito que TCP é 6 e UDP é 17."},{"type":"text","text":"Com **split tunneling**, só parte do tráfego vai pela VPN; o resto sai direto pela sua internet normal."}],"terms":[{"en":"tunnel","pt":"o cano criptografado entre você e a outra rede"},{"en":"encapsulation","pt":"colocar um pacote dentro de outro"},{"en":"split tunneling","pt":"só parte do tráfego passa pela VPN"},{"en":"ESP / AH","pt":"as duas proteções do IPsec"},{"en":"IKE","pt":"a negociação de chaves do IPsec"}],"practice":"No HTB você só alcança as máquinas com a VPN de pé. Em pentest real, o próprio servidor de VPN exposto na internet costuma ser um alvo importante.","quiz":[{"q":"Uma empresa quer ligar matriz e filial escondendo também os IPs internos de cada lado. Qual modo do IPsec serve?","options":["Transport mode","Split tunneling","Tunnel mode","Aggressive mode"],"answer":2,"explain":"O tunnel mode encapsula o pacote inteiro, incluindo o cabeçalho com os IPs internos. O transport mode cifra só o payload."},{"q":"Alguém no meio do caminho observa sua conexão de VPN. O que essa pessoa consegue ver?","options":["Que existe tráfego entre você e o servidor de VPN, mas não o conteúdo","O conteúdo dos pacotes, mas não o destino final","Os sites que você visita, mas não as senhas","Nada: nem que você está usando a internet"],"answer":0,"explain":"O pacote externo vai de você até o servidor de VPN e isso fica visível. O pacote original viaja cifrado lá dentro."}]},{"n":17,"title":"Vendor Specific Information","titlePt":"Cisco IOS e outros fabricantes","minutes":6,"gist":"Cada fabricante de equipamento de rede tem sistema, comandos e jeito de guardar senha próprios, e o mais conhecido de todos é o Cisco IOS.","blocks":[{"type":"text","text":"Roteadores e switches rodam um sistema operacional próprio. O **Cisco IOS** é o mais presente em redes corporativas e nas certificações (CCNA), então vale conhecer o básico."},{"type":"text","text":"Você acessa pelo cabo de console (físico) ou remotamente por SSH/Telnet, através das linhas **VTY** (virtual terminal)."},{"type":"steps","title":"Os modos do IOS: o prompt mostra onde você está","items":[{"label":"Router>","text":"**user EXEC**: o modo ao logar; só consulta básica."},{"label":"Router#","text":"**privileged EXEC**: o modo administrador. Você chega com `enable`."},{"label":"Router(config)#","text":"**global configuration**: onde se muda a config. Você chega com `configure terminal`."}]},{"type":"code","title":"Uma sessão típica (o que vem depois do ! é só anotação)","lang":"text","code":"Router> enable                               ! sobe pro modo privilegiado\nRouter# show version                         ! versão do IOS, modelo, uptime\nRouter# show running-config                  ! configuração ativa (fica na RAM)\nRouter# show ip interface brief              ! interfaces, IPs e status\nRouter# configure terminal                   ! entra no modo de configuração\nRouter(config)# exit\nRouter# copy running-config startup-config   ! salva pra sobreviver ao reboot"},{"type":"compare","title":"As duas configs","columns":[{"label":"running-config","items":["A configuração ativa","Fica na RAM","Some se o equipamento reiniciar sem salvar"]},{"label":"startup-config","items":["A configuração salva","Fica na NVRAM, memória que não apaga ao desligar","É carregada no boot"]}]},{"type":"table","title":"Tipos de senha no IOS (o n
